                - row [ref=f1e827]:
                  - rowheader "2023" [ref=f1e828]
                - row [ref=f1e829]:
                  - rowheader "2024" [ref=f1e830]
                - row [ref=f1e831]:
                  - rowheader "2025" [ref=f1e832]
                  - cell "End of support for PS4 and Xbox One versions" [ref=f1e833]
                - row [ref=f1e834]:
                  - cell "PUBG (Xbox Series X/S, PS5)" [ref=f1e835]
            - region [ref=f1e836]:
              - heading "Personal computers" [level=3] [ref=f1e838]
              - paragraph [ref=f1e839]:
                - text: Bluehole used
                - link "closed alpha and beta periods" [ref=f1e840] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Closed_beta
                - text: with about 80,000 players to gauge initial reaction to the gameplay and adjust balance prior to a wider release.
                - superscript [ref=f1e841]:
                  - link "[14]" [ref=f1e842] [cursor=pointer]:
                    - /url: "#cite_note-pcgn_greene-20"
                - superscript [ref=f1e844]:
                  - link "[48]" [ref=f1e845] [cursor=pointer]:
                    - /url: "#cite_note-vg247_kim-54"
                - text: Just prior to the
                - link "early access phase on Steam" [ref=f1e847] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Early_access#Steam_Early_Access
                - text: ", Bluehole opened a few servers and invited some popular"
                - link "live streamers" [ref=f1e848] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Live_streaming
                - text: of similar games to try it out as to start gaining interest.
                - superscript [ref=f1e849]:
                  - link "[49]" [ref=f1e850] [cursor=pointer]:
                    - /url: "#cite_note-55"
                - text: Early access for the Windows version launched on March 23, 2017.
                - superscript [ref=f1e852]:
                  - link "[50]" [ref=f1e853] [cursor=pointer]:
                    - /url: "#cite_note-pc_gamer_now-56"
                - text: This period was planned to last approximately six months, originally aiming for a September 2017 release.
                - superscript [ref=f1e855]:
                  - link "[50]" [ref=f1e856] [cursor=pointer]:
                    - /url: "#cite_note-pc_gamer_now-56"
                - superscript [ref=f1e858]:
                  - link "[51]" [ref=f1e859] [cursor=pointer]:
                    - /url: "#cite_note-57"
                - text: In July 2017, Greene announced that they would need to extend the early access period by a few months, continuing to release updates on a regular basis, with plans to still release by the end of 2017, as committing to this original period "could hinder us from delivering a fully featured game and/or lead to disappointment within the community if the launch deadline is not met".
                - superscript [ref=f1e861]:
                  - link "[52]" [ref=f1e862] [cursor=pointer]:
                    - /url: "#cite_note-58"
                - text: Initially, Bluehole had expected that they would just gain enough players through early access to smooth out the gameplay, and only when the game was completed, they would have started more marketing for the title. The sudden interest in the game from early access exceeded their expectations, and put emphasis on the stability of the game and its underlying networking alongside gameplay improvements.
                - superscript [ref=f1e864]:
                  - link "[48]" [ref=f1e865] [cursor=pointer]:
                    - /url: "#cite_note-vg247_kim-54"
                - text: Through August 2017, these updates generally included a major weekly patch alongside major monthly updates that provided key performance improvements.
                - superscript [ref=f1e867]:
                  - link "[53]" [ref=f1e868] [cursor=pointer]:
                    - /url: "#cite_note-59"
                - text: However, from August onward, Bluehole backed off the rate of such patches, as the high frequency has led to some quality control issues, and the developers rather make sure each patch content is well-vetted by the community before providing new updates; this did not change their plans for a 2017 release, where it fully released out of early access on December 20.
                - superscript [ref=f1e870]:
                  - link "[54]" [ref=f1e871] [cursor=pointer]:
                    - /url: "#cite_note-60"
                - superscript [ref=f1e873]:
                  - link "[55]" [ref=f1e874] [cursor=pointer]:
                    - /url: "#cite_note-release2017-61"
              - paragraph [ref=f1e876]:
                - text: In part of the game's success in early access,
                - link "Tencent Games" [ref=f1e877] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tencent_Games
                - text: ", the largest publisher of video games in China, approached Bluehole that same month with an offer to publish PUBG in China."
                - superscript [ref=f1e878]:
                  - link "[56]" [ref=f1e879] [cursor=pointer]:
                    - /url: "#cite_note-bloomberg_set2017-62"
                - text: However, the China Audio-Video and Digital Publishing Association issued a statement in October 2017 that discouraged battle royale-style games, stating that they are too violent and deviate from Chinese values of socialism, deeming it harmful to young consumers.
                - superscript [ref=f1e881]:
                  - link "[57]" [ref=f1e882] [cursor=pointer]:
                    - /url: "#cite_note-63"
                - superscript [ref=f1e884]:
                  - link "[58]" [ref=f1e885] [cursor=pointer]:
                    - /url: "#cite_note-64"
                - text: The following month however, PUBG had reached a formal agreement with the Chinese government to allow the release of the game in the country, with Tencent as the publishing partner.
                - superscript [ref=f1e887]:
                  - link "[59]" [ref=f1e888] [cursor=pointer]:
                    - /url: "#cite_note-65"
                - text: This version was censored in accordance to Chinese regulations, such as lessened graphic violence.
                - superscript [ref=f1e890]:
                  - link "[60]" [ref=f1e891] [cursor=pointer]:
                    - /url: "#cite_note-66"
                - text: In South Korea, the game is marketed and distributed by
                - link "Kakao Games" [ref=f1e893] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Kakao_Games
                - text: .
                - superscript [ref=f1e894]:
                  - link "[61]" [ref=f1e895] [cursor=pointer]:
                    - /url: "#cite_note-67"
              - paragraph [ref=f1e897]:
                - text: Despite the lack of a Chinese publisher prior to the Tencent deal, players in China had found ways to acquire and play the game through Steam via proxies and other networking tricks.
                - superscript [ref=f1e898]:
                  - link "[62]" [ref=f1e899] [cursor=pointer]:
                    - /url: "#cite_note-polygon_china_effect-68"
                - text: To address it, PUBG Corporation planned to add maximum client
                - link "ping" [ref=f1e901] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ping_(networking_utility)
                - text: limits for servers which can reduce the issues with latency problems and prevent some of the cheating that has occurred. This would not prevent cross-region matchmaking but may make it difficult for some players to play outside their region if they have a poor Internet infrastructure.
                - superscript [ref=f1e902]:
                  - link "[63]" [ref=f1e903] [cursor=pointer]:
                    - /url: "#cite_note-69"
                - text: Tencent has also helped by identifying and reporting around 30 software programs to Chinese police that can be used to cheat in PUBG, leading to over a hundred arrests by the beginning of 2018.
                - superscript [ref=f1e905]:
                  - link "[64]" [ref=f1e906] [cursor=pointer]:
                    - /url: "#cite_note-70"
                - text: Separately, this technical issue, in addition to the larger number of Chinese players, has created complaints in the player community. Some Western players fear that many Chinese players are able to cheat in the game by exploiting some of the network latency issues, something that PUBG Corporation continued to address as the game shifted out of early access. However, a small number of players called for server segregation by region and had used racial insults at Chinese players they encountered in game. Greene was disappointed with this "xenophobic attitude", calling it "disgraceful", and asked the player community to respect the Chinese players more as their numbers were a key part of the game's success.
                - superscript [ref=f1e908]:
                  - link "[62]" [ref=f1e909] [cursor=pointer]:
                    - /url: "#cite_note-polygon_china_effect-68"
                - text: Greene also identified that players can easily get around such region locks using
                - link "virtual private networks" [ref=f1e911] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Virtual_private_network
                - text: ", making this approach ineffective."
                - superscript [ref=f1e912]:
                  - link "[65]" [ref=f1e913] [cursor=pointer]:
                    - /url: "#cite_note-71"
                - text: PUBG Corporation eventually added region-based matchmaking by October 2018, though players still reported issues with connectivity and slow matchmaking.
                - superscript [ref=f1e915]:
                  - link "[66]" [ref=f1e916] [cursor=pointer]:
                    - /url: "#cite_note-72"
              - paragraph [ref=f1e918]:
                - text: PUBG Lite was a free version of PUBG that was meant to be better playable on low-end computers by having significant reductions in graphic details and other features, but is otherwise feature complete with the full game. The version was meant to be played in regions where the game's minimum specifications may be difficult for average players to achieve, with a beta launch first releasing in Thailand in January 2019, and in Europe that October.
                - superscript [ref=f1e919]:
                  - link "[67]" [ref=f1e920] [cursor=pointer]:
                    - /url: "#cite_note-73"
                - superscript [ref=f1e922]:
                  - link "[68]" [ref=f1e923] [cursor=pointer]:
                    - /url: "#cite_note-74"
                - text: PUBG Lite was shut down on April 29, 2021.
                - superscript [ref=f1e925]:
                  - link "[69]" [ref=f1e926] [cursor=pointer]:
                    - /url: "#cite_note-75"
                - superscript [ref=f1e928]:
                  - link "[70]" [ref=f1e929] [cursor=pointer]:
                    - /url: "#cite_note-76"
              - paragraph [ref=f1e931]:
                - text: On January 12, 2022, the game became
                - link "free to play" [ref=f1e932] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Free-to-play
                - text: . A new account tier, called Battleground Plus, was made available for purchase that includes additional customization items and in-game experience boosts. Owners of the game who purchased prior to January 12 were automatically upgraded to Battleground Plus for free.
                - superscript [ref=f1e933]:
                  - link "[71]" [ref=f1e934] [cursor=pointer]:
                    - /url: "#cite_note-77"
                - text: Battleground Plus allows for playing in ranked mode and on custom servers and includes additional customization items and in-game experience boosts.
                - superscript [ref=f1e936]:
                  - link "[72]" [ref=f1e937] [cursor=pointer]:
                    - /url: "#cite_note-78"
                - superscript [ref=f1e939]:
                  - link "[73]" [ref=f1e940] [cursor=pointer]:
                    - /url: "#cite_note-79"
            - region [ref=f1e942]:
              - heading "Consoles" [level=3] [ref=f1e944]
              - paragraph [ref=f1e945]:
                - text: Greene was part of
                - link "Microsoft" [ref=f1e946] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Microsoft
                - text: "'s press conference during"
                - link "E3 2017" [ref=f1e947] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/E3_2017
                - text: to announce that PUBG would be coming to
                - link "Xbox One" [ref=f1e948] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Xbox_One
                - text: as a timed console exclusive sometime by the end of 2017, using the
                - link "Xbox Game Preview" [ref=f1e949] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Xbox_Game_Preview
                - text: early access approach to test it.
                - superscript [ref=f1e950]:
                  - link "[74]" [ref=f1e951] [cursor=pointer]:
                    - /url: "#cite_note-80"
                - superscript [ref=f1e953]:
                  - link "[75]" [ref=f1e954] [cursor=pointer]:
                    - /url: "#cite_note-81"
                - superscript [ref=f1e956]:
                  - link "[48]" [ref=f1e957] [cursor=pointer]:
                    - /url: "#cite_note-vg247_kim-54"
              - paragraph [ref=f1e959]:
                - text: Initially, Greene said that Microsoft was not directly involved in the porting but only providing assistance to make sure the port is good, and that most of the porting responsibilities are being done by Anticto, a Spanish developer.
                - superscript [ref=f1e960]:
                  - link "[45]" [ref=f1e961] [cursor=pointer]:
                    - /url: "#cite_note-cnet_interview-51"
                - text: However, at
                - link "Gamescom" [ref=f1e963] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Gamescom
                - text: that year, Bluehole affirmed that
                - link "Microsoft Studios" [ref=f1e964] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Microsoft_Studios
                - text: would be publishing the Xbox One version of the title, helping to make a planned 2017 release for this version.
                - superscript [ref=f1e965]:
                  - link "[76]" [ref=f1e966] [cursor=pointer]:
                    - /url: "#cite_note-verge-pubgxboxms-82"
                - text: Greene said that Microsoft's support has helped in several ways, not only for the Xbox One version but improving the performance and security of the Windows version. Further, by being part of the group of studios under the Microsoft banner, they have been able to talk and incorporate technology from other developers, such as improved water rendering techniques they obtained from
                - link "Rare" [ref=f1e968] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Rare_(company)
                - text: that they had developed for
                - link "Sea of Thieves" [ref=f1e970] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Sea_of_Thieves
                - text: .
                - superscript [ref=f1e971]:
                  - link "[77]" [ref=f1e972] [cursor=pointer]:
                    - /url: "#cite_note-gibiz_sept2017_interview-83"
                - text: Microsoft considered PUBG to be an important project to demonstrate their company's ability to be more than just a publisher, according to Microsoft's Nico Bihary who lead the project. Bihary said they have given PUBG a "white glove" treatment, and for the Xbox One port, they have provided services from their advanced technology group and time and support from
                - link "The Coalition" [ref=f1e974] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/The_Coalition_(company)
                - text: ", another of Microsoft Studios' subsidiaries."
                - superscript [ref=f1e975]:
                  - link "[78]" [ref=f1e976] [cursor=pointer]:
                    - /url: "#cite_note-84"
                - text: Kim also stated that the team was interested in
                - link "cross-platform play" [ref=f1e978] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cross-platform_play
                - text: between the Windows and console versions, but did not anticipate this as a release feature, as they need to determine how to mitigate the advantage keyboard and mouse-using players would have over those using controllers.
                - superscript [ref=f1e979]:
                  - link "[48]" [ref=f1e980] [cursor=pointer]:
                    - /url: "#cite_note-vg247_kim-54"
              - paragraph [ref=f1e982]:
                - text: Titled "Game Preview Edition", the early access version for the Xbox One was released on December 12, 2017, in both digital and physical formats.
                - superscript [ref=f1e983]:
                  - link "[79]" [ref=f1e984] [cursor=pointer]:
                    - /url: "#cite_note-85"
                - text: To promote it, Microsoft performed real-life supply crate drops in Australia in the week prior, with the crates containing Xbox hardware, Battlegrounds merchandise, and other goods, using passcodes published alongside the drop locations on social media.
                - superscript [ref=f1e986]:
                  - link "[80]" [ref=f1e987] [cursor=pointer]:
                    - /url: "#cite_note-86"
                - text: The Xbox version also includes Xbox-specific in-game cosmetic items, some of which could be purchased directly rather than through in-game crates.
                - superscript [ref=f1e989]:
                  - link "[81]" [ref=f1e990] [cursor=pointer]:
                    - /url: "#cite_note-87"
                - text: The official release out of the Game Preview program occurred on September 4, 2018.
                - superscript [ref=f1e992]:
                  - link "[82]" [ref=f1e993] [cursor=pointer]:
                    - /url: "#cite_note-88"
                - superscript [ref=f1e995]:
                  - link "[83]" [ref=f1e996] [cursor=pointer]:
                    - /url: "#cite_note-89"
                - text: The game also features account transition and cross-platform play.
              - paragraph [ref=f1e998]:
                - text: With the announcement of the Xbox release, PUBG Corporation stated that there were plans to port to additional platforms, such as the
                - link "PlayStation 4" [ref=f1e999] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/PlayStation_4
                - text: .
                - superscript [ref=f1e1000]:
                  - link "[84]" [ref=f1e1001] [cursor=pointer]:
                    - /url: "#cite_note-kotaku-90"
                - superscript [ref=f1e1003]:
                  - link "[85]" [ref=f1e1004] [cursor=pointer]:
                    - /url: "#cite_note-vg_cho-91"
                - superscript [ref=f1e1006]:
                  - link "[86]" [ref=f1e1007] [cursor=pointer]:
                    - /url: "#cite_note-92"
                - text: In an interview shortly after Gamescom, Greene said that their deal with Microsoft did not exclude a PlayStation 4 port, but that their focus at the time was only on the Windows and Xbox One version, given the small size of their team.
                - superscript [ref=f1e1009]:
                  - link "[77]" [ref=f1e1010] [cursor=pointer]:
                    - /url: "#cite_note-gibiz_sept2017_interview-83"
                - superscript [ref=f1e1012]:
                  - link "[56]" [ref=f1e1013] [cursor=pointer]:
                    - /url: "#cite_note-bloomberg_set2017-62"
                - text: When asked about it in January 2018, Kim stated that the team released the game first on the Steam and Xbox Game Preview early access programs as they both easily allowed in-development games to be released and updated over time, which contrasted with Sony's lack of their own early access program, as well as their strict quality control for even completed games.
                - superscript [ref=f1e1015]:
                  - link "[87]" [ref=f1e1016] [cursor=pointer]:
                    - /url: "#cite_note-93"
                - text: The PlayStation port was officially announced in November, and was released on December 7, 2018. PUBG Corporation studio head Brian Corrigan said that while they had a small team working on the PlayStation 4 port for some time, it was only until the Xbox One port was mostly completed that they began fully working on the PlayStation port.
                - superscript [ref=f1e1018]:
                  - link "[88]" [ref=f1e1019] [cursor=pointer]:
                    - /url: "#cite_note-94"
                - text: The PlayStation 4 version of the game includes platform-exclusive customization items, specifically the outfit of
                - link "Nathan Drake" [ref=f1e1021] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Nathan_Drake_(character)
                - text: from the
                - link "Uncharted" [ref=f1e1023] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Uncharted
                - text: series, and
                - link "Ellie" [ref=f1e1024] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ellie_(The_Last_of_Us)
                - text: "'s backpack from"
                - link "The Last of Us" [ref=f1e1026] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/The_Last_of_Us_(video_game)
                - text: .
                - superscript [ref=f1e1027]:
                  - link "[89]" [ref=f1e1028] [cursor=pointer]:
                    - /url: "#cite_note-95"
                - text: A short live-action film to promote the PlayStation 4 release was directed by
                - link "Jordan Vogt-Roberts" [ref=f1e1030] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Jordan_Vogt-Roberts
                - text: and starred
                - link "Jason Mitchell" [ref=f1e1031] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Jason_Mitchell_(actor)
                - text: .
                - superscript [ref=f1e1032]:
                  - link "[90]" [ref=f1e1033] [cursor=pointer]:
                    - /url: "#cite_note-96"
              - paragraph [ref=f1e1035]:
                - link "Cross-platform play" [ref=f1e1036] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cross-platform_play
                - text: support between the Xbox and PlayStation versions of PUBG was added in October 2019 following a testing period during the prior month.
                - superscript [ref=f1e1037]:
                  - link "[91]" [ref=f1e1038] [cursor=pointer]:
                    - /url: "#cite_note-97"
                - superscript [ref=f1e1040]:
                  - link "[92]" [ref=f1e1041] [cursor=pointer]:
                    - /url: "#cite_note-98"
              - paragraph [ref=f1e1043]:
                - text: PlayerUnknown's Battlegrounds – Pioneer Edition was released on the streaming service
                - link "Stadia" [ref=f1e1044] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Google_Stadia
                - text: on April 28, 2020. The game was free for Stadia's paid subscribers on launch.
                - superscript [ref=f1e1045]:
                  - link "[93]" [ref=f1e1046] [cursor=pointer]:
                    - /url: "#cite_note-pubg_stadia-99"
              - paragraph [ref=f1e1048]:
                - text: PUBG Corporation confirmed in a blog post that support for Xbox One and PS4 consoles would end in November 13, 2025, with the game no longer being playable after this date. Native
                - link "Xbox Series X/S" [ref=f1e1049] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Xbox_Series_X/S
                - text: and
                - link "PlayStation 5" [ref=f1e1050] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/PlayStation_5
                - text: version releases were announced at the same time. The Xbox Series X version and PS5 Pro versions will run at 4K, while the PS5 version will run at 1440p. On Xbox Series S, the game will run at either 1440p at 30fps or 1080p at 60fps. PlayStation 5 players will need to download the new version to continue playing, while Xbox Series X/S players will receive the new version automatically with the console's Smart Delivery feature.
                - superscript [ref=f1e1051]:
                  - link "[94]" [ref=f1e1052] [cursor=pointer]:
                    - /url: "#cite_note-100"
            - region [ref=f1e1054]:
              - heading "Mobile versions" [level=3] [ref=f1e1056]
              - note [ref=f1e1057]:
                - text: "Main article:"
                - link "PUBG Mobile" [ref=f1e1058] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/PUBG_Mobile
              - note [ref=f1e1059]:
                - text: "Further information:"
                - link "New State Mobile" [ref=f1e1060] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/New_State_Mobile
                - text: and
                - link "Battlegrounds Mobile India" [ref=f1e1061] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Battlegrounds_Mobile_India
              - paragraph [ref=f1e1062]:
                - text: Following the Chinese publication deal for the Windows version, Tencent Games and PUBG Corporation additionally announced that they were planning on releasing two mobile versions based on the game in the country.
                - superscript [ref=f1e1063]:
                  - link "[95]" [ref=f1e1064] [cursor=pointer]:
                    - /url: "#cite_note-101"
                - superscript [ref=f1e1066]:
                  - link "[96]" [ref=f1e1067] [cursor=pointer]:
                    - /url: "#cite_note-102"
                - text: "The first, PUBG: Exhilarating Battlefield, is an abridged version of the original game, and was developed by LightSpeed & Quantum Studio, an internal division of"
                - link "Tencent Games" [ref=f1e1069] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tencent_Games
                - text: .
                - superscript [ref=f1e1070]:
                  - link "[97]" [ref=f1e1071] [cursor=pointer]:
                    - /url: "#cite_note-103"
                - text: "The second, PUBG: Army Attack, includes more arcade-style elements, including action taking place on warships, and was developed by Tencent's TiMi Studio."
                - superscript [ref=f1e1073]:
                  - link "[98]" [ref=f1e1074] [cursor=pointer]:
                    - /url: "#cite_note-104"
                - text: Both versions are
                - link "free-to-play" [ref=f1e1076] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Free-to-play
                - text: ", and were released for"
                - link "Android" [ref=f1e1077] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Android_(operating_system)
                - text: and
                - link "iOS" [ref=f1e1078] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/IOS
                - text: devices on February 9, 2018.
                - superscript [ref=f1e1079]:
                  - link "[99]" [ref=f1e1080] [cursor=pointer]:
                    - /url: "#cite_note-105"
                - superscript [ref=f1e1082]:
                  - link "[100]" [ref=f1e1083] [cursor=pointer]:
                    - /url: "#cite_note-PUBG_mobile_numbers-106"
                - text: The games had a combined total of 75 million pre-registrations, and ranked first and second on the Chinese iOS download charts at launch.
                - superscript [ref=f1e1085]:
                  - link "[100]" [ref=f1e1086] [cursor=pointer]:
                    - /url: "#cite_note-PUBG_mobile_numbers-106"
                - text: Following a
                - link "soft launch" [ref=f1e1088] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Soft_launch
                - text: in Canada, an English version of Exhilarating Battlefield, localized simply as PUBG Mobile, was released worldwide on March 19, 2018.
                - superscript [ref=f1e1089]:
                  - link "[101]" [ref=f1e1090] [cursor=pointer]:
                    - /url: "#cite_note-107"
                - superscript [ref=f1e1092]:
                  - link "[102]" [ref=f1e1093] [cursor=pointer]:
                    - /url: "#cite_note-108"
                - superscript [ref=f1e1095]:
                  - link "[103]" [ref=f1e1096] [cursor=pointer]:
                    - /url: "#cite_note-109"
                - text: Following its release, a Korean and Japanese oriented version of the game released in June 2018, under the title name PUBG Mobile KR. A Vietnamese version, PUBG Mobile VN released in January 2019.
              - paragraph [ref=f1e1098]:
                - text: In China, PUBG Mobile had been awaiting approval by the government for an authorized release, during which the game could only be offered as a public test. However, Tencent's planned release was suspended due to the
                - link "government approval freeze across most of 2018" [ref=f1e1099] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Video_gaming_in_China#2018_approvals_freeze
                - text: . By May 2019, Tencent announced it would no longer seek to publish PUBG Mobile in China, but instead would re-release the game under the title Game for Peace that readily meets China's content restrictions, such as eliminating blood and gore.
                - superscript [ref=f1e1100]:
                  - link "[104]" [ref=f1e1101] [cursor=pointer]:
                    - /url: "#cite_note-110"
                - text: Taiwanese version of the game was released following the Chinese version, as PUBG Mobile TW. A version meant for lower-end mobile devices which features a smaller map made for 60 players, PUBG Mobile Lite, was released on July 25, 2019.
                - superscript [ref=f1e1103]:
                  - link "[105]" [ref=f1e1104] [cursor=pointer]:
                    - /url: "#cite_note-111"
                - superscript [ref=f1e1106]:
                  - link "[106]" [ref=f1e1107] [cursor=pointer]:
                    - /url: "#cite_note-112"
                - text: This had support for high FPS gameplay on multiple Android devices.
                - superscript [ref=f1e1109]:
                  - link "[107]" [ref=f1e1110] [cursor=pointer]:
                    - /url: "#cite_note-90fps-113"
                - text: The Chinese version of the app was again renamed to Peacekeeper Elite in 2020.
                - superscript [ref=f1e1112]:
                  - link "[108]" [ref=f1e1113] [cursor=pointer]:
                    - /url: "#cite_note-114"
              - paragraph [ref=f1e1115]:
                - text: Support for 90 FPS gameplay was added for selected OnePlus devices in August 2020.
                - superscript [ref=f1e1116]:
                  - link "[107]" [ref=f1e1117] [cursor=pointer]:
                    - /url: "#cite_note-90fps-113"
                - superscript [ref=f1e1119]:
                  - link "[109]" [ref=f1e1120] [cursor=pointer]:
                    - /url: "#cite_note-115"
              - paragraph [ref=f1e1122]:
                - text: On May 6, 2021,
                - link "Krafton" [ref=f1e1123] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Krafton
                - text: announced the relaunch of the game in
                - link "India" [ref=f1e1124] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/India
                - text: ", following the ban imposed by the"
                - link "Government of India" [ref=f1e1125] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Government_of_India
                - text: . Krafton directly published the game instead of
                - link "Tencent" [ref=f1e1126] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tencent
                - text: as a newly named title which could only be accessed by users in India as
                - link "Battlegrounds Mobile India" [ref=f1e1128] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Battlegrounds_Mobile_India
                - text: .
                - superscript [ref=f1e1129]:
                  - link "[110]" [ref=f1e1130] [cursor=pointer]:
                    - /url: "#cite_note-116"
                - superscript [ref=f1e1132]:
                  - link "[111]" [ref=f1e1133] [cursor=pointer]:
                    - /url: "#cite_note-117"
          - region [ref=f1e1135]:
            - heading "Esports" [level=2] [ref=f1e1137]
            - 'figure "PUBG: Battlegrounds esports studio at the 2019 G-loot Grandslam" [ref=f1e1138]':
              - link [ref=f1e1139] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/File:G-loot_Grandslam_2019.jpg
            - paragraph [ref=f1e1142]:
              - text: To celebrate the game surpassing two million copies sold, Bluehole announced a 2017 Charity Invitational event, inviting 128 players to compete over their official
              - link "Twitch" [ref=f1e1143] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Twitch_(service)
              - text: channel to raise money for the
              - link "Gamers Outreach Foundation" [ref=f1e1144] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Gamers_Outreach_Foundation
              - text: ", with Bluehole matching all donations up to"
              - generic [ref=f1e1145]:
                - link "US$" [ref=f1e1146] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/United_States_dollar
                - text: 100,000
              - text: .
              - superscript [ref=f1e1147]:
                - link "[112]" [ref=f1e1148] [cursor=pointer]:
                  - /url: "#cite_note-118"
              - text: The competition ran in early May 2017, and raised at least US$120,000 from viewers along with Bluehole's US$100,000 match, and served as a prototype for future
              - link "esports" [ref=f1e1150] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Esports
              - text: events for the game.
              - superscript [ref=f1e1151]:
                - link "[113]" [ref=f1e1152] [cursor=pointer]:
                  - /url: "#cite_note-119"
              - text: During the August 2017
              - link "Gamescom" [ref=f1e1154] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Gamescom
              - text: event, Bluehole and
              - link "ESL" [ref=f1e1155] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/ESL_(company)
              - text: organized the first PUBG invitational tournament, with a $350,000 prize pool. Separate events were held for solo players, two-player teams, two-player teams fixed to first-person perspective, and four-player squads. Each event featured three matches, with the player or team scoring the highest across all three named winners.
              - superscript [ref=f1e1156]:
                - link "[43]" [ref=f1e1157] [cursor=pointer]:
                  - /url: "#cite_note-rps_aug17_lootcrates-49"
              - superscript [ref=f1e1159]:
                - link "[114]" [ref=f1e1160] [cursor=pointer]:
                  - /url: "#cite_note-120"
              - superscript [ref=f1e1162]:
                - link "[115]" [ref=f1e1163] [cursor=pointer]:
                  - /url: "#cite_note-121"
            - paragraph [ref=f1e1165]:
              - text: Greene said that while he had envisioned the battle royale format to be a spectator sport since his ARMA II mod, their approach to making PUBG an esport would be a matter of taking "baby steps". Greene said that they would not actively pursue esports until after the game was fully released and that all major
              - link "bugs" [ref=f1e1166] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Software_bug
              - text: were eliminated. The Gamescom 2017 event demonstrated the issues surrounding the logistics of running a large PUBG tournament with a large number of players involved, and they had worked alongside ESL to explore how to do this effectively in the future. Further, Greene stated there was also the need to establish a format for presenting a PUBG match to make it interesting to spectators, which he thought would take some time to develop given the nature of the emergent gameplay, comparing it to established first-person shooters and multiplayer online battle arena esport games.
              - superscript [ref=f1e1167]:
                - link "[116]" [ref=f1e1168] [cursor=pointer]:
                  - /url: "#cite_note-122"
              - text: A 20-team, 80-player tournament with a US$200,000 prize pool was organized by
              - link "Intel" [ref=f1e1170] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Intel
              - text: in Oakland in November 2017.
              - superscript [ref=f1e1171]:
                - link "[117]" [ref=f1e1172] [cursor=pointer]:
                  - /url: "#cite_note-:0-123"
              - superscript [ref=f1e1174]:
                - link "[118]" [ref=f1e1175] [cursor=pointer]:
                  - /url: "#cite_note-124"
          - region [ref=f1e1177]:
            - heading "Other games and media" [level=2] [ref=f1e1179]
            - paragraph [ref=f1e1180]:
              - text: "Krafton had looked to expand PUBG beyond the core game as to expand the narrative universe. As part of this, PlayerUnknown's Battlegrounds was quietly rebranded as PUBG: Battlegrounds around July 2021."
              - superscript [ref=f1e1181]:
                - link "[119]" [ref=f1e1182] [cursor=pointer]:
                  - /url: "#cite_note-125"
            - paragraph [ref=f1e1184]:
              - text: Starting in 2020, Krafton released a series of live-action documentaries starring
              - link "Jonathan Frakes" [ref=f1e1185] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Jonathan_Frakes
              - text: that explored the origins of the game's Battlegrounds. Ahead of the game's Taego expansion in July 2021, Krafton released another live-action short called "Ground Zero", featuring
              - link "Ma Dong-seok" [ref=f1e1186] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Ma_Dong-seok
              - text: (aka Don Lee).
              - superscript [ref=f1e1187]:
                - link "[120]" [ref=f1e1188] [cursor=pointer]:
                  - /url: "#cite_note-126"
            - paragraph [ref=f1e1190]:
              - text: Krafton announced a partnership with
              - link "Adi Shankar" [ref=f1e1191] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Adi_Shankar
              - text: in July 2021 to develop an animated series based on the PUBG universe.
              - superscript [ref=f1e1192]:
                - link "[121]" [ref=f1e1193] [cursor=pointer]:
                  - /url: "#cite_note-127"
            - paragraph [ref=f1e1195]:
              - text: In 2019, Krafton created a new studio Striking Distance, helmed by
              - link "Glen Schofield" [ref=f1e1196] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Glen_Schofield
              - text: ", who previously led development on the"
              - link "Dead Space" [ref=f1e1198] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Dead_Space_(video_game)
              - text: series. In 2020, Schofield revealed that the studio was working on
              - link "The Callisto Protocol" [ref=f1e1200] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/The_Callisto_Protocol
              - text: ", a game set in the PUBG universe but in the far future, taking place on a prison colony established on Jupiter's moon"
              - link "Callisto" [ref=f1e1201] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Callisto_(moon)
              - text: .
              - superscript [ref=f1e1202]:
