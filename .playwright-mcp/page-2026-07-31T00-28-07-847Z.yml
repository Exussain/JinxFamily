            - paragraph [ref=f1e1304]:
              - text: Battlegrounds received "generally favorable reviews" on all platforms, with the exception of the PlayStation 4 version which received "mixed or average reviews", according to
              - link "review aggregator" [ref=f1e1305] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Review_aggregator
              - text: website
              - link "Metacritic" [ref=f1e1306] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Metacritic
              - text: .
              - superscript [ref=f1e1307]:
                - link "[127]" [ref=f1e1308] [cursor=pointer]:
                  - /url: "#cite_note-MetacriticPC-133"
              - text: During both its early access phase and after, the game also surpassed numerous player-count records. Bluehole released statistics for the first four months of release that showed that over ten million rounds of Battlegrounds had been played, effectively equal to more than 25,000 man-years of time.
              - superscript [ref=f1e1310]:
                - link "[137]" [ref=f1e1311] [cursor=pointer]:
                  - /url: "#cite_note-143"
              - text: Data by
              - link "SteamSpy" [ref=f1e1313] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/SteamSpy
              - text: showed that Battlegrounds had surpassed long-standing popular titles in
              - link "concurrent player count" [ref=f1e1314] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Concurrent_player_count
              - text: on Steam, such as
              - link "Fallout 4" [ref=f1e1316] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Fallout_4
              - text: and
              - link "Grand Theft Auto V" [ref=f1e1318] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Grand_Theft_Auto_V
              - text: ","
              - superscript [ref=f1e1319]:
                - link "[138]" [ref=f1e1320] [cursor=pointer]:
                  - /url: "#cite_note-144"
              - text: eventually overtaking
              - link "Dota 2" [ref=f1e1323] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Dota_2
              - text: ", the most played game on the platform for years, in August 2017."
              - superscript [ref=f1e1324]:
                - link "[139]" [ref=f1e1325] [cursor=pointer]:
                  - /url: "#cite_note-145"
              - text: The following month, the game had its peak concurrent player count reach over 1.3 million, surpassing Dota 2
              - generic [ref=f1e1327]: "'s"
              - text: all-time record of 1.29 set in March 2016.
              - superscript [ref=f1e1328]:
                - link "[140]" [ref=f1e1329] [cursor=pointer]:
                  - /url: "#cite_note-146"
              - superscript [ref=f1e1331]:
                - link "[141]" [ref=f1e1332] [cursor=pointer]:
                  - /url: "#cite_note-147"
              - superscript [ref=f1e1334]:
                - link "[142]" [ref=f1e1335] [cursor=pointer]:
                  - /url: "#cite_note-148"
              - text: The game then reached a concurrent player count of two million in October 2017,
              - superscript [ref=f1e1337]:
                - link "[143]" [ref=f1e1338] [cursor=pointer]:
                  - /url: "#cite_note-149"
              - text: and three million by the end of the year.
              - superscript [ref=f1e1340]:
                - link "[144]" [ref=f1e1341] [cursor=pointer]:
                  - /url: "#cite_note-150"
              - text: The game has also been shown popular in South Korean
              - link "PC bangs" [ref=f1e1343] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/PC_bangs
              - text: ; analysis firm Gametrics reported that Battlegrounds had surpassed
              - link "Overwatch" [ref=f1e1345] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Overwatch_(2016_video_game)
              - text: and became the second-most played game in the country by August 2017, only behind
              - link "League of Legends" [ref=f1e1347] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/League_of_Legends
              - text: ","
              - superscript [ref=f1e1348]:
                - link "[145]" [ref=f1e1349] [cursor=pointer]:
                  - /url: "#cite_note-151"
              - text: it subsequently surpassed League of Legends by October 2017.
              - superscript [ref=f1e1351]:
                - link "[146]" [ref=f1e1352] [cursor=pointer]:
                  - /url: "#cite_note-152"
              - text: Battlegrounds
              - generic [ref=f1e1354]: "'"
              - text: popularity in China led to a large increase in users of Steam from there, with more than half of Steam clients having Chinese as their default language in late 2017.
              - superscript [ref=f1e1355]:
                - link "[62]" [ref=f1e1356] [cursor=pointer]:
                  - /url: "#cite_note-polygon_china_effect-68"
            - paragraph [ref=f1e1358]:
              - text: Several journalists commented on the game's rapid growth towards a large player base for a game that was still in early access. Greene had confidence that the game could reach over a million players within a month, but some of his development team were only anticipating around 200,000 to 300,000 within the first year, and were surprised by its performance in its first month.
              - superscript [ref=f1e1359]:
                - link "[147]" [ref=f1e1360] [cursor=pointer]:
                  - /url: "#cite_note-153"
              - text: Greene himself believed that the strong growth was buoyed by non-traditional promotional channels like Twitch streamers and other content creators, which they have since worked to introduce new gameplay elements ahead of public release.
              - superscript [ref=f1e1362]:
                - link "[77]" [ref=f1e1363] [cursor=pointer]:
                  - /url: "#cite_note-gibiz_sept2017_interview-83"
              - link "IGN" [ref=f1e1366] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/IGN
              - generic [ref=f1e1367]: "'s"
              - text: Rad believed that the popularity of the game was due to its fast-paced nature compared to similar type games available at the time, such as
              - link "H1Z1" [ref=f1e1369] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/H1Z1:_King_of_the_Kill
              - text: and
              - link "DayZ" [ref=f1e1371] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/DayZ_(video_game)
              - text: . She thought that the design balanced the solitary periods when the player is scavenging or sneaking around with those of being in combat with others, and the approach is readily accessible to new players with very little waiting time to get into a new match.
              - superscript [ref=f1e1372]:
                - link "[148]" [ref=f1e1373] [cursor=pointer]:
                  - /url: "#cite_note-154"
              - text: Andy Moore for
              - link "Glixel" [ref=f1e1376] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Glixel
              - text: considered that Battlegrounds
              - generic [ref=f1e1377]: "'"
              - text: popularity comes from how the game encouraged players to engage due to the situation they are placed in rather than from the player's own disposition, comparing it to the
              - link "Stanford prison experiment" [ref=f1e1378] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Stanford_prison_experiment
              - text: ", and thus the game is able to capture the interest of players who may normally eschew these types of games."
              - superscript [ref=f1e1379]:
                - link "[149]" [ref=f1e1380] [cursor=pointer]:
                  - /url: "#cite_note-155"
            - 'figure "A PUBG: Battlegrounds female cosplayer at the 33rd Development Anime Festival" [ref=f1e1382]':
              - link [ref=f1e1383] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/File:Mayu_Ronne_as_PUBG_female_player_20190216d.jpg
            - paragraph [ref=f1e1386]:
              - link "Rock Paper Shotgun" [ref=f1e1388] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Rock_Paper_Shotgun
              - generic [ref=f1e1389]: "'s"
              - text: Michael Johnson described Battlegrounds as "a tactical shooting sandbox, a story generator, and a horror game all in one", providing some of the "highest highs" in multiplayer gaming as reason for its popularity.
              - superscript [ref=f1e1390]:
                - link "[150]" [ref=f1e1391] [cursor=pointer]:
                  - /url: "#cite_note-rps_tension-156"
              - text: Rob Zacny for
              - link "Waypoint" [ref=f1e1394] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Waypoint_(website)
              - text: found that Battlegrounds offered the same type of entertainment experience for viewers that many other player-vs-player
              - link "survival games" [ref=f1e1395] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Survival_game
              - text: have, but because of the lack of persistence, players were more likely to experiment with resources rather than hoard them, leading to humorous or unexpected situations that are often absent in survival games and making the title more enjoyable to watch and play, leading to its popularity.
              - superscript [ref=f1e1396]:
                - link "[151]" [ref=f1e1397] [cursor=pointer]:
                  - /url: "#cite_note-157"
              - text: Jeff Grubb of
              - link "Venture Beat" [ref=f1e1400] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Venture_Beat
              - text: considered Battlegrounds a paradigm shift in the first-person shooter market similar to how
              - 'link "Call of Duty 4: Modern Warfare" [ref=f1e1402] [cursor=pointer]':
                - /url: https://en.wikipedia.org/wiki/Call_of_Duty_4:_Modern_Warfare
              - text: also changed the landscape of shooters when it was released in 2007, and believed it did this by being an anti-Call of Duty in terms of pacing and strategy.
              - superscript [ref=f1e1403]:
                - link "[152]" [ref=f1e1404] [cursor=pointer]:
                  - /url: "#cite_note-158"
              - text: IGN's Chloi Rad has praised the game's gunplay, saying the game "has taken the military-sim gameplay... [and] boiled it down to its most exciting parts."
            - region [ref=f1e1406]:
              - heading "Sales" [level=3] [ref=f1e1408]
              - paragraph [ref=f1e1409]:
                - text: Battlegrounds made
                - generic [ref=f1e1410]: US$11 million
                - text: in the first three days of its Windows early access release in March 2017.
                - superscript [ref=f1e1411]:
                  - link "[153]" [ref=f1e1412] [cursor=pointer]:
                    - /url: "#cite_note-159"
                - text: By the second week of April, the game had sold over one million copies, with a peak player count of 89,000,
                - superscript [ref=f1e1414]:
                  - link "[154]" [ref=f1e1415] [cursor=pointer]:
                    - /url: "#cite_note-160"
                - link "SuperData Research" [ref=f1e1417] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/SuperData_Research
                - text: estimated that the game's April sales exceeded
                - generic [ref=f1e1418]: US$34 million
                - text: ", putting it as one of the top 10 highest grossing revenue games for the month and exceeding revenue from"
                - link "Overwatch" [ref=f1e1420] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Overwatch_(2016_video_game)
                - text: and
                - 'link "Counter-Strike: Global Offensive" [ref=f1e1422] [cursor=pointer]':
                  - /url: https://en.wikipedia.org/wiki/Counter-Strike:_Global_Offensive
                - text: .
                - superscript [ref=f1e1423]:
                  - link "[155]" [ref=f1e1424] [cursor=pointer]:
                    - /url: "#cite_note-161"
                - text: By May 2017, the game had sold over two million copies, with total gross revenues estimated at
                - generic [ref=f1e1426]: US$60 million
                - text: .
                - superscript [ref=f1e1427]:
                  - link "[156]" [ref=f1e1428] [cursor=pointer]:
                    - /url: "#cite_note-162"
                - superscript [ref=f1e1430]:
                  - link "[157]" [ref=f1e1431] [cursor=pointer]:
                    - /url: "#cite_note-bi_may2017-163"
                - text: Within three months of its early access release, it had surpassed over five million copies sold,
                - superscript [ref=f1e1433]:
                  - link "[158]" [ref=f1e1434] [cursor=pointer]:
                    - /url: "#cite_note-164"
                - text: and Bluehole announced it had exceeded
                - generic [ref=f1e1436]: US$100 million
                - text: in sale revenue.
                - superscript [ref=f1e1437]:
                  - link "[159]" [ref=f1e1438] [cursor=pointer]:
                    - /url: "#cite_note-165"
                - text: Battlegrounds reached this four million mark faster than
                - link "Minecraft" [ref=f1e1441] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Minecraft
                - text: ", which took over a year to reach similar sales figures while it was in its paid-beta development period."
                - superscript [ref=f1e1442]:
                  - link "[160]" [ref=f1e1443] [cursor=pointer]:
                    - /url: "#cite_note-atlantic-166"
              - paragraph [ref=f1e1445]:
                - text: By September 2017, Bluehole's value, as tracked by a firm that tracks private Korean corporations, increased five-fold from June of that year to
                - generic [ref=f1e1446]: US$4.6 billion
                - text: ", primarily due to Battlegrounds."
                - superscript [ref=f1e1447]:
                  - link "[56]" [ref=f1e1448] [cursor=pointer]:
                    - /url: "#cite_note-bloomberg_set2017-62"
                - text: By December 2017, PUBG Corporation reported that there were more than 30 million players worldwide between the Windows and Xbox versions.
                - superscript [ref=f1e1450]:
                  - link "[161]" [ref=f1e1451] [cursor=pointer]:
                    - /url: "#cite_note-167"
                - text: The research firm SuperData estimated that Battlegrounds drew in more than US$712 million in revenue within 2017.
                - superscript [ref=f1e1453]:
                  - link "[162]" [ref=f1e1454] [cursor=pointer]:
                    - /url: "#cite_note-168"
                - text: By February 2018, the game had sold over thirty million on Steam according to
                - link "Steam Spy" [ref=f1e1456] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Steam_Spy
                - text: .
                - superscript [ref=f1e1457]:
                  - link "[163]" [ref=f1e1458] [cursor=pointer]:
                    - /url: "#cite_note-169"
                - text: The following month, Steam's President
                - link "Gabe Newell" [ref=f1e1460] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Gabe_Newell
                - text: stated that the game was the third highest-grossing game of all time on the platform.
                - superscript [ref=f1e1461]:
                  - link "[164]" [ref=f1e1462] [cursor=pointer]:
                    - /url: "#cite_note-170"
                - text: "PUBG: Battlegrounds is the"
                - link "second-best-selling video game on PC" [ref=f1e1464] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/List_of_best-selling_PC_games
                - text: and
                - link "best-selling game on Xbox One" [ref=f1e1465] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/List_of_best-selling_Xbox_One_video_games
                - text: . Before the release of the
                - link "PlayStation 4" [ref=f1e1466] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/PlayStation_4
                - text: version, 42 million copies were sold on PC and 9 million copies on Xbox One.
                - superscript [ref=f1e1467]:
                  - link "[165]" [ref=f1e1468] [cursor=pointer]:
                    - /url: "#cite_note-171"
                - superscript [ref=f1e1470]:
                  - link "[166]" [ref=f1e1471] [cursor=pointer]:
                    - /url: "#cite_note-172"
              - paragraph [ref=f1e1473]:
                - text: Within three days of going live on the Xbox Live Preview Program in mid-December 2017, Microsoft announced that Battlegrounds had sold more than a million copies on the platform. Alongside this, Microsoft announced that Battlegrounds would be offered as a free add-on for those buying the
                - link "Xbox One X" [ref=f1e1474] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Xbox_One_X
                - text: console through the end of 2017.
                - superscript [ref=f1e1475]:
                  - link "[167]" [ref=f1e1476] [cursor=pointer]:
                    - /url: "#cite_note-173"
                - text: A month after release, the Xbox version had sold more than four million copies and was the fourth bestselling game in the United States, according to
                - link "The NPD Group" [ref=f1e1478] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/The_NPD_Group
                - text: .
                - superscript [ref=f1e1479]:
                  - link "[168]" [ref=f1e1480] [cursor=pointer]:
                    - /url: "#cite_note-174"
                - superscript [ref=f1e1482]:
                  - link "[169]" [ref=f1e1483] [cursor=pointer]:
                    - /url: "#cite_note-175"
                - text: By March 2018, the game had sold forty million copies across all platforms, which had risen to over fifty million by June, averaging over 87 million players daily with over 400 million players in total.
                - superscript [ref=f1e1485]:
                  - link "[170]" [ref=f1e1486] [cursor=pointer]:
                    - /url: "#cite_note-176"
                - superscript [ref=f1e1488]:
                  - link "[171]" [ref=f1e1489] [cursor=pointer]:
                    - /url: "#cite_note-polygon-177"
                - text: The mobile version had over 100 million downloads by August 2018,
                - superscript [ref=f1e1491]:
                  - link "[172]" [ref=f1e1492] [cursor=pointer]:
                    - /url: "#cite_note-178"
                - text: and exceeded 225million by October 2018,
                - superscript [ref=f1e1495]:
                  - link "[173]" [ref=f1e1496] [cursor=pointer]:
                    - /url: "#cite_note-venturebeat-179"
                - text: a figure higher than the combined player base for
                - link "Fortnite" [ref=f1e1499] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fortnite
                - text: at nearly the same point in time. In 2018, the bulk of these players were in Asian countries such as China and India, where PUBG Mobile was released before Fortnite and could run on lower-powered mobile hardware.
                - superscript [ref=f1e1500]:
                  - link "[174]" [ref=f1e1501] [cursor=pointer]:
                    - /url: "#cite_note-180"
                - superscript [ref=f1e1503]:
                  - link "[175]" [ref=f1e1504] [cursor=pointer]:
                    - /url: "#cite_note-181"
                - text: China was the game's largest player base.
                - superscript [ref=f1e1506]:
                  - link "[173]" [ref=f1e1507] [cursor=pointer]:
                    - /url: "#cite_note-venturebeat-179"
                - text: PUBG was the most popular online game in India in 2018 (but it was banned by the government of India in 2020; see
                - link "below" [ref=f1e1509] [cursor=pointer]:
                  - /url: "#National_bans"
                - text: ).
                - superscript [ref=f1e1510]:
                  - link "[176]" [ref=f1e1511] [cursor=pointer]:
                    - /url: "#cite_note-182"
              - paragraph [ref=f1e1513]:
                - text: PUBG was the top-selling PC paid game of 2017,
                - superscript [ref=f1e1514]:
                  - link "[177]" [ref=f1e1515] [cursor=pointer]:
                    - /url: "#cite_note-SuperData-183"
                - text: having sold 30million copies worldwide and grossed about $900 million.
                - superscript [ref=f1e1518]:
                  - link "[178]" [ref=f1e1519] [cursor=pointer]:
                    - /url: "#cite_note-:2-184"
                - text: By June 2018, it had sold more than 50million copies worldwide.
                - superscript [ref=f1e1522]:
                  - link "[171]" [ref=f1e1523] [cursor=pointer]:
                    - /url: "#cite_note-polygon-177"
                - text: PUBG was again the top-selling PC paid game of 2018, increasing its annual sales revenue to $1.028 billion.
                - superscript [ref=f1e1525]:
                  - link "[179]" [ref=f1e1526] [cursor=pointer]:
                    - /url: "#cite_note-:3-185"
                - text: In addition, the free-to-play PUBG Mobile became the first mobile battle royale game to gross over $1 billion,
                - superscript [ref=f1e1528]:
                  - link "[180]" [ref=f1e1529] [cursor=pointer]:
                    - /url: "#cite_note-186"
                - text: reaching over $1.5 billion as of 2019 .
                - superscript [ref=f1e1531]:
                  - link "[181]" [ref=f1e1532] [cursor=pointer]:
                    - /url: "#cite_note-Pocket-187"
              - paragraph [ref=f1e1534]:
                - text: PUBG Mobile was the second most-downloaded mobile game of 2018, with nearly 300million downloads worldwide. The game's largest market was China, which accounted for 29% of the game's downloads, followed by India and the United States each with about 10% (30million) of its downloads. It was also the most-installed battle royale game of 2018, with about 200million more installs than Fortnite, which received 82million installs on mobile devices.
                - superscript [ref=f1e1539]:
                  - link "[182]" [ref=f1e1540] [cursor=pointer]:
                    - /url: "#cite_note-188"
                - text: In 2019, PUBG Mobile reached 555million downloads worldwide, with India accounting for 116 million (21%) of the downloads, China 108 million (19%), and the United States 42 million (8%).
                - superscript [ref=f1e1543]:
                  - link "[181]" [ref=f1e1544] [cursor=pointer]:
                    - /url: "#cite_note-Pocket-187"
              - paragraph [ref=f1e1546]:
                - text: In Japan, PUBG was the most popular
                - link "PC game" [ref=f1e1547] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/PC_game
                - text: during 2017.
                - superscript [ref=f1e1548]:
                  - link "[183]" [ref=f1e1549] [cursor=pointer]:
                    - /url: "#cite_note-189"
                - text: PUBG Mobile grossed ¥3.58 billion ($32.42 million) in Japan during 2018.
                - superscript [ref=f1e1551]:
                  - link "[184]" [ref=f1e1552] [cursor=pointer]:
                    - /url: "#cite_note-japan-190"
                - text: In January 2019, the PlayStation 4 version of Battlegrounds sold 7,447 copies within its first week in Japan, which placed it at number 14 on the all-format sales chart.
                - superscript [ref=f1e1554]:
                  - link "[185]" [ref=f1e1555] [cursor=pointer]:
                    - /url: "#cite_note-191"
                - text: By December 2019, the PC and console versions of the game had sold over 60 million copies, in addition to PUBG Mobile having exceeded 600million downloads.
                - superscript [ref=f1e1558]:
                  - link "[186]" [ref=f1e1559] [cursor=pointer]:
                    - /url: "#cite_note-192"
                - text: By July 2020, computer and console software sales had exceeded 70million units sold,
                - superscript [ref=f1e1562]:
                  - link "[187]" [ref=f1e1563] [cursor=pointer]:
                    - /url: "#cite_note-193"
                - text: in addition to PUBG Mobile accumulating 734 million downloads.
                - superscript [ref=f1e1565]:
                  - link "[188]" [ref=f1e1566] [cursor=pointer]:
                    - /url: "#cite_note-194"
                - text: PUBG Mobile had grossed over $3.5 billion in revenue by August 2020.
                - superscript [ref=f1e1568]:
                  - link "[189]" [ref=f1e1569] [cursor=pointer]:
                    - /url: "#cite_note-sensortower-2020-08-13-195"
                - text: PUBG Mobile grossed over $2.6 billion in 2020, making it the
                - link "highest-grossing game of the year" [ref=f1e1571] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/2020_in_video_games
                - text: and bringing its total revenue to over $4.3 billion by December 2020.
                - superscript [ref=f1e1572]:
                  - link "[190]" [ref=f1e1573] [cursor=pointer]:
                    - /url: "#cite_note-196"
              - paragraph [ref=f1e1575]:
                - text: In March 2021, it was reported that PUBG Mobile had accumulated 1 billion downloads outside of China since launch.
                - superscript [ref=f1e1576]:
                  - link "[191]" [ref=f1e1577] [cursor=pointer]:
                    - /url: "#cite_note-197"
                - text: By December 2022, PUBG Mobile has grossed $9 billion worldwide,
                - superscript [ref=f1e1579]:
                  - link "[192]" [ref=f1e1580] [cursor=pointer]:
                    - /url: "#cite_note-:4-198"
                - text: while
                - link "Battlegrounds Mobile India" [ref=f1e1583] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Battlegrounds_Mobile_India
                - text: surpassed 100 million downloads from the
                - link "Google Play" [ref=f1e1584] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Google_Play
                - text: store.
                - superscript [ref=f1e1585]:
                  - link "[193]" [ref=f1e1586] [cursor=pointer]:
                    - /url: "#cite_note-199"
                - text: "By the end of 2021, PUBG: Battlegrounds had an average of 70 million daily users."
                - superscript [ref=f1e1588]:
                  - link "[194]" [ref=f1e1589] [cursor=pointer]:
                    - /url: "#cite_note-200"
                - text: After selling more than 75 million copies, the original PC and console game converted to free-to-play,
                - superscript [ref=f1e1591]:
                  - link "[195]" [ref=f1e1592] [cursor=pointer]:
                    - /url: "#cite_note-201"
                - text: and according to Krafton's revenue report for the first quarter of 2022, the free-to-play transition was the reason for the increase in the game's profits. PC sales had increased by 61 percent for a revenue of $82.3 million. In gaming consoles, sales revenue increased by 274 percent over the last year, and monthly active users also increased by almost 300 percent. The PC and console versions of the game have a total revenue of $4 billion since the game's release in 2017.
                - superscript [ref=f1e1594]:
                  - link "[178]" [ref=f1e1595] [cursor=pointer]:
                    - /url: "#cite_note-:2-184"
                - superscript [ref=f1e1597]:
                  - link "[196]" [ref=f1e1598] [cursor=pointer]:
                    - /url: "#cite_note-202"
                - superscript [ref=f1e1600]:
                  - link "[197]" [ref=f1e1601] [cursor=pointer]:
                    - /url: "#cite_note-203"
                - superscript [ref=f1e1603]:
                  - link "[198]" [ref=f1e1604] [cursor=pointer]:
                    - /url: "#cite_note-204"
                - superscript [ref=f1e1606]:
                  - link "[179]" [ref=f1e1607] [cursor=pointer]:
                    - /url: "#cite_note-:3-185"
                - text: Combined with the mobile version, which generated $9 billion in revenue until Q3 2022,
                - superscript [ref=f1e1609]:
                  - link "[192]" [ref=f1e1610] [cursor=pointer]:
                    - /url: "#cite_note-:4-198"
                - text: "PUBG: Battlegrounds has a total revenue of $13 billion."
