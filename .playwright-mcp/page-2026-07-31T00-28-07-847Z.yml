            - paragraph [ref=f1e371]:
              - generic [ref=f1e372]: "PUBG: Battlegrounds"
              - text: (previously titled
              - generic [ref=f1e373]: PlayerUnknown's Battlegrounds
              - text: ) is a 2017
              - link "battle royale" [ref=f1e374] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Battle_royale_game
              - text: video game published by
              - link "Krafton" [ref=f1e375] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Krafton
              - text: ", and developed by Krafton's"
              - link "PUBG Studios" [ref=f1e376] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Krafton
              - text: . The game, which was inspired by the Japanese film
              - link "Battle Royale" [ref=f1e378] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Battle_Royale_(film)
              - text: (2000), is based on previous
              - link "mods" [ref=f1e379] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Mod_(video_gaming)
              - text: created by
              - link "Brendan \"PlayerUnknown\" Greene" [ref=f1e380] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/PlayerUnknown
              - text: for other games, and expanded into a standalone game under Greene's creative direction. Played from either a
              - link "third-person" [ref=f1e381] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Third-person_(video_games)
              - text: or
              - link "first-person" [ref=f1e382] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/First-person_(video_games)
              - text: perspective, up to one hundred players parachute onto an island where they are tasked to scavenge for weapons and equipment to kill other players while avoiding getting killed themselves. The available safe area of the game's map decreases in size over time, directing surviving players into an ever-tightening space to force encounters.
            - paragraph [ref=f1e383]:
              - text: PlayerUnknown's Battlegrounds was first released for
              - link "Windows" [ref=f1e384] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Windows
              - text: via
              - link "Steam" [ref=f1e385] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Steam_(service)
              - text: "'s"
              - link "early access" [ref=f1e386] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Early_access
              - text: beta program in March 2017, with a full release in December 2017; the same month,
              - link "Microsoft Studios" [ref=f1e387] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Microsoft_Studios
              - text: studios released it for the
              - link "Xbox One" [ref=f1e388] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Xbox_One
              - text: via the
              - link "Xbox Game Preview" [ref=f1e389] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Xbox_Game_Preview
              - text: program, with a full release coming in September 2018. Afterwards the game was
              - link "ported" [ref=f1e390] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Video_game_port
              - text: to the
              - link "PlayStation 4" [ref=f1e391] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/PlayStation_4
              - text: ","
              - link "Xbox Series X/S" [ref=f1e392] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Xbox_Series_X/S
              - text: and
              - link "PlayStation 5" [ref=f1e393] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/PlayStation_5
              - text: consoles, and the
              - link "Stadia" [ref=f1e394] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Google_Stadia
              - text: streaming platform, and has also spawned a
              - link "mobile" [ref=f1e395] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Mobile_game
              - text: version,
              - link "PUBG Mobile" [ref=f1e397] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/PUBG_Mobile
              - text: ", for"
              - link "Android" [ref=f1e398] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Android_(operating_system)
              - text: and
              - link "iOS" [ref=f1e399] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/IOS
              - text: . The game is continuously developed under the
              - link "games as a service" [ref=f1e400] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Game_as_a_service
              - text: model and has been
              - link "free-to-play" [ref=f1e401] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Free-to-play
              - text: for all platforms since January 2022.
            - paragraph [ref=f1e402]:
              - text: The game received positive reviews from critics, who found that while the game had some technical flaws, it presented new types of gameplay that could be easily approached by players of any skill level and was highly replayable. It was credited with popularizing the battle royale genre, with a number of unofficial Chinese
              - link "clones" [ref=f1e403] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Video_game_clone
              - text: being produced following its success. The game received several
              - link "Game of the Year" [ref=f1e404] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/List_of_Game_of_the_Year_awards
              - text: nominations and set seven
              - link "Guinness World Records" [ref=f1e405] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Guinness_World_Records
              - text: ", among many other accolades. PUBG Corporation has run several small tournaments and introduced in-game tools to help with broadcasting the game to spectators, as they wish for it to become a popular"
              - link "esport" [ref=f1e406] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Esport
              - text: title. It has sold over 75 million copies on
              - link "personal computers" [ref=f1e407] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Personal_computers
              - text: and
              - link "game consoles" [ref=f1e408] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Game_consoles
              - text: ", is the"
              - link "second-best-selling game on PC" [ref=f1e409] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/List_of_best-selling_PC_games
              - text: and
              - link "best-selling game on Xbox One" [ref=f1e410] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/List_of_best-selling_Xbox_One_video_games
              - text: ", and is the"
              - link "fifth best-selling video game of all time" [ref=f1e411] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/List_of_best-selling_video_games
              - text: . Until Q3 2022, the game has accumulated $13 billion in worldwide revenue, including from its more successful mobile version, making it one of the highest-grossing video games of all time.
          - region [ref=f1e412]:
            - heading "Gameplay" [level=2] [ref=f1e414]
            - paragraph [ref=f1e415]:
              - text: PUBG is a
              - link "player versus player" [ref=f1e416] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Player_versus_player
              - link "shooter game" [ref=f1e417] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Shooter_game
              - text: in which up to one hundred players fight in a
              - link "battle royale" [ref=f1e418] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Battle_royale_game
              - text: ", a type of large-scale"
              - link "last man standing deathmatch" [ref=f1e419] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Last_man_standing_(video_games)
              - text: where players fight to remain the last alive. Players can choose to enter the match solo, duo, or with a small team of up to four people. The last person or team alive wins the match.
              - superscript [ref=f1e420]:
                - link "[1]" [ref=f1e421] [cursor=pointer]:
                  - /url: "#cite_note-polygon_guide-7"
            - paragraph [ref=f1e423]:
              - text: Each match starts with players parachuting from a plane onto one of the eight maps which have different sizes and terrain ranging from 1 to 64 square kilometers.
              - superscript [ref=f1e424]:
                - link "[2]" [ref=f1e425] [cursor=pointer]:
                  - /url: "#cite_note-8"
              - text: The plane's flight path across the map varies with each round, requiring players to quickly determine the best time to eject and parachute to the ground.
              - superscript [ref=f1e427]:
                - link "[1]" [ref=f1e428] [cursor=pointer]:
                  - /url: "#cite_note-polygon_guide-7"
              - text: Players start with no gear beyond customized clothing selections which do not affect gameplay. Once they land, players can search buildings,
              - link "ghost towns" [ref=f1e430] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Ghost_town
              - text: and other sites to find weapons, vehicles, armor, and other equipment. These
              - link "items" [ref=f1e431] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Item_(game_terminology)
              - text: are procedurally distributed throughout the map at the start of a match, with certain high-risk zones typically having better equipment.
              - superscript [ref=f1e432]:
                - link "[1]" [ref=f1e433] [cursor=pointer]:
                  - /url: "#cite_note-polygon_guide-7"
              - text: Killed players can be looted to acquire their gear as well.
              - superscript [ref=f1e435]:
                - link "[1]" [ref=f1e436] [cursor=pointer]:
                  - /url: "#cite_note-polygon_guide-7"
              - text: Players can opt to play either from the
              - link "first-person" [ref=f1e438] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/First-person_perspective
              - text: or
              - link "third-person perspective" [ref=f1e439] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Third-person_perspective
              - text: ", each having their own advantages and disadvantages in combat and situational awareness; though server-specific settings can be used to force all players into one perspective to eliminate some advantages."
              - superscript [ref=f1e440]:
                - link "[3]" [ref=f1e441] [cursor=pointer]:
                  - /url: "#cite_note-9"
              - text: As of 2026, all official competitive modes are only in third-person.
              - link [ref=f1e443] [cursor=pointer]:
                - /url: https://pubgesports.com/en/news/9640
            - paragraph [ref=f1e444]:
              - text: Every few minutes, the playable area of the map begins to shrink down towards a random location, with any player caught outside the safe area taking damage incrementally, and eventually being eliminated if the safe zone is not entered in time; in game, the players see the boundary as a shimmering blue wall that contracts over time.
              - superscript [ref=f1e445]:
                - link "[4]" [ref=f1e446] [cursor=pointer]:
                  - /url: "#cite_note-gamasutra_mapdesign-10"
              - text: This results in a more confined map, in turn increasing the chances of encounters.
              - superscript [ref=f1e448]:
                - link "[1]" [ref=f1e449] [cursor=pointer]:
                  - /url: "#cite_note-polygon_guide-7"
              - text: During the course of the match, random regions of the map are highlighted in red and bombed, posing a threat to players who remain in that area.
              - superscript [ref=f1e451]:
                - link "[5]" [ref=f1e452] [cursor=pointer]:
                  - /url: "#cite_note-pc_gamer_future-11"
              - text: In both cases, players are warned a few minutes before these events, giving them time to relocate to safety.
              - superscript [ref=f1e454]:
                - link "[6]" [ref=f1e455] [cursor=pointer]:
                  - /url: "#cite_note-gibiz-12"
              - text: A plane will fly over various parts of the playable map occasionally at random, or wherever a player uses a
              - link "flare gun" [ref=f1e457] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Flare_gun
              - text: ", and drop a loot package, containing items which are typically unobtainable during normal gameplay. These packages emit highly visible red smoke, drawing interested players near it and creating further confrontations."
              - superscript [ref=f1e458]:
                - link "[1]" [ref=f1e459] [cursor=pointer]:
                  - /url: "#cite_note-polygon_guide-7"
              - superscript [ref=f1e461]:
                - link "[7]" [ref=f1e462] [cursor=pointer]:
                  - /url: "#cite_note-13"
              - text: On average, a full round takes no more than 30 minutes.
              - superscript [ref=f1e464]:
                - link "[6]" [ref=f1e465] [cursor=pointer]:
                  - /url: "#cite_note-gibiz-12"
            - paragraph [ref=f1e467]:
              - text: At the completion of each round, players gain
              - link "in-game currency" [ref=f1e468] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/In-game_currency
              - text: based on their performance. The currency is used to purchase crates which contain
              - link "cosmetic items" [ref=f1e469] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Virtual_goods
              - text: for character or weapon customization.
              - superscript [ref=f1e470]:
                - link "[8]" [ref=f1e471] [cursor=pointer]:
                  - /url: "#cite_note-Skin_economy-14"
              - text: A rotating "event mode" was added to the game in March 2018. These events change up the normal game rules, such as establishing larger teams or squads, or altering the distribution of weapons and armor across the game map.
              - superscript [ref=f1e473]:
                - link "[9]" [ref=f1e474] [cursor=pointer]:
                  - /url: "#cite_note-15"
          - region [ref=f1e476]:
            - heading "Development" [level=2] [ref=f1e478]
            - figure "Game creator Brendan \"PlayerUnknown\" Greene in 2018" [ref=f1e479]:
              - link [ref=f1e480] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/File:Brendan_greene_gdc_2018.jpg
            - paragraph [ref=f1e483]:
              - text: The game's concept and design was led by Brendan Greene, better known by his online handle PlayerUnknown, who had previously created the
              - link "ARMA 2" [ref=f1e485] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/ARMA_2
              - link "mod" [ref=f1e486] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Mod_(video_gaming)
              - text: "DayZ: Battle Royale, an offshoot of popular mod"
              - link "DayZ" [ref=f1e488] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/DayZ_(mod)
              - text: ", and inspired by the 2000 Japanese film"
              - link "Battle Royale" [ref=f1e490] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Battle_Royale_(film)
              - text: .
              - superscript [ref=f1e491]:
                - link "[10]" [ref=f1e492] [cursor=pointer]:
                  - /url: "#cite_note-16"
              - superscript [ref=f1e494]:
                - link "[11]" [ref=f1e495] [cursor=pointer]:
                  - /url: "#cite_note-usgamer_greene_interview-17"
              - text: "At the time he created DayZ: Battle Royale, around 2013, Irish-born Greene had been living in Brazil for a few years as a photographer, graphic designer, and web designer, and played video games such as"
              - 'link "Delta Force: Black Hawk Down" [ref=f1e498] [cursor=pointer]':
                - /url: https://en.wikipedia.org/wiki/Delta_Force:_Black_Hawk_Down
              - text: and
              - link "America's Army" [ref=f1e500] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/America's_Army
              - text: .
              - superscript [ref=f1e501]:
                - link "[12]" [ref=f1e502] [cursor=pointer]:
                  - /url: "#cite_note-rps_interview_jul17-18"
              - superscript [ref=f1e504]:
                - link "[13]" [ref=f1e505] [cursor=pointer]:
                  - /url: "#cite_note-glixel_interview-19"
              - text: The DayZ mod caught his interest as it is a realistic military simulation and its open-ended gameplay, and he started playing around with a custom server, learning programming as he went along.
              - superscript [ref=f1e507]:
                - link "[12]" [ref=f1e508] [cursor=pointer]:
                  - /url: "#cite_note-rps_interview_jul17-18"
              - text: Greene found most multiplayer first-person shooters too repetitive, considering maps small and easy to memorize. He wanted to create something with more random aspects so that players would not know what to expect, creating a high degree of replayability; this was done by creating vastly larger maps that could not be easily memorized, and using random item placement across it.
              - superscript [ref=f1e510]:
                - link "[14]" [ref=f1e511] [cursor=pointer]:
                  - /url: "#cite_note-pcgn_greene-20"
              - text: Greene was also inspired by an online competition for DayZ called Survivor GameZ, which featured a number of
              - link "Twitch" [ref=f1e513] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Twitch_(service)
              - text: and
              - link "YouTube" [ref=f1e514] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/YouTube
              - link "streamers" [ref=f1e515] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Video_game_live_streaming
              - text: fighting until only a few were left; as he was not a streamer himself, Greene wanted to create a similar game mode that anyone could play.
              - superscript [ref=f1e516]:
                - link "[14]" [ref=f1e517] [cursor=pointer]:
                  - /url: "#cite_note-pcgn_greene-20"
              - text: His initial efforts on this mod were more inspired by
              - link "The Hunger Games" [ref=f1e520] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/The_Hunger_Games
              - text: novels, where players would try to vie for stockpiles of weapons at a central location, but he moved away from this partially to give players a better chance at survival by spreading weapons around, and to avoid copyright issues with the novels.
              - superscript [ref=f1e521]:
                - link "[11]" [ref=f1e522] [cursor=pointer]:
                  - /url: "#cite_note-usgamer_greene_interview-17"
              - text: In taking inspiration from the Battle Royale film, Greene had wanted to use square safe areas, but his inexperience in coding led him to use circular safe areas instead, which persisted to Battlegrounds.
              - superscript [ref=f1e524]:
                - link "[11]" [ref=f1e525] [cursor=pointer]:
                  - /url: "#cite_note-usgamer_greene_interview-17"
            - paragraph [ref=f1e527]:
              - text: When DayZ became its
              - link "own standalone title" [ref=f1e528] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/DayZ_(video_game)
              - text: ", interest in his ARMA 2 version of the Battle Royale mod trailed off, and Greene transitioned to"
              - link "ARMA 3" [ref=f1e530] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/ARMA_3
              - text: .
              - superscript [ref=f1e531]:
                - link "[12]" [ref=f1e532] [cursor=pointer]:
                  - /url: "#cite_note-rps_interview_jul17-18"
              - link "Sony Online Entertainment" [ref=f1e534] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Sony_Online_Entertainment
              - text: (now the
              - link "Daybreak Game Company" [ref=f1e535] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Daybreak_Game_Company
              - text: ) had become interested in Greene's work, and brought him on as a consultant to develop on H1Z1, licensing the battle royale idea from him.
              - superscript [ref=f1e536]:
                - link "[12]" [ref=f1e537] [cursor=pointer]:
                  - /url: "#cite_note-rps_interview_jul17-18"
              - text: In February 2016, Sony Online split H1Z1 into two separate games, the survival mode
              - 'link "H1Z1: Just Survive" [ref=f1e540] [cursor=pointer]':
                - /url: https://en.wikipedia.org/wiki/H1Z1:_Just_Survive
              - text: ", and the battle royale-like"
              - 'link "H1Z1: King of the Kill" [ref=f1e542] [cursor=pointer]':
                - /url: https://en.wikipedia.org/wiki/H1Z1:_King_of_the_Kill
              - text: ", around the same time that Greene's consultation period was over."
              - superscript [ref=f1e543]:
                - link "[15]" [ref=f1e544] [cursor=pointer]:
                  - /url: "#cite_note-21"
            - paragraph [ref=f1e546]:
              - text: Separately, the
              - link "Seoul" [ref=f1e547] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Seoul
              - text: "-based studio Ginno Games, led by Chang-han Kim and who developed"
              - link "massively multiplayer online games" [ref=f1e548] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Massively_multiplayer_online_game
              - text: (MMOs) for personal computers, was acquired and renamed Bluehole Ginno Games by Bluehole in January 2015, a major South Korean publisher of MMOs and
              - link "mobile games" [ref=f1e549] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Mobile_games
              - text: .
              - superscript [ref=f1e550]:
                - link "[16]" [ref=f1e551] [cursor=pointer]:
                  - /url: "#cite_note-vb_kim-22"
              - superscript [ref=f1e553]:
                - link "[17]" [ref=f1e554] [cursor=pointer]:
                  - /url: "#cite_note-23"
              - text: Kim recognized that producing a successful game in South Korea generally meant it would be published globally, and wanted to use his team to create a successful title for personal computers that followed the same model as other mobile games published by Bluehole. He had already been excited about making a type of battle royale game after he had played DayZ, in part because the format had not caught on in Korea. He also wanted to make this through an
              - link "early access" [ref=f1e556] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Early_access
              - text: model and have a very limited development schedule to get the game out as quickly as possible, while treating the product as a "
              - link "games as a service" [ref=f1e557] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Games_as_a_service
              - text: "\" model to be able to support it for many years."
              - superscript [ref=f1e558]:
                - link "[16]" [ref=f1e559] [cursor=pointer]:
                  - /url: "#cite_note-vb_kim-22"
              - text: In researching what had been done, he came across Greene's mods and reached out to him.
              - superscript [ref=f1e561]:
                - link "[16]" [ref=f1e562] [cursor=pointer]:
                  - /url: "#cite_note-vb_kim-22"
              - text: In July 2017, Bluehole partnered with
              - link "social media" [ref=f1e564] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Social_media
              - text: platform
              - link "Facebook" [ref=f1e565] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Facebook
              - text: to provide exclusive streaming content to Facebook's gaming channels, as part of their push to provide more gaming content for its users.
              - superscript [ref=f1e566]:
                - link "[18]" [ref=f1e567] [cursor=pointer]:
                  - /url: "#cite_note-24"
            - paragraph [ref=f1e569]:
              - text: Around the same time that Greene left Sony Online, Kim contacted and offered him the opportunity to work on a new battle royale concept. Within a week, Greene flew out to Bluehole's headquarters in Korea to discuss the options, and a few weeks later, he became the creative director of Bluehole. He moved to South Korea to oversee development.
              - superscript [ref=f1e570]:
                - link "[14]" [ref=f1e571] [cursor=pointer]:
                  - /url: "#cite_note-pcgn_greene-20"
              - text: According to Greene, this was the first time a Korean game studio had brought aboard a foreigner for a creative director role, and while it was a risk, he says that his relationship with Bluehole's management is strong, allowing Greene's team to work autonomously with minimal oversight.
              - superscript [ref=f1e573]:
                - link "[6]" [ref=f1e574] [cursor=pointer]:
                  - /url: "#cite_note-gibiz-12"
              - text: The game's main musical theme was composed by
              - link "Tom Salta" [ref=f1e576] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Tom_Salta
              - text: ", who was personally selected by Greene as he and the team were looking for an \"orchestral electronic hybrid theme\" that would give players a \"huge build-up\", keeping them \"resolutely determined\" until a match starts."
              - superscript [ref=f1e577]:
                - link "[19]" [ref=f1e578] [cursor=pointer]:
                  - /url: "#cite_note-25"
              - text: The music for 6th anniversary was composed by Antti Martikainen.
              - superscript [ref=f1e580]:
                - link "[20]" [ref=f1e581] [cursor=pointer]:
                  - /url: "#cite_note-26"
            - paragraph [ref=f1e583]:
              - text: Development began in early 2016 and was publicly announced that June, with plans to have the game ready within a year.
              - superscript [ref=f1e584]:
                - link "[21]" [ref=f1e585] [cursor=pointer]:
                  - /url: "#cite_note-eurogamer_interview-27"
              - superscript [ref=f1e587]:
                - link "[22]" [ref=f1e588] [cursor=pointer]:
                  - /url: "#cite_note-28"
              - text: Kim served as executive producer for the game.
              - superscript [ref=f1e590]:
                - link "[14]" [ref=f1e591] [cursor=pointer]:
                  - /url: "#cite_note-pcgn_greene-20"
              - text: Bluehole started with a team of about 35 developers supporting Greene's work, but had expanded to 70 by June 2017.
              - superscript [ref=f1e593]:
                - link "[23]" [ref=f1e594] [cursor=pointer]:
                  - /url: "#cite_note-pcgamesn_team-29"
              - text: Greene stated that many of these developers were voluntarily putting in longer work hours into the game due to their dedication to the project, and not by any mandate from himself or Bluehole's management.
              - superscript [ref=f1e596]:
                - link "[14]" [ref=f1e597] [cursor=pointer]:
                  - /url: "#cite_note-pcgn_greene-20"
              - superscript [ref=f1e599]:
                - link "[24]" [ref=f1e600] [cursor=pointer]:
                  - /url: "#cite_note-polygon_fireside-30"
              - text: In addition to Bluehole, Greene also credits
              - link "Bohemia Interactive" [ref=f1e602] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Bohemia_Interactive
              - text: ", the developers of ARMA and DayZ, for support with"
              - link "motion capture" [ref=f1e603] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Motion_capture
              - text: animations via their
              - link "Prague" [ref=f1e604] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Prague
              - text: studio.
              - superscript [ref=f1e605]:
                - link "[24]" [ref=f1e606] [cursor=pointer]:
                  - /url: "#cite_note-polygon_fireside-30"
              - superscript [ref=f1e608]:
                - link "[23]" [ref=f1e609] [cursor=pointer]:
                  - /url: "#cite_note-pcgamesn_team-29"
            - paragraph [ref=f1e611]:
              - text: With the rapid growth of interest in the game, Bluehole spun out the entire development for PUBG into Bluehole Ginno Games in September 2017, which was renamed PUBG Corporation with Kim as its
              - link "chief executive officer" [ref=f1e612] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Chief_executive_officer
              - text: . PUBG Corporation continued the development of the game and its marketing and growth, opening an office in the United States with plans for future ones in Europe and Japan.
              - superscript [ref=f1e613]:
                - link "[25]" [ref=f1e614] [cursor=pointer]:
                  - /url: "#cite_note-vb_pubg_corp-31"
              - text: In August 2018, PUBG Corporation launched the "Fix PUBG" campaign, acknowledging that the game by then still had several lingering
              - link "bugs" [ref=f1e616] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Software_bug
              - text: and other performance issues.
              - superscript [ref=f1e617]:
                - link "[26]" [ref=f1e618] [cursor=pointer]:
                  - /url: "#cite_note-32"
              - text: The campaign finished in November, with PUBG Corporation calling it a success as everything listed had been implemented by then.
              - superscript [ref=f1e620]:
                - link "[27]" [ref=f1e621] [cursor=pointer]:
                  - /url: "#cite_note-33"
            - paragraph [ref=f1e623]:
              - text: In March 2019, Greene announced that he was stepping down as the game's lead designer, but would still serve as a creative consultant. Tae-seok Jang, the game's art director, would replace him, with Green relocating to PUBG's studio in Amsterdam, PUBG Special Projects.
              - superscript [ref=f1e624]:
                - link "[28]" [ref=f1e625] [cursor=pointer]:
                  - /url: "#cite_note-34"
              - text: Greene stated that he believed the main PUBG team was at a place to continue developing the game in the direction he had set to keep the game unique among the other battle royale games it had launched, and he wanted to try something not tied to battle royale but still multiplayer-based. The move also put him closer to his family in Ireland.
              - superscript [ref=f1e627]:
                - link "[29]" [ref=f1e628] [cursor=pointer]:
                  - /url: "#cite_note-35"
            - paragraph [ref=f1e630]:
              - text: With the success of PUBG, Bluehole created
              - link "Krafton" [ref=f1e631] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Krafton
              - text: as a holding company for its video game assets and studios in 2018, taking over the publishing duties for PUBG and related games.
              - superscript [ref=f1e632]:
                - link "[30]" [ref=f1e633] [cursor=pointer]:
                  - /url: "#cite_note-bloomberg_krafton_ipo-36"
              - superscript [ref=f1e635]:
                - link "[31]" [ref=f1e636] [cursor=pointer]:
                  - /url: "#cite_note-37"
              - text: By December 2020, Krafton merged PUBG Corporation into their internal studio system, rebranding the team as PUBG Studios.
              - superscript [ref=f1e638]:
                - link "[32]" [ref=f1e639] [cursor=pointer]:
                  - /url: "#cite_note-38"
            - region [ref=f1e641]:
              - heading "Design" [level=3] [ref=f1e643]
              - paragraph [ref=f1e644]:
                - text: PUBG represents the standalone version of what Greene believes is the "final version" of the battle royale concept, incorporating the elements he had designed in previous iterations.
                - superscript [ref=f1e645]:
                  - link "[6]" [ref=f1e646] [cursor=pointer]:
                    - /url: "#cite_note-gibiz-12"
                - superscript [ref=f1e648]:
                  - link "[33]" [ref=f1e649] [cursor=pointer]:
                    - /url: "#cite_note-39"
                - text: Faster development was possible with the game engine
                - link "Unreal Engine" [ref=f1e651] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Unreal_Engine
                - text: 4, compared with ARMA and H1Z1, which were built with proprietary game engines. Greene acknowledged that implementing the size of the maps in PUBG has been one of the challenges with working with Unreal, which was not designed with such maps in mind.
                - superscript [ref=f1e652]:
                  - link "[6]" [ref=f1e653] [cursor=pointer]:
                    - /url: "#cite_note-gibiz-12"
                - superscript [ref=f1e655]:
                  - link "[12]" [ref=f1e656] [cursor=pointer]:
                    - /url: "#cite_note-rps_interview_jul17-18"
                - text: The game was designed as a mix between the realistic simulation of ARMA 3 and the arcade-like action focus and player accessibility of H1Z1.
                - superscript [ref=f1e658]:
                  - link "[5]" [ref=f1e659] [cursor=pointer]:
                    - /url: "#cite_note-pc_gamer_future-11"
                - text: To prevent
                - link "in-game cheating" [ref=f1e661] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cheating_in_online_games
                - text: ", the game uses"
                - link "BattlEye" [ref=f1e662] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/BattlEye
                - text: anti-cheating software, which had permanently banned over 13 million players by October 2018.
                - superscript [ref=f1e663]:
                  - link "[34]" [ref=f1e664] [cursor=pointer]:
                    - /url: "#cite_note-40"
                - superscript [ref=f1e666]:
                  - link "[35]" [ref=f1e667] [cursor=pointer]:
                    - /url: "#cite_note-41"
                - text: BattlEye indicated that 99% of all cheating software for the game was developed in
                - link "China" [ref=f1e669] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/China
                - text: .
                - superscript [ref=f1e670]:
                  - link "[36]" [ref=f1e671] [cursor=pointer]:
                    - /url: "#cite_note-42"
              - paragraph [ref=f1e673]:
                - text: Based on Greene's experience with the genre, an island with many terrain features was picked as the first map, known as "Erangel".
                - superscript [ref=f1e674]:
                  - link "[11]" [ref=f1e675] [cursor=pointer]:
                    - /url: "#cite_note-usgamer_greene_interview-17"
                - text: The map design scope was to offer players many possible options for strategic and unique gameplay.
                - superscript [ref=f1e677]:
                  - link "[4]" [ref=f1e678] [cursor=pointer]:
                    - /url: "#cite_note-gamasutra_mapdesign-10"
                - text: Some buildings and structures were designed to depict the style of the
                - link "brutalist architecture" [ref=f1e680] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Brutalist_architecture
                - text: of the
                - link "Soviet Union" [ref=f1e681] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Soviet_Union
                - text: during the 1950s. The developer team playtested architecture features and random item placement systems, looking at both how close-quarters encounters went and open terrain areas.
                - superscript [ref=f1e682]:
                  - link "[4]" [ref=f1e683] [cursor=pointer]:
                    - /url: "#cite_note-gamasutra_mapdesign-10"
                - text: The goal was to optimize the right distribution and placement of weapons and gear across the map, to encourage players to make strategic decisions about how to proceed in the game without overly penalizing players who may not find weapons within the first few minutes of a round.
                - superscript [ref=f1e685]:
                  - link "[6]" [ref=f1e686] [cursor=pointer]:
                    - /url: "#cite_note-gibiz-12"
                - text: During early access, additional maps were planned, such as one set on a fictional island in the Adriatic Sea that included snow-covered Yugoslavian territories.
                - superscript [ref=f1e688]:
                  - link "[37]" [ref=f1e689] [cursor=pointer]:
                    - /url: "#cite_note-43"
                - superscript [ref=f1e691]:
                  - link "[23]" [ref=f1e692] [cursor=pointer]:
                    - /url: "#cite_note-pcgamesn_team-29"
                - text: Greene stated that he thought the Erangel map felt disjointed despite meeting their goals for gameplay, and sought to create more unified ideas with future maps.
                - superscript [ref=f1e694]:
                  - link "[11]" [ref=f1e695] [cursor=pointer]:
                    - /url: "#cite_note-usgamer_greene_interview-17"
              - paragraph [ref=f1e697]:
                - text: The freefall from an airplane at the start of each match was a new feature for the genre, encouraging strategy between staying with the pack of players or seeking out one's own route for a better chance at finding good loot.
                - superscript [ref=f1e698]:
                  - link "[6]" [ref=f1e699] [cursor=pointer]:
                    - /url: "#cite_note-gibiz-12"
                - text: "With the added parachute drop, Greene considered that PUBG had three distinct subgames: the airdrop during which one must quickly figure out the best time to jump and where to land in relationship to the other players, the loot game of knowing where and how to gather the best possible equipment, and the combat game with other players."
                - superscript [ref=f1e701]:
                  - link "[38]" [ref=f1e702] [cursor=pointer]:
                    - /url: "#cite_note-44"
                - text: Winners of a match are greeted with the phrase "winner winner chicken dinner", an idiom that Greene had used in his prior battle royale games and kept in PUBG, which itself had origins as early as the
                - link "Great Depression" [ref=f1e704] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Great_Depression
                - text: era.
                - superscript [ref=f1e705]:
                  - link "[39]" [ref=f1e706] [cursor=pointer]:
                    - /url: "#cite_note-45"
              - paragraph [ref=f1e708]:
                - text: Greene also introduced
                - link "microtransactions" [ref=f1e709] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Microtransaction
                - text: that allow players to use real-world funds to purchase loot crates that provide randomly-selected cosmetic items, also known as "skins", which they can trade with other players; while Greene recognizes the issue with
                - link "skin gambling" [ref=f1e710] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Skin_gambling
                - text: ", he believes that Valve has put safeguards in place to support a \"skin economy\" that will provide further revenue for them without concerns over gambling."
                - superscript [ref=f1e711]:
                  - link "[8]" [ref=f1e712] [cursor=pointer]:
                    - /url: "#cite_note-Skin_economy-14"
                - text: However, by November 2017,
                - link "gray market" [ref=f1e714] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Gray_market
                - text: skin gambling sites began to appear that used PUBG cosmetics as
                - link "virtual currency" [ref=f1e715] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Virtual_currency
                - text: .
                - superscript [ref=f1e716]:
                  - link "[40]" [ref=f1e717] [cursor=pointer]:
                    - /url: "#cite_note-46"
                - text: Following controversy over the use of
                - link "loot boxes" [ref=f1e719] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Loot_box
                - text: to offer "pay-to-win" items in other games in November 2017, the PUBG Corporation affirmed that while they would continue to add new cosmetic items rewarded by in-game crate purchases, they would never add anything that affects or alters gameplay.
                - superscript [ref=f1e720]:
                  - link "[41]" [ref=f1e721] [cursor=pointer]:
                    - /url: "#cite_note-47"
                - text: In May 2018, PUBG Corporation disabled the ability to trade skins on the
                - link "Steam Marketplace" [ref=f1e723] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Steam_Marketplace
                - text: as they found that players were still abusing the system by selling them for monetary value through unofficial third-party platforms.
                - superscript [ref=f1e724]:
                  - link "[42]" [ref=f1e725] [cursor=pointer]:
                    - /url: "#cite_note-48"
                - text: While still in early access, Bluehole offered an early preview of the system by offering time-limited crates that could be purchased during the first PUBG Invitations tournament during
                - link "Gamescom" [ref=f1e727] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Gamescom
                - text: in August 2017, with the sales from these contributing to the prize pool. Among loot from these crates were special outfits inspired by the original
                - link "Battle Royale" [ref=f1e729] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Battle_Royale_(film)
                - text: film.
                - superscript [ref=f1e730]:
                  - link "[43]" [ref=f1e731] [cursor=pointer]:
                    - /url: "#cite_note-rps_aug17_lootcrates-49"
                - text: Greene anticipates adding a campaign mode with co-operative player support, though there would be "no serious lore" crafted for the narrative, comparing this to similar modes in
                - link "Watch Dogs" [ref=f1e734] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Watch_Dogs_(video_game)
                - text: .
                - superscript [ref=f1e735]:
                  - link "[44]" [ref=f1e736] [cursor=pointer]:
                    - /url: "#cite_note-50"
              - paragraph [ref=f1e738]:
                - text: The game also features custom gamemodes and
                - link "modding" [ref=f1e739] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Mod_(video_gaming)
                - text: support.
                - superscript [ref=f1e740]:
                  - link "[6]" [ref=f1e741] [cursor=pointer]:
                    - /url: "#cite_note-gibiz-12"
                - superscript [ref=f1e743]:
                  - link "[14]" [ref=f1e744] [cursor=pointer]:
                    - /url: "#cite_note-pcgn_greene-20"
                - text: He considered modding support an essential part of the full release as, just as he had his start with mods, he wants to enable others to create variations on his game so that he could "find the next PlayerUnknown".
                - superscript [ref=f1e746]:
                  - link "[45]" [ref=f1e747] [cursor=pointer]:
                    - /url: "#cite_note-cnet_interview-51"
                - text: This was aided by a quiet release of custom server support to a number of influential streamers which subsequently made it into public release.
                - superscript [ref=f1e749]:
                  - link "[24]" [ref=f1e750] [cursor=pointer]:
                    - /url: "#cite_note-polygon_fireside-30"
                - text: In one case, "Zombie Mode", all but four players pretend to be
                - link "zombies" [ref=f1e752] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Zombie
                - text: ", who may sometimes distinguish themselves by removing all clothing and are limited only to collecting melee weapons and consumable items, and must rush to attack the other four players, who are able to collect all gear and attempt to outrun and defeat the zombies."
                - superscript [ref=f1e753]:
                  - link "[46]" [ref=f1e754] [cursor=pointer]:
                    - /url: "#cite_note-52"
                - text: Inspired by this mode, Greene announced plans to introduce an official zombie-based gameplay mode based on this into PUBG.
                - superscript [ref=f1e756]:
                  - link "[47]" [ref=f1e757] [cursor=pointer]:
                    - /url: "#cite_note-53"
                - text: Whereas most of the rest of the team continued to develop the core gameplay and maps, Greene is taking on the zombie mode as a near solo project, only using the assistance of the lead animator to help with the zombie animations.
                - superscript [ref=f1e759]:
                  - link "[23]" [ref=f1e760] [cursor=pointer]:
                    - /url: "#cite_note-pcgamesn_team-29"
                - text: Greene sees PUBG as a platform, and would like to see more custom game types and mods developed by players for it.
                - superscript [ref=f1e762]:
                  - link "[12]" [ref=f1e763] [cursor=pointer]:
                    - /url: "#cite_note-rps_interview_jul17-18"
                - text: Greene identified that some mods that he also previously worked on from ARMA 3 may become part of the Battlegrounds platform.
                - superscript [ref=f1e765]:
                  - link "[12]" [ref=f1e766] [cursor=pointer]:
                    - /url: "#cite_note-rps_interview_jul17-18"
                - text: Greene also wants to incorporate streaming services like
                - link "Twitch" [ref=f1e768] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Twitch_(service)
                - text: into the game that would enable features supporting Battlegrounds' development as an
                - link "esport" [ref=f1e769] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Esport
                - text: ", calling this an \"ultimate end goal\" for his development, but he wanted to let it progress naturally with players."
                - superscript [ref=f1e770]:
                  - link "[6]" [ref=f1e771] [cursor=pointer]:
                    - /url: "#cite_note-gibiz-12"
                - superscript [ref=f1e773]:
                  - link "[14]" [ref=f1e774] [cursor=pointer]:
                    - /url: "#cite_note-pcgn_greene-20"
                - superscript [ref=f1e776]:
                  - link "[13]" [ref=f1e777] [cursor=pointer]:
                    - /url: "#cite_note-glixel_interview-19"
          - region [ref=f1e779]:
            - heading "Release" [level=2] [ref=f1e781]
            - table "Release timeline Major release(s)" [ref=f1e782]:
              - caption [ref=f1e783]:
                - text: Release timeline
                - generic [ref=f1e784]: Major release(s)
