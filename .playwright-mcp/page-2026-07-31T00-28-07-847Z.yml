                  - rowgroup
                - paragraph [ref=f1e1673]:
                  - text: "Before the official release of PUBG: Battlegrounds, as an"
                  - link "early access video game" [ref=f1e1674] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Early_access_video_game
                  - text: ", it had collected seven"
                  - link "Guinness World Records" [ref=f1e1676] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Guinness_World_Records
                  - text: "on"
                  - link "Steam" [ref=f1e1677] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Steam_(service)
                  - text: . The first record, titled "Fastest time for a Steam Early Access video game to sell one million units" was provided selling 1 million units in just 16 days of its early access release. The second record, titled, "Fastest time for a Steam Early Access video game to gross $100 million in revenue" was provided for grossing $100 million in just 79 days of its early access release. And the third record, titled "First non-Valve video game to be the most played game on Steam" was provided for temporarily topping the Steam charts for people playing the game at the same time – more than 800,000. It was the first time that a game not published by
                  - link "Valve" [ref=f1e1678] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Valve_Corporation
                  - text: ", the makers of Steam, had achieved this since Steam's initial release in 2003. As of 6 September 2017, it had the second highest ever peak players on the Steam distribution platform. Titles \"Most concurrent players for a Steam Early Access video game\", \"Most concurrent players on Steam for a non-Valve video game\" and \"Most actively played video game on Steam\" were provided for being able to achieve 1,984,278"
                  - link "concurrent players" [ref=f1e1679] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Concurrent_players
                  - text: on Steam. Title "First video game with 2 million concurrent players on Steam" was provided for being able to achieve a peak of 2,279,084 gamers playing at the same time.
                  - superscript [ref=f1e1680]:
                    - link "[199]" [ref=f1e1681] [cursor=pointer]:
                      - /url: "#cite_note-:5-205"
            - region [ref=f1e1683]:
              - heading "Awards" [level=3] [ref=f1e1685]
              - paragraph [ref=f1e1686]:
                - text: While it was still in early access, Battlegrounds won the "Best Multiplayer Game" and was also nominated for the categories "Game of the Year" and "Best Ongoing Game" at
                - link "The Game Awards 2017" [ref=f1e1687] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/The_Game_Awards_2017
                - text: .
                - superscript [ref=f1e1688]:
                  - link "[200]" [ref=f1e1689] [cursor=pointer]:
                    - /url: "#cite_note-GameAwards2017-206"
                - text: The game's nomination for "Game of the Year" created some debate, being the first early access title to be named for one of the top industry awards.
                - superscript [ref=f1e1691]:
                  - link "[201]" [ref=f1e1692] [cursor=pointer]:
                    - /url: "#cite_note-207"
                - superscript [ref=f1e1694]:
                  - link "[202]" [ref=f1e1695] [cursor=pointer]:
                    - /url: "#cite_note-208"
                - text: Also, about a month before it was released, the game won "Best Multiplayer Game" and "PC Game of the Year" at the 35th
                - link "Golden Joystick Awards" [ref=f1e1697] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Golden_Joystick_Awards
                - text: ","
                - superscript [ref=f1e1698]:
                  - link "[203]" [ref=f1e1699] [cursor=pointer]:
                    - /url: "#cite_note-Golden-Joysticks-2017-209"
                - text: whereas its other nominations were for "Studio of the Year" (PUBG Corporation) and "Ultimate Game of the Year".
                - superscript [ref=f1e1701]:
                  - link "[204]" [ref=f1e1702] [cursor=pointer]:
                    - /url: "#cite_note-GoldenJoystickAwards2017-nominations-210"
                - text: It also won the "Breakout Game of the Year" award at
                - link "PC Gamer" [ref=f1e1705] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/PC_Gamer
                - generic [ref=f1e1706]: "'s"
                - text: end of the year awards,
                - superscript [ref=f1e1707]:
                  - link "[205]" [ref=f1e1708] [cursor=pointer]:
                    - /url: "#cite_note-PCGamerGOTYAwards2017BreakoutGame-211"
                - text: whereas its other nomination was for "Game of the Year".
                - superscript [ref=f1e1710]:
                  - link "[206]" [ref=f1e1711] [cursor=pointer]:
                    - /url: "#cite_note-PCGamerGOTYAwards2017Nominees-212"
                - link "Polygon" [ref=f1e1714] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Polygon_(website)
                - text: ranked the game second on their list of the 50 best games of 2017,
                - superscript [ref=f1e1715]:
                  - link "[207]" [ref=f1e1716] [cursor=pointer]:
                    - /url: "#cite_note-213"
                - text: and
                - link "The Verge" [ref=f1e1719] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/The_Verge
                - text: named it one of their 15 Best Games of 2017,
                - superscript [ref=f1e1720]:
                  - link "[208]" [ref=f1e1721] [cursor=pointer]:
                    - /url: "#cite_note-214"
                - text: while
                - link "Entertainment Weekly" [ref=f1e1724] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Entertainment_Weekly
                - text: ranked it seventh on their "Best Games of 2017" list.
                - superscript [ref=f1e1725]:
                  - link "[209]" [ref=f1e1726] [cursor=pointer]:
                    - /url: "#cite_note-215"
              - paragraph [ref=f1e1728]:
                - text: Following release, Battlegrounds has been nominated and won several industry awards, including winning Best Multiplayer Game at the 35th
                - link "Golden Joystick Awards" [ref=f1e1729] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Golden_Joystick_Awards
                - text: and
                - link "The Game Awards 2017" [ref=f1e1730] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/The_Game_Awards_2017
                - text: ", as well as"
                - link "Action Game of the Year" [ref=f1e1731] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/D.I.C.E._Award_for_Action_Game_of_the_Year
                - text: during the
