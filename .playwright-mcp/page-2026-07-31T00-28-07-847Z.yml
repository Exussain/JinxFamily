                - rowgroup
              - paragraph [ref=f1e2067]:
                - text: The game has also gained multiple awards from individual press. Battlegrounds won the award for "Best PC Game", "Best Multiplayer", and "Best Spectator Game" at the
                - link "IGN" [ref=f1e2069] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/IGN
                - text: Best of 2017 Awards,
                - superscript [ref=f1e2070]:
                  - link "[241]" [ref=f1e2071] [cursor=pointer]:
                    - /url: "#cite_note-IGNBestOf2017A-247"
                - superscript [ref=f1e2073]:
                  - link "[242]" [ref=f1e2074] [cursor=pointer]:
                    - /url: "#cite_note-IGNBestOf2017B-248"
                - superscript [ref=f1e2076]:
                  - link "[243]" [ref=f1e2077] [cursor=pointer]:
                    - /url: "#cite_note-IGNBestOf2017C-249"
                - text: whereas its other nominations were for "Game of the Year"
                - superscript [ref=f1e2079]:
                  - link "[244]" [ref=f1e2080] [cursor=pointer]:
                    - /url: "#cite_note-IGNBestOf2017GOTY-250"
                - text: and "Best Shooter".
                - superscript [ref=f1e2082]:
                  - link "[245]" [ref=f1e2083] [cursor=pointer]:
                    - /url: "#cite_note-IGNBestOf2017Shooter-251"
                - text: It also won the award for "Best PC Game" at
                - link "Destructoid" [ref=f1e2086] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Destructoid
                - generic [ref=f1e2087]: "'"
                - text: s Game of the Year Awards 2017.
                - superscript [ref=f1e2088]:
                  - link "[246]" [ref=f1e2089] [cursor=pointer]:
                    - /url: "#cite_note-DestructoidPCGOTY2017-252"
                - text: The game also won
                - link "Giant Bomb" [ref=f1e2092] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Giant_Bomb
                - generic [ref=f1e2093]: "'"
                - text: s "Best Multiplayer", "Best Surprise", "Best Debut", and "Game of the Year" awards, and was classified as a runner-up for the "Best Moment or Sequence" award for the "chicken-eating game".
                - superscript [ref=f1e2094]:
                  - link "[247]" [ref=f1e2095] [cursor=pointer]:
                    - /url: "#cite_note-GiantBombGOTY2017Day2-253"
                - superscript [ref=f1e2097]:
                  - link "[248]" [ref=f1e2098] [cursor=pointer]:
                    - /url: "#cite_note-GiantBombGOTY2017Day3-254"
                - superscript [ref=f1e2100]:
                  - link "[249]" [ref=f1e2101] [cursor=pointer]:
                    - /url: "#cite_note-GiantBombGOTY2017Day4-255"
                - superscript [ref=f1e2103]:
                  - link "[250]" [ref=f1e2104] [cursor=pointer]:
                    - /url: "#cite_note-GiantBombGOTY2017Day5-256"
                - link "Eurogamer" [ref=f1e2107] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Eurogamer
                - text: ranked PUBG fourth on their list of the "Top 50 Games of 2017",
                - superscript [ref=f1e2108]:
                  - link "[251]" [ref=f1e2109] [cursor=pointer]:
                    - /url: "#cite_note-257"
                - text: while
                - link "GamesRadar+" [ref=f1e2112] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/GamesRadar+
                - text: ranked it 12th on their list of the 25 Best Games of 2017.
                - superscript [ref=f1e2113]:
                  - link "[252]" [ref=f1e2114] [cursor=pointer]:
                    - /url: "#cite_note-258"
                - link "Game Informer" [ref=f1e2117] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Game_Informer
                - text: gave it the award each for "Best Competitive Multiplayer" and "Best Shooter" in their Best of 2017 Awards,
                - superscript [ref=f1e2118]:
                  - link "[253]" [ref=f1e2119] [cursor=pointer]:
                    - /url: "#cite_note-GameInformerBestOf2017Page2-259"
                - superscript [ref=f1e2121]:
                  - link "[254]" [ref=f1e2122] [cursor=pointer]:
                    - /url: "#cite_note-GameInformerBestOf2017Page4-260"
                - text: and for "Best Competitive Multiplayer", "Best Multiplayer Map" (Erangel), "Best Innovation", and "Shooter of the Year" in their 2017 Shooter of the Year Awards.
                - superscript [ref=f1e2124]:
                  - link "[255]" [ref=f1e2125] [cursor=pointer]:
                    - /url: "#cite_note-GameInformer2017ShooterOfTheYear-261"
                - text: In their Reader's Choice Best of 2017 Awards, the game won the "Best Competitive Multiplayer" award, and was runner-up in the "Best Microsoft Exclusive" and "Best Shooter" categories.
                - superscript [ref=f1e2127]:
                  - link "[256]" [ref=f1e2128] [cursor=pointer]:
                    - /url: "#cite_note-GameInformerReadersChoice2017-262"
                - superscript [ref=f1e2130]:
                  - link "[257]" [ref=f1e2131] [cursor=pointer]:
                    - /url: "#cite_note-GameInformerReadersChoice2017Page2-263"
                - superscript [ref=f1e2133]:
                  - link "[258]" [ref=f1e2134] [cursor=pointer]:
                    - /url: "#cite_note-GameInformerReadersChoice2017Page3-264"
          - region [ref=f1e2136]:
            - heading "Litigation" [level=2] [ref=f1e2138]
            - region [ref=f1e2139]:
              - heading "Epic Games lawsuit" [level=3] [ref=f1e2141]
              - paragraph [ref=f1e2142]:
                - text: Battlegrounds is considered as one of the games that have boosted the popularity of the
                - link "battle royale game" [ref=f1e2143] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Battle_royale_game
                - text: genre, even though other games, including Greene's previous mods, were already on the market.
                - superscript [ref=f1e2144]:
                  - link "[259]" [ref=f1e2145] [cursor=pointer]:
                    - /url: "#cite_note-bbc_greene-265"
                - text: After its large early access sales numbers, other games followed with battle royale mechanics, with either existing games that added a battle royale mode or fully new games. Notably,
                - link "Epic Games" [ref=f1e2147] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Epic_Games
                - text: updated their in-development title
                - link "Fortnite" [ref=f1e2149] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fortnite
                - text: ", a"
                - link "sandbox" [ref=f1e2150] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Sandbox_game
                - text: "-based survival game that included the ability to construct fortifications, to include a battle royale mode that retained the fortification aspects. Known as"
                - link "Fortnite Battle Royale" [ref=f1e2152] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fortnite_Battle_Royale
                - text: ", Epic later released it as a standalone free-to-play game in September 2017. Shortly after its release,"
                - link "Bluehole" [ref=f1e2153] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Krafton
                - text: expressed concerns about the game, acknowledging that while they cannot claim ownership of the battle royale genre, they feared that since they had been working with Epic for technical support of the Unreal engine, they may have had a heads-up on planned features they wanted to bring to Battlegrounds and could release it first.
                - superscript [ref=f1e2154]:
                  - link "[260]" [ref=f1e2155] [cursor=pointer]:
                    - /url: "#cite_note-266"
                - text: PUBG Corporation later filed a lawsuit against Epic Games Korea in January 2018, alleging that Fortnite Battle Royale was infringing the copyright of Battlegrounds.
                - superscript [ref=f1e2157]:
                  - link "[261]" [ref=f1e2158] [cursor=pointer]:
                    - /url: "#cite_note-267"
                - text: However, the lawsuit was closed by PUBG in June 2018 for undisclosed reasons.
                - superscript [ref=f1e2160]:
                  - link "[262]" [ref=f1e2161] [cursor=pointer]:
                    - /url: "#cite_note-268"
              - paragraph [ref=f1e2163]:
                - text: Greene had expressed concern on the large number of games that have simply
                - link "cloned" [ref=f1e2164] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Video_game_clone
                - text: the Battlegrounds mechanics, particularly in China where clones of Battlegrounds are considered a new genre of "chicken-eating game" (based on the "winner winner chicken dinner" line that is presented to a match winner in Battlegrounds).
                - superscript [ref=f1e2165]:
                  - link "[263]" [ref=f1e2166] [cursor=pointer]:
                    - /url: "#cite_note-269"
                - superscript [ref=f1e2168]:
                  - link "[264]" [ref=f1e2169] [cursor=pointer]:
                    - /url: "#cite_note-270"
                - text: Greene said "I want this genre of games to grow. For that to happen you need new and interesting spins on the game mode. If it's just copycats down the line, then the genre doesn't grow and people get bored."
                - superscript [ref=f1e2171]:
                  - link "[259]" [ref=f1e2172] [cursor=pointer]:
                    - /url: "#cite_note-bbc_greene-265"
                - text: Greene claimed no ownership of the battle royale or last man standing genres, but believed that the clones were taking some specific mechanics he had developed in Battlegrounds and prior mods, such as the initial parachuting segment or the red-zone bombing runs, and would like to see legislation to give developers like himself protection against these types of concepts as well as improve creativity as developers invent new approaches to mimic such innovations.
                - superscript [ref=f1e2174]:
                  - link "[265]" [ref=f1e2175] [cursor=pointer]:
                    - /url: "#cite_note-271"
                - text: Battlegrounds
                - generic [ref=f1e2177]: "'"
                - text: explosive growth and how it popularized the battle royale genre was considered one of the top stories in the
                - link "video game industry" [ref=f1e2178] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Video_game_industry
                - text: during 2017.
                - superscript [ref=f1e2179]:
                  - link "[266]" [ref=f1e2180] [cursor=pointer]:
                    - /url: "#cite_note-272"
                - superscript [ref=f1e2182]:
                  - link "[267]" [ref=f1e2183] [cursor=pointer]:
                    - /url: "#cite_note-273"
                - superscript [ref=f1e2185]:
                  - link "[268]" [ref=f1e2186] [cursor=pointer]:
                    - /url: "#cite_note-274"
            - region [ref=f1e2188]:
              - heading "NetEase lawsuit" [level=3] [ref=f1e2190]
              - paragraph [ref=f1e2191]:
                - text: Prior to release of their mobile versions, PUBG Corporation initiated legal action in the
                - link "Northern District Court of California" [ref=f1e2192] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/United_States_District_Court_for_the_Northern_District_of_California
                - text: against Chinese game publisher
                - link "NetEase" [ref=f1e2193] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/NetEase
                - text: in January 2018, claiming that their mobile games
                - link "Rules of Survival" [ref=f1e2195] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Rules_of_Survival
                - text: and Knives Out infringe on Battlegrounds
                - generic [ref=f1e2196]: "'"
                - text: copyrights. PUBG's lawsuit asserts that Rules of Survival is "a copyrightable audio-visual work, individually and/or in combination with other elements of Battlegrounds", and identified several elements that appear similar in both games. While some of these elements are common features of a battle royale game, PUBG asserted that other elements referencing specific facets of Battlegrounds, such as references to chicken for winning a game or using cookware as weapons or armor, imply a connection to Battlegrounds. PUBG seeks both monetary damages and an injunction to prevent NetEase from further distribution of the games. NetEase, in responding to PUBG's request to
                - link "Apple" [ref=f1e2197] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Apple_Inc.
                - text: to remove the games, denied that their games violated Battlegrounds
                - generic [ref=f1e2198]: "'"
                - text: copyrights.
                - superscript [ref=f1e2199]:
                  - link "[269]" [ref=f1e2200] [cursor=pointer]:
                    - /url: "#cite_note-275"
                - superscript [ref=f1e2202]:
                  - link "[270]" [ref=f1e2203] [cursor=pointer]:
                    - /url: "#cite_note-276"
                - text: By March 2019, the two companies had reached an undisclosed agreement and were working to get the cases dismissed.
                - superscript [ref=f1e2205]:
                  - link "[271]" [ref=f1e2206] [cursor=pointer]:
                    - /url: "#cite_note-277"
            - region [ref=f1e2208]:
              - heading "National bans" [level=3] [ref=f1e2210]
              - paragraph [ref=f1e2211]:
                - text: In March 2019, Battlegrounds was banned in the Indian state of
                - link "Gujarat" [ref=f1e2212] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Gujarat
                - text: after the local government decided the game was too addictive and an unnecessary distraction during exam season.
                - superscript [ref=f1e2213]:
                  - link "[272]" [ref=f1e2214] [cursor=pointer]:
                    - /url: "#cite_note-BanLifted-278"
                - text: A number of students caught playing the game were arrested as a result.
                - superscript [ref=f1e2216]:
                  - link "[273]" [ref=f1e2217] [cursor=pointer]:
                    - /url: "#cite_note-279"
                - superscript [ref=f1e2219]:
                  - link "[274]" [ref=f1e2220] [cursor=pointer]:
                    - /url: "#cite_note-280"
                - text: The ban was not renewed in some cities in the state after March as exam season had ended.
                - superscript [ref=f1e2222]:
                  - link "[272]" [ref=f1e2223] [cursor=pointer]:
                    - /url: "#cite_note-BanLifted-278"
                - text: A similar ban was enacted in
                - link "Nepal" [ref=f1e2225] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Nepal
                - text: and
                - link "Iraq" [ref=f1e2226] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Iraq
                - text: in April 2019, with the cited reasons being that the game was harmful to children and teenagers.
                - superscript [ref=f1e2227]:
                  - link "[275]" [ref=f1e2228] [cursor=pointer]:
                    - /url: "#cite_note-281"
                - superscript [ref=f1e2230]:
                  - link "[276]" [ref=f1e2231] [cursor=pointer]:
                    - /url: "#cite_note-282"
                - text: The ban in Nepal was shortly lifted by the country's Supreme Court, stating that the government could not enforce such a ban that interfered with personal freedoms without demonstrating why the ban was necessary.
                - superscript [ref=f1e2233]:
                  - link "[277]" [ref=f1e2234] [cursor=pointer]:
                    - /url: "#cite_note-:1-283"
                - text: In mid-2019,
                - link "Jordan" [ref=f1e2236] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Jordan
                - text: and the Indonesian province of
                - link "Aceh" [ref=f1e2237] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Aceh
                - text: issued similar bans.
                - superscript [ref=f1e2238]:
                  - link "[278]" [ref=f1e2239] [cursor=pointer]:
                    - /url: "#cite_note-284"
                - superscript [ref=f1e2241]:
                  - link "[279]" [ref=f1e2242] [cursor=pointer]:
                    - /url: "#cite_note-285"
              - paragraph [ref=f1e2244]:
                - text: On July 1, 2020, Battlegrounds was banned in Pakistan by
                - link "Pakistan Telecommunication Authority" [ref=f1e2245] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Pakistan_Telecommunication_Authority
                - text: ", citing the reasons that the game is addictive, a wastage of time and poses a serious negative impact on the physical and psychological health of children, after receiving various complaints from different segments of society and"
                - link "Lahore High Court" [ref=f1e2246] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Lahore_High_Court
                - text: "'s directions to look in the matter. However, the ban was temporary till further orders from the court."
                - superscript [ref=f1e2247]:
                  - link "[280]" [ref=f1e2248] [cursor=pointer]:
                    - /url: "#cite_note-286"
                - text: The game continued to remain banned in Pakistan for a month. A meeting was held on July 30, 2020, between PTA and legal representatives of Proxima Beta, who addressed the queries raised by the authority and emphasized on continued engagement and a comprehensive control mechanism. After this, the ban on Battlegrounds was lifted.
                - superscript [ref=f1e2250]:
                  - link "[281]" [ref=f1e2251] [cursor=pointer]:
                    - /url: "#cite_note-287"
              - paragraph [ref=f1e2253]:
                - text: Amidst the ongoing
                - link "2020 China–India skirmishes" [ref=f1e2254] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/2020_China–India_skirmishes
                - text: ", the Indian government banned PUBG Mobile along with more than 100 other Chinese apps, most made by Tencent and NetEase, on September 2, 2020, asserting the apps were \"stealing and surreptitiously transmitting user data in an unauthorized manner to servers which have locations outside India\"."
                - superscript [ref=f1e2255]:
                  - link "[282]" [ref=f1e2256] [cursor=pointer]:
                    - /url: "#cite_note-288"
                - superscript [ref=f1e2258]:
                  - link "[283]" [ref=f1e2259] [cursor=pointer]:
                    - /url: "#cite_note-289"
                - text: India was PUBG Mobile
                - generic [ref=f1e2261]: "'"
                - text: s largest market with the country accounting for 175 million downloads and 24% of global users.
                - superscript [ref=f1e2262]:
                  - link "[284]" [ref=f1e2263] [cursor=pointer]:
                    - /url: "#cite_note-290"
