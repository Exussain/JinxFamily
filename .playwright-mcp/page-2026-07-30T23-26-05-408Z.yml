                      - /url: https://en.wikipedia.org/wiki/Multiplayer
            - paragraph [ref=f8e368]:
              - generic [ref=f8e369]: Tom Clancy's Rainbow Six Siege
              - superscript [ref=f8e370]:
                - link "[b]" [ref=f8e371] [cursor=pointer]:
                  - /url: "#cite_note-2"
              - text: is a 2015
              - link "tactical shooter game" [ref=f8e372] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Tactical_shooter_game
              - text: developed by
              - link "Ubisoft Montreal" [ref=f8e373] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Ubisoft_Montreal
              - text: and published by
              - link "Ubisoft" [ref=f8e374] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Ubisoft
              - text: . The game puts heavy emphasis on environmental destruction and
              - link "cooperation" [ref=f8e375] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Cooperation
              - text: between players. Each player assumes control of an attacker or a defender in different gameplay modes such as rescuing a hostage, defusing a bomb, or taking control of an objective within a room. The title has no campaign but features offline training modes that can be played solo.
            - paragraph [ref=f8e376]:
              - text: Siege is an entry in the
              - link "Rainbow Six" [ref=f8e378] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Tom_Clancy's_Rainbow_Six
              - text: series and the successor to
              - 'link "Tom Clancy''s Rainbow 6: Patriots" [ref=f8e380] [cursor=pointer]':
                - /url: https://en.wikipedia.org/wiki/Tom_Clancy's_Rainbow_6:_Patriots
              - text: ", a tactical shooter that had a larger focus on narrative. After Patriots was eventually cancelled due to its technical shortcomings, Ubisoft decided to"
              - link "reboot" [ref=f8e381] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Reboot_(fiction)
              - text: the franchise. The team evaluated the core of the Rainbow Six franchise and believed that letting players impersonate the top counter-terrorist operatives around the world suited the game most. To create authentic siege situations, the team consulted actual
              - link "counter-terrorism units" [ref=f8e382] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Counter-terrorism_unit
              - text: and looked at real-life examples of sieges such as the 1980
              - link "Iranian Embassy siege" [ref=f8e383] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Iranian_Embassy_siege
              - text: . Powered by
              - link "AnvilNext 2.0" [ref=f8e384] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Anvil_(game_engine)
              - text: ", the game also utilizes Ubisoft's RealBlast technology to create destructible environments. It was released for"
              - link "PlayStation 4" [ref=f8e385] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/PlayStation_4
              - text: ","
              - link "Windows" [ref=f8e386] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Windows
              - text: ", and"
              - link "Xbox One" [ref=f8e387] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Xbox_One
              - text: in December 2015,
              - link "PlayStation 5" [ref=f8e388] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/PlayStation_5
              - text: and
              - link "Xbox Series X/S" [ref=f8e389] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Xbox_Series_X/S
              - text: in December 2020, and
              - link "Google Stadia" [ref=f8e390] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Google_Stadia
              - text: in June 2021.
            - paragraph [ref=f8e391]:
              - text: The game received an overall positive reception from critics, with praise mostly directed to the game's tense multiplayer and focus on tactics. However, the game was criticized for its progression system and its lack of content. Initial sales were weak, but the game's player base increased significantly as Ubisoft adopted a "
              - link "games as a service" [ref=f8e392] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Games_as_a_service
              - text: "\" model for the game and subsequently released several packages of free"
              - link "downloadable content" [ref=f8e393] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Downloadable_content
              - text: . Several years after the game's release, some critics regarded Siege as one of the best multiplayer games in the modern market due to the improvements brought by the post-launch updates. The company partnered with
              - link "ESL" [ref=f8e394] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/ESL_(eSports)
              - text: to make Siege an
              - link "esports" [ref=f8e395] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Esports
              - text: game. In December 2020, the game surpassed 70 million registered players across all platforms.
              - link "Rainbow Six Extraction" [ref=f8e397] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Rainbow_Six_Extraction
              - text: ", a"
              - link "spin-off" [ref=f8e398] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Spin-off_(media)
              - text: game featuring Siege characters, was released in January 2022.
          - region [ref=f8e399]:
            - heading "Gameplay" [level=2] [ref=f8e401]
            - figure "An alpha gameplay screenshot of the game, showcasing the Hostage Mode. Players can destroy structures like walls to spot targets." [ref=f8e402]:
              - link [ref=f8e403] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/File:Tom_Clancy's_Rainbow_Six_Siege_screenshot.jpg
            - paragraph [ref=f8e406]:
              - text: Tom Clancy's Rainbow Six Siege is a
              - link "first-person shooter" [ref=f8e407] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/First-person_shooter
              - text: game, in which players utilize many different operators from the Rainbow team. Different operators have different nationalities, weapons, and gadgets.
              - superscript [ref=f8e408]:
                - link "[1]" [ref=f8e409] [cursor=pointer]:
                  - /url: "#cite_note-3"
              - text: The game features an
              - link "asymmetrical" [ref=f8e410] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Asymmetrical
              - text: structure whereby the teams are not always balanced in their choices of abilities.
              - superscript [ref=f8e411]:
                - link "[2]" [ref=f8e412] [cursor=pointer]:
                  - /url: "#cite_note-4"
              - text: The base Counter-Terrorism Units (CTUs) available for play are the American
              - link "Hostage Rescue Team" [ref=f8e413] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Hostage_Rescue_Team
              - text: (referred to in-game as the
              - link "FBI SWAT" [ref=f8e414] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/FBI_SWAT
              - text: ), the British
              - link "SAS" [ref=f8e415] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Special_Air_Service
              - text: ", the German"
              - link "GSG-9" [ref=f8e416] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/GSG-9
              - text: ", the Russian"
              - link "Spetsnaz" [ref=f8e417] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Spetsnaz
              - text: and the French
              - link "GIGN" [ref=f8e418] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/GIGN
              - text: ", each of which has four operators per unit split between attackers and defenders (other units were later added through"
              - link "downloadable content" [ref=f8e419] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Downloadable_content
              - text: ", see"
              - link "below" [ref=f8e420] [cursor=pointer]:
                - /url: "#Release"
              - text: ). Players also have access to a "Recruit" operator who can choose from a more flexible assortment of equipment at the expense of having a unique gadget. Players can pick any operator from any unit that is defending or attacking before a round starts, choosing spawn points as well as attachments on their guns but are not allowed to change their choices once the round has started. An in-game shop allows players to purchase operators or cosmetics using the in-game currency, "Renown", which is earned at the end of matches from actions performed in-game. Different gameplay modes award renown at different rates, with ranked matches offering the largest renown multiplier potential per match. Players can also complete in-game "challenges" to get a small amount of renown. Renown gain rate can also be affected by the using in-game "boosters" which gives the player an increase in all renown earned for various duration, starting with 24 hours. A premium currency known as "R6 credits" can also be purchased using real-world currency to get operators quicker in-game, or other cosmetic items, such as weapon or operator skins .
              - superscript [ref=f8e421]:
                - link "[3]" [ref=f8e422] [cursor=pointer]:
                  - /url: "#cite_note-5"
            - paragraph [ref=f8e423]:
              - text: When the round begins in an online match, the attackers choose one of several spawn points from which to launch their attack while defenders do the same from which to defend from. A 45-second preparatory period will then commence wherein the attackers are then given control over
              - link "mecanum" [ref=f8e424] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Mecanum_wheel
              - text: "-wheeled"
              - link "drones" [ref=f8e425] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Unmanned_ground_vehicle
              - text: to scout the map in search of enemy operators, traps and defensive set-ups in addition to the target objective(s),
              - superscript [ref=f8e426]:
                - link "[4]" [ref=f8e427] [cursor=pointer]:
                  - /url: "#cite_note-VG1-6"
              - text: while the defenders establish their defences and are encouraged to do so without having the defensive and target objective(s) details being discovered, chiefly through destroying the drones.
              - superscript [ref=f8e428]:
                - link "[5]" [ref=f8e429] [cursor=pointer]:
                  - /url: "#cite_note-7"
              - text: If a player dies, they cannot
              - link "respawn" [ref=f8e430] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Respawn
              - text: until the end of a round.
              - superscript [ref=f8e431]:
                - text: "["
                - link "citation needed" [ref=f8e433] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Wikipedia:Citation_needed
                - text: "]"
              - text: Players who were killed by opponents can enter "Support Mode", which allows them to gain access to drone's cameras and security cameras so that they can continue to contribute to their team by informing them of opponent locations and activities.
              - superscript [ref=f8e434]:
                - link "[6]" [ref=f8e435] [cursor=pointer]:
                  - /url: "#cite_note-8"
              - superscript [ref=f8e436]:
                - link "[7]" [ref=f8e437] [cursor=pointer]:
                  - /url: "#cite_note-9"
              - text: Matches last only 3 minutes and 30 seconds for a casual and three minutes for a ranked.
              - superscript [ref=f8e438]:
                - link "[8]" [ref=f8e439] [cursor=pointer]:
                  - /url: "#cite_note-IGN-10"
              - text: Teamwork and cooperation are encouraged in Siege, and players need to take advantage of their different abilities in order to complete the objective and defeat the enemy team.
              - superscript [ref=f8e440]:
                - link "[4]" [ref=f8e441] [cursor=pointer]:
                  - /url: "#cite_note-VG1-6"
              - text: Communication between players is also heavily encouraged.
              - superscript [ref=f8e442]:
                - link "[4]" [ref=f8e443] [cursor=pointer]:
                  - /url: "#cite_note-VG1-6"
              - superscript [ref=f8e444]:
                - link "[9]" [ref=f8e445] [cursor=pointer]:
                  - /url: "#cite_note-11"
              - text: The game also has a
              - link "spectator" [ref=f8e446] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Audience
              - text: mode, which allows players to observe a match from different angles.
              - superscript [ref=f8e447]:
                - link "[10]" [ref=f8e448] [cursor=pointer]:
                  - /url: "#cite_note-12"
            - paragraph [ref=f8e449]:
              - text: The game features a heavy emphasis on environmental destruction
              - superscript [ref=f8e450]:
                - link "[11]" [ref=f8e451] [cursor=pointer]:
                  - /url: "#cite_note-13"
              - superscript [ref=f8e452]:
                - link "[12]" [ref=f8e453] [cursor=pointer]:
                  - /url: "#cite_note-PCG1-14"
              - text: using a procedural destruction system. Players can break structures by planting explosives on them, or shoot walls with a shotgun to make a hole.
              - superscript [ref=f8e454]:
                - link "[13]" [ref=f8e455] [cursor=pointer]:
                  - /url: "#cite_note-PolyPre-15"
              - text: Players may gain tactical advantages through environmental destruction, and the system aims at encouraging players to utilize creativity and strategy.
              - superscript [ref=f8e456]:
                - link "[13]" [ref=f8e457] [cursor=pointer]:
                  - /url: "#cite_note-PolyPre-15"
              - superscript [ref=f8e458]:
                - link "[14]" [ref=f8e459] [cursor=pointer]:
                  - /url: "#cite_note-16"
              - text: A bullet-penetration system is featured, in which bullets that pass through structures deal less damage to enemies.
              - superscript [ref=f8e460]:
                - link "[12]" [ref=f8e461] [cursor=pointer]:
                  - /url: "#cite_note-PCG1-14"
              - text: In addition to destruction, players on the defending team can also set up a limited number of heavy-duty fortifications on walls and deployable shields around them for protection; these can be destroyed through breaching devices, explosives, or by utilizing operator specific gadgets in the case of the former.
              - superscript [ref=f8e462]:
                - link "[15]" [ref=f8e463] [cursor=pointer]:
                  - /url: "#cite_note-17"
              - text: In order to stop attackers' advance, defenders can place traps like
              - link "barbed-wire" [ref=f8e464] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Barbed-wire
              - text: and explosive entry denial devices around the maps.
              - superscript [ref=f8e465]:
                - link "[16]" [ref=f8e466] [cursor=pointer]:
                  - /url: "#cite_note-18"
              - text: "Vertical space is a key gameplay element in the game's maps: players can destroy ceilings and floors using breach charges and can ambush enemies by rappelling through windows."
              - superscript [ref=f8e467]:
                - link "[4]" [ref=f8e468] [cursor=pointer]:
                  - /url: "#cite_note-VG1-6"
              - text: Powerful weapons like grenades and breach charges are valuable, as only a limited amount can be used in a round.
              - superscript [ref=f8e469]:
                - link "[8]" [ref=f8e470] [cursor=pointer]:
                  - /url: "#cite_note-IGN-10"
            - region [ref=f8e471]:
              - heading "Modes" [level=3] [ref=f8e473]
              - paragraph [ref=f8e474]:
                - text: At launch, the game featured 11 maps
                - superscript [ref=f8e475]:
                  - link "[17]" [ref=f8e476] [cursor=pointer]:
                    - /url: "#cite_note-19"
                - text: and 5 different gameplay modes spanning both
                - link "PVE" [ref=f8e477] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Player_versus_environment
                - text: and
                - link "PVP" [ref=f8e478] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Player_versus_player
                - text: . With the
                - link "downloadable content" [ref=f8e479] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Downloadable_content
                - text: (DLC) released post-launch with an additional four maps from year one and three maps from year two – there are currently 26 playable maps.
                - superscript [ref=f8e480]:
                  - link "[18]" [ref=f8e481] [cursor=pointer]:
                    - /url: "#cite_note-20"
                - text: "The gameplay modes featured include:"
              - list [ref=f8e482]:
                - listitem [ref=f8e483]:
                  - text: "Hostage: a non-competitive multiplayer mode, in which the attackers must extract the hostage from the defenders, while the defenders must prevent that from happening, either by eliminating all of the attacking team or successfully defending the hostage until the time expires. A secondary manner of winning can occur if the attacking or defending team accidentally damages the hostage, causing the hostage to \"down\"; if the opposing team can prevent the revival of the hostage, and the hostage bleeds-out and dies, they will win the round."
                  - superscript [ref=f8e484]:
                    - link "[19]" [ref=f8e485] [cursor=pointer]:
                      - /url: "#cite_note-21"
                - listitem [ref=f8e486]:
                  - text: "Bomb: a competitive multiplayer mode, in which the attackers are tasked with locating and defusing one of two bombs. The defenders must stop the attackers by killing all of them or destroying the defuser."
                  - superscript [ref=f8e487]:
                    - link "[20]" [ref=f8e488] [cursor=pointer]:
                      - /url: "#cite_note-22"
                  - text: If all attackers are killed after the defuser is planted, the defuser must still be destroyed for a defending victory.
                - listitem [ref=f8e489]:
                  - text: "Secure Area: a non-competitive multiplayer mode, in which the defenders must protect a room with a biohazard container, while the attackers must fight their way in and secure it. The match ends when all players from one team are killed or the biohazard container is secured by the attackers when there are no defenders in the room."
                  - superscript [ref=f8e490]:
                    - link "[21]" [ref=f8e491] [cursor=pointer]:
                      - /url: "#cite_note-23"
                - listitem [ref=f8e492]:
                  - text: "Tactical Realism: a variation of the standard competitive multiplayer modes, added with the release of the Operation Skull Rain DLC. The game mode features a heavier emphasis on realism and teamwork, removing most of the heads-up display (HUD) elements, the ability to mark opponents, and the ability to see teammates' contours through walls, while also featuring the addition of a realistic ammo management system."
                  - superscript [ref=f8e493]:
                    - link "[22]" [ref=f8e494] [cursor=pointer]:
                      - /url: "#cite_note-24"
                  - text: This mode is no longer in the game but some aspects are in the other multiplayer modes.
                - listitem [ref=f8e495]:
                  - text: "Training grounds: a solo"
                  - superscript [ref=f8e496]:
                    - link "[23]" [ref=f8e497] [cursor=pointer]:
                      - /url: "#cite_note-25"
                  - text: or
                  - link "cooperative multiplayer mode" [ref=f8e498] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Cooperative_video_game
                  - text: for up to five players. Players take on the role of either attackers or defenders, and must fight against waves of enemies controlled by
                  - link "artificial intelligence" [ref=f8e499] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Artificial_intelligence
                  - text: across various modes like Bomb, Hostage, or Elimination.
                  - superscript [ref=f8e500]:
                    - link "[24]" [ref=f8e501] [cursor=pointer]:
                      - /url: "#cite_note-26"
                  - superscript [ref=f8e502]:
                    - link "[25]" [ref=f8e503] [cursor=pointer]:
                      - /url: "#cite_note-GSpot_tense-27"
                - listitem [ref=f8e504]:
                  - text: "Situations: a single-player series of 10 solo and 1 co-op multiplayer missions that serve as introductory and interactive tutorials to the game's mechanics."
                  - superscript [ref=f8e505]:
                    - link "[26]" [ref=f8e506] [cursor=pointer]:
                      - /url: "#cite_note-28"
                - listitem [ref=f8e507]:
                  - text: "Outbreak: A limited time event exclusive to Operation Chimera, Outbreak pits a 3 player team in a co-op PVE environment against an"
                  - link "extraterrestrial" [ref=f8e508] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Extraterrestrial_life
                  - text: biohazard threat, namely AI-controlled heavily mutated forms of humans infected with said alien parasite. Two difficulties exists for this mode, for which the chief difference was the inclusion of friendly fire on the harder one.
                  - superscript [ref=f8e509]:
                    - link "[27]" [ref=f8e510] [cursor=pointer]:
                      - /url: "#cite_note-29"
                - listitem [ref=f8e511]:
                  - text: "Arcade: Random limited time events which modify elements of existing modes and is on a smaller scale compared to seasonal game modes, this includes the Golden Gun event"
                  - superscript [ref=f8e512]:
                    - link "[28]" [ref=f8e513] [cursor=pointer]:
                      - /url: "#cite_note-30"
                - listitem [ref=f8e514]:
                  - text: "Seasonal Events: Limited time events which are available for one season. These are normally large scale game modes which are completely unique to regular Bomb, Secure Area, or Hostage Game modes."
                  - superscript [ref=f8e515]:
                    - link "[29]" [ref=f8e516] [cursor=pointer]:
                      - /url: "#cite_note-31"
          - region [ref=f8e517]:
            - heading "Setting" [level=2] [ref=f8e519]
            - region [ref=f8e520]:
              - heading "Years 1–3" [level=3] [ref=f8e522]
              - figure [ref=f8e523]:
                - link [ref=f8e524] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Angela_Bassett_by_Gage_Skidmoe.jpg
                - generic [ref=f8e526]:
                  - link "Angela Bassett" [ref=f8e527] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Angela_Bassett
                  - text: performed voice works and motion capture for Aurelia "Six" Arnot, the former director of Team Rainbow.
              - paragraph [ref=f8e528]:
                - text: Three years after the Rainbow Program's deactivation, there is a resurgence of terrorist activities, with the White Mask being the most prominent. The terrorists' goals are unknown, yet they are causing chaos across the world.
                - superscript [ref=f8e529]:
                  - link "[30]" [ref=f8e530] [cursor=pointer]:
                    - /url: "#cite_note-story_and_setting-32"
                - text: To counter this rising threat, the program is reactivated by a new leader, Aurelia Arnot (
                - link "Angela Bassett" [ref=f8e531] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Angela_Bassett
                - text: ).
                - superscript [ref=f8e532]:
                  - link "[31]" [ref=f8e533] [cursor=pointer]:
                    - /url: "#cite_note-33"
                - text: Arnot, operating under the codename "Six", assembles a group of special forces operatives from different countries to face and combat the White Masks. Recruits go through multiple exercises to prepare them for future encounters with the White Masks, training to perform hostage rescue and bomb disposal. Eventually, the White Masks launch a chemical attack on Bartlett University, and the recruits are sent to disarm the bombs and eliminate the enemy presence. The operation is a massive success, though there are casualties. Arnot affirms that the reactivation of Team Rainbow is the best and only choice in a time filled with risks and uncertainties, and that Team Rainbow is ready for their next mission – to hunt down the leader of their enemy – and they stand prepared to protect and defend their nation from terrorists. Over the next few years, Team Rainbow continues to expand their operations, recruiting more operatives from numerous countries.
            - region [ref=f8e534]:
              - heading "Years 4–6" [level=3] [ref=f8e536]
              - paragraph [ref=f8e537]:
                - text: In 2019, Arnot resigns from her position to become the Secretary of State and recommends her advisor, Doctor Harishva "Harry" Pandey (
                - link "Andy McQueen" [ref=f8e538] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Andy_McQueen
                - text: ), to take her place as "Six". Harry seeks to improve the synergies of Team Rainbow members; thus he develops The Program, a global training regimen to help Rainbow operators understand each other better, and to expand their operations. To that end, Harry also organizes annual tournaments for Team Rainbow, which are broadcast and viewed globally as public training exercises. Some time later, Harry invites members of a
                - link "private military company" [ref=f8e539] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Private_military_company
                - text: ", Nighthaven, to join Team Rainbow, in order to observe their skills and prevent competitors from also hiring them. Nighthaven operatives regularly clash with those of Team Rainbow, due to their difference in battle tactics; Nighthaven's is considered to be more brutal and reckless, with a notable disregard for their own members' safety. This eventually leads to a public dispute between Rainbow operative Eliza \"Ash\" Cohen ("
                - link "Patricia Summersett" [ref=f8e540] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Patricia_Summersett
                - text: ) and Nighthaven's founder, Jaimini "Kali" Shah (Yasmine Aker), after Ash was injured during the 2021 tournament finals due to Kali's action.
            - region [ref=f8e541]:
              - heading "Years 7–9" [level=3] [ref=f8e543]
              - paragraph [ref=f8e544]: By 2022, Kali has successfully recruited several Rainbow operators to join Nighthaven, much to Harry's dismay. With a surge in global criminal activities, Harry begins reorganizing the remaining Rainbow operators into several smaller teams, and has them focus on new operations, while also looks into Nighthaven and their activities. Following the assassination of a high-profile tech company CEO, Masayuki Yahata, Team Rainbow investigates his death and finds evidence implicating Nighthaven's involvement. Rainbow squad Ghosteyes, led by Taina "Caveira" Pereira (Renata Eastlick), conducts multiple strikes against Nighthaven and eventually apprehends Kali, who denies involvement in Yahata's assassination while also claiming Nighthaven's weaponry had been stolen prior, only for Caveira to reveal that Rainbow is aware of Nighthaven's innocence; the strikes were to keep Nighthaven from escalating the situation.
              - paragraph [ref=f8e545]:
                - text: Some time later, Harry is confronted by "Deimos" (Dallas Blake), a former Rainbow operative who orchestrated Yahata's death as well as the conflict between Team Rainbow and Nighthaven. Seeking to eliminate Team Rainbow, Deimos claims that the unit has become a disgrace under Harry's leadership, showing him a video recording of an ambush on Rainbow that leaves Ash in a coma before killing Harry. Following Deimos' trails over the next year, Team Rainbow finally manages to pinpoint his next target, with Rainbow members Gustave "Doc" Kateb (
                - link "Alex Ivanovici" [ref=f8e546] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Alex_Ivanovici
                - text: ), Elena "Mira" Álvarez (Anahi Bustillos), Julien "Rook" Nizan (Marc-André Brunet) and
                - link "Sam \"Zero\" Fisher" [ref=f8e547] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Sam_Fisher_(Splinter_Cell)
                - text: (
                - link "Jeff Teravainen" [ref=f8e548] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Jeff_Teravainen
                - text: ) confronting and apprehending Deimos. After awakening from her coma, Ash and the rest of Rainbow uncover Deimos' real identity as Gerald Morris, a rogue Rainbow operative who betrayed and killed his squad mate during an operation in 2012 and was declared killed in action. With Deimos' group, the Keres Legion, remaining at large, Team Rainbow recruits retired operative Kure "Skopós" Galanos, who previously worked with Deimos in his Rainbow days. Skopós teams up with Rainbow operative Grace "Dokkaebi" Nam (Christine Lee) to assault a Keres safehouse and retrieve intel pertaining to the organization.
              - paragraph [ref=f8e549]: During a training exercise at Hereford Base, England, Rainbow operatives are forced to defend the base from Keres Legion troops, who have infiltrated the organization under the guise of new recruits to break Deimos out of prison and destroy the base.
            - region [ref=f8e550]:
              - heading "Years 10–11" [level=3] [ref=f8e552]
              - paragraph [ref=f8e553]: Following the ambush on Hereford Base, the base is ultimately destroyed by the Keres Legion with several staff and recruits killed, including a Global Security Alliance Council (GSAC) observer named Caron, while Dokkaebi, unbeknownst to Rainbow, was also abducted during the attack. It is further revealed that the attack and destruction of Hereford Base was merely Phase One of Deimos' ultimate plan as "Phobos", the Legion's second-in-command, initiates Phase Two. Realizing the scale of the Keres Legion's threat, Nighthaven, who had disassociated themselves from Rainbow following their actions against the PMC, decides to put their difference aside and come to Rainbow's aid in their fight against the Keres Legion.
              - paragraph [ref=f8e554]:
                - text: After learning that the Keres Legion has kidnapped Dokkaebi, Ana "Solis" Valentina Díaz (AJ Simmons) and Hāpai "Rauora" Iwini, one of the surviving recruits from the assault on Hereford Base, head to Detroit to investigate the Legion's relation with a company named "POLARIS". Encountering enemy forces inside the company building, the two are personally attacked by Phobos who also destroys the building with planted explosives. Escaping the explosion, Solis and Rauora manage to retrieve a tracker that they believe will lead them to Dokkaebi. Rainbow operatives Morowa "Clash" Evans (Sophia Walker) and Monika "IQ" Weiss (
                - link "Kristina Klebe" [ref=f8e555] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Kristina_Klebe
                - text: )
                - superscript [ref=f8e556]:
                  - link "[c]" [ref=f8e557] [cursor=pointer]:
                    - /url: "#cite_note-34"
                - text: are later deployed to rescue Dokkaebi from a Keres Legion hideout. During extraction, Dokkaebi reveals that she has acquired intel on Phobos.
              - paragraph [ref=f8e558]: In spite of Rainbow's efforts, GSAC eventually threatens to shut down the Rainbow Program, due to multiple failures and casualties suffered. Team Rainbow is given one last chance to find Phobos and stop him. They deploy a strike team to confront Phobos and his Keres Legion forces, and successfully kill him, ending the threat. Two years later following the shutdown of the Rainbow Program, several intelligence agencies are attacked by an unknown force, leading to former Rainbow Deputy Director "Bishop" being contacted.
          - region [ref=f8e559]:
            - heading "Development" [level=2] [ref=f8e561]
            - note [ref=f8e562]:
              - text: "See also:"
              - 'link "Tom Clancy''s Rainbow 6: Patriots" [ref=f8e563] [cursor=pointer]':
                - /url: https://en.wikipedia.org/wiki/Tom_Clancy's_Rainbow_6:_Patriots
            - paragraph [ref=f8e564]:
              - text: "The game's predecessor was Tom Clancy's Rainbow 6: Patriots, a"
              - link "tactical shooter" [ref=f8e565] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Tactical_shooter
              - text: announced in 2011. It had a focus on narrative, and the story campaign features many cut-scenes and scripted events. However, the game fell into a
              - link "development hell" [ref=f8e566] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Development_hell
              - text: shortly after its announcement. The game's outdated engine and frequent change of leadership hindered development progress, and game quality was not up to par.
              - superscript [ref=f8e567]:
                - link "[32]" [ref=f8e568] [cursor=pointer]:
                  - /url: "#cite_note-35"
              - text: In addition, it was planned to be released on
              - link "seventh-generation video-game consoles" [ref=f8e569] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Seventh_generation_of_video_game_consoles
              - text: which were not capable of processing certain game mechanics. Seeing the arrival of a new generation of consoles, the team wanted to make use of this opportunity to create a more technologically advanced game.
              - superscript [ref=f8e570]:
                - link "[33]" [ref=f8e571] [cursor=pointer]:
                  - /url: "#cite_note-36"
              - text: As a result, Ubisoft decided to cancel Patriots and assembled a new team of 25 people to come up with ideas to
              - link "reboot" [ref=f8e572] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Reboot_(fiction)
              - text: the series.
              - superscript [ref=f8e573]:
                - link "[34]" [ref=f8e574] [cursor=pointer]:
                  - /url: "#cite_note-reboot-37"
            - paragraph [ref=f8e575]:
              - text: To make the new game feel refreshing, only certain multiplayer elements were retained as the small team took the game in a different direction. They evaluated the core of the
              - link "Rainbow Six" [ref=f8e577] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Tom_Clancy's_Rainbow_Six
              - text: series, which they thought was about being a member of a counter-terrorist team travelling around the globe to deal with dangerous terrorist attacks – operations which are usually intense confrontations between attackers and defenders.
              - superscript [ref=f8e578]:
                - link "[35]" [ref=f8e579] [cursor=pointer]:
                  - /url: "#cite_note-lean-38"
              - text: However, the team wanted to fit these ideas into a multiplayer format which would increase the game's sustainability.
              - superscript [ref=f8e580]:
                - link "[36]" [ref=f8e581] [cursor=pointer]:
                  - /url: "#cite_note-unbreakable-39"
              - superscript [ref=f8e582]:
                - link "[37]" [ref=f8e583] [cursor=pointer]:
                  - /url: "#cite_note-40"
              - text: These became the basic concept ideas for the game. As the development team hoped that the game can be replayed frequently, the team decided to devote all the resources into developing the game's multiplayer and abandoned the single-player campaign.
              - superscript [ref=f8e584]:
                - link "[38]" [ref=f8e585] [cursor=pointer]:
                  - /url: "#cite_note-41"
            - paragraph [ref=f8e586]:
              - text: Development of the game officially began in January 2013.
              - link "Ubisoft Montreal" [ref=f8e587] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Ubisoft_Montreal
              - text: ", the developer of Patriots, handled the game's development, with Ubisoft's offices in"
              - link "Barcelona" [ref=f8e588] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Ubisoft_Barcelona
              - text: ","
              - link "Toronto" [ref=f8e589] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Ubisoft_Toronto
              - text: ","
              - link "Kyiv" [ref=f8e590] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Ubisoft_Kyiv
              - text: ","
              - link "Shanghai" [ref=f8e591] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Ubisoft_Shanghai
              - text: and
              - link "Chengdu" [ref=f8e592] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Ubisoft_Chengdu
              - text: providing assistance.
              - superscript [ref=f8e593]:
                - link "[39]" [ref=f8e594] [cursor=pointer]:
                  - /url: "#cite_note-42"
              - superscript [ref=f8e595]:
                - link "[40]" [ref=f8e596] [cursor=pointer]:
                  - /url: "#cite_note-43"
              - text: The game was originally called Rainbow Six Unbreakable, a title that reflected not only the game's destruction mechanic but also the mindset of the development team, who had to deliver a game that was once stuck in development hell.
              - superscript [ref=f8e597]:
                - link "[36]" [ref=f8e598] [cursor=pointer]:
                  - /url: "#cite_note-unbreakable-39"
              - text: According to Alexandre Remy, the brand director, the team was confident in their new vision for the game but very nervous when they revealed it, realizing the change of direction would likely disappoint some fans.
              - superscript [ref=f8e599]:
                - link "[34]" [ref=f8e600] [cursor=pointer]:
                  - /url: "#cite_note-reboot-37"
            - region [ref=f8e601]:
              - heading "Design" [level=3] [ref=f8e603]
              - paragraph [ref=f8e604]:
                - text: The 150-person team consisted mainly of
                - link "first-person shooter" [ref=f8e605] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/First-person_shooter
                - text: veterans or longtime Rainbow Six players.
                - superscript [ref=f8e606]:
                  - link "[36]" [ref=f8e607] [cursor=pointer]:
                    - /url: "#cite_note-unbreakable-39"
                - text: Despite having prior knowledge on how these types of games work, the team decided to study historic examples of counter-terrorist operations, including 1980's London
                - link "Iranian Embassy siege" [ref=f8e608] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Iranian_Embassy_siege
                - text: ", 1977's"
                - link "Lufthansa Flight 181" [ref=f8e609] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Lufthansa_Flight_181
                - text: hijacking, and 2002's
                - link "Moscow theatre hostage crisis" [ref=f8e610] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Moscow_theatre_hostage_crisis
                - text: to ensure that the portrayal of these operations was accurate and appropriate. The team also consulted
                - link "counter-terrorism units" [ref=f8e611] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Counter-terrorism_unit
                - text: ", such as the"
                - link "National Gendarmerie Intervention Group" [ref=f8e612] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/National_Gendarmerie_Intervention_Group
                - text: (GIGN), for their opinions on how they would react during a hostage rescue situation.
                - superscript [ref=f8e613]:
                  - link "[41]" [ref=f8e614] [cursor=pointer]:
                    - /url: "#cite_note-44"
                - text: According to Xavier Marquis, the game's creative director, having a hostage rescue mission in the game helped create an immersive story. By allowing players to assume control of an operator tasked with saving innocents, it gives them an objective and a priority. They must be careful in dealing with the situation and try their best not to hurt the hostage. This further promotes teamwork between players and prompts them to plan before attacking, and further makes the game more realistic, tense and immersive.
                - superscript [ref=f8e615]:
                  - link "[42]" [ref=f8e616] [cursor=pointer]:
                    - /url: "#cite_note-45"
                - text: To make the game feel more realistic, the team introduced a mechanic called "living hostage" to govern the hostage character's behaviour – e.g., coughing if there is dust in the air or shielding him or herself if there is nearby gunfire.
                - superscript [ref=f8e617]:
                  - link "[43]" [ref=f8e618] [cursor=pointer]:
                    - /url: "#cite_note-46"
              - paragraph [ref=f8e619]:
                - text: The environmental destruction mechanic was one of the game's most important elements. When the game's development was begun, the developer's in-house team completed their work on RealBlast Destruction, an engine that "procedurally breaks everything down" and remodels the environment.
                - superscript [ref=f8e620]:
                  - link "[44]" [ref=f8e621] [cursor=pointer]:
                    - /url: "#cite_note-47"
                - text: The development team thought that this technology fitted the game's style and gameplay, and decided to use it.
                - superscript [ref=f8e622]:
                  - link "[45]" [ref=f8e623] [cursor=pointer]:
                    - /url: "#cite_note-48"
                - text: This aspect of the game became increasingly important during development, and the team spent an extended period of time making sure that these destructions were authentic. As a result, the team implemented a materials-based tearing system, in which environmental objects of different materials show different reactions to players' attacks.
                - superscript [ref=f8e624]:
                  - link "[12]" [ref=f8e625] [cursor=pointer]:
                    - /url: "#cite_note-PCG1-14"
                - text: To render the game's texture, the team used
                - link "physically based rendering" [ref=f8e626] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Physically_based_rendering
                - text: ", even though it was ineffective during the game's early stage of production due to issues with the game's engine. A material bank and substance painter were utilized to create textures for environmental objects when they were damaged or destroyed. The team also implemented subtle visual cues to help players identify whether a structure was destructible or not, as opposed to \"distracting\" players with more-obvious hints."
                - superscript [ref=f8e627]:
                  - link "[46]" [ref=f8e628] [cursor=pointer]:
                    - /url: "#cite_note-49"
                - text: The destruction mechanic prompted Ubisoft to change their level-design approach, as they had to ensure that the level was still logical and realistic when parts of the environment were destroyed.
                - superscript [ref=f8e629]:
                  - link "[47]" [ref=f8e630] [cursor=pointer]:
                    - /url: "#cite_note-postmortem-50"
              - paragraph [ref=f8e631]:
                - text: According to Ubisoft, "teamwork, tactics, and tension" were the game's three most important pillars. The team initially worked on a respawn feature, allowing players to rejoin after they are killed in the game. However, following several internal tournaments, the team realized that some of their employees would always win a match. They concluded that the respawn system worked to the benefit of strong players and placed individual skill above teamwork,
                - superscript [ref=f8e632]:
                  - link "[48]" [ref=f8e633] [cursor=pointer]:
                    - /url: "#cite_note-51"
                - text: which did not fit the developer's focus on game tactics. Removing the respawn feature meant greater consequences for taking risks, and players had to rely on their teammates in order to survive and achieve objectives. According to Chris Lee, the game's designer, the team initially worried that the system would only appeal to hardcore players. However, after several testings, they found that the removal of the respawn system provided new challenges to strong players and forced them to cooperate with their teammates – while it rewarded weaker players who were willing to take their time, plan their actions, and be strategic.
                - superscript [ref=f8e634]:
                  - link "[49]" [ref=f8e635] [cursor=pointer]:
                    - /url: "#cite_note-52"
                - superscript [ref=f8e636]:
                  - link "[50]" [ref=f8e637] [cursor=pointer]:
                    - /url: "#cite_note-FP-53"
                - superscript [ref=f8e638]:
                  - link "[51]" [ref=f8e639] [cursor=pointer]:
                    - /url: "#cite_note-54"
              - paragraph [ref=f8e640]:
                - text: The gameplay system was designed to allow players to have a lot of freedom. As a result, the team implemented the "Golden 3C Rules", which represents Character, Control, and Camera.
                - superscript [ref=f8e641]:
                  - link "[52]" [ref=f8e642] [cursor=pointer]:
                    - /url: "#cite_note-55"
                - text: Players are always controlling their own actions and movements, and the team intentionally avoided any animation that would disrupt the players. As a result, actions such as setting explosives, or placing a breach charge, can be cancelled immediately so that players can react and shoot. The game's camera only moves when the player moves, as the team feared that the changes of camera angle may lead to players' in-game deaths. A free-lean system was introduced to the game so that players can have more control over their line of sight.
                - superscript [ref=f8e643]:
                  - link "[35]" [ref=f8e644] [cursor=pointer]:
                    - /url: "#cite_note-lean-38"
                - text: According to Ubisoft, this input-driven control mechanism makes the game feel more "natural" and "fluid". This is because it allows players to concentrate on planning and coordinating, rather than thinking if the camera or environment will interfere with their actions.
                - superscript [ref=f8e645]:
                  - link "[53]" [ref=f8e646] [cursor=pointer]:
                    - /url: "#cite_note-56"
              - paragraph [ref=f8e647]:
                - text: Several gameplay elements were scrapped or removed from the final game. One of the features of its predecessors,
                - link "artificial intelligence" [ref=f8e648] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Artificial_intelligence
                - text: "-controlled squadmates, were removed from single-player missions. This decision was made because the team wanted players to play with a squad controlled by actual players rather than computers. The team once considered adding a map editor so that players could design their own maps, but this plan never came to fruition. Hit markers, which would indicate an injury inflicted on an opponent, were removed because the team feared that players would abuse the system by \"peppering the walls with gunfire\" and use hit markers to locate enemies. Players cannot jump in the game, as real-life counter-terrorist unit operators do not jump while carrying out their missions."
                - superscript [ref=f8e649]:
                  - link "[50]" [ref=f8e650] [cursor=pointer]:
                    - /url: "#cite_note-FP-53"
              - paragraph [ref=f8e651]:
                - text: According to Louis Philippe, the game's audio director, the team originally used intense music and sounds to create tension. However, the team decided to scrap this idea, realizing that the best way to create a tense atmosphere is to create the sounds of other players, which are often unexpected. The team created Navigation Sounds, in which the sound a player made is determined by their operators' weight, armour, and speed. Gadget deployment such as fortifying and breach-charging create louder sounds that may reveal the player's presence. The team thought that this would be enjoyable for players and influence their gameplay experience.
                - superscript [ref=f8e652]:
                  - link "[54]" [ref=f8e653] [cursor=pointer]:
                    - /url: "#cite_note-57"
                - text: The game's music was composed by
                - link "Paul Haslinger" [ref=f8e654] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Paul_Haslinger
                - text: ", who had worked on the score of the previous Rainbow Six games and the"
                - link "Far Cry" [ref=f8e656] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Far_Cry
                - text: series. His co-composer was
                - link "Ben Frost" [ref=f8e657] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ben_Frost
                - text: ", who debuted his first video game soundtrack with Siege. Leon Purviance assisted Frost and Haslinger in composing the music."
                - superscript [ref=f8e658]:
                  - link "[55]" [ref=f8e659] [cursor=pointer]:
                    - /url: "#cite_note-58"
          - region [ref=f8e660]:
            - heading "Release" [level=2] [ref=f8e662]
            - paragraph [ref=f8e663]:
              - text: Ubisoft announced the game at their press conference during
              - link "Electronic Entertainment Expo 2014" [ref=f8e664] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Electronic_Entertainment_Expo_2014
              - text: .
              - superscript [ref=f8e665]:
                - link "[56]" [ref=f8e666] [cursor=pointer]:
                  - /url: "#cite_note-59"
              - text: In August 2015, Ubisoft announced that they had delayed the game's release from October 10 to December 1, 2015, in order to give additional time for the team to balance the game for cooperative multiplayer play.
              - superscript [ref=f8e667]:
                - link "[57]" [ref=f8e668] [cursor=pointer]:
                  - /url: "#cite_note-60"
              - text: A closed alpha-testing was held by Ubisoft on April 7–13, 2015, in which players could play an early version of the game in order to help the development team test their servers and core gameplay loops, and to provide feedback.
              - superscript [ref=f8e669]:
                - link "[58]" [ref=f8e670] [cursor=pointer]:
                  - /url: "#cite_note-61"
              - text: Ubisoft held a closed beta, starting on September 24, 2015, for further testing. The company originally wanted to hold another round of testing with the release of the game's open beta on November 25, 2015, but they delayed its release to November 26 due to
              - link "matchmaking" [ref=f8e671] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Matchmaking_(video_games)
              - text: issues.
              - superscript [ref=f8e672]:
                - link "[59]" [ref=f8e673] [cursor=pointer]:
                  - /url: "#cite_note-62"
              - text: Players who purchased Siege for the Xbox One could download
              - 'link "Tom Clancy''s Rainbow Six: Vegas" [ref=f8e675] [cursor=pointer]':
                - /url: https://en.wikipedia.org/wiki/Tom_Clancy's_Rainbow_Six:_Vegas
              - text: and its sequel,
              - 'link "Tom Clancy''s Rainbow Six: Vegas 2" [ref=f8e677] [cursor=pointer]':
                - /url: https://en.wikipedia.org/wiki/Tom_Clancy's_Rainbow_Six:_Vegas_2
              - text: for free.
              - superscript [ref=f8e678]:
                - link "[60]" [ref=f8e679] [cursor=pointer]:
                  - /url: "#cite_note-63"
              - text: To launch the game in Asian markets, Ubisoft announced plans to remove graphic imagery from all versions of the game via a patch.
              - superscript [ref=f8e680]:
                - link "[61]" [ref=f8e681] [cursor=pointer]:
                  - /url: "#cite_note-64"
              - text: The plan was later withdrawn by the developer due to
              - link "review bombing" [ref=f8e682] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Review_bomb
              - text: and negative fans feedback.
              - superscript [ref=f8e683]:
                - link "[62]" [ref=f8e684] [cursor=pointer]:
                  - /url: "#cite_note-65"
            - paragraph [ref=f8e685]:
              - text: The game had multiple versions for players to purchase. A
              - link "season pass" [ref=f8e686] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Season_pass_(video_gaming)
              - text: was announced on November 12, 2015. Players who bought this version of the game could gain early access to operators offered in the
              - link "DLCs" [ref=f8e687] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Downloadable_content
              - text: and receive several weapon skins.
              - superscript [ref=f8e688]:
                - link "[63]" [ref=f8e689] [cursor=pointer]:
                  - /url: "#cite_note-66"
              - text: The game was also released alongside its Collector's Edition, which included the game's season pass, a hat, a compass and bottle opener, a backpack, and a 120-page guide.
              - superscript [ref=f8e690]:
                - link "[64]" [ref=f8e691] [cursor=pointer]:
                  - /url: "#cite_note-67"
              - text: A Starter Edition was released on PC in June 2016, featuring all content offered in the Standard Edition, and included two operators at start for use plus enough Rainbow 6 Credits to purchase up to two more of the player's choice while the rest has to be purchased through either Renown at an increased cost or additional Rainbow 6 Credits. The Starter Edition was cheaper than the Standard Edition and was initially available for a limited time.
              - superscript [ref=f8e692]:
                - link "[65]" [ref=f8e693] [cursor=pointer]:
                  - /url: "#cite_note-68"
              - text: In February 2017, the Starter Edition became permanently available via
              - link "Uplay" [ref=f8e694] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Uplay
              - text: .
              - superscript [ref=f8e695]:
                - link "[66]" [ref=f8e696] [cursor=pointer]:
                  - /url: "#cite_note-69"
            - paragraph [ref=f8e697]:
              - text: According to Ubisoft, the game adopted a "
              - link "games as a service" [ref=f8e698] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Games_as_a_service
              - text: "\" approach, as they would provide long-term support for the game and offer post-release content to keep players engaged. The management team initially doubted the idea but eventually decided to approve it."
              - superscript [ref=f8e699]:
                - link "[34]" [ref=f8e700] [cursor=pointer]:
                  - /url: "#cite_note-reboot-37"
              - text: The title was supported with many updates upon launch, with the company introducing fixes to
              - link "bugs" [ref=f8e701] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Software_bug
              - text: and improvements on both matchmaking and general gameplay mechanics.
              - superscript [ref=f8e702]:
                - link "[67]" [ref=f8e703] [cursor=pointer]:
                  - /url: "#cite_note-70"
              - superscript [ref=f8e704]:
                - link "[68]" [ref=f8e705] [cursor=pointer]:
                  - /url: "#cite_note-71"
              - text: To enable players' involvement in the game's continued development, Ubisoft introduced the R6Fix programme in 2018. It allows players to submit bug reports to Ubisoft, which would fix the bug and award the player in-game items.
              - superscript [ref=f8e706]:
                - link "[69]" [ref=f8e707] [cursor=pointer]:
                  - /url: "#cite_note-72"
              - text: They also introduced an auto-kick system, which automatically removes players from a match when they kill friendly players
              - superscript [ref=f8e708]:
                - link "[70]" [ref=f8e709] [cursor=pointer]:
                  - /url: "#cite_note-73"
              - text: and launched the
              - link "BattlEye" [ref=f8e710] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/BattlEye
              - text: system in August 2016 to punish cheaters.
              - superscript [ref=f8e711]:
                - link "[71]" [ref=f8e712] [cursor=pointer]:
                  - /url: "#cite_note-74"
              - text: To counter toxicity within the game's community, in mid 2018 Ubisoft began issuing
              - link "bans" [ref=f8e713] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Ban_(law)
              - text: to any player who has used racist and homophobic slurs.
              - superscript [ref=f8e714]:
                - link "[72]" [ref=f8e715] [cursor=pointer]:
                  - /url: "#cite_note-75"
              - text: All
              - link "downloadable content" [ref=f8e716] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Downloadable_content
              - text: maps were released to all players for free.
              - superscript [ref=f8e717]:
                - link "[73]" [ref=f8e718] [cursor=pointer]:
                  - /url: "#cite_note-76"
              - text: All downloadable operators can be unlocked using the in-game currency though purchasing the season pass enables players to gain instant access to them.
              - superscript [ref=f8e719]:
                - link "[34]" [ref=f8e720] [cursor=pointer]:
                  - /url: "#cite_note-reboot-37"
              - text: Players can purchase cosmetic items using real-world money, but the team did not wish to put gameplay content behind a paywall in order to be more player-friendly.
              - superscript [ref=f8e721]:
                - link "[74]" [ref=f8e722] [cursor=pointer]:
                  - /url: "#cite_note-77"
              - superscript [ref=f8e723]:
                - link "[75]" [ref=f8e724] [cursor=pointer]:
                  - /url: "#cite_note-GI_Post-78"
              - text: The team avoided adding more modes to the game because most would not fit well with the game's close-quarter combat.
              - superscript [ref=f8e725]:
                - link "[76]" [ref=f8e726] [cursor=pointer]:
                  - /url: "#cite_note-79"
              - text: Downloadable content for the game was divided into several seasons, with a Mid-Season Reinforcement patch which added new weapons and modified some of the operators' core abilities.
              - superscript [ref=f8e727]:
                - link "[34]" [ref=f8e728] [cursor=pointer]:
                  - /url: "#cite_note-reboot-37"
              - text: This post-release content was developed by the Montreal studio in conjunction with
              - link "Blue Byte" [ref=f8e729] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Blue_Byte
              - text: in Germany.
              - superscript [ref=f8e730]:
                - link "[77]" [ref=f8e731] [cursor=pointer]:
                  - /url: "#cite_note-80"
              - text: Ubisoft announced that they would keep supporting the game and adding new playable characters for 10 more years. As a result, no sequel was planned.
              - superscript [ref=f8e732]:
                - link "[78]" [ref=f8e733] [cursor=pointer]:
                  - /url: "#cite_note-81"
            - paragraph [ref=f8e734]:
              - text: In January 2018, Ubisoft announced the introduction of 'Outbreak Packs', which are
              - link "loot boxes" [ref=f8e735] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Loot_box
              - text: that can be unlocked with R6 credits (which can be purchased with
              - link "microtransactions" [ref=f8e736] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Microtransaction
              - text: ) to gain character items. The company also announced that the base version of the game will be replaced by a bundle named The Advanced Edition, which includes the base game and a small number of outbreak packs and R6 credits. The changes resulted in players' backlash, as existing players have to pay for new content while new players do not.
              - superscript [ref=f8e737]:
                - link "[79]" [ref=f8e738] [cursor=pointer]:
                  - /url: "#cite_note-82"
              - text: Ubisoft compensated players by giving players a free premium skin for free and announced plans to change the Standard Edition so that players can unlock new operators at a faster pace.
              - superscript [ref=f8e739]:
                - link "[80]" [ref=f8e740] [cursor=pointer]:
                  - /url: "#cite_note-83"
              - text: In July 2018, Ubisoft announced the introduction of a limited time pack named 'Sunsplash Packs', which are available to purchase with R6 credits and contain cosmetics that have an association with the season of Summer.
              - superscript [ref=f8e741]:
                - link "[81]" [ref=f8e742] [cursor=pointer]:
                  - /url: "#cite_note-84"
              - text: In October 2018, Ubisoft unveiled the Crimsonveil packs, which added a Halloween themed weapon skin, charm, headgear, and uniform for 4 operators, plus a seasonal weapon skin and a charm that was themed with the skin.
              - superscript [ref=f8e743]:
                - link "[82]" [ref=f8e744] [cursor=pointer]:
                  - /url: "#cite_note-85"
            - region [ref=f8e745]:
              - heading "Esports" [level=3] [ref=f8e747]
              - note [ref=f8e748]:
                - text: "See also:"
                - link "Six Invitational" [ref=f8e749] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Six_Invitational
              - figure [ref=f8e750]:
                - link [ref=f8e751] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:BLAST_R6_Copenhagen_Major_2023_-_52897260804.jpg
                - generic [ref=f8e753]:
                  - text: A match between
                  - link "FaZe Clan" [ref=f8e754] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/FaZe_Clan
                  - text: and
                  - link "Scarz" [ref=f8e755] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Scarz
                  - text: at BLAST Major Copenhagen 2023
              - paragraph [ref=f8e756]:
                - text: Ubisoft also envisioned the game as an
                - link "esports" [ref=f8e757] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Esports
                - text: game. The company had their first meeting with David Hiltscher, vice president of
                - link "ESL" [ref=f8e758] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/ESL_(eSports)
                - text: ", in late 2013. ESL offered feedback on the game's balancing and helped the developer to ensure that the game was suitable for competitive play."
                - superscript [ref=f8e759]:
                  - link "[83]" [ref=f8e760] [cursor=pointer]:
                    - /url: "#cite_note-86"
                - text: The team focused on introducing new operators to provide variety for esports viewers after the game's release, a decision inspired by modern
                - link "multiplayer online battle arena" [ref=f8e761] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Multiplayer_online_battle_arena
                - text: games such as
                - link "Dota 2" [ref=f8e763] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Dota_2
                - text: ", as this type of game often has 80–100 playable characters."
                - superscript [ref=f8e764]:
                  - link "[84]" [ref=f8e765] [cursor=pointer]:
                    - /url: "#cite_note-87"
                - text: ESL and Ubisoft officially announced Tom Clancy's Rainbow Six Pro League, a global tournament for Windows and Xbox One players. The competition was held at Intel Extreme Masters eSports tournament on March 4, 2016.
                - superscript [ref=f8e766]:
                  - link "[85]" [ref=f8e767] [cursor=pointer]:
                    - /url: "#cite_note-88"
                - text: A European team, PENTA Sports, became the champion of the first season of Rainbow Six Pro League after defeating another team, GiFu, at the final of the tournament held in May 2016.
                - superscript [ref=f8e768]:
                  - link "[86]" [ref=f8e769] [cursor=pointer]:
                    - /url: "#cite_note-89"
                - text: In 2017, it was revealed that Pro League Year Two would return, but Xbox One tournaments would not be featured.
                - superscript [ref=f8e770]:
                  - link "[87]" [ref=f8e771] [cursor=pointer]:
                    - /url: "#cite_note-90"
                - text: Ubisoft also held the
                - link "Six Invitational" [ref=f8e772] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Six_Invitational
                - text: tournaments in 2017 and 2018, in which top teams competed for the top prize. The 2018 tournament attracted 321,000 viewers on
                - link "Twitch" [ref=f8e773] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Twitch_(service)
                - text: .
                - superscript [ref=f8e774]:
                  - link "[88]" [ref=f8e775] [cursor=pointer]:
                    - /url: "#cite_note-91"
                - text: Both Nathan Lawrence from
                - link "Red Bull" [ref=f8e776] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Red_Bull_GmbH
                - text: and Richie Shoemaker from
                - link "Eurogamer" [ref=f8e778] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Eurogamer
                - text: compared the game favourably with
                - 'link "Counter-Strike: Global Offensive" [ref=f8e780] [cursor=pointer]':
                  - /url: https://en.wikipedia.org/wiki/Counter-Strike:_Global_Offensive
                - text: ", with both being hopeful that Siege can dethrone Global Offensive's status as the most successful competitive esports first-person shooter in the future."
                - superscript [ref=f8e781]:
                  - link "[89]" [ref=f8e782] [cursor=pointer]:
                    - /url: "#cite_note-92"
                - superscript [ref=f8e783]:
                  - link "[90]" [ref=f8e784] [cursor=pointer]:
                    - /url: "#cite_note-93"
                - text: Rainbow Six Siege Year 3 Season 4 was announced on November 18 at the Pro League Season 8 Finals in Rio de Janeiro and was set in Morocco.
                - superscript [ref=f8e785]:
                  - link "[91]" [ref=f8e786] [cursor=pointer]:
                    - /url: "#cite_note-94"
                - superscript [ref=f8e787]:
                  - link "[92]" [ref=f8e788] [cursor=pointer]:
                    - /url: "#cite_note-95"
              - paragraph [ref=f8e789]:
                - text: The Six Invitational 2020, in February 2020, had the highest prize pool in all of Rainbow Six with $3,000,000 split among 16 teams, with the victors, Spacestation Gaming from North America, taking home the lion's share of $1,000,000.
                - superscript [ref=f8e790]:
                  - link "[93]" [ref=f8e791] [cursor=pointer]:
                    - /url: "#cite_note-96"
                - text: The Six Invitational 2020 also announce enormous changes to both the game itself and the competitive scene. The changes included the end of Pro League and a new points-based system.
                - superscript [ref=f8e792]:
                  - link "[94]" [ref=f8e793] [cursor=pointer]:
                    - /url: "#cite_note-97"
                - text: These changes to the competitive scene have been compared to that of Dota 2 and
                - link "League of Legends" [ref=f8e795] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/League_of_Legends
                - text: .
            - region [ref=f8e796]:
              - heading "Downloadable content" [level=3] [ref=f8e798]
              - generic [ref=f8e799]:
                - note [ref=f8e800]:
                  - text: This section is an excerpt from
                  - link "List of Tom Clancy's Rainbow Six Siege downloadable content" [ref=f8e801] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/List_of_Tom_Clancy's_Rainbow_Six_Siege_downloadable_content
                  - text: .
                  - generic [ref=f8e802]:
                    - link "edit":
                      - /url: https://en.wikipedia.org/w/index.php?title=List_of_Tom_Clancy%27s_Rainbow_Six_Siege_downloadable_content&action=edit
                - paragraph [ref=f8e804]:
                  - text: There have been 42 seasons in 11 years of Tom Clancy's Rainbow Six Siege in the form of
                  - link "downloadable content" [ref=f8e805] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Downloadable_content
                  - text: . In most of the seasons, the downloadable content has usually fixed a glitch in the game, introduced a new map or a rework of an existing one, and one or two new operators to play.
                  - superscript [ref=f8e806]:
                    - link "[95]" [ref=f8e807] [cursor=pointer]:
                      - /url: "#cite_note-98"
                  - text: The inaugural season began in February 2016 with Operation Black Ice, and the game is currently in its forty-first season, Operation Silent Hunt, which is the first season of Year 11. There are currently 28 maps between four game modes, and 77 operators to choose from between attacking and defending.
                  - superscript [ref=f8e808]:
                    - link "[96]" [ref=f8e809] [cursor=pointer]:
                      - /url: "#cite_note-List_of_Tom_Clancy's_Rainbow_Six_Siege_downloadable_content_Maps-99"
                  - superscript [ref=f8e810]:
                    - link "[97]" [ref=f8e811] [cursor=pointer]:
                      - /url: "#cite_note-List_of_Tom_Clancy's_Rainbow_Six_Siege_downloadable_content_Operators-100"
            - region [ref=f8e812]:
              - heading "Crossovers" [level=3] [ref=f8e814]
              - paragraph [ref=f8e815]:
                - text: Rainbow Six Siege operators have made two appearances in another Clancy series,
                - link "Ghost Recon" [ref=f8e817] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ghost_Recon
                - text: ", in DLC missions:"
              - list [ref=f8e818]:
                - listitem [ref=f8e819]:
                  - text: In Operation Archangel, a summer 2018 DLC mission for
                  - link "Wildlands" [ref=f8e821] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Tom_Clancy's_Ghost_Recon_Wildlands
                  - text: ", Valkyrie and Twitch travel to Bolivia after Caveira has gone AWOL and is suspected of killing several members of the Santa Blanca Mexican drug cartel, which the Ghosts are working to bring down under the leadership of Nomad and their"
                  - link "CIA" [ref=f8e822] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/CIA
                  - text: contact Karen Bowman. The mission escalates into an operation to save Caveira's younger brother João, an undercover officer from the Federal Police of Brazil, from the cartel.
                  - superscript [ref=f8e823]:
                    - link "[98]" [ref=f8e824] [cursor=pointer]:
                      - /url: "#cite_note-101"
                - listitem [ref=f8e825]:
                  - text: In Amber Sky, a January 2021 DLC mission for
                  - link "Breakpoint" [ref=f8e827] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Tom_Clancy's_Ghost_Recon_Breakpoint
                  - text: ", Ash, Finka and Thatcher in addition to Lesion as point of contact travel to the South Pacific island of Auroa to help Nomad and the Ghosts stop private military contractor Sentinel under the command of rogue former Ghost Lieutenant Colonel Cole D. Walker from manufacturing and selling a chemical weapon called Amber Ruin."
                  - superscript [ref=f8e828]:
                    - link "[99]" [ref=f8e829] [cursor=pointer]:
                      - /url: "#cite_note-102"
