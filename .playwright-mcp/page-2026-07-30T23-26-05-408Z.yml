            - paragraph [ref=f8e921]:
              - text: Tom Clancy's Rainbow Six Siege received "generally favorable" reviews from critics, according to
              - link "review aggregator" [ref=f8e922] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Review_aggregator
              - link "Metacritic" [ref=f8e923] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Metacritic
              - text: .
              - superscript [ref=f8e924]:
                - link "[100]" [ref=f8e925] [cursor=pointer]:
                  - /url: "#cite_note-MCPC-103"
              - superscript [ref=f8e926]:
                - link "[101]" [ref=f8e927] [cursor=pointer]:
                  - /url: "#cite_note-MCXONE-104"
              - superscript [ref=f8e928]:
                - link "[102]" [ref=f8e929] [cursor=pointer]:
                  - /url: "#cite_note-MCPS4-105"
            - paragraph [ref=f8e930]:
              - text: The game's multiplayer was widely praised by critics. Chris Carter from
              - link "Destructoid" [ref=f8e932] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Destructoid
              - text: praised the game's open-ended nature, which made each match unpredictable and helped the experience to stay fresh even after an extended period of playing.
              - superscript [ref=f8e933]:
                - link "[103]" [ref=f8e934] [cursor=pointer]:
                  - /url: "#cite_note-DestructRev-106"
              - link "GameSpot" [ref=f8e936] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/GameSpot
              - generic [ref=f8e937]: "'"
              - text: s Scott Butterworth appreciated the title for allowing players to make use of their creativity in approaching a mission.
              - superscript [ref=f8e938]:
                - link "[107]" [ref=f8e939] [cursor=pointer]:
                  - /url: "#cite_note-GSpotRev-110"
              - text: James Davenport from
              - link "PC Gamer" [ref=f8e941] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/PC_Gamer
              - text: echoed this thought, and he described Siege as a "psychological race" in which players are constantly trying to outwit their opponents.
              - superscript [ref=f8e942]:
                - link "[111]" [ref=f8e943] [cursor=pointer]:
                  - /url: "#cite_note-PCGRev-114"
              - text: Ryan McCaffery from
              - link "IGN" [ref=f8e945] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/IGN
              - text: also praised the tactical possibilities, which make the game "tense and riveting".
              - superscript [ref=f8e946]:
                - link "[110]" [ref=f8e947] [cursor=pointer]:
                  - /url: "#cite_note-IGNRev-113"
              - text: The large number of operators available for players to choose were praised by both Carter and Matt Bertz from
              - link "Game Informer" [ref=f8e949] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Game_Informer
              - text: ", who commented that they added depths and variety to the game and that players could experiment to see which pairs of operators can complement each other."
              - superscript [ref=f8e950]:
                - link "[104]" [ref=f8e951] [cursor=pointer]:
                  - /url: "#cite_note-GIRev-107"
              - text: However, McCaffery was disappointed by the lack of variety of game modes and commented that most players usually neglect the mode's objectives and opted to simply eliminate their opponents.
              - superscript [ref=f8e952]:
                - link "[110]" [ref=f8e953] [cursor=pointer]:
                  - /url: "#cite_note-IGNRev-113"
              - text: Terrorist Hunt received divisive opinions from critics. Carter thought that it was more relaxing,
              - superscript [ref=f8e954]:
                - link "[103]" [ref=f8e955] [cursor=pointer]:
                  - /url: "#cite_note-DestructRev-106"
              - text: and Butterworth thought it was exhilarating. However, Bertz criticized its lack of variety, weak
              - link "artificial intelligence" [ref=f8e956] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Artificial_intelligence_(video_games)
              - text: ", and its less-intense nature when compared with the player-versus-player modes."
              - superscript [ref=f8e957]:
                - link "[104]" [ref=f8e958] [cursor=pointer]:
                  - /url: "#cite_note-GIRev-107"
              - text: Martin Robinson from
              - link "Eurogamer" [ref=f8e960] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Eurogamer
              - text: also noted that the mode only ran at 30
              - link "frames per second" [ref=f8e961] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Frames_per_second
              - text: ", which limited its appeal."
              - superscript [ref=f8e962]:
                - link "[114]" [ref=f8e963] [cursor=pointer]:
                  - /url: "#cite_note-EuroGRev-117"
            - paragraph [ref=f8e964]:
              - text: The game's focus on tactics was praised. Bertz applauded the tactical nature of the game, as it fostered communications between players. However, he noted that teamwork may not be possible if players did not have a headphone and microphone.
              - superscript [ref=f8e965]:
                - link "[104]" [ref=f8e966] [cursor=pointer]:
                  - /url: "#cite_note-GIRev-107"
              - text: Arthur Gies from
              - link "Polygon" [ref=f8e968] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Polygon_(website)
              - text: echoed these comments, stating that the game's over-reliance on teamwork meant that when teammates were not communicating, the game would not be fun to play.
              - superscript [ref=f8e969]:
                - link "[112]" [ref=f8e970] [cursor=pointer]:
                  - /url: "#cite_note-PolyRev-115"
              - text: The "No Respawn" system was praised by Butterworth for making each match feel intense, as even the best player needs to think tactically in order to win.
              - superscript [ref=f8e971]:
                - link "[107]" [ref=f8e972] [cursor=pointer]:
                  - /url: "#cite_note-GSpotRev-110"
              - text: Jonathon Leack from
              - link "Game Revolution" [ref=f8e974] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Game_Revolution
              - text: enjoyed the scouting phase of a multiplayer match, which encouraged players to communicate with each other and coordinate their attacks.
              - superscript [ref=f8e975]:
                - link "[105]" [ref=f8e976] [cursor=pointer]:
                  - /url: "#cite_note-GameRevRev-108"
              - text: However, Gies noted that the placement of game objectives does not vary much, thus making the scouting phase meaningless. Both Bertz and Butterworth agreed that the game's competitive nature increases the game's replay value.
              - superscript [ref=f8e977]:
                - link "[104]" [ref=f8e978] [cursor=pointer]:
                  - /url: "#cite_note-GIRev-107"
              - superscript [ref=f8e979]:
                - link "[107]" [ref=f8e980] [cursor=pointer]:
                  - /url: "#cite_note-GSpotRev-110"
              - text: Ben Griffin from
              - link "GamesRadar" [ref=f8e982] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/GamesRadar
              - text: praised the destruction mechanic for bringing tactical depth to the game.
              - superscript [ref=f8e983]:
                - link "[108]" [ref=f8e984] [cursor=pointer]:
                  - /url: "#cite_note-GRadarRev-111"
            - paragraph [ref=f8e985]:
              - text: The gameplay received mixed reviews. Both Bertz and Griffin criticized the game's incompetent hit detection system, which made the experience unfair.
              - superscript [ref=f8e986]:
                - link "[108]" [ref=f8e987] [cursor=pointer]:
                  - /url: "#cite_note-GRadarRev-111"
              - text: Bertz described the game's gunplay as "serviceable",
              - superscript [ref=f8e988]:
                - link "[104]" [ref=f8e989] [cursor=pointer]:
                  - /url: "#cite_note-GIRev-107"
              - text: while Leack noticed a delay in shooting, which drags the game's pace and leads to a steep learning curve. However, Leack appreciated the game's map design, which opened many possibilities. He also praised its attention to detail and sound design, which can often make a multiplayer match feel like a "great action film".
              - superscript [ref=f8e990]:
                - link "[105]" [ref=f8e991] [cursor=pointer]:
                  - /url: "#cite_note-GameRevRev-108"
              - text: Bertz was disappointed by the lack of customization options, which did not offer long-term progression for the players.
              - superscript [ref=f8e992]:
                - link "[104]" [ref=f8e993] [cursor=pointer]:
                  - /url: "#cite_note-GIRev-107"
              - text: Butterworth similarly criticized the progression system for being slow. As players cannot play as the same operator in the same match, he was often forced to play as the generic "recruit" character when he was only at the beginning stage of the game. He also criticized the limited weapon customization options, which barely affect gameplay.
              - superscript [ref=f8e994]:
                - link "[107]" [ref=f8e995] [cursor=pointer]:
                  - /url: "#cite_note-GSpotRev-110"
              - text: McCaffery described customization as the "least interesting" aspect of the game and claimed that most gameplay features were locked when players started playing.
              - superscript [ref=f8e996]:
                - link "[110]" [ref=f8e997] [cursor=pointer]:
                  - /url: "#cite_note-IGNRev-113"
              - text: Griffin, Gies, and Steven Burns from VideoGamer.com were annoyed by the
              - link "microtransactions" [ref=f8e998] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Microtransaction
              - text: featured in the game,
              - superscript [ref=f8e999]:
                - link "[113]" [ref=f8e1000] [cursor=pointer]:
                  - /url: "#cite_note-VGRev-116"
              - superscript [ref=f8e1001]:
                - link "[112]" [ref=f8e1002] [cursor=pointer]:
                  - /url: "#cite_note-PolyRev-115"
              - text: with Griffin describing it as a greedy attempt by Ubisoft to make more money,
              - superscript [ref=f8e1003]:
                - link "[108]" [ref=f8e1004] [cursor=pointer]:
                  - /url: "#cite_note-GRadarRev-111"
              - text: though Davenport did not mind these features as they were limited to cosmetic items and could be unlocked through earning Renown.
              - superscript [ref=f8e1005]:
                - link "[111]" [ref=f8e1006] [cursor=pointer]:
                  - /url: "#cite_note-PCGRev-114"
              - text: Bertz was annoyed the lack of clan infrastructure, which may cause players troubles when they were finding matches,
              - superscript [ref=f8e1007]:
                - link "[104]" [ref=f8e1008] [cursor=pointer]:
                  - /url: "#cite_note-GIRev-107"
              - text: while Griffin thought that map rotation often felt random and was disappointed that players cannot vote to decide which map they are going to play next.
              - superscript [ref=f8e1009]:
                - link "[108]" [ref=f8e1010] [cursor=pointer]:
                  - /url: "#cite_note-GRadarRev-111"
            - paragraph [ref=f8e1011]:
              - text: Single-player was generally considered a disappointment by critics, with Situations receiving mixed reviews. Carter described it as one of his "favorite non-campaign additions" as the mode gave players incentive to return due to its rating system. Butterworth described it as a "surprisingly robust" mode and thought that there were great tutorial missions that help players to understand gameplay before trying multiplayer.
              - superscript [ref=f8e1012]:
                - link "[107]" [ref=f8e1013] [cursor=pointer]:
                  - /url: "#cite_note-GSpotRev-110"
              - text: However, Bertz criticized it for its lack of replay value,
              - superscript [ref=f8e1014]:
                - link "[104]" [ref=f8e1015] [cursor=pointer]:
                  - /url: "#cite_note-GIRev-107"
              - text: and Griffin noted their short length.
              - superscript [ref=f8e1016]:
                - link "[108]" [ref=f8e1017] [cursor=pointer]:
                  - /url: "#cite_note-GRadarRev-111"
              - text: McCaffery thought that it served as a competent tutorial, but its solo play nature meant that players could not practice team play and tactics.
              - superscript [ref=f8e1018]:
                - link "[110]" [ref=f8e1019] [cursor=pointer]:
                  - /url: "#cite_note-IGNRev-113"
              - text: Davenport criticized the narrative in Situations, which he thought was not meaningful.
              - superscript [ref=f8e1020]:
                - link "[111]" [ref=f8e1021] [cursor=pointer]:
                  - /url: "#cite_note-PCGRev-114"
              - text: Many critics were disappointed with the lack of a single-player campaign or a cooperative campaign,
              - superscript [ref=f8e1022]:
                - link "[104]" [ref=f8e1023] [cursor=pointer]:
                  - /url: "#cite_note-GIRev-107"
              - superscript [ref=f8e1024]:
                - link "[105]" [ref=f8e1025] [cursor=pointer]:
                  - /url: "#cite_note-GameRevRev-108"
              - text: but Butterworth believed that the strong multiplayer components can compensate for this absence.
              - superscript [ref=f8e1026]:
                - link "[107]" [ref=f8e1027] [cursor=pointer]:
                  - /url: "#cite_note-GSpotRev-110"
              - text: Gies noticed certain network issues would affect the single-player.
              - superscript [ref=f8e1028]:
                - link "[112]" [ref=f8e1029] [cursor=pointer]:
                  - /url: "#cite_note-PolyRev-115"
            - paragraph [ref=f8e1030]:
              - text: Many critics generally had a positive opinion on the package. Bertz thought that the game's multiplayer design had laid a great foundation for the game, but it was not taken advantage of due to the small number of game modes.
              - superscript [ref=f8e1031]:
                - link "[104]" [ref=f8e1032] [cursor=pointer]:
                  - /url: "#cite_note-GIRev-107"
              - text: Leack felt that Siege
              - generic [ref=f8e1033]: "'"
              - text: s tight focus on tactical gameplay had "provided something unlike any other game on the market".
              - superscript [ref=f8e1034]:
                - link "[105]" [ref=f8e1035] [cursor=pointer]:
                  - /url: "#cite_note-GameRevRev-108"
              - text: Butterworth found the game unique and that there was "nothing else like it" when he put aside the game's minor annoyances.
              - superscript [ref=f8e1036]:
                - link "[107]" [ref=f8e1037] [cursor=pointer]:
                  - /url: "#cite_note-GSpotRev-110"
              - text: Griffin wrote that the title felt very fresh, as most games in the market did not value tactics.
              - superscript [ref=f8e1038]:
                - link "[108]" [ref=f8e1039] [cursor=pointer]:
                  - /url: "#cite_note-GRadarRev-111"
              - text: Davenport similarly praised the game for being very concentrated and making no compromises on gameplay design, which in turn make the title one of the best tactical multiplayer shooters on the market.
              - superscript [ref=f8e1040]:
                - link "[111]" [ref=f8e1041] [cursor=pointer]:
                  - /url: "#cite_note-PCGRev-114"
              - text: Gies recognized the game's potential but thought that they were overshadowed by the game's numerous technical annoyances, frustrating progression system and its lack of content.
              - superscript [ref=f8e1042]:
                - link "[112]" [ref=f8e1043] [cursor=pointer]:
                  - /url: "#cite_note-PolyRev-115"
              - text: Robinson was impressed by the game's multiplayer mode, and that the overall package could be considered as the year's best multiplayer game. However, he questioned Ubisoft for releasing the game with so little content while still selling it at full-price.
              - superscript [ref=f8e1044]:
                - link "[114]" [ref=f8e1045] [cursor=pointer]:
                  - /url: "#cite_note-EuroGRev-117"
              - text: By December 2020, the game had more than 70 million registered players.
              - superscript [ref=f8e1046]:
                - link "[115]" [ref=f8e1047] [cursor=pointer]:
                  - /url: "#cite_note-118"
              - superscript [ref=f8e1048]:
                - link "[116]" [ref=f8e1049] [cursor=pointer]:
                  - /url: "#cite_note-119"
            - region [ref=f8e1050]:
              - heading "Games as a service" [level=3] [ref=f8e1052]
              - paragraph [ref=f8e1053]:
                - text: In May 2015, CEO of Ubisoft Yves Guillemot announced that the company expected the game to outsell
                - link "Far Cry 4" [ref=f8e1056] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Far_Cry_4
                - text: "'s seven million sales over the course of its lifetime because of post-launch support."
                - superscript [ref=f8e1057]:
                  - link "[117]" [ref=f8e1058] [cursor=pointer]:
                    - /url: "#cite_note-120"
                - text: At the game's launch, it debuted at number six in UK Software Charts, selling 76,000 retail copies across all three platforms.
                - superscript [ref=f8e1059]:
                  - link "[118]" [ref=f8e1060] [cursor=pointer]:
                    - /url: "#cite_note-121"
                - text: Critics thought that the launch performance was underwhelming and lacklustre.
                - superscript [ref=f8e1061]:
                  - link "[119]" [ref=f8e1062] [cursor=pointer]:
                    - /url: "#cite_note-122"
                - text: However, through continued post-release support and updates, the player base had doubled since the game's launch.
                - superscript [ref=f8e1063]:
                  - link "[120]" [ref=f8e1064] [cursor=pointer]:
                    - /url: "#cite_note-123"
                - text: Following the summer 2016 launch of the third DLC, Skull Rain, the size of the player base had a 40% increase, and the title had more than 10 million registered players.
                - superscript [ref=f8e1065]:
                  - link "[121]" [ref=f8e1066] [cursor=pointer]:
                    - /url: "#cite_note-124"
                - text: Two years after launch, the game remained as one of the top 40 best-selling retail games in the UK.
                - superscript [ref=f8e1067]:
                  - link "[47]" [ref=f8e1068] [cursor=pointer]:
                    - /url: "#cite_note-postmortem-50"
                - text: The strong performance of Siege, along with
                - link "Tom Clancy's The Division" [ref=f8e1070] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tom_Clancy's_The_Division
                - text: (2016) and
                - link "Tom Clancy's Ghost Recon Wildlands" [ref=f8e1072] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tom_Clancy's_Ghost_Recon_Wildlands
                - text: (2017) boosted the total number of players of the
                - link "Tom Clancy's" [ref=f8e1074] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tom_Clancy's
                - text: franchise to 44 million in 2017.
                - superscript [ref=f8e1075]:
                  - link "[122]" [ref=f8e1076] [cursor=pointer]:
                    - /url: "#cite_note-125"
                - text: In August 2017, Ubisoft announced that the game had passed 20 million players and that the game was played by 2.3 million players every day.
                - superscript [ref=f8e1077]:
                  - link "[123]" [ref=f8e1078] [cursor=pointer]:
                    - /url: "#cite_note-126"
                - text: Two years after the game's launch, Ubisoft announced that the game has passed 25 million registered players.
                - superscript [ref=f8e1079]:
                  - link "[124]" [ref=f8e1080] [cursor=pointer]:
                    - /url: "#cite_note-127"
                - text: As of February 2019, the game had more than 45 million registered players.
                - superscript [ref=f8e1081]:
                  - link "[125]" [ref=f8e1082] [cursor=pointer]:
                    - /url: "#cite_note-128"
              - paragraph [ref=f8e1083]:
                - text: Critics agreed that while the game suffered a rocky launch, Ubisoft's efforts in updating the game and fixing bugs have increased the game's quality and had transformed the game into a better experience.
                - superscript [ref=f8e1084]:
                  - link "[126]" [ref=f8e1085] [cursor=pointer]:
                    - /url: "#cite_note-129"
                - superscript [ref=f8e1086]:
                  - link "[127]" [ref=f8e1087] [cursor=pointer]:
                    - /url: "#cite_note-130"
                - superscript [ref=f8e1088]:
                  - link "[128]" [ref=f8e1089] [cursor=pointer]:
                    - /url: "#cite_note-131"
                - superscript [ref=f8e1090]:
                  - link "[129]" [ref=f8e1091] [cursor=pointer]:
                    - /url: "#cite_note-132"
                - link "IGN" [ref=f8e1093] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/IGN
                - text: and
                - link "Eurogamer" [ref=f8e1095] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Eurogamer
                - text: re-reviewed the game in 2018 and both concluded that the game had improved significantly since its launch.
                - superscript [ref=f8e1096]:
                  - link "[109]" [ref=f8e1097] [cursor=pointer]:
                    - /url: "#cite_note-IGNRev2018-112"
                - superscript [ref=f8e1098]:
                  - link "[130]" [ref=f8e1099] [cursor=pointer]:
                    - /url: "#cite_note-133"
                - text: Several years after the game's launch, Siege was regarded as one of the best multiplayer games released for
                - link "PlayStation 4" [ref=f8e1100] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/PlayStation_4
                - text: and
                - link "Xbox One" [ref=f8e1101] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Xbox_One
                - text: by some critics, with praise being directed to its distinctiveness and the similarities it shares with
                - link "multiplayer online battle arena" [ref=f8e1102] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Multiplayer_online_battle_arena
                - text: games and
                - link "hero shooters" [ref=f8e1103] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Hero_shooter
                - text: .
                - superscript [ref=f8e1104]:
                  - link "[75]" [ref=f8e1105] [cursor=pointer]:
                    - /url: "#cite_note-GI_Post-78"
                - superscript [ref=f8e1106]:
                  - link "[131]" [ref=f8e1107] [cursor=pointer]:
                    - /url: "#cite_note-134"
                - superscript [ref=f8e1108]:
                  - link "[132]" [ref=f8e1109] [cursor=pointer]:
                    - /url: "#cite_note-135"
              - paragraph [ref=f8e1110]:
                - text: According to Remy, the team focused on players retention in the year after the game's launch, but the growth of the game's player base exceeded their expectations. He called the game "a testament" to the
                - link "games as a service" [ref=f8e1111] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Games_as_a_service
                - text: model.
                - superscript [ref=f8e1112]:
                  - link "[34]" [ref=f8e1113] [cursor=pointer]:
                    - /url: "#cite_note-reboot-37"
                - text: Jeff Grubb from
                - link "VentureBeat" [ref=f8e1115] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/VentureBeat
                - text: attributed Siege's high player retention rate and successful eSports events to Ubisoft's continuous and frequent updates to the game.
                - superscript [ref=f8e1116]:
                  - link "[133]" [ref=f8e1117] [cursor=pointer]:
                    - /url: "#cite_note-136"
                - link "GameSpot" [ref=f8e1119] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/GameSpot
                - text: described Siege as "one of modern
                - link "AAA" [ref=f8e1120] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/AAA_(video_game_industry)
                - text: gaming's biggest comebacks", and the best proof to show that the "games-as-a-service" model works well, attributing its success to Ubisoft's continuous updates and the thriving community.
                - superscript [ref=f8e1121]:
                  - link "[134]" [ref=f8e1122] [cursor=pointer]:
                    - /url: "#cite_note-137"
                - text: Haydn Taylor from
                - link "Gameindustry.biz" [ref=f8e1124] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Gameindustry.biz
                - text: praised Ubisoft's monetization methods, which was less aggressive than other gaming companies like
                - link "Electronic Arts" [ref=f8e1125] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Electronic_Arts
                - text: . Unlike titles such as
                - link "Star Wars Battlefront II" [ref=f8e1127] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Star_Wars_Battlefront_II_(2017_video_game)
                - text: (2017), the game's monetization methods and the use of
                - link "loot boxes" [ref=f8e1128] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Loot_box
                - text: generated minimal amount of backlash from players. He added that Ubisoft had shown, with Siege, "the delicate and reasoned approach that's been missing from the industry's clumsy, heavy-handed adoption of the games-as-a-service model".
                - superscript [ref=f8e1129]:
                  - link "[135]" [ref=f8e1130] [cursor=pointer]:
                    - /url: "#cite_note-138"
                - text: The post-launch success for Siege further solidified Ubisoft's belief in the model. Future Ubisoft multiplayer-focused titles – such as
                - link "For Honor" [ref=f8e1132] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/For_Honor
                - text: – adopted this structure, in which the company would provide free DLC and updates several years after the game's official release.
                - superscript [ref=f8e1133]:
                  - link "[136]" [ref=f8e1134] [cursor=pointer]:
                    - /url: "#cite_note-139"
