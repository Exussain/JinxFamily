                - rowgroup
            - region [ref=f8e1342]:
              - heading "Controversy" [level=3] [ref=f8e1344]
              - paragraph [ref=f8e1345]:
                - text: On November 2, 2018, Ubisoft Montreal announced they were going to make "aesthetic changes" to Tom Clancy's Rainbow Six Siege by removing references to death, sex, and gambling in order to comply with regulations of Asian countries. However, the announcement generated opposition from the gaming community who believed the changes were going to be made for the game's upcoming release in China, likening the move to
                - link "censorship" [ref=f8e1346] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Video_game_censorship
                - text: .
                - superscript [ref=f8e1347]:
                  - link "[161]" [ref=f8e1348] [cursor=pointer]:
                    - /url: "#cite_note-164"
                - text: Because of pressure from the community, Ubisoft Montreal announced on November 21 that they were reversing the decision to make the changes, "We have been following the conversation with our community closely over the past couple of weeks, alongside regular discussions with our internal Ubisoft team, and we want to ensure that the experience for all our players, especially those that have been with us from the beginning, remains as true to the original artistic intent as possible."
                - superscript [ref=f8e1349]:
                  - link "[162]" [ref=f8e1350] [cursor=pointer]:
                    - /url: "#cite_note-165"
              - paragraph [ref=f8e1351]:
                - text: Ubisoft filed a lawsuit against the Chinese developers Ejoy as well as Apple and Google in May 2020, based on Ejoy's mobile game Area F2, which Ubisoft claimed was a
                - link "clone" [ref=f8e1352] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Video_game_clone
                - text: of Siege. Ubisoft stated that "Virtually every aspect of [Area F2] is copied from [Siege], from the operator selection screen to the final scoring screen and everything in between". Ubisoft claimed they had attempted to have the game removed from Apple and Google's respective app stores but they failed to grant the removal, and as Area F2 was a
                - link "free-to-play" [ref=f8e1353] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Free-to-play
                - text: game with microtransactions, the two companies were financially benefiting from the copyright violation, and thus included in the lawsuit.
                - superscript [ref=f8e1354]:
                  - link "[163]" [ref=f8e1355] [cursor=pointer]:
                    - /url: "#cite_note-166"
              - paragraph [ref=f8e1356]:
                - text: During the Six Invitational 2022, Ubisoft announced that one of its upcoming majors for the game would take place in the
                - link "United Arab Emirates" [ref=f8e1357] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/United_Arab_Emirates
                - text: ", drawing criticism because of the"
                - link "UAE's treatment of LGBTQ+ people" [ref=f8e1358] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/LGBT_rights_in_the_United_Arab_Emirates
                - text: and concern for the safety of Ubisoft's LGBTQ+ personnel and players.
                - superscript [ref=f8e1359]:
                  - link "[164]" [ref=f8e1360] [cursor=pointer]:
                    - /url: "#cite_note-UAE_backlash-167"
                - text: Days later, Ubisoft announced their "decision to move the Six Major of August 2022 to another Rainbow Six Esports region" due to the response from the fanbase.
                - superscript [ref=f8e1361]:
                  - link "[165]" [ref=f8e1362] [cursor=pointer]:
                    - /url: "#cite_note-UAE_reversal-168"
              - paragraph [ref=f8e1363]:
                - text: During the Six Invitational 2025 event, Ubisoft revealed a new operator named Rauora originating from Christchurch, New Zealand. Fans soon noticed that the operator's origin and birthday of March 15 was in reference to the
                - link "Christchurch terrorist mosque shootings" [ref=f8e1364] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Christchurch_mosque_shootings
                - text: in which 51 victims were killed by a white supremacist.
                - superscript [ref=f8e1365]:
                  - link "[166]" [ref=f8e1366] [cursor=pointer]:
                    - /url: "#cite_note-169"
                - text: Ubisoft later retracted the "oversight" after the reveal caused heated discussion as to whether the date and origin of the new operator was intentional. A Ubisoft spokesperson later stated "We apologise for the oversight and have taken immediate steps to change the birth date [...] The change has been made on the game’s website and will be implemented in the game via an update on March 4".
                - superscript [ref=f8e1367]:
                  - link "[167]" [ref=f8e1368] [cursor=pointer]:
                    - /url: "#cite_note-170"
                - text: The operator's birthday was subsequently changed to May 11.
                - superscript [ref=f8e1369]:
                  - link "[168]" [ref=f8e1370] [cursor=pointer]:
                    - /url: "#cite_note-171"
