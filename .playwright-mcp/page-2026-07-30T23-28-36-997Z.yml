                - superscript [ref=f16e778]:
                  - link "[76]" [ref=f16e779] [cursor=pointer]:
                    - /url: "#cite_note-80"
                - text: An update released in July 2017 introduced a new arena celebrating the one-year anniversary of the game, along with cosmetic items based on the American animated show
                - link "Rick and Morty" [ref=f16e781] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Rick_and_Morty
                - text: .
                - superscript [ref=f16e782]:
                  - link "[77]" [ref=f16e783] [cursor=pointer]:
                    - /url: "#cite_note-81"
                - text: Alongside the theatrical release of
                - 'link "Jurassic World: Fallen Kingdom" [ref=f16e785] [cursor=pointer]':
                  - /url: https://en.wikipedia.org/wiki/Jurassic_World:_Fallen_Kingdom
                - text: ", Psyonix released"
                - link "Jurassic Park" [ref=f16e787] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Jurassic_Park
                - text: and Jurassic World-themed content, including a Jurassic Park-themed
                - link "Jeep Wrangler" [ref=f16e788] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Jeep_Wrangler_(YJ)
                - text: car model.
                - superscript [ref=f16e789]:
                  - link "[78]" [ref=f16e790] [cursor=pointer]:
                    - /url: "#cite_note-82"
                - text: The game had collaborated with numerous franchise, including
                - link "The Goonies" [ref=f16e792] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/The_Goonies
                - text: ","
                - link "Karate Kid" [ref=f16e794] [cursor=pointer]:
