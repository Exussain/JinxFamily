                      - /url: https://en.wikipedia.org/wiki/Multiplayer
            - paragraph [ref=f16e345]:
              - generic [ref=f16e346]: Rocket League
              - text: is a 2015 vehicular
              - link "soccer" [ref=f16e347] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Association_football
              - link "video game" [ref=f16e348] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Video_game
              - text: developed and published by
              - link "Psyonix" [ref=f16e349] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Psyonix
              - text: . A sequel to 2008's
              - link "Supersonic Acrobatic Rocket-Powered Battle-Cars" [ref=f16e351] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Supersonic_Acrobatic_Rocket-Powered_Battle-Cars
              - text: ", Rocket League features up to eight players assigned to each of the two teams, using \"rocket-powered\" vehicles to hit a ball into their opponent's goal and score points over the course of a match. The game includes single-player and multiplayer modes that can be played both locally and online, including"
              - link "cross-platform play" [ref=f16e352] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Cross-platform_play
              - text: between all versions.
            - paragraph [ref=f16e353]:
              - text: Psyonix began formal development of Rocket League around 2013, refining the gameplay from Battle-Cars to address criticism and fan input. Psyonix also recognized their lack of marketing from Battle-Cars and engaged in both social media and promotions to market the game. Rocket League was first released on the
              - link "PlayStation 4" [ref=f16e354] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/PlayStation_4
              - text: and
              - link "Windows" [ref=f16e355] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Windows
              - text: respectively in July 2015, with ports for
              - link "Xbox One" [ref=f16e356] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Xbox_One
              - text: and
              - link "Nintendo Switch" [ref=f16e357] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Nintendo_Switch
              - text: being released later on. Physical retail versions for PlayStation 4 and Xbox One were distributed starting in 2016 by
              - link "505 Games" [ref=f16e358] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/505_Games
              - text: and later by
              - link "Warner Bros. Interactive Entertainment" [ref=f16e359] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Warner_Bros._Interactive_Entertainment
              - text: . Versions for
              - link "macOS" [ref=f16e360] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/MacOS
              - text: and
              - link "Linux" [ref=f16e361] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Linux
              - text: were also released in 2016, but support for their online services was dropped in 2020. Rocket League is developed under the
              - link "games as a service" [ref=f16e362] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Games_as_a_service
              - text: model; later updates for the game enabled the ability to modify core rules and added new game modes, including ones based on
              - link "ice hockey" [ref=f16e363] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Ice_hockey
              - text: ","
              - link "gridiron football" [ref=f16e364] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Gridiron_football
              - text: and
              - link "basketball" [ref=f16e365] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Basketball
              - text: . It has been offered as
              - link "free-to-play" [ref=f16e366] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Free-to-play
              - text: since 2020 when
              - link "Epic Games" [ref=f16e367] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Epic_Games
              - text: acquired Psyonix.
            - paragraph [ref=f16e368]:
              - text: Rocket League was praised for its gameplay improvements over Supersonic Acrobatic Rocket Powered Battle-Cars, as well as its graphics and overall presentation, although some criticism was directed towards the game's
              - link "physics engine" [ref=f16e369] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Physics_engine
              - text: . It has since been considered one of the
              - link "greatest video games ever made" [ref=f16e370] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/List_of_video_games_considered_the_best
              - text: . The game earned many industry awards and saw over 10 million sales and 40 million players by the beginning of 2018. Rocket League has also been adopted as an
              - link "esport" [ref=f16e371] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Esport
              - text: ", with professional players participating through"
              - link "ESL" [ref=f16e372] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/ESL_(company)
              - text: and
              - link "Major League Gaming" [ref=f16e373] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Major_League_Gaming
              - text: along with Psyonix's own
              - link "Rocket League Championship Series" [ref=f16e374] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Rocket_League_Championship_Series
              - text: (RLCS).
          - region [ref=f16e375]:
            - heading "Gameplay" [level=2] [ref=f16e377]
            - figure "Gameplay in Rocket League, where players aim to hit the ball into the opposing team's goal using their rocket-powered cars" [ref=f16e378]:
              - link [ref=f16e379] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/File:Rocket_League,_Mannfield.jpg
            - paragraph [ref=f16e382]:
              - text: Rocket League
              - generic [ref=f16e383]: "'s"
              - text: gameplay is largely the same as that of its predecessor,
              - link "Supersonic Acrobatic Rocket-Powered Battle-Cars" [ref=f16e385] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Supersonic_Acrobatic_Rocket-Powered_Battle-Cars
              - text: . Players control a rocket-powered car and use it to hit a ball that is much larger than the cars towards the other team's goal area to score goals, in a way that resembles
              - link "indoor soccer" [ref=f16e386] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Indoor_soccer
              - text: ", with elements reminiscent of a"
              - link "demolition derby" [ref=f16e387] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Demolition_derby
              - text: .
              - superscript [ref=f16e388]:
                - link "[1]" [ref=f16e389] [cursor=pointer]:
                  - /url: "#cite_note-5"
              - superscript [ref=f16e390]:
                - link "[2]" [ref=f16e391] [cursor=pointer]:
                  - /url: "#cite_note-ShackNews-6"
              - text: Players' cars have the ability to hop to hit the ball while in mid-air. Updates in 2024 introduced new features that allow players to view the remaining boost amount of their teammates, and how much time was remaining on the game clock when specific comments were made in the chat.
              - superscript [ref=f16e392]:
                - link "[3]" [ref=f16e393] [cursor=pointer]:
                  - /url: "#cite_note-7"
            - paragraph [ref=f16e394]:
              - text: Matches are usually five minutes long, with a
              - link "sudden death" [ref=f16e395] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Sudden_death_(sport)
              - text: overtime if the game is tied at that point.
              - superscript [ref=f16e396]:
                - link "[4]" [ref=f16e397] [cursor=pointer]:
                  - /url: "#cite_note-8"
              - text: Matches can be played from between one-on-one up to four-on-four players, as well as in casual and ranked playlists.
              - superscript [ref=f16e398]:
                - link "[5]" [ref=f16e399] [cursor=pointer]:
                  - /url: "#cite_note-9"
              - text: The latter serves as Rocket League
              - generic [ref=f16e400]: "'s"
              - text: competitive online mode, where players compete in various tiered ranks within game seasons, with victories or losses raising or lowering a player's rank, respectively.
              - superscript [ref=f16e401]:
                - link "[6]" [ref=f16e402] [cursor=pointer]:
                  - /url: "#cite_note-10"
              - text: The game includes a single-player Season mode, with the player competing with computer-controlled players. An update in December 2016 introduced Custom Training sequences that can be created by players and shared with others on the same platform. Players are able to specify the ball's path and the presence and skill of opponents on the field, which enables them to practice specific shots or maneuvers.
              - superscript [ref=f16e403]:
                - link "[7]" [ref=f16e404] [cursor=pointer]:
                  - /url: "#cite_note-11"
            - paragraph [ref=f16e405]:
              - text: A few months after it was released, Psyonix released an update that added game modes known as mutators, modifying some aspects of gameplay, such as increased or decreased gravity, ball size, ball speed and bounciness.
              - superscript [ref=f16e406]:
                - link "[8]" [ref=f16e407] [cursor=pointer]:
                  - /url: "#cite_note-Mutate-12"
              - text: For the 2015 holiday season, another update replaced mutator matches with an
              - link "ice hockey" [ref=f16e408] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Ice_hockey
              - text: "-inspired mode (called Snow Day), played on an ice rink and the ball replaced with a"
              - link "hockey puck" [ref=f16e409] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Hockey_puck
              - text: with different physics.
              - superscript [ref=f16e410]:
                - link "[9]" [ref=f16e411] [cursor=pointer]:
                  - /url: "#cite_note-Hockey-13"
              - text: Positive reception to the ice hockey mode led to it being extended for a few weeks after the holiday season. Snow Day was permanently added to the mutator settings for private matches and exhibition games on February 10, 2016.
              - superscript [ref=f16e412]:
                - link "[10]" [ref=f16e413] [cursor=pointer]:
                  - /url: "#cite_note-14"
              - superscript [ref=f16e414]:
                - link "[11]" [ref=f16e415] [cursor=pointer]:
                  - /url: "#cite_note-15"
              - text: Hoops, a game mode based on
              - link "basketball" [ref=f16e416] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Basketball
              - text: ","
              - superscript [ref=f16e417]:
                - link "[12]" [ref=f16e418] [cursor=pointer]:
                  - /url: "#cite_note-16"
              - superscript [ref=f16e419]:
                - link "[13]" [ref=f16e420] [cursor=pointer]:
                  - /url: "#cite_note-17"
              - superscript [ref=f16e421]:
                - link "[14]" [ref=f16e422] [cursor=pointer]:
                  - /url: "#cite_note-gamespot_hoops-18"
              - text: was added on April 25, 2016.
              - superscript [ref=f16e423]:
                - link "[15]" [ref=f16e424] [cursor=pointer]:
                  - /url: "#cite_note-19"
              - text: A separate Rumble mode, which incorporates unusual power-ups, such as the ability to freeze the ball in place or cause a single opponent to have difficulty controlling their car, was added on September 8, 2016.
              - superscript [ref=f16e425]:
                - link "[16]" [ref=f16e426] [cursor=pointer]:
                  - /url: "#cite_note-vg247_201608-20"
              - text: An update in December 2016, known as Starbase ARC and based on Psyonix' mobile game
              - link "ARC Squadron" [ref=f16e428] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/ARC_Squadron
              - text: ","
              - superscript [ref=f16e429]:
                - link "[17]" [ref=f16e430] [cursor=pointer]:
                  - /url: "#cite_note-21"
              - text: added support for custom arenas for Windows players supported through
              - link "Steam Workshop" [ref=f16e431] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Steam_Workshop
              - text: ", along with other new content."
              - superscript [ref=f16e432]:
                - link "[18]" [ref=f16e433] [cursor=pointer]:
                  - /url: "#cite_note-22"
            - paragraph [ref=f16e434]:
              - text: A new game mode, Dropshot, was added in a March 2017 update. It takes place in an arena without any goals and a field made of hexagonal tiles, and uses a ball that becomes increasingly electrified after successful strikes or passes. The more the ball is struck by players without touching the ground the more electrified it becomes, and the more tiles it damages once it finally does hit the ground. The goal of the mode is to damage the opponent's floor enough to break a hole into it, allowing the ball to drop through and score. When a team scores, the floor on the opponent's side of the field resets to normal, while the floor on the scoring team's side retains any existing damage.
              - superscript [ref=f16e435]:
                - link "[19]" [ref=f16e436] [cursor=pointer]:
                  - /url: "#cite_note-23"
              - superscript [ref=f16e437]:
                - link "[20]" [ref=f16e438] [cursor=pointer]:
                  - /url: "#cite_note-24"
            - paragraph [ref=f16e439]:
              - text: Psyonix also released a number of limited-time modes for the game. Spike Rush, released as part of the Radical Summer event in 2019, resembles
              - link "rugby" [ref=f16e440] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Rugby_football
              - text: . The spikes power-up will attach the ball to a player's vehicle once it is touched. Players must avoid contacting any opposing player as it results in instant demolition.
              - superscript [ref=f16e441]:
                - link "[21]" [ref=f16e442] [cursor=pointer]:
                  - /url: "#cite_note-25"
              - text: In celebration of
              - link "Super Bowl LV" [ref=f16e443] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Super_Bowl_LV
              - text: in February 2021, Psyonix released a limited time gamemode called Gridiron, which functions similar to
              - link "gridiron football" [ref=f16e444] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Gridiron_football
              - text: with the normal soccer ball being replaced by a football.
              - superscript [ref=f16e445]:
                - link "[22]" [ref=f16e446] [cursor=pointer]:
                  - /url: "#cite_note-26"
              - text: A new game mode was added called Knockout was added in 2022. It is played Free-For-All, without teams, in a set of newly added arenas that have no goals. The object of the mode is to knock opponents into Hazards, features that destroy the player on contact, in order to take away one of three lives. This can be achieved using the three actions the player can take, Attack, Block, and Grab, operating similarly to Rock, Paper, and Scissors respectively in
              - link "Rock Paper Scissors" [ref=f16e447] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Rock_paper_scissors
              - text: . After a 6 minutes, if a winner has not yet been decided by being the only remaining player with one or more lives, the match enters Sudden KO mode, where all actions are much more powerful and exiting a safe zone around the map removes a life.
              - superscript [ref=f16e448]:
                - link "[23]" [ref=f16e449] [cursor=pointer]:
                  - /url: "#cite_note-27"
            - paragraph [ref=f16e450]:
              - text: As part of a means to monetize the game beyond downloadable content, Psyonix has tried a few different approaches. In September 2016, it introduced a
              - link "loot box" [ref=f16e451] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Loot_box
              - text: system known as Crates, where players could purchase them with a random selection of in-game customization items, opened through the purchase of Keys using real-world funds.
              - superscript [ref=f16e452]:
                - link "[16]" [ref=f16e453] [cursor=pointer]:
                  - /url: "#cite_note-vg247_201608-20"
              - text: Due to increasing governmental concern over loot boxes, Psyonix replaced the Crates system with Blueprints in December 2019, which offer a known specific item with potential modifiers as potential end-of-match drops.
              - superscript [ref=f16e454]:
                - link "[24]" [ref=f16e455] [cursor=pointer]:
                  - /url: "#cite_note-28"
              - text: These Blueprints can then be crafted using the game's new premium currency (Credits),
              - superscript [ref=f16e456]:
                - link "[25]" [ref=f16e457] [cursor=pointer]:
                  - /url: "#cite_note-29"
              - text: or purchased with real-world funds, if the player so chooses.
              - superscript [ref=f16e458]:
                - link "[26]" [ref=f16e459] [cursor=pointer]:
                  - /url: "#cite_note-30"
              - superscript [ref=f16e460]:
                - link "[27]" [ref=f16e461] [cursor=pointer]:
                  - /url: "#cite_note-31"
              - text: A new rotating Item Shop was introduced in December 2019 as well, with Featured items available on a 48-hour timer and Daily items on a 24-hour timer. The Item Shop includes all types of in-game items, such as Painted Cars, Exotic Wheels, Goal Explosions, and many more. Each item has a listed Credit value that will show the item's cost, allowing players to purchase the exact item they want, instead of relying on
              - link "RNG" [ref=f16e462] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Random_number_generation
              - text: to attain a specific item previously available through loot boxes.
              - superscript [ref=f16e463]:
                - link "[28]" [ref=f16e464] [cursor=pointer]:
                  - /url: "#cite_note-32"
              - text: Separately, Psyonix added a
              - link "battle pass" [ref=f16e465] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Battle_pass
              - text: feature to the game in September 2018, known as the Rocket Pass. Each pass, which lasts a few months, has challenges and other opportunities through playing Rocket League that allow players to increase the tier of the Pass, from which new unique customization options tied to that pass can be unlocked. While the Rocket Pass is free to all players, a flat-cost premium option that accelerates the level up rate and unlocks additional items at certain tier levels can be purchased.
              - superscript [ref=f16e466]:
                - link "[29]" [ref=f16e467] [cursor=pointer]:
                  - /url: "#cite_note-eurogamer_mid2018_updates-33"
              - superscript [ref=f16e468]:
                - link "[30]" [ref=f16e469] [cursor=pointer]:
                  - /url: "#cite_note-34"
          - region [ref=f16e470]:
            - heading "Development" [level=2] [ref=f16e472]
            - generic [ref=f16e474]:
              - generic [ref=f16e475]:
                - link [ref=f16e479] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Supersonic_Acrobatic_Rocket-Powered_Battle-Cars,_Stadium.jpg
                  - img "Airborne cars above a football pitch attempting to hit a ball situated beneath them" [ref=f16e480]
                - link [ref=f16e484] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Rocket_League,_DHF_Stadium.jpg
                  - img "A car sits idly on a football pitch as another flies above him, following an explosion at the goal posts" [ref=f16e485]
              - generic [ref=f16e487]:
                - text: Psyonix's
                - link "Supersonic Acrobatic Rocket-Powered Battle-Cars" [ref=f16e489] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Supersonic_Acrobatic_Rocket-Powered_Battle-Cars
                - text: (left) immediately preceded and inspired the development of Rocket League (right), which would make vast improvements upon Battle-Cars
                - generic [ref=f16e490]: "'"
                - text: gameplay and online features.
            - paragraph [ref=f16e491]:
              - text: Psyonix had previously developed
              - link "Supersonic Acrobatic Rocket-Powered Battle-Cars" [ref=f16e493] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Supersonic_Acrobatic_Rocket-Powered_Battle-Cars
              - text: in 2008 for the
              - link "PlayStation 3" [ref=f16e494] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/PlayStation_3
              - text: . That game itself bore out from previous
              - link "modifications" [ref=f16e495] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Mod_(video_gaming)
              - text: that Psyonix' founder, Dave Hagewood, had done for
              - link "Unreal Tournament 2003" [ref=f16e497] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Unreal_Tournament_2003
              - text: by expanding out vehicle-based gameplay that
              - link "Epic Games" [ref=f16e498] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Epic_Games
              - text: had already set in place in the engine into a new game mode called Onslaught.
              - superscript [ref=f16e499]:
                - link "[31]" [ref=f16e500] [cursor=pointer]:
                  - /url: "#cite_note-eurogamer_history-35"
              - text: For this, Hagewood was hired as a contractor by Epic for
              - link "Unreal Tournament 2004" [ref=f16e502] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Unreal_Tournament_2004
              - text: specifically for incorporating the Onslaught mode as an official part of the game.
              - superscript [ref=f16e503]:
                - link "[32]" [ref=f16e504] [cursor=pointer]:
                  - /url: "#cite_note-gamasutra_history-36"
              - text: Hagewood used his experience at Epic to found Psyonix. Among other contract projects, Psyonix worked to try to find a way to make racing the Unreal vehicles in a physics-based engine enjoyable. They had toyed with several options such as race modes or mazes, but found that when they added a ball to the arena to be pushed by the vehicles, they had hit upon the right formula, which would become Battle-Cars.
              - superscript [ref=f16e505]:
                - link "[32]" [ref=f16e506] [cursor=pointer]:
                  - /url: "#cite_note-gamasutra_history-36"
              - text: Further to the success was the addition of the rocket-powered cars; this originally was to be a simple speed boost, but with the physics engine, they were able to have the vehicles fly off and around the arena, furthering the possibilities for gameplay.
              - superscript [ref=f16e507]:
                - link "[32]" [ref=f16e508] [cursor=pointer]:
                  - /url: "#cite_note-gamasutra_history-36"
              - superscript [ref=f16e509]:
                - link "[33]" [ref=f16e510] [cursor=pointer]:
                  - /url: "#cite_note-37"
            - paragraph [ref=f16e511]:
              - text: As Psyonix finished development of Battle-Cars, the studio had tried to gain access to a publisher by selling their game as "soccer, but with rocket-powered cars"; none of the publishers seemed interested.
              - superscript [ref=f16e512]:
                - link "[32]" [ref=f16e513] [cursor=pointer]:
                  - /url: "#cite_note-gamasutra_history-36"
              - text: Ultimately, they opted to self-publish the game on the
              - link "PlayStation Network" [ref=f16e514] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/PlayStation_Network
              - text: with almost no marketing.
              - superscript [ref=f16e515]:
                - link "[34]" [ref=f16e516] [cursor=pointer]:
                  - /url: "#cite_note-wsj-38"
              - text: Though it was downloaded more than two million times, it was not considered very successful even after the studio cut the price.
              - superscript [ref=f16e517]:
                - link "[31]" [ref=f16e518] [cursor=pointer]:
                  - /url: "#cite_note-eurogamer_history-35"
              - superscript [ref=f16e519]:
                - link "[34]" [ref=f16e520] [cursor=pointer]:
                  - /url: "#cite_note-wsj-38"
              - text: The studio continued on to other projects, though kept the idea of building on Battle-Cars as an option, recognizing the game had a small but dedicated fan-base that provided them with ideas for expansion.
              - superscript [ref=f16e521]:
                - link "[31]" [ref=f16e522] [cursor=pointer]:
                  - /url: "#cite_note-eurogamer_history-35"
              - superscript [ref=f16e523]:
                - link "[32]" [ref=f16e524] [cursor=pointer]:
                  - /url: "#cite_note-gamasutra_history-36"
              - text: These other projects, which including contract work for
              - link "AAA games" [ref=f16e525] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/AAA_games
              - text: ", including"
              - link "Mass Effect 3" [ref=f16e527] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Mass_Effect_3
              - text: ", helped to fund the development of Rocket League."
              - superscript [ref=f16e528]:
                - link "[35]" [ref=f16e529] [cursor=pointer]:
                  - /url: "#cite_note-PC_Gamer-39"
            - paragraph [ref=f16e530]:
              - text: Full development of Rocket League started around 2013 and took around two years and under $2 million to develop, though they had tested various prototypes of a Battle-Cars sequel in the years prior, including an unsuccessful attempt at pitching the game's idea to
              - link "Electronic Arts" [ref=f16e531] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Electronic_Arts
              - text: in 2011.
              - superscript [ref=f16e532]:
                - link "[34]" [ref=f16e533] [cursor=pointer]:
                  - /url: "#cite_note-wsj-38"
              - superscript [ref=f16e534]:
                - link "[36]" [ref=f16e535] [cursor=pointer]:
                  - /url: "#cite_note-eurogamer_success-40"
              - superscript [ref=f16e536]:
                - link "[37]" [ref=f16e537] [cursor=pointer]:
                  - /url: "#cite_note-41"
              - text: Psyonix used some of the feedback from Battle-Cars to fine-tune the gameplay in Rocket League. A key requirement for Psyonix was to increase the game's
              - link "frame rate" [ref=f16e538] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Frame_rate
              - text: from 30 to 60 frames-per-second, a known criticism from Battle-Cars and essential for newer hardware, according to Corey Davis, the design director at Psyonix.
              - superscript [ref=f16e539]:
                - link "[38]" [ref=f16e540] [cursor=pointer]:
                  - /url: "#cite_note-gamasutra_gdc2016-42"
              - text: Hagewood recognized that Battle-Cars was considered "too hardcore" with the game becoming too inaccessible to novice players against skilled ones.
              - superscript [ref=f16e541]:
                - link "[39]" [ref=f16e542] [cursor=pointer]:
                  - /url: "#cite_note-guardian_history-43"
              - text: They eased up on some aspects to make it more approachable, such as by slowing the pace of the game and allowing players of all skill levels to reasonably compete against each other while promoting team-based gameplay.
              - superscript [ref=f16e543]:
                - link "[32]" [ref=f16e544] [cursor=pointer]:
                  - /url: "#cite_note-gamasutra_history-36"
              - superscript [ref=f16e545]:
                - link "[39]" [ref=f16e546] [cursor=pointer]:
                  - /url: "#cite_note-guardian_history-43"
              - text: Though they tried to add elements like
              - link "power-ups" [ref=f16e547] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Power-up
              - text: ", they found these to be too distracting to gameplay."
              - superscript [ref=f16e548]:
                - link "[31]" [ref=f16e549] [cursor=pointer]:
                  - /url: "#cite_note-eurogamer_history-35"
              - text: They also explored other changes such as making the game more gritty, akin to
              - link "Monday Night Combat" [ref=f16e551] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Monday_Night_Combat
              - text: ", developing several"
              - link "mini-games" [ref=f16e552] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Mini-game
              - text: related to handling of the car, working on making the graphics give a sense of
              - link "scale" [ref=f16e553] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Scale_(ratio)
              - text: to the players to give the impression they were controlling full-sized vehicles rather than
              - link "radio-controlled cars" [ref=f16e554] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Radio-controlled_car
              - text: ", and creating an"
              - link "open world" [ref=f16e555] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Open_world
              - text: structure where the player would drive between stadium and stadium to participate in matches.
              - superscript [ref=f16e556]:
                - link "[36]" [ref=f16e557] [cursor=pointer]:
                  - /url: "#cite_note-eurogamer_success-40"
              - superscript [ref=f16e558]:
                - link "[38]" [ref=f16e559] [cursor=pointer]:
                  - /url: "#cite_note-gamasutra_gdc2016-42"
              - superscript [ref=f16e560]:
                - link "[40]" [ref=f16e561] [cursor=pointer]:
                  - /url: "#cite_note-rps_sept2015-44"
              - text: Instead, the team opted to strip the game to its core, focusing on more visual elements to enhance the title.
              - superscript [ref=f16e562]:
                - link "[31]" [ref=f16e563] [cursor=pointer]:
                  - /url: "#cite_note-eurogamer_history-35"
              - text: From Battle-Cars, Psyonix recognized very few players actually went online, and developed Rocket League
              - generic [ref=f16e564]: "'s"
              - text: single-player season mode to encourage players to try online matches once they completed it.
              - superscript [ref=f16e565]:
                - link "[40]" [ref=f16e566] [cursor=pointer]:
                  - /url: "#cite_note-rps_sept2015-44"
            - figure "Corey Davis, Rocket League's design manager, giving a presentation at GDC 2016" [ref=f16e567]:
              - link [ref=f16e568] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/File:Rocket_League_at_GDC_2016_(25290258093).jpg
              - generic [ref=f16e570]:
                - text: Corey Davis, Rocket League
                - generic [ref=f16e571]: "'s"
                - text: design manager, giving a presentation at
                - link "GDC 2016" [ref=f16e572] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Game_Developers_Conference
            - paragraph [ref=f16e573]:
              - text: Psyonix's team were aware of past difficulties that they had with Battle-Cars and other racing games with online play and
              - link "client-side prediction" [ref=f16e574] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Client-side_prediction
              - text: ", and the issues that would arise from that with Rocket League"
              - generic [ref=f16e575]: "'s"
              - text: fast-paced play style. To solve this, the physics in the game are based on using the
              - link "Bullet physics engine" [ref=f16e576] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Bullet_(software)
              - text: within the
              - link "Unreal Engine 3" [ref=f16e577] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Unreal_Engine_3
              - text: "'s"
              - link "PhysX" [ref=f16e578] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/PhysX
              - text: engine, which tracks the movement of all the cars and actors, allowing them to periodically re-synchronize the game state across players based on the stored physics states, which enabled players to have quick reactions from their client.
              - superscript [ref=f16e579]:
                - link "[40]" [ref=f16e580] [cursor=pointer]:
                  - /url: "#cite_note-rps_sept2015-44"
              - text: At the time of Battle-Cars, Psyonix could not afford a dedicated server network and were forced to rely on individual hosts, which could lead to poor performance with slow Internet connections. With Rocket League, Psyonix was able to put a dedicated server network in place, writing their own service protocols to interface with Sony's and Valve's online services so as to enable cross-platform play, as well as improving matchmaking capabilities.
              - superscript [ref=f16e581]:
                - link "[32]" [ref=f16e582] [cursor=pointer]:
                  - /url: "#cite_note-gamasutra_history-36"
              - superscript [ref=f16e583]:
                - link "[38]" [ref=f16e584] [cursor=pointer]:
                  - /url: "#cite_note-gamasutra_gdc2016-42"
              - text: Psyonix's previous experience in contract work for AAA games had exposed them to the larger developers' approach to release and quality control, and they were able to apply those principles and aim for the same level of quality requirements in the final release of Rocket League.
              - superscript [ref=f16e585]:
                - link "[39]" [ref=f16e586] [cursor=pointer]:
                  - /url: "#cite_note-guardian_history-43"
            - paragraph [ref=f16e587]:
              - text: Psyonix had at one point considered having Rocket League as a
              - link "free-to-play" [ref=f16e588] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Free-to-play
              - text: game with
              - link "microtransactions" [ref=f16e589] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Microtransaction
              - text: ", inspired by"
              - link "Team Fortress 2" [ref=f16e591] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Team_Fortress_2
              - text: and
              - link "Dota 2" [ref=f16e593] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Dota_2
              - generic [ref=f16e594]: "'s"
              - text: models.
              - superscript [ref=f16e595]:
                - link "[36]" [ref=f16e596] [cursor=pointer]:
                  - /url: "#cite_note-eurogamer_success-40"
              - text: Though they had put in efforts to establish a free-to-play model, Psyonix decided instead to switch to a traditional sale method, and offer only cosmetic elements as
              - link "downloadable content" [ref=f16e597] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Downloadable_content
              - text: ", assuring that no players would have any additional advantage beyond their own skill."
              - superscript [ref=f16e598]:
                - link "[38]" [ref=f16e599] [cursor=pointer]:
                  - /url: "#cite_note-gamasutra_gdc2016-42"
              - text: The name Rocket League was selected in part to reduce the size of the game's title in order to appear fully in digital storefronts, and also served to be an easier to remember name as well as a more mature-sounding title than Battle-Cars, according to Hagewood;
              - superscript [ref=f16e600]:
                - link "[31]" [ref=f16e601] [cursor=pointer]:
                  - /url: "#cite_note-eurogamer_history-35"
              - text: speaking on Rocket League
              - generic [ref=f16e602]: "'s"
              - text: development in March 2016, Davis opined that
              - link "Supersonic Acrobatic Rocket-Powered Battle-Cars" [ref=f16e604] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Supersonic_Acrobatic_Rocket-Powered_Battle-Cars
              - text: was "the worst game name of all time".
              - superscript [ref=f16e605]:
                - link "[38]" [ref=f16e606] [cursor=pointer]:
                  - /url: "#cite_note-gamasutra_gdc2016-42"
            - region [ref=f16e607]:
              - heading "Cross-platform play" [level=3] [ref=f16e609]
              - paragraph [ref=f16e610]:
                - text: Rocket League has been one of the leading games in supporting
                - link "cross-platform play" [ref=f16e611] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cross-platform_play
                - text: between personal computers and consoles. Jeremy Dunham, Psyonix's vice president of publishing, says cross-platform play helps establish a stable player base and avoid the snowball effect that can cause isolated player bases on individual platforms to wane, particularly in the transition from one console generation to the next.
                - superscript [ref=f16e612]:
                  - link "[41]" [ref=f16e613] [cursor=pointer]:
                    - /url: "#cite_note-gamespot_interview-45"
                - superscript [ref=f16e614]:
                  - link "[42]" [ref=f16e615] [cursor=pointer]:
                    - /url: "#cite_note-engadget_crossplatform-46"
                - text: Though the Xbox One version lacked this feature at launch,
                - superscript [ref=f16e616]:
                  - link "[43]" [ref=f16e617] [cursor=pointer]:
                    - /url: "#cite_note-Pereira-47"
                - text: Microsoft in March 2016 announced that Rocket League would be the first game in a new initiative they were taking to enable cross-play between Windows and Xbox One players who have Xbox Live accounts;
                - superscript [ref=f16e618]:
                  - link "[44]" [ref=f16e619] [cursor=pointer]:
                    - /url: "#cite_note-polygon_xbox_xplay-48"
                - text: this cross-platform play feature was added in an update in May 2016.
                - superscript [ref=f16e620]:
                  - link "[44]" [ref=f16e621] [cursor=pointer]:
                    - /url: "#cite_note-polygon_xbox_xplay-48"
                - superscript [ref=f16e622]:
                  - link "[45]" [ref=f16e623] [cursor=pointer]:
                    - /url: "#cite_note-49"
                - text: Microsoft has stated that they offer other networks, such as Sony's PlayStation Network, the ability to integrate with Xbox Live to allow full cross-platform compatibility for games like Rocket League. Dunham noted that this cross-platform idea had been something they asked Microsoft about when Rocket League was set for an Xbox One release, but he stated that Microsoft did not seem to be on board with it. Only after they had neared the release date would Microsoft take the initiative to offer it as one for their new cross-play efforts and started working towards this possibility in the game.
                - superscript [ref=f16e624]:
                  - link "[46]" [ref=f16e625] [cursor=pointer]:
                    - /url: "#cite_note-ign_july2016-50"
              - figure "Crossplay platforms" [ref=f16e626]:
                - link [ref=f16e627] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Xbox_One_Controller_next_to_a_Playstation_4_Controller.jpg
              - paragraph [ref=f16e630]:
                - text: Psyonix determined the required technical steps needed to enable cross-platform play and have tested it in closed environments, and were only waiting for the legalities of cross-connecting players between different networks before proceeding.
                - superscript [ref=f16e631]:
                  - link "[47]" [ref=f16e632] [cursor=pointer]:
                    - /url: "#cite_note-51"
                - superscript [ref=f16e633]:
                  - link "[42]" [ref=f16e634] [cursor=pointer]:
                    - /url: "#cite_note-engadget_crossplatform-46"
                - text: this work also includes how they would be able to distribute updated content patches in a unified and more frequent manner to enable them to continue to expand the game for at least another 9 months.
                - superscript [ref=f16e635]:
                  - link "[41]" [ref=f16e636] [cursor=pointer]:
                    - /url: "#cite_note-gamespot_interview-45"
                - text: In a July 2016 interview with
                - link "IGN" [ref=f16e638] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/IGN
                - text: ", Dunham stated they had done all the technical work and could enable cross-platform play between the Xbox One and PlayStation 4 versions \"within a few hours\" of Sony's approval."
                - superscript [ref=f16e639]:
                  - link "[48]" [ref=f16e640] [cursor=pointer]:
                    - /url: "#cite_note-52"
                - text: As of March 2017, the company is ready to enable this feature, but was still waiting for the console manufacturers to come to the required agreements to allow it.
                - superscript [ref=f16e641]:
                  - link "[49]" [ref=f16e642] [cursor=pointer]:
                    - /url: "#cite_note-ign_mar17_future-53"
              - paragraph [ref=f16e643]:
                - text: With the announcement of the Switch version, Psyonix affirmed that it would support cross-platform play with PC and Xbox users. Sony still opted not to participate in this; PlayStation global marketing head Jim Ryan said that while they are "open to conversations with any developer or publisher who wants to talk about it", their decision was "a commercial discussion between ourselves and other stakeholders".
                - superscript [ref=f16e644]:
                  - link "[50]" [ref=f16e645] [cursor=pointer]:
                    - /url: "#cite_note-54"
                - text: Dunham says that in contrast to
                - link "Microsoft" [ref=f16e646] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Microsoft
                - text: or
                - link "Nintendo" [ref=f16e647] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Nintendo
                - text: ", who agreed to allow cross-platform play within a month and with the day of Psyonix' request, respectively, Sony has been asked on a nearly daily basis about this support and have yet to receive any definitive answer."
                - superscript [ref=f16e648]:
                  - link "[42]" [ref=f16e649] [cursor=pointer]:
                    - /url: "#cite_note-engadget_crossplatform-46"
                - text: The cross-platform party feature is planned for an update in early 2019.
                - superscript [ref=f16e650]:
                  - link "[51]" [ref=f16e651] [cursor=pointer]:
                    - /url: "#cite_note-55"
                - text: "This will allow players to create in-game friend lists across platforms and play in matches with them. This is limited by the current cross-platform limitations: while Windows players can add friends from other Windows users and Xbox One, PlayStation 4, and Switch users, PlayStation 4 users are limited to Windows and PlayStation 4 users."
                - superscript [ref=f16e652]:
                  - link "[29]" [ref=f16e653] [cursor=pointer]:
                    - /url: "#cite_note-eurogamer_mid2018_updates-33"
              - paragraph [ref=f16e654]:
                - text: In September 2018, Sony had altered its position on cross-platform play following the release of
                - link "Fortnite Battle Royale" [ref=f16e656] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fortnite_Battle_Royale
                - text: for the Nintendo Switch, where the lack of cross-platform play had been a point of significant criticism. Sony allowed Fortnite to be cross-platform play compatible with all platforms and stated they would review other games on a case-by-case basis.
                - superscript [ref=f16e657]:
                  - link "[52]" [ref=f16e658] [cursor=pointer]:
                    - /url: "#cite_note-56"
                - text: By January 2019, Psyonix announced that Sony had granted the same for Rocket League, allowing cross-platform play between the PlayStation 4, Xbox One, Switch, and PC versions in February 2019.
                - superscript [ref=f16e659]:
                  - link "[53]" [ref=f16e660] [cursor=pointer]:
                    - /url: "#cite_note-57"
                - superscript [ref=f16e661]:
                  - link "[54]" [ref=f16e662] [cursor=pointer]:
                    - /url: "#cite_note-58"
            - region [ref=f16e663]:
              - heading "Downloadable content" [level=3] [ref=f16e665]
              - figure [ref=f16e666]:
                - link [ref=f16e667] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Rocket_League,_Dunk_House.jpg
                - generic [ref=f16e669]:
                  - text: The "Hoops" mode in Rocket League, one of the many updates to the game after its release, has players shoot the ball into a
                  - link "basket" [ref=f16e670] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Backboard_(basketball)
                  - text: instead of a goal.
              - paragraph [ref=f16e671]:
                - text: Psyonix planned to continue to support Rocket League with
                - link "downloadable content" [ref=f16e672] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Downloadable_content
                - text: (DLC), intending to keep all gameplay updates free and only charging for cosmetic items.
                - superscript [ref=f16e673]:
                  - link "[55]" [ref=f16e674] [cursor=pointer]:
                    - /url: "#cite_note-polygon_june2016-59"
                - text: In November 2015, a free update added the ability to Mutate a match, allowing for a number of different custom presets and match settings, including a low gravity mode and a cubed ball, among other improvements and additions.
                - superscript [ref=f16e675]:
                  - link "[8]" [ref=f16e676] [cursor=pointer]:
                    - /url: "#cite_note-Mutate-12"
                - text: Through this, Psyonix is able to offer custom game playlists to test out new modes or for holiday-themed events. For example, during the latter part of December 2015, Psyonix introduced an
                - link "ice hockey" [ref=f16e677] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ice_hockey
                - text: "-based mutation alongside a special event featuring holiday-themed decorative items, replacing the normal ball with a"
                - link "hockey puck" [ref=f16e678] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Hockey_puck
                - text: ", and changing the floor to ice."
                - superscript [ref=f16e679]:
                  - link "[8]" [ref=f16e680] [cursor=pointer]:
                    - /url: "#cite_note-Mutate-12"
                - superscript [ref=f16e681]:
                  - link "[9]" [ref=f16e682] [cursor=pointer]:
                    - /url: "#cite_note-Hockey-13"
                - superscript [ref=f16e683]:
                  - link "[56]" [ref=f16e684] [cursor=pointer]:
                    - /url: "#cite_note-60"
                - text: This mode proved very popular and was permanently added to the standard playlists on February 24, 2016.
                - superscript [ref=f16e685]:
                  - link "[57]" [ref=f16e686] [cursor=pointer]:
                    - /url: "#cite_note-61"
                - text: In February 2016, a new game playlist called Rocket Labs was added to offer new experimental maps to players as a means to gauge feedback and interest in a map before adding it to the game's standard map playlist.
                - superscript [ref=f16e687]:
                  - link "[58]" [ref=f16e688] [cursor=pointer]:
                    - /url: "#cite_note-62"
                - text: In April 2016, the developers added the
                - link "basketball" [ref=f16e689] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Basketball
                - text: "-based playlist to the standard playlists."
                - superscript [ref=f16e690]:
                  - link "[14]" [ref=f16e691] [cursor=pointer]:
                    - /url: "#cite_note-gamespot_hoops-18"
                - text: A new Rumble mode, which adds unique
                - link "power-ups" [ref=f16e692] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Power-up
                - text: on various maps, was released in September 2016.
                - superscript [ref=f16e693]:
                  - link "[39]" [ref=f16e694] [cursor=pointer]:
                    - /url: "#cite_note-guardian_history-43"
                - superscript [ref=f16e695]:
                  - link "[59]" [ref=f16e696] [cursor=pointer]:
                    - /url: "#cite_note-rps_rumble-63"
              - paragraph [ref=f16e697]:
                - text: The game's first DLC pack, titled Supersonic Fury, was released in August 2015, along with new arena Utopia Coliseum.
                - superscript [ref=f16e698]:
                  - link "[60]" [ref=f16e699] [cursor=pointer]:
                    - /url: "#cite_note-64"
                - text: It contains exclusive cosmetics, including two new cars, rocket boosts, wheels, five paint finishes, and twelve decals for both new cars. The same month, it was announced that Rocket League would be ported to
                - link "macOS" [ref=f16e700] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/MacOS
                - text: and
                - link "Linux" [ref=f16e701] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Linux
                - text: later that year, in order to run natively with
                - link "SteamOS" [ref=f16e702] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/SteamOS
                - text: hardware; Rocket League and
                - link "Portal 2" [ref=f16e704] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Portal_2
                - text: were part of incentives for those that pre-ordered a
                - link "Steam Link" [ref=f16e705] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Steam_Link
                - text: ", a"
                - link "Steam Controller" [ref=f16e706] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Steam_Controller_(1st_generation)
                - text: ", or a"
                - link "Steam Machine" [ref=f16e707] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Steam_Machines
                - text: .
                - superscript [ref=f16e708]:
                  - link "[61]" [ref=f16e709] [cursor=pointer]:
                    - /url: "#cite_note-Ports-65"
                - superscript [ref=f16e710]:
                  - link "[62]" [ref=f16e711] [cursor=pointer]:
                    - /url: "#cite_note-66"
                - text: The game's second DLC pack, titled Revenge of the Battle-Cars, was released in October 2015.
                - superscript [ref=f16e712]:
                  - link "[63]" [ref=f16e713] [cursor=pointer]:
                    - /url: "#cite_note-67"
                - text: The DLC adds two more cars from
                - link "Supersonic Acrobatic Rocket-Powered Battle-Cars" [ref=f16e715] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Supersonic_Acrobatic_Rocket-Powered_Battle-Cars
                - text: ", along with exclusive cosmetics for both. In another event, players had a chance to collect six"
                - link "Halloween" [ref=f16e716] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Halloween
                - text: "-themed items from October 18 to November 2."
                - superscript [ref=f16e717]:
                  - link "[64]" [ref=f16e718] [cursor=pointer]:
                    - /url: "#cite_note-68"
                - text: The game's third DLC pack, titled Chaos Run, was released in December 2015. The DLC added two more cars, along with more cosmetics. A new arena, called "Wasteland", was released for free alongside the DLC. The map is notable for being the first non-standard arena to be released, having a different size and shape than the others and inspired by the
                - link "Mad Max" [ref=f16e720] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Mad_Max
                - text: films, the first of which Psyonix plans to release over time.
                - superscript [ref=f16e721]:
                  - link "[65]" [ref=f16e722] [cursor=pointer]:
                    - /url: "#cite_note-69"
                - superscript [ref=f16e723]:
                  - link "[66]" [ref=f16e724] [cursor=pointer]:
                    - /url: "#cite_note-psblog_chaosrun-70"
              - paragraph [ref=f16e725]:
                - text: In June 2016, a new arena, Neo Tokyo, based on the Rocket Labs layout Underpass, was added to the game via an update. The update also introduced cosmetic items awarded at the end of matches with various rarity grades, and gave players the ability to trade multiple items of the same type and rarity grade to obtain an item of a better rarity grade. Also included in the patch are a number of painted and certified items, the latter of which are cosmetic items with statistics-recording tags, and eight new achievements.
                - superscript [ref=f16e726]:
                  - link "[67]" [ref=f16e727] [cursor=pointer]:
                    - /url: "#cite_note-71"
                - superscript [ref=f16e728]:
                  - link "[68]" [ref=f16e729] [cursor=pointer]:
                    - /url: "#cite_note-72"
                - text: Psyonix added the ability for players to trade items with other players within the "Rumble" update, including item and crate drop systems comparable to Team Fortress 2 and
                - 'link "Counter-Strike: Global Offensive" [ref=f16e731] [cursor=pointer]':
                  - /url: https://en.wikipedia.org/wiki/Counter-Strike:_Global_Offensive
                - text: ", in which players have the chance to gain locked crates from playing in competitive matches. Players are able to purchase keys to open these crates through"
                - link "microtransactions" [ref=f16e732] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Microtransaction
                - text: ", revealing special decorative items for their cars."
                - superscript [ref=f16e733]:
                  - link "[59]" [ref=f16e734] [cursor=pointer]:
                    - /url: "#cite_note-rps_rumble-63"
                - text: Players can opt-out of this feature to disable crate drops. Though items received in crates are tradable within the game, these items cannot be sold on the platform's respective marketplaces so as to prevent issues in the same vein as the
                - link "Counter-Strike skin gambling controversy" [ref=f16e735] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Skin_gambling
                - text: .
                - superscript [ref=f16e736]:
                  - link "[59]" [ref=f16e737] [cursor=pointer]:
                    - /url: "#cite_note-rps_rumble-63"
                - superscript [ref=f16e738]:
                  - link "[69]" [ref=f16e739] [cursor=pointer]:
                    - /url: "#cite_note-73"
                - text: The funds from microtransactions would be used to support the esports tournaments organized by Psyonix.
                - superscript [ref=f16e740]:
                  - link "[59]" [ref=f16e741] [cursor=pointer]:
                    - /url: "#cite_note-rps_rumble-63"
                - text: In October 2016, a major update titled "Aquadome" launched, featuring a new arena placed under the sea, along with two new premium water-themed cars, and a new crate containing new items and seven new achievements.
                - superscript [ref=f16e742]:
                  - link "[70]" [ref=f16e743] [cursor=pointer]:
                    - /url: "#cite_note-74"
              - paragraph [ref=f16e744]:
                - text: Psyonix was able to make licensing agreements to include vehicles and decorative items from other franchises within the game. On launch, the PlayStation 4 version included
                - link "Sweet Tooth" [ref=f16e745] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Sweet_Tooth_(Twisted_Metal)
                - text: "'s car from the"
                - link "Twisted Metal" [ref=f16e747] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Twisted_Metal
                - text: series.
                - superscript [ref=f16e748]:
                  - link "[71]" [ref=f16e749] [cursor=pointer]:
                    - /url: "#cite_note-75"
                - text: As a separate DLC, the
                - link "DeLorean time machine" [ref=f16e750] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/DeLorean_time_machine
                - text: from the
                - link "Back to the Future" [ref=f16e752] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Back_to_the_Future_(franchise)
                - text: film franchise, was released on October 21, 2015, corresponding with
                - link "Back to the Future Day" [ref=f16e753] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Back_to_the_Future_Day
                - text: .
                - superscript [ref=f16e754]:
                  - link "[72]" [ref=f16e755] [cursor=pointer]:
                    - /url: "#cite_note-76"
                - text: The Xbox One release includes platform-exclusive
                - link "Gears of War" [ref=f16e757] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Gears_of_War
                - text: and
                - link "Halo" [ref=f16e759] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Halo_(series)
                - text: "-themed vehicles."
                - superscript [ref=f16e760]:
                  - link "[73]" [ref=f16e761] [cursor=pointer]:
                    - /url: "#cite_note-xbox_release-77"
                - text: The
                - link "Nintendo Switch" [ref=f16e762] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Nintendo_Switch
                - text: version, meanwhile, received platform-exclusive cars inspired by Nintendo's
                - link "Super Mario" [ref=f16e764] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Super_Mario
                - text: and
                - link "Metroid" [ref=f16e766] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Metroid_(series)
                - text: series.
                - superscript [ref=f16e767]:
                  - link "[74]" [ref=f16e768] [cursor=pointer]:
                    - /url: "#cite_note-78"
                - text: The
                - link "Batmobile" [ref=f16e769] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Batmobile
                - text: ", as seen in the 2016 film"
                - 'link "Batman v Superman: Dawn of Justice" [ref=f16e771] [cursor=pointer]':
                  - /url: https://en.wikipedia.org/wiki/Batman_v_Superman:_Dawn_of_Justice
                - text: ", was offered as a playable vehicle in March 2016,"
                - superscript [ref=f16e772]:
                  - link "[75]" [ref=f16e773] [cursor=pointer]:
                    - /url: "#cite_note-79"
                - text: while
                - link "Dominic Toretto" [ref=f16e774] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Dominic_Toretto
                - text: "'s"
                - link "Dodge Charger" [ref=f16e775] [cursor=pointer]:
