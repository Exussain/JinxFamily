                - text: ", and"
                - link "Star Wars" [ref=f16e798] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Star_Wars
                - text: .
                - superscript [ref=f16e799]:
                  - link "[79]" [ref=f16e800] [cursor=pointer]:
                    - /url: "#cite_note-83"
              - paragraph [ref=f16e801]:
                - text: In September 2015, Psyonix held a cross-promotion with
                - link "Torn Banner Studios" [ref=f16e802] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Torn_Banner_Studios
                - text: ", adding two free new flags themed after Torn Banner's"
                - 'link "Chivalry: Medieval Warfare" [ref=f16e804] [cursor=pointer]':
                  - /url: https://en.wikipedia.org/wiki/Chivalry:_Medieval_Warfare
                - text: .
                - superscript [ref=f16e805]:
                  - link "[80]" [ref=f16e806] [cursor=pointer]:
                    - /url: "#cite_note-84"
                - text: At the same time the "Chaos Run" DLC was released, Psyonix added free cosmetics and accessories from the
                - link "Portal series" [ref=f16e807] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Portal_(video_game_series)
                - text: by
                - link "Valve" [ref=f16e808] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Valve_Corporation
                - text: .
                - superscript [ref=f16e809]:
                  - link "[66]" [ref=f16e810] [cursor=pointer]:
                    - /url: "#cite_note-psblog_chaosrun-70"
                - superscript [ref=f16e811]:
                  - link "[81]" [ref=f16e812] [cursor=pointer]:
                    - /url: "#cite_note-85"
                - text: Themed content based on
                - link "Goat Simulator" [ref=f16e814] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Goat_Simulator
                - text: and
                - link "Euro Truck Simulator" [ref=f16e816] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Euro_Truck_Simulator
                - text: were added to the game in April 2016 as part of cross-promotional deals with those games.
                - superscript [ref=f16e817]:
                  - link "[82]" [ref=f16e818] [cursor=pointer]:
                    - /url: "#cite_note-gamespot_14m-86"
                - text: Other themed promotional content includes decorative items based on
                - link "The Witcher" [ref=f16e820] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/The_Witcher_(video_game)
                - text: and
                - link "Worms W.M.D" [ref=f16e822] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Worms_W.M.D
                - text: .
                - superscript [ref=f16e823]:
                  - link "[83]" [ref=f16e824] [cursor=pointer]:
                    - /url: "#cite_note-87"
                - text: With the release of the basketball game mode in 2016, Psyonix partnered with the
                - link "National Basketball Association" [ref=f16e825] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/National_Basketball_Association
                - text: (NBA), offering flags with all 30 NBA team logos as car customization items.
                - superscript [ref=f16e826]:
                  - link "[14]" [ref=f16e827] [cursor=pointer]:
                    - /url: "#cite_note-gamespot_hoops-18"
                - text: In February 2017, two iconic
                - link "Hot Wheels" [ref=f16e828] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Hot_Wheels
                - text: cars were added to the game, along with other cosmetic items based on the brand.
                - superscript [ref=f16e829]:
                  - link "[84]" [ref=f16e830] [cursor=pointer]:
                    - /url: "#cite_note-88"
                - superscript [ref=f16e831]:
                  - link "[85]" [ref=f16e832] [cursor=pointer]:
                    - /url: "#cite_note-89"
                - superscript [ref=f16e833]:
                  - link "[86]" [ref=f16e834] [cursor=pointer]:
                    - /url: "#cite_note-ps4pro-90"
              - paragraph [ref=f16e835]:
                - text: For the 2019 Radical Summer event, Psyonix released two new car packs; the
                - link "Ecto-1" [ref=f16e836] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ectomobile
                - text: from the
                - link "Ghostbusters" [ref=f16e838] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ghostbusters
                - text: film franchise in June, and the
                - link "KITT" [ref=f16e839] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/KITT
                - text: from the 1980s television series
                - link "Knight Rider" [ref=f16e841] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Knight_Rider_(1982_TV_series)
                - text: in July.
                - superscript [ref=f16e842]:
                  - link "[87]" [ref=f16e843] [cursor=pointer]:
                    - /url: "#cite_note-91"
                - superscript [ref=f16e844]:
                  - link "[88]" [ref=f16e845] [cursor=pointer]:
                    - /url: "#cite_note-92"
                - text: Psyonix had hoped to include KITT as early as 2016.
                - superscript [ref=f16e846]:
                  - link "[89]" [ref=f16e847] [cursor=pointer]:
                    - /url: "#cite_note-gamespot_salesfeb2016-93"
                - text: For the 2019 Halloween event, cars and other cosmetics based on the television series
                - link "Stranger Things" [ref=f16e849] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Stranger_Things
                - text: were added.
                - superscript [ref=f16e850]:
                  - link "[90]" [ref=f16e851] [cursor=pointer]:
                    - /url: "#cite_note-94"
                - text: In May 2020, Psyonix introduced the Modes of May event, which included a number of limited-time game modes for every weekend of the month.
                - superscript [ref=f16e852]:
                  - link "[91]" [ref=f16e853] [cursor=pointer]:
                    - /url: "#cite_note-95"
                - text: The modes include Dropshot Rumble, Beach Ball, Boomer Ball, and Heatseeker, which features a curving ball that magnetizes toward both ends of the field, drawing comparisons to the 1972 table tennis sports game
                - link "Pong" [ref=f16e854] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Pong
                - text: .
                - superscript [ref=f16e855]:
                  - link "[92]" [ref=f16e856] [cursor=pointer]:
                    - /url: "#cite_note-96"
            - region [ref=f16e857]:
              - heading "Music" [level=3] [ref=f16e859]
              - note [ref=f16e860]:
                - text: "Main article:"
                - link "Music of Rocket League" [ref=f16e861] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Music_of_Rocket_League
              - paragraph [ref=f16e862]:
                - text: The original soundtrack for Rocket League was released both physically and digitally on July 1, 2015.
                - superscript [ref=f16e863]:
                  - link "[93]" [ref=f16e864] [cursor=pointer]:
                    - /url: "#cite_note-97"
                - text: It contains original compositions by Psyonix sound designer
                - link "Mike Ault" [ref=f16e865] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Mike_Ault
                - text: ", as well as contributions by Ault's"
                - link "electronic music" [ref=f16e866] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Electronic_music
                - text: group, Hollywood Principle.
                - superscript [ref=f16e867]:
                  - link "[94]" [ref=f16e868] [cursor=pointer]:
                    - /url: "#cite_note-98"
                - text: New songs were added to the game with post-release updates, including "Chaos Run Theme" by
                - link "Kevin Riepl" [ref=f16e869] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Kevin_Riepl
                - text: ", \"Escape from LA (Instrumental)\" by Abandoned Carnival and Ault, and a remix of Hollywood Principle's \"Breathing Underwater\" by Ether. These songs were later compiled in the second volume of the soundtrack, which was released on July 7, 2016."
                - superscript [ref=f16e870]:
                  - link "[95]" [ref=f16e871] [cursor=pointer]:
                    - /url: "#cite_note-99"
                - link "iam8bit" [ref=f16e872] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Iam8bit
                - text: published a three-disc vinyl version of the soundtrack, consisting of the above two volumes, in late 2016.
                - superscript [ref=f16e873]:
                  - link "[96]" [ref=f16e874] [cursor=pointer]:
                    - /url: "#cite_note-100"
                - text: The game's 2nd anniversary update included a musical content pack featuring releases from the
                - link "EDM" [ref=f16e875] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Electronic_music
                - text: label
                - link "Monstercat" [ref=f16e876] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Monstercat
                - text: .
                - superscript [ref=f16e877]:
                  - link "[97]" [ref=f16e878] [cursor=pointer]:
                    - /url: "#cite_note-2nd-anni-101"
                - text: The label have also released a series of standalone albums featuring the music, titled Rocket League x Monstercat.
                - superscript [ref=f16e879]:
                  - link "[98]" [ref=f16e880] [cursor=pointer]:
                    - /url: "#cite_note-102"
                - superscript [ref=f16e881]:
                  - link "[99]" [ref=f16e882] [cursor=pointer]:
                    - /url: "#cite_note-103"
                - superscript [ref=f16e883]:
                  - link "[100]" [ref=f16e884] [cursor=pointer]:
                    - /url: "#cite_note-104"
            - region [ref=f16e885]:
              - heading "Rocket League Sideswipe" [level=3] [ref=f16e887]
              - note [ref=f16e888]:
                - text: "Main article:"
                - link "Rocket League Sideswipe" [ref=f16e889] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Rocket_League_Sideswipe
              - paragraph [ref=f16e890]:
                - text: Rocket League Sideswipe is a free
                - link "mobile game" [ref=f16e891] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Mobile_game
                - link "spin-off" [ref=f16e892] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Spin-off_(media)
                - text: by Psyonix released on
                - link "Android" [ref=f16e893] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Android_(operating_system)
                - text: and
                - link "iOS" [ref=f16e894] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/IOS
                - text: in late 2021. The game was announced in March 2021 and replicates the gameplay of the original game, but in a
                - link "two-dimensional space" [ref=f16e895] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/2D_computer_graphics
                - text: . Players compete in short 1-on-1 or 2-on-2 matches that are played online. They can also play volleyball, heatseeker, basketball or 3-on-3 matches.
                - superscript [ref=f16e896]:
                  - link "[101]" [ref=f16e897] [cursor=pointer]:
                    - /url: "#cite_note-105"
            - region [ref=f16e898]:
              - heading "Rocket Racing" [level=3] [ref=f16e900]
              - paragraph [ref=f16e901]:
                - text: On December 2, 2023, Psyonix teased
                - link "Rocket Racing" [ref=f16e903] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Rocket_Racing
                - text: during the
                - link "Fortnite" [ref=f16e905] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fortnite
                - text: Big Bang event as a spin-off title and was released as a game mode in Fortnite on December 8. It supports cross-game inventory for use in the
                - link "Battle Royale" [ref=f16e906] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fortnite_Battle_Royale
                - text: modes with cosmetics related to cars.
                - superscript [ref=f16e907]:
                  - link "[102]" [ref=f16e908] [cursor=pointer]:
                    - /url: "#cite_note-106"
          - region [ref=f16e909]:
            - heading "Release" [level=2] [ref=f16e911]
            - paragraph [ref=f16e912]:
              - text: Rocket League was officially announced as the sequel to Battle-Cars in February 2014.
              - superscript [ref=f16e913]:
                - link "[103]" [ref=f16e914] [cursor=pointer]:
                  - /url: "#cite_note-107"
              - text: Building on the effects from the lack of marketing with Battle-Cars, Psyonix developed a different marketing approach to Rocket League. This included engaging with
              - link "YouTube" [ref=f16e915] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/YouTube
              - text: and
              - link "Twitch" [ref=f16e916] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Twitch_(service)
              - text: video game streamers with early release copies to help spread the word, recognizing that clips from the game would be readily shared through social media.
              - superscript [ref=f16e917]:
                - link "[34]" [ref=f16e918] [cursor=pointer]:
                  - /url: "#cite_note-wsj-38"
              - superscript [ref=f16e919]:
                - link "[38]" [ref=f16e920] [cursor=pointer]:
                  - /url: "#cite_note-gamasutra_gdc2016-42"
              - text: They also opened the game to early
              - link "alpha and beta testing" [ref=f16e921] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Software_release_life_cycle#Stages_of_development
              - text: for several months following the game's announcement.
              - superscript [ref=f16e922]:
                - link "[104]" [ref=f16e923] [cursor=pointer]:
                  - /url: "#cite_note-Announce-108"
              - superscript [ref=f16e924]:
                - link "[105]" [ref=f16e925] [cursor=pointer]:
                  - /url: "#cite_note-109"
              - text: Davis noted that they otherwise did not spend any money on traditional marketing approaches.
              - superscript [ref=f16e926]:
                - link "[38]" [ref=f16e927] [cursor=pointer]:
                  - /url: "#cite_note-gamasutra_gdc2016-42"
            - paragraph [ref=f16e928]:
              - text: They had originally planned to release the game around November 2014, but had missed this deadline to implement better matchmaking and servers, high frame rates, and removing the free-to-play elements.
              - superscript [ref=f16e929]:
                - link "[36]" [ref=f16e930] [cursor=pointer]:
                  - /url: "#cite_note-eurogamer_success-40"
              - text: The game was released publicly on July 7, 2015, for the PlayStation 4 and Windows.
              - superscript [ref=f16e931]:
                - link "[106]" [ref=f16e932] [cursor=pointer]:
                  - /url: "#cite_note-110"
              - text: Davis considered this serendipitous, as this moved the game out from a busy period of many major releases during the holiday season to the relatively quiet mid-year period, reducing the amount of competition from other titles.
              - superscript [ref=f16e933]:
                - link "[38]" [ref=f16e934] [cursor=pointer]:
                  - /url: "#cite_note-gamasutra_gdc2016-42"
              - text: Further, the game on release was made part of
              - link "Instant Game Collection" [ref=f16e935] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Instant_Game_Collection
              - text: on the PlayStation 4 and free to
              - link "PlayStation Plus" [ref=f16e936] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/PlayStation_Plus
              - text: subscribers; within the week, Psyonix had seen more than 183,000 unique players, exceeding their server capacity and requiring them to improve on their network code to handle the influx of players.
              - superscript [ref=f16e937]:
                - link "[31]" [ref=f16e938] [cursor=pointer]:
                  - /url: "#cite_note-eurogamer_history-35"
              - superscript [ref=f16e939]:
                - link "[107]" [ref=f16e940] [cursor=pointer]:
                  - /url: "#cite_note-111"
              - text: Davis estimated there were six million downloads of the game from this promotion, and considered this the "best decision" they had ever made.
              - superscript [ref=f16e941]:
                - link "[38]" [ref=f16e942] [cursor=pointer]:
                  - /url: "#cite_note-gamasutra_gdc2016-42"
            - paragraph [ref=f16e943]:
              - text: At
              - link "The Game Awards 2015" [ref=f16e944] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/The_Game_Awards_2015
              - text: ", it was announced that the game would be ported to"
              - link "Xbox One" [ref=f16e945] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Xbox_One
              - text: ","
              - superscript [ref=f16e946]:
                - link "[73]" [ref=f16e947] [cursor=pointer]:
                  - /url: "#cite_note-xbox_release-77"
              - text: where it was released on February 17, including most of the previous DLC packs for free.
              - superscript [ref=f16e948]:
                - link "[108]" [ref=f16e949] [cursor=pointer]:
                  - /url: "#cite_note-112"
              - text: Ports for
              - link "macOS" [ref=f16e950] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/MacOS
              - text: and
              - link "Linux" [ref=f16e951] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Linux
              - text: were released on September 8, 2016.
              - superscript [ref=f16e952]:
                - link "[61]" [ref=f16e953] [cursor=pointer]:
                  - /url: "#cite_note-Ports-65"
              - text: A retail version of Rocket League, in form of the game's Collector's Edition, was announced in February 2016, and was released in Europe on June 24, 2016, and in North America on July 5, 2016.
              - superscript [ref=f16e954]:
                - link "[109]" [ref=f16e955] [cursor=pointer]:
                  - /url: "#cite_note-GameSpot_retail-113"
              - superscript [ref=f16e956]:
                - link "[110]" [ref=f16e957] [cursor=pointer]:
                  - /url: "#cite_note-114"
              - superscript [ref=f16e958]:
                - link "[111]" [ref=f16e959] [cursor=pointer]:
                  - /url: "#cite_note-115"
              - text: The Collector's Edition is published and distributed by
              - link "505 Games" [ref=f16e960] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/505_Games
              - text: ", and includes the first three downloadable content packs for free, as well as four additional cars to be available as digital download on July 18: Aftershock and Marauder (both from"
              - link "Supersonic Acrobatic Rocket-Powered Battle-Cars" [ref=f16e962] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Supersonic_Acrobatic_Rocket-Powered_Battle-Cars
              - text: ), as well as Esper and Masamune.
              - superscript [ref=f16e963]:
                - link "[109]" [ref=f16e964] [cursor=pointer]:
                  - /url: "#cite_note-GameSpot_retail-113"
              - superscript [ref=f16e965]:
                - link "[112]" [ref=f16e966] [cursor=pointer]:
                  - /url: "#cite_note-116"
              - text: In October 2017, Psyonix announced that
              - link "Warner Bros. Interactive Entertainment" [ref=f16e967] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Warner_Bros._Interactive_Entertainment
              - text: would begin to publish an updated version of the game for PlayStation 4 and Xbox One consoles by the end of that year, which includes additional content for both versions.
              - superscript [ref=f16e968]:
                - link "[113]" [ref=f16e969] [cursor=pointer]:
                  - /url: "#cite_note-117"
            - paragraph [ref=f16e970]:
              - text: The PlayStation 4 version was patched in February 2017 to offer
              - link "PlayStation 4 Pro" [ref=f16e971] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/PlayStation_4_Pro
              - text: support, allowing for
              - link "4K resolution" [ref=f16e972] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/4K_resolution
              - text: and constant 60 frames-per-second rendering at
              - link "1080p" [ref=f16e973] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/1080p
              - text: for one and two-player split-screen players; three and four-player split screen will render up to 60 frames-per-second when possible. Similar rendering improvements were also made to the standard PlayStation 4 to approach constant 60 frames-per-second for most arenas and modes.
              - superscript [ref=f16e974]:
                - link "[114]" [ref=f16e975] [cursor=pointer]:
                  - /url: "#cite_note-118"
              - superscript [ref=f16e976]:
                - link "[86]" [ref=f16e977] [cursor=pointer]:
                  - /url: "#cite_note-ps4pro-90"
            - paragraph [ref=f16e978]:
              - text: After reviewing the feasibility of doing so, Psyonix announced that Rocket League would also be released for the
              - link "Nintendo Switch" [ref=f16e979] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Nintendo_Switch
              - text: ", as revealed during"
              - link "Nintendo" [ref=f16e980] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Nintendo
              - text: "'s press conference during"
              - link "E3 2017" [ref=f16e981] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/E3_2017
              - text: .
              - superscript [ref=f16e982]:
                - link "[115]" [ref=f16e983] [cursor=pointer]:
                  - /url: "#cite_note-ign_switch_pot-119"
              - superscript [ref=f16e984]:
                - link "[116]" [ref=f16e985] [cursor=pointer]:
                  - /url: "#cite_note-120"
              - text: It was released later that year on November 14, and includes customization options based on Nintendo properties, including
              - link "Mario" [ref=f16e986] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Mario
              - text: ","
              - link "Luigi" [ref=f16e987] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Luigi_(character)
              - text: ", and"
              - link "Metroid" [ref=f16e989] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Metroid
              - text: "-inspired car designs, and supports cross-platform play with the PC and Xbox One versions."
              - superscript [ref=f16e990]:
                - link "[117]" [ref=f16e991] [cursor=pointer]:
                  - /url: "#cite_note-121"
              - superscript [ref=f16e992]:
                - link "[118]" [ref=f16e993] [cursor=pointer]:
                  - /url: "#cite_note-122"
              - superscript [ref=f16e994]:
                - link "[119]" [ref=f16e995] [cursor=pointer]:
                  - /url: "#cite_note-123"
              - text: Due to the Switch's lack of natural support for
              - link "Unreal Engine 3" [ref=f16e996] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Unreal_Engine_3
              - text: ", some compromises had to be made in the porting process, such as by reducing the graphical quality to"
              - link "720p" [ref=f16e997] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/720p
              - text: . Despite having to do custom work to make the game run smoothly on the Switch, Dunham was impressed with the work that had been done before release.
              - superscript [ref=f16e998]:
                - link "[120]" [ref=f16e999] [cursor=pointer]:
                  - /url: "#cite_note-124"
            - paragraph [ref=f16e1000]:
              - link "Austin, Texas" [ref=f16e1001] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Austin,_Texas
              - text: "-based studio"
              - link "Panic Button" [ref=f16e1002] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Panic_Button_(company)
              - text: assisted Psyonix with the Xbox One and Nintendo Switch ports,
              - superscript [ref=f16e1003]:
                - link "[121]" [ref=f16e1004] [cursor=pointer]:
                  - /url: "#cite_note-125"
              - superscript [ref=f16e1005]:
                - link "[122]" [ref=f16e1006] [cursor=pointer]:
                  - /url: "#cite_note-126"
              - text: and graphical updates to support the
              - link "PlayStation 4 Pro" [ref=f16e1007] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/PlayStation_4_Pro
              - text: .
              - superscript [ref=f16e1008]:
                - link "[123]" [ref=f16e1009] [cursor=pointer]:
                  - /url: "#cite_note-127"
              - superscript [ref=f16e1010]:
                - link "[124]" [ref=f16e1011] [cursor=pointer]:
                  - /url: "#cite_note-128"
              - text: In April 2017, Psyonix announced that they had partnered with
              - link "Tencent" [ref=f16e1012] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Tencent
              - text: to bring a
              - link "free-to-play" [ref=f16e1013] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Free-to-play
              - text: version of Rocket League to the Chinese gaming market, with users able to purchase cosmetic items through microtransactions.
              - superscript [ref=f16e1014]:
                - link "[125]" [ref=f16e1015] [cursor=pointer]:
                  - /url: "#cite_note-129"
              - text: It was successfully licensed through China's approval process in July 2019.
              - superscript [ref=f16e1016]:
                - link "[126]" [ref=f16e1017] [cursor=pointer]:
                  - /url: "#cite_note-130"
              - text: Because of the continued growth of the game's player base, Psyonix's Dunham said they do not anticipate creating any sequel to the game,
              - superscript [ref=f16e1018]:
                - link "[127]" [ref=f16e1019] [cursor=pointer]:
                  - /url: "#cite_note-gamespot_march2017-131"
              - text: and instead are expecting to continue to add new features to the game over several years' time, calling this an "infinite support window".
              - superscript [ref=f16e1020]:
                - link "[115]" [ref=f16e1021] [cursor=pointer]:
                  - /url: "#cite_note-ign_switch_pot-119"
              - text: A small team within Psyonix was set up to explore new features and gameplay ideas to continue to expand Rocket League.
              - superscript [ref=f16e1022]:
                - link "[49]" [ref=f16e1023] [cursor=pointer]:
                  - /url: "#cite_note-ign_mar17_future-53"
            - paragraph [ref=f16e1024]:
              - text: In May 2019,
              - link "Epic Games" [ref=f16e1025] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Epic_Games
              - text: announced that it had acquired Psyonix for an undisclosed amount. Psyonix has had a long-standing relationship with the studio (its original North Carolina headquarters were only 12 miles (19 km) away from those of Epic), having worked with it on development tools for the Unreal Engine. As a result of the purchase, the game was planned to be added to the
              - link "Epic Games Store" [ref=f16e1026] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Epic_Games_Store
              - text: by late-2019, but Psyonix was unclear over whether the game would become exclusive to the store.
              - superscript [ref=f16e1027]:
                - link "[128]" [ref=f16e1028] [cursor=pointer]:
                  - /url: "#cite_note-132"
              - text: The game became subject to
              - link "review bombing" [ref=f16e1029] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Review_bombing
              - text: "on"
              - link "Steam" [ref=f16e1030] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Steam_(service)
              - text: due to this sale, triggering Steam's "off-topic review activity" system, which hides reviews that do not correlate with the game itself.
              - superscript [ref=f16e1031]:
                - link "[129]" [ref=f16e1032] [cursor=pointer]:
                  - /url: "#cite_note-133"
              - superscript [ref=f16e1033]:
                - link "[130]" [ref=f16e1034] [cursor=pointer]:
                  - /url: "#cite_note-134"
            - paragraph [ref=f16e1035]:
              - text: Psyonix announced in January 2020 that as part of a major upgrade to the base game systems, they would be dropping support for macOS and Linux from the game by March 2020.
              - superscript [ref=f16e1036]:
                - link "[131]" [ref=f16e1037] [cursor=pointer]:
                  - /url: "#cite_note-135"
              - text: After March 2020, these versions will no longer be able to connect and use the online parts of the game, but can still be played in single player or local multiplayer.
              - superscript [ref=f16e1038]:
                - link "[132]" [ref=f16e1039] [cursor=pointer]:
                  - /url: "#cite_note-136"
              - text: Psyonix said in a followup message that macOS and Linux players represented less than 0.3% of the total player base and could not justify keeping these as supported platforms as they advanced the other platforms to newer technology, such as moving the Windows version from
              - link "DirectX" [ref=f16e1040] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/DirectX
              - text: 9 to 11. The developer offered full refunds to the game for macOS and Linux owners regardless of how long they had the game.
              - superscript [ref=f16e1041]:
                - link "[133]" [ref=f16e1042] [cursor=pointer]:
                  - /url: "#cite_note-137"
            - region [ref=f16e1043]:
              - heading "Cross-promotions" [level=3] [ref=f16e1045]
              - paragraph [ref=f16e1046]:
                - text: Psyonix teamed with
                - link "Internal Drive" [ref=f16e1047] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/ID_Tech_Camps
                - text: to provide Rocket League as part of the latter's iD Tech summer educational camps for children, using the game for both recreation and for teaching elements of game design.
                - superscript [ref=f16e1048]:
                  - link "[134]" [ref=f16e1049] [cursor=pointer]:
                    - /url: "#cite_note-138"
                - text: In 2017, the game served as a sponsor of
                - link "WWE pay-per-view events" [ref=f16e1050] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/WWE_pay-per-view_events
                - text: ", such as"
                - link "Backlash" [ref=f16e1051] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Backlash_(2017)
                - text: ","
                - link "Great Balls of Fire" [ref=f16e1052] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/WWE_Great_Balls_of_Fire
                - text: ", and"
                - link "SummerSlam" [ref=f16e1053] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/SummerSlam_(2017)
                - text: .
                - superscript [ref=f16e1054]:
                  - link "[135]" [ref=f16e1055] [cursor=pointer]:
                    - /url: "#cite_note-139"
                - superscript [ref=f16e1056]:
                  - link "[136]" [ref=f16e1057] [cursor=pointer]:
                    - /url: "#cite_note-140"
                - text: The following year, the companies announced a further partnership, with
                - link "WWE" [ref=f16e1058] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/WWE
                - text: cosmetic items introduced to the game in April.
                - superscript [ref=f16e1059]:
                  - link "[137]" [ref=f16e1060] [cursor=pointer]:
                    - /url: "#cite_note-141"
                - superscript [ref=f16e1061]:
                  - link "[138]" [ref=f16e1062] [cursor=pointer]:
                    - /url: "#cite_note-142"
              - paragraph [ref=f16e1063]:
                - text: Psyonix partnered with Zag Toys to produce a series of
                - link "pullback toy cars" [ref=f16e1064] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Pullback_toy_cars
                - text: based on the Rocket League vehicles, which released in June 2017. Some of these included a redeemable code that can be used within the game for unique customization items.
                - superscript [ref=f16e1065]:
                  - link "[139]" [ref=f16e1066] [cursor=pointer]:
                    - /url: "#cite_note-143"
                - superscript [ref=f16e1067]:
                  - link "[140]" [ref=f16e1068] [cursor=pointer]:
                    - /url: "#cite_note-144"
                - text: The developers also filmed television advertisements for Rocket League that started airing the same month. Alongside these ads, Psyonix offered free copies of Rocket League alongside purchase of selected
                - link "Nvidia" [ref=f16e1069] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Nvidia
                - link "graphics cards" [ref=f16e1070] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Graphics_cards
                - text: .
                - superscript [ref=f16e1071]:
                  - link "[141]" [ref=f16e1072] [cursor=pointer]:
                    - /url: "#cite_note-145"
                - text: In December 2018, toy car brand
                - link "Hot Wheels" [ref=f16e1073] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Hot_Wheels
                - text: released a
                - link "radio-controlled car" [ref=f16e1074] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Radio-controlled_car
                - text: (RC car) game set based on the game that features two RC cars that are controlled through
                - link "Bluetooth" [ref=f16e1075] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Bluetooth
                - text: devices, a play field, a ball containing
                - link "infrared" [ref=f16e1076] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Infrared
                - text: sensors for scoring purposes, and charging devices.
                - superscript [ref=f16e1077]:
                  - link "[142]" [ref=f16e1078] [cursor=pointer]:
                    - /url: "#cite_note-146"
              - paragraph [ref=f16e1079]:
                - text: In February 2022, there was announced a partnership between
                - link "7-Eleven" [ref=f16e1080] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/7-Eleven
                - text: and Psyonix, with
                - link "Slurpee" [ref=f16e1081] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Slurpee
                - text: themed Rocket League cosmetics able to be purchased by players in-game, and Rocket League themed items being sold inside 7-Eleven stores and some subsidiaries.
                - superscript [ref=f16e1082]:
                  - link "[143]" [ref=f16e1083] [cursor=pointer]:
                    - /url: "#cite_note-147"
                - text: 7-Eleven was also an official sponsor of the RLCS, and an event was named after the brand, the "7‑Eleven Slurpee Cup."
                - superscript [ref=f16e1084]:
                  - link "[144]" [ref=f16e1085] [cursor=pointer]:
                    - /url: "#cite_note-148"
                - text: A sweepstakes was offered by 7-Eleven to win a real life vehicle, the "Model 711."
                - superscript [ref=f16e1086]:
                  - link "[145]" [ref=f16e1087] [cursor=pointer]:
                    - /url: "#cite_note-149"
            - region [ref=f16e1088]:
              - heading "Free-to-play transition" [level=3] [ref=f16e1090]
              - paragraph [ref=f16e1091]:
                - text: Psyonix transitioned Rocket League to a
                - link "free-to-play" [ref=f16e1092] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Free-to-play
                - text: model on all platforms on September 23, 2020.
                - superscript [ref=f16e1093]:
                  - link "[146]" [ref=f16e1094] [cursor=pointer]:
                    - /url: "#cite_note-150"
                - text: Associated with the transition, the game added cross-platform progression that covers the cosmetic items players have earned, new competitive tournaments at each rank to earn rewards, new challenges, and other features.
                - superscript [ref=f16e1095]:
                  - link "[147]" [ref=f16e1096] [cursor=pointer]:
                    - /url: "#cite_note-verge_f2p-151"
                - superscript [ref=f16e1097]:
                  - link "[148]" [ref=f16e1098] [cursor=pointer]:
                    - /url: "#cite_note-152"
                - text: The free-to-play version eliminated the need for players to have console subscription services like
                - link "PlayStation Plus" [ref=f16e1099] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/PlayStation_Plus
                - text: or
                - link "Nintendo Switch Online" [ref=f16e1100] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Nintendo_Switch_Online
                - text: to be able to play.
                - superscript [ref=f16e1101]:
                  - link "[149]" [ref=f16e1102] [cursor=pointer]:
                    - /url: "#cite_note-153"
                - text: Some changes were also made to the game's tournaments and challenge systems to help with monetization. Players that had purchased the game prior to the transition were given "Legacy" status and some related cosmetic items.
                - superscript [ref=f16e1103]:
                  - link "[150]" [ref=f16e1104] [cursor=pointer]:
                    - /url: "#cite_note-154"
                - text: One day after the game became free-to-play, it reached a peak concurrent player count on more than 1 million players.
                - superscript [ref=f16e1105]:
                  - link "[151]" [ref=f16e1106] [cursor=pointer]:
                    - /url: "#cite_note-155"
              - paragraph [ref=f16e1107]:
                - text: As part of this transition, the Windows version of the game was moved off
                - link "Steam" [ref=f16e1108] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Steam_(service)
                - text: onto the
                - link "Epic Games Store" [ref=f16e1109] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Epic_Games_Store
                - text: . Players that had already owned the Steam version prior to the change were still able to download, update the game and play it with cross-play with other platforms, and would continue to receive updates.
                - superscript [ref=f16e1110]:
                  - link "[147]" [ref=f16e1111] [cursor=pointer]:
                    - /url: "#cite_note-verge_f2p-151"
            - region [ref=f16e1112]:
              - heading "Removal of player trading" [level=3] [ref=f16e1114]
              - paragraph [ref=f16e1115]:
                - text: In December 2023, Psyonix removed player-to-player trading. This change was made to align Rocket League's cosmetic and item shop policies with Epic's standards, and to enable the possibility of cross-game ownership of Rocket League vehicles in other Epic Games titles.
                - superscript [ref=f16e1116]:
                  - link "[152]" [ref=f16e1117] [cursor=pointer]:
                    - /url: "#cite_note-156"
          - region [ref=f16e1118]:
            - heading "Esports" [level=2] [ref=f16e1120]
            - note [ref=f16e1121]:
              - text: "See also:"
              - link "Rocket League Championship Series" [ref=f16e1122] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Rocket_League_Championship_Series
            - paragraph [ref=f16e1123]:
              - text: Psyonix had observed the popularity of Rocket League matches on
              - link "Twitch" [ref=f16e1124] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Twitch_(service)
              - text: and other live streaming platforms, and in February 2016, were looking to use the game more in
              - link "esports" [ref=f16e1125] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Esports
              - text: .
              - superscript [ref=f16e1126]:
                - link "[153]" [ref=f16e1127] [cursor=pointer]:
                  - /url: "#cite_note-157"
              - text: In March 2016, Psyonix announced the first Rocket League Championship Series (RLCS); the finals took place in August 2016 with a $55,000 prize pool.
              - superscript [ref=f16e1128]:
                - link "[154]" [ref=f16e1129] [cursor=pointer]:
                  - /url: "#cite_note-158"
              - superscript [ref=f16e1130]:
                - link "[155]" [ref=f16e1131] [cursor=pointer]:
                  - /url: "#cite_note-159"
              - text: More than $1 million in revenues from the sale of in-game crates and cosmetic items were used to fund additional competitive events throughout the year, including smaller competitions at major gaming conventions and support for community-run competitive events.
              - superscript [ref=f16e1132]:
                - link "[156]" [ref=f16e1133] [cursor=pointer]:
                  - /url: "#cite_note-160"
            - paragraph [ref=f16e1134]:
              - text: Soon after release, Rocket League became an officially sponsored esport, joining
              - link "ESL" [ref=f16e1135] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/ESL_(company)
              - text: .
              - superscript [ref=f16e1136]:
                - link "[157]" [ref=f16e1137] [cursor=pointer]:
                  - /url: "#cite_note-161"
              - text: In September 2015,
              - link "Major League Gaming" [ref=f16e1138] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Major_League_Gaming
              - text: (MLG) announced the first season of the Pro Rocket League, which was held in September through early October.
              - superscript [ref=f16e1139]:
                - link "[158]" [ref=f16e1140] [cursor=pointer]:
                  - /url: "#cite_note-162"
              - text: A $75,000 Rocket League tournament was held outside
              - link "U.S. Bank Stadium" [ref=f16e1141] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/U.S._Bank_Stadium
              - text: at the
              - link "Summer X Games" [ref=f16e1142] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/X_Games_Minneapolis_2017
              - text: in July 2017,
              - superscript [ref=f16e1143]:
                - link "[159]" [ref=f16e1144] [cursor=pointer]:
                  - /url: "#cite_note-redbull-xgames-163"
              - text: with the finals streamed live on
              - link "ESPN3" [ref=f16e1145] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/ESPN3
              - text: .
              - superscript [ref=f16e1146]:
                - link "[160]" [ref=f16e1147] [cursor=pointer]:
                  - /url: "#cite_note-164"
              - link "NRG Esports" [ref=f16e1148] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/NRG_Esports
              - text: claimed their first live Rocket League championship by winning the tournament, defeating Gale Force eSports in the final.
              - superscript [ref=f16e1149]:
                - link "[159]" [ref=f16e1150] [cursor=pointer]:
                  - /url: "#cite_note-redbull-xgames-163"
              - superscript [ref=f16e1151]:
                - link "[161]" [ref=f16e1152] [cursor=pointer]:
                  - /url: "#cite_note-165"
              - text: As NBC's first foray into esports,
              - link "NBC Sports Group" [ref=f16e1153] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/NBC_Sports_Group
              - text: ", in conjunction with"
              - link "Faceit" [ref=f16e1154] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Faceit
              - text: ", ran its own $100,000-prize pool tournament which was broadcast across its eight worldwide regions in July–August 2017."
              - superscript [ref=f16e1155]:
                - link "[162]" [ref=f16e1156] [cursor=pointer]:
                  - /url: "#cite_note-166"
              - text: Starting in September 2017, Psyonix and
              - link "Tespa" [ref=f16e1157] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Tespa
              - text: ", a collegiate esports organizer, held the first collegiate tournament for teams to win a share of $50,000 in scholarships."
              - superscript [ref=f16e1158]:
                - link "[163]" [ref=f16e1159] [cursor=pointer]:
                  - /url: "#cite_note-167"
              - text: In December 2017,
              - link "Turner Sports" [ref=f16e1160] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Turner_Sports
              - text: organized a US$150,000
              - link "ELEAGUE" [ref=f16e1161] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/ELEAGUE
              - text: Cup event for eight teams was broadcast live on streaming media, with a three-part series of shows detailing some of the teams' path to the Cup and some of the match results, which aired on
              - link "TBS" [ref=f16e1162] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/TBS_(U.S._TV_channel)
              - text: later in the month.
              - superscript [ref=f16e1163]:
                - link "[164]" [ref=f16e1164] [cursor=pointer]:
                  - /url: "#cite_note-168"
              - superscript [ref=f16e1165]:
                - link "[165]" [ref=f16e1166] [cursor=pointer]:
                  - /url: "#cite_note-169"
            - paragraph [ref=f16e1167]:
              - text: The 2020s brought significant changes to Rocket League esports. RLCS Season X would bring the addition of a new competitive format which featured 3 separate regional splits, each one having their own international Majors, followed by the season-ending World Championship. Teams were awarded points based on how they placed in the regional events which qualified them for the World Championship
              - superscript [ref=f16e1168]:
                - link "[166]" [ref=f16e1169] [cursor=pointer]:
                  - /url: "#cite_note-170"
              - text: While the Season X World Championship was cancelled due to the
              - link "COVID-19 pandemic" [ref=f16e1170] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/COVID-19_pandemic
              - text: ", this format stayed the same for the 2021–22 and 2022–23 seasons. For 2024, this would change to two regional splits, each one having their own international Major at the end, followed by the World Championship."
              - superscript [ref=f16e1171]:
                - link "[167]" [ref=f16e1172] [cursor=pointer]:
                  - /url: "#cite_note-171"
              - text: This would be kept for the 2025 season, but Last Chance Qualifiers for the World Championship for the 4 best regions, Play-ins for the World Championship and a 1v1 series were added. Also in 2024, the
              - link "FIFAe World Cup" [ref=f16e1173] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/FIFAe_World_Cup
              - text: ", organized by"
              - link "FIFA" [ref=f16e1174] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/FIFA
              - text: and previously utilizing the
              - link "FIFA" [ref=f16e1175] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/FIFA_(video_game_series)
              - text: soccer series, would feature a national team focused Rocket League tournament.
              - superscript [ref=f16e1176]:
                - link "[168]" [ref=f16e1177] [cursor=pointer]:
                  - /url: "#cite_note-172"
              - text: This was due to
              - link "EA Sports" [ref=f16e1178] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/EA_Sports
              - text: ", who had developed the FIFA games, ending their decades-long ties with soccer's governing body."
              - superscript [ref=f16e1179]:
                - link "[169]" [ref=f16e1180] [cursor=pointer]:
                  - /url: "#cite_note-173"
          - region [ref=f16e1181]:
            - heading "Reception" [level=2] [ref=f16e1183]
            - complementary [ref=f16e1184]:
