                        - link "[2]" [ref=f16e1248] [cursor=pointer]:
                          - /url: "#cite_note-ShackNews-6"
            - paragraph [ref=f16e1249]:
              - text: Rocket League has received "generally favorable" reviews on all platforms, according to
              - link "review aggregator" [ref=f16e1250] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Review_aggregator
              - text: website
              - link "Metacritic" [ref=f16e1251] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Metacritic
              - text: .
              - superscript [ref=f16e1252]:
                - link "[170]" [ref=f16e1253] [cursor=pointer]:
                  - /url: "#cite_note-mcx-174"
              - superscript [ref=f16e1254]:
                - link "[171]" [ref=f16e1255] [cursor=pointer]:
                  - /url: "#cite_note-mc4-175"
              - superscript [ref=f16e1256]:
                - link "[172]" [ref=f16e1257] [cursor=pointer]:
                  - /url: "#cite_note-mcp-176"
              - superscript [ref=f16e1258]:
                - link "[173]" [ref=f16e1259] [cursor=pointer]:
                  - /url: "#cite_note-mcs-177"
              - text: Positive feedback was aimed towards the game's multiplayer gameplay,
              - superscript [ref=f16e1260]:
                - link "[179]" [ref=f16e1261] [cursor=pointer]:
                  - /url: "#cite_note-desructoid-review-183"
              - text: and its graphics and visuals,
              - superscript [ref=f16e1262]:
                - link "[2]" [ref=f16e1263] [cursor=pointer]:
                  - /url: "#cite_note-ShackNews-6"
              - text: especially in comparison to Battle-Cars;
              - superscript [ref=f16e1264]:
                - link "[177]" [ref=f16e1265] [cursor=pointer]:
                  - /url: "#cite_note-Polygonrev-181"
              - text: later reviews praised the player experience in the game.
              - superscript [ref=f16e1266]:
                - link "[180]" [ref=f16e1267] [cursor=pointer]:
                  - /url: "#cite_note-rockpapershotgun-review-184"
              - text: Criticism was mostly aimed at the game's physics engine,
              - superscript [ref=f16e1268]:
                - link "[178]" [ref=f16e1269] [cursor=pointer]:
                  - /url: "#cite_note-VideoGamer_Review-182"
              - superscript [ref=f16e1270]:
                - link "[181]" [ref=f16e1271] [cursor=pointer]:
                  - /url: "#cite_note-PSU_Review-185"
              - text: though a consensus on the topic has been mostly unclear, with some defending the engine.
              - superscript [ref=f16e1272]:
                - link "[176]" [ref=f16e1273] [cursor=pointer]:
                  - /url: "#cite_note-PCgamer-180"
            - paragraph [ref=f16e1274]:
              - text: In a review of Rocket League
              - generic [ref=f16e1275]: "'s"
              - text: beta preview, Ozzie Mejia of
              - link "Shacknews" [ref=f16e1277] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Shacknews
              - text: praised Psyonix's approach to updating Battle-Cars using the PlayStation 4's hardware, describing the graphics as "brilliantly detailed" and "crisp", and citing its consistent
              - link "frame rates" [ref=f16e1278] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Frame_rate
              - text: throughout.
              - superscript [ref=f16e1279]:
                - link "[2]" [ref=f16e1280] [cursor=pointer]:
                  - /url: "#cite_note-ShackNews-6"
              - text: Robert Summa of
              - link "Destructoid" [ref=f16e1282] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Destructoid
              - text: shared Mejia's view that the game was "fun option for anyone looking to mix their racing and sports games together", himself describing that the game was "addictive and fun as hell."
              - superscript [ref=f16e1283]:
                - link "[2]" [ref=f16e1284] [cursor=pointer]:
                  - /url: "#cite_note-ShackNews-6"
              - superscript [ref=f16e1285]:
                - link "[179]" [ref=f16e1286] [cursor=pointer]:
                  - /url: "#cite_note-desructoid-review-183"
              - text: Reviewers from
              - link "Polygon" [ref=f16e1288] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Polygon_(website)
              - text: ", PlayStation Universe, and Videogamer.com shared positive views towards multiplayer gameplay in Rocket League."
              - superscript [ref=f16e1289]:
                - link "[177]" [ref=f16e1290] [cursor=pointer]:
                  - /url: "#cite_note-Polygonrev-181"
              - superscript [ref=f16e1291]:
                - link "[178]" [ref=f16e1292] [cursor=pointer]:
                  - /url: "#cite_note-VideoGamer_Review-182"
              - superscript [ref=f16e1293]:
                - link "[181]" [ref=f16e1294] [cursor=pointer]:
                  - /url: "#cite_note-PSU_Review-185"
              - text: Ben Kuchera of Polygon wrote that the game "introduces a well-known concept and then adds a complication." Kuchera asserted that the game's physics were "internally consistent", and summarized his experience with the game as "joyful" and rewarding in its progression.
              - superscript [ref=f16e1295]:
                - link "[177]" [ref=f16e1296] [cursor=pointer]:
                  - /url: "#cite_note-Polygonrev-181"
              - text: The game's physics engine continued to be a point of contention in later reviews, including Steven Burns' review for Videogamer.com, in which he shared his opinion that the speed of the ball should have been increased in certain modes to compensate for the "floaty" physics.
              - superscript [ref=f16e1297]:
                - link "[178]" [ref=f16e1298] [cursor=pointer]:
                  - /url: "#cite_note-VideoGamer_Review-182"
              - text: Neil Bolt of PlayStation Universe shared a similar view, writing that the physics "causes frustration in 4v4 bouts where everyone ends up huddling under the slow-descending ball for long periods."
              - superscript [ref=f16e1299]:
                - link "[181]" [ref=f16e1300] [cursor=pointer]:
                  - /url: "#cite_note-PSU_Review-185"
            - blockquote [ref=f16e1301]:
              - paragraph [ref=f16e1302]:
                - text: "\"... the physics, floaty as they are, not really suited to seeing the ball constantly being punted about: it can often feel like chasing a balloon around a children's party, but the children are in high-powered rocket cars and are taking no shit. ... you feel Psyonix would be better off making the ball move just a tad faster: often you'll crash into it at speed only to see your car move quicker than it after collision.\""
                - superscript [ref=f16e1303]:
                  - link "[178]" [ref=f16e1304] [cursor=pointer]:
                    - /url: "#cite_note-VideoGamer_Review-182"
            - paragraph [ref=f16e1306]: — Steven Burns
            - paragraph [ref=f16e1307]:
              - text: In a review for
              - link "PC Gamer" [ref=f16e1309] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/PC_Gamer
              - text: ", Matt Elliott defended the physics engine, citing the \"[nice] contrast\" between the fast player-controlled cars and the slower-moving ball, colorfully describing that the ball \"gormlessly invites impact like a punchable cousin.\""
              - superscript [ref=f16e1310]:
                - link "[176]" [ref=f16e1311] [cursor=pointer]:
                  - /url: "#cite_note-PCgamer-180"
              - text: Elliott also wrote positively of the multiplayer gameplay, comparing the "destruction" mechanic to the
              - link "Burnout" [ref=f16e1313] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Burnout_(series)
              - text: series, and praising the overall player experience.
              - superscript [ref=f16e1314]:
                - link "[176]" [ref=f16e1315] [cursor=pointer]:
                  - /url: "#cite_note-PCgamer-180"
              - text: In complimenting the game's points system, Elliott recounted, "the most valuable players I encountered were workmanlike wingers who selflessly chugged along the flanks, crossing the ball for greedy goalhunters like me. It stops players from clustering in the same spots and reinforces the concept that Rocket League is a team game."
              - superscript [ref=f16e1316]:
                - link "[176]" [ref=f16e1317] [cursor=pointer]:
                  - /url: "#cite_note-PCgamer-180"
              - text: In a retrospective review written two years after its release, Alec Meer of
              - link "Rock Paper Shotgun" [ref=f16e1319] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Rock_Paper_Shotgun
              - text: shared similar feelings about the player experience in Rocket League. Meer stated that the game remained "very open, friendly, and accessible to new players across all ages, in contrast to other games with online longevity that tend to be dominated by expert players and difficult to breach by new ones."
              - superscript [ref=f16e1320]:
                - link "[180]" [ref=f16e1321] [cursor=pointer]:
                  - /url: "#cite_note-rockpapershotgun-review-184"
            - paragraph [ref=f16e1322]:
              - text: Following the Blueprint update in December 2019, players expressed concern that the costs of completing blueprints was more expensive than the cost to open loot boxes, that players got more items for opening a loot box, and that in general, the loot box system felt more rewarding.
              - superscript [ref=f16e1323]:
                - link "[182]" [ref=f16e1324] [cursor=pointer]:
                  - /url: "#cite_note-186"
              - superscript [ref=f16e1325]:
                - link "[183]" [ref=f16e1326] [cursor=pointer]:
                  - /url: "#cite_note-187"
              - text: Within a week of the update, Psyonix reduced the prices of completing blueprints by half and refunded credits for those that had spent them already.
              - superscript [ref=f16e1327]:
                - link "[184]" [ref=f16e1328] [cursor=pointer]:
                  - /url: "#cite_note-188"
            - paragraph [ref=f16e1329]:
              - text: Subsequent games like the Football mode on
              - link "Nintendo Switch Sports" [ref=f16e1331] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Nintendo_Switch_Sports
              - superscript [ref=f16e1332]:
                - link "[185]" [ref=f16e1333] [cursor=pointer]:
                  - /url: "#cite_note-189"
              - superscript [ref=f16e1334]:
                - link "[186]" [ref=f16e1335] [cursor=pointer]:
                  - /url: "#cite_note-190"
              - text: and
              - link "Drag x Drive" [ref=f16e1337] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Drag_x_Drive
              - text: have been compared to Rocket League.
              - superscript [ref=f16e1338]:
                - link "[187]" [ref=f16e1339] [cursor=pointer]:
                  - /url: "#cite_note-191"
              - superscript [ref=f16e1340]:
                - link "[188]" [ref=f16e1341] [cursor=pointer]:
                  - /url: "#cite_note-192"
            - region [ref=f16e1342]:
              - heading "Sales" [level=3] [ref=f16e1344]
              - paragraph [ref=f16e1345]:
                - text: On July 11, 2015, Psyonix announced that there were around 120,000 concurrent players across both PlayStation 4 and Windows.
                - superscript [ref=f16e1346]:
                  - link "[189]" [ref=f16e1347] [cursor=pointer]:
                    - /url: "#cite_note-193"
                - superscript [ref=f16e1348]:
                  - link "[190]" [ref=f16e1349] [cursor=pointer]:
                    - /url: "#cite_note-194"
                - text: By the end of July, the game had been downloaded over 5 million times,
                - superscript [ref=f16e1350]:
                  - link "[191]" [ref=f16e1351] [cursor=pointer]:
                    - /url: "#cite_note-195"
                - text: and had 179,000 concurrent players.
                - superscript [ref=f16e1352]:
                  - link "[192]" [ref=f16e1353] [cursor=pointer]:
                    - /url: "#cite_note-196"
                - superscript [ref=f16e1354]:
                  - link "[193]" [ref=f16e1355] [cursor=pointer]:
                    - /url: "#cite_note-197"
                - text: Psyonix stated that Rocket League's quick paced success far exceeded their expectations.
                - superscript [ref=f16e1356]:
                  - link "[194]" [ref=f16e1357] [cursor=pointer]:
                    - /url: "#cite_note-198"
              - paragraph [ref=f16e1358]:
                - text: Psyonix announced that over one million copies of the game had been sold on
                - link "Steam" [ref=f16e1359] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Steam_(service)
                - text: by August 2015.
                - superscript [ref=f16e1360]:
                  - link "[195]" [ref=f16e1361] [cursor=pointer]:
                    - /url: "#cite_note-199"
                - text: By the end of 2015, the game had been downloaded over eight million times, and grossed over $50 million.
                - superscript [ref=f16e1362]:
                  - link "[196]" [ref=f16e1363] [cursor=pointer]:
                    - /url: "#cite_note-200"
                - superscript [ref=f16e1364]:
                  - link "[197]" [ref=f16e1365] [cursor=pointer]:
                    - /url: "#cite_note-201"
                - text: In February 2016, Psyonix stated Rocket League has earned $70 million in revenues with at least four million copies sold, not including downloads on the PlayStation system;
                - superscript [ref=f16e1366]:
                  - link "[198]" [ref=f16e1367] [cursor=pointer]:
                    - /url: "#cite_note-202"
                - text: they have tracked at least 12 million unique players of the game, including both purchases and during free play offers such as its availability on the
                - link "PlayStation Plus" [ref=f16e1368] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/PlayStation_Plus
                - text: membership program.
                - superscript [ref=f16e1369]:
                  - link "[89]" [ref=f16e1370] [cursor=pointer]:
                    - /url: "#cite_note-gamespot_salesfeb2016-93"
                - text: Within three weeks of its release for the Xbox One, Psyonix observed at least one million unique players for that system.
                - superscript [ref=f16e1371]:
                  - link "[199]" [ref=f16e1372] [cursor=pointer]:
                    - /url: "#cite_note-203"
                - text: By July 2016, a year after its release, Psyonix reported more than 6.2 million sales of the game across all platforms, including 5.5 million purchases of DLC, with more than $110 million in revenue; 40% of these sales have been for the PlayStation 4 version with the remaining split roughly equally between PC and Xbox One.
                - superscript [ref=f16e1373]:
                  - link "[200]" [ref=f16e1374] [cursor=pointer]:
                    - /url: "#cite_note-204"
                - text: Psyonix has tracked more than 25 million unique players by January 2017,
                - superscript [ref=f16e1375]:
                  - link "[201]" [ref=f16e1376] [cursor=pointer]:
                    - /url: "#cite_note-205"
                - text: averaging 1.1 million players a day, and reaching 220,000 concurrent players at one point.
                - superscript [ref=f16e1377]:
                  - link "[55]" [ref=f16e1378] [cursor=pointer]:
                    - /url: "#cite_note-polygon_june2016-59"
                - superscript [ref=f16e1379]:
                  - link "[82]" [ref=f16e1380] [cursor=pointer]:
                    - /url: "#cite_note-gamespot_14m-86"
                - superscript [ref=f16e1381]:
                  - link "[202]" [ref=f16e1382] [cursor=pointer]:
                    - /url: "#cite_note-gamespot_jun16_concurrent-206"
                - text: Sony stated that Rocket League was the most-downloaded title from the PlayStation Store in 2016.
                - superscript [ref=f16e1383]:
                  - link "[203]" [ref=f16e1384] [cursor=pointer]:
                    - /url: "#cite_note-207"
                - text: By the beginning of 2018, the number of players had risen to over 40 million,
                - superscript [ref=f16e1385]:
                  - link "[204]" [ref=f16e1386] [cursor=pointer]:
                    - /url: "#cite_note-208"
                - text: and subsequently reached 50 million by September 2018.
                - superscript [ref=f16e1387]:
                  - link "[205]" [ref=f16e1388] [cursor=pointer]:
                    - /url: "#cite_note-209"
              - paragraph [ref=f16e1389]:
                - text: By March 2017, Psyonix reported that Rocket League had sold more than 10.5 million copies across all platforms, and had 29 million registered players, with about a fourth of that having played during February 2017.
                - superscript [ref=f16e1390]:
                  - link "[127]" [ref=f16e1391] [cursor=pointer]:
                    - /url: "#cite_note-gamespot_march2017-131"
                - text: Dunham estimated that 70% of the game's players had purchased some of the DLC offered for the game by March 2017.
                - superscript [ref=f16e1392]:
                  - link "[49]" [ref=f16e1393] [cursor=pointer]:
                    - /url: "#cite_note-ign_mar17_future-53"
                - text: In April 2017, Psyonix reported that in addition to 9.5 million digital sales, the game had also sold over a million physical copies at retail.
                - superscript [ref=f16e1394]:
                  - link "[206]" [ref=f16e1395] [cursor=pointer]:
                    - /url: "#cite_note-210"
            - region [ref=f16e1396]:
              - heading "Awards" [level=3] [ref=f16e1398]
              - figure [ref=f16e1399]:
                - link [ref=f16e1400] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Psyonix_at_2016_GDC_Awards.jpg
                - generic [ref=f16e1402]:
                  - text: Members from
                  - link "Psyonix" [ref=f16e1403] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Psyonix
                  - text: ", including founder Dave Hagewood (right), receiving the"
                  - link "Game Developers Choice Award" [ref=f16e1404] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Game_Developers_Choice_Award
                  - text: for the game at the 2016
                  - link "Game Developers Conference" [ref=f16e1405] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Game_Developers_Conference
              - paragraph [ref=f16e1406]:
                - text: After the
                - link "E3 2015" [ref=f16e1407] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/E3_2015
                - text: event, Rocket League received multiple nominations and won several awards, including PlayStation Universe
                - generic [ref=f16e1408]: "'s"
                - text: "\"Best Sports Game of E3\","
                - superscript [ref=f16e1409]:
                  - link "[207]" [ref=f16e1410] [cursor=pointer]:
                    - /url: "#cite_note-PSU-211"
                - text: as well as Gaming Trend
                - generic [ref=f16e1411]: "'s"
                - text: "\"Best Multiplayer Game of E3\"."
                - superscript [ref=f16e1412]:
                  - link "[208]" [ref=f16e1413] [cursor=pointer]:
                    - /url: "#cite_note-GT-212"
                - text: At
                - link "The Game Awards 2015" [ref=f16e1414] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/The_Game_Awards_2015
                - text: in December, Rocket League won the award for Best Independent Game and Best Sports/Racing Game, and was nominated for Best Multiplayer.
                - superscript [ref=f16e1415]:
                  - link "[209]" [ref=f16e1416] [cursor=pointer]:
                    - /url: "#cite_note-TGA2015-213"
              - paragraph [ref=f16e1417]:
                - text: At the
                - link "19th Annual D.I.C.E. Awards" [ref=f16e1418] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/19th_Annual_D.I.C.E._Awards
                - text: in February 2016, the
                - link "Academy of Interactive Arts & Sciences" [ref=f16e1419] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Academy_of_Interactive_Arts_&_Sciences
                - text: awarded Rocket League with
                - link "Sports Game of the Year" [ref=f16e1420] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/D.I.C.E._Award_for_Sports_Game_of_the_Year
                - text: ","
                - link "Outstanding Achievement in Online Gameplay" [ref=f16e1421] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/D.I.C.E._Award_for_Online_Game_of_the_Year
                - text: and the
                - link "D.I.C.E. Sprite Award" [ref=f16e1422] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/D.I.C.E._Award_for_Outstanding_Achievement_for_an_Independent_Game
                - text: .
                - superscript [ref=f16e1423]:
                  - link "[210]" [ref=f16e1424] [cursor=pointer]:
                    - /url: "#cite_note-214"
                - text: Rocket League was awarded the Best Design at the 2016
                - link "Game Developers Choice Awards" [ref=f16e1425] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Game_Developers_Choice_Awards
                - text: .
                - superscript [ref=f16e1426]:
                  - link "[211]" [ref=f16e1427] [cursor=pointer]:
                    - /url: "#cite_note-GDCwins-215"
                - text: At the 2016
                - link "SXSW" [ref=f16e1428] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/SXSW
                - text: Gaming Awards, Rocket League was awarded the "Excellence in Multiplayer" prize.
                - superscript [ref=f16e1429]:
                  - link "[212]" [ref=f16e1430] [cursor=pointer]:
                    - /url: "#cite_note-216"
                - text: Rocket League won three
                - link "BAFTA Games Awards" [ref=f16e1431] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/12th_British_Academy_Games_Awards
                - text: for Multiplayer, Sports, and Family,
                - superscript [ref=f16e1432]:
                  - link "[213]" [ref=f16e1433] [cursor=pointer]:
                    - /url: "#cite_note-217"
                - text: and was nominated for two others, Best Game and Game Design.
                - superscript [ref=f16e1434]:
                  - link "[214]" [ref=f16e1435] [cursor=pointer]:
                    - /url: "#cite_note-218"
                - text: It also won the following year for the
                - link "BAFTA" [ref=f16e1436] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/13th_British_Academy_Games_Awards
                - text: "'s Evolving Game award."
                - superscript [ref=f16e1437]:
                  - link "[215]" [ref=f16e1438] [cursor=pointer]:
                    - /url: "#cite_note-219"
                - superscript [ref=f16e1439]:
                  - link "[216]" [ref=f16e1440] [cursor=pointer]:
                    - /url: "#cite_note-220"
                - text: In 2017, the game was nominated for "e-Sports Game of the Year" and "Still Playing" at the
                - link "Golden Joystick Awards" [ref=f16e1441] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Golden_Joystick_Awards
                - text: ","
                - superscript [ref=f16e1442]:
                  - link "[217]" [ref=f16e1443] [cursor=pointer]:
                    - /url: "#cite_note-221"
                - text: and for "Best Spectator Game" in
                - link "IGN" [ref=f16e1445] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/IGN
                - generic [ref=f16e1446]: "'"
                - text: s Best of 2017 Awards.
                - superscript [ref=f16e1447]:
                  - link "[218]" [ref=f16e1448] [cursor=pointer]:
                    - /url: "#cite_note-222"
                - text: It won the award for "Best Post-Launch Support" in Game Informer
                - generic [ref=f16e1449]: "'"
                - text: 2017 Sports Game of the Year Awards.
                - superscript [ref=f16e1450]:
                  - link "[219]" [ref=f16e1451] [cursor=pointer]:
                    - /url: "#cite_note-223"
              - paragraph [ref=f16e1452]:
                - text: In 2018, the game was nominated for "eSports Game of the Year" at the Golden Joystick Awards.
                - superscript [ref=f16e1453]:
                  - link "[220]" [ref=f16e1454] [cursor=pointer]:
                    - /url: "#cite_note-224"
                - superscript [ref=f16e1455]:
                  - link "[221]" [ref=f16e1456] [cursor=pointer]:
                    - /url: "#cite_note-225"
                - text: The game won the award for "Fan Favorite Sports/Racing Game" at the
                - link "Gamers' Choice Awards" [ref=f16e1457] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Gamers'_Choice_Awards
                - text: ","
                - superscript [ref=f16e1458]:
                  - link "[222]" [ref=f16e1459] [cursor=pointer]:
                    - /url: "#cite_note-226"
                - text: whereas its other nomination was for "Fan Favorite eSports Game".
                - superscript [ref=f16e1460]:
                  - link "[223]" [ref=f16e1461] [cursor=pointer]:
                    - /url: "#cite_note-227"
                - text: It was also nominated for "eSports Title of the Year" at the Australian Games Awards.
                - superscript [ref=f16e1462]:
                  - link "[224]" [ref=f16e1463] [cursor=pointer]:
                    - /url: "#cite_note-228"
                - text: In 2019, the game was nominated for the "Still Playing" award at the Golden Joystick Awards.
                - superscript [ref=f16e1464]:
                  - link "[225]" [ref=f16e1465] [cursor=pointer]:
                    - /url: "#cite_note-229"
          - region [ref=f16e1466]:
            - heading "Notes" [level=2] [ref=f16e1468]
            - list [ref=f16e1471]:
              - listitem [ref=f16e1472]:
                - link "Jump up" [ref=f16e1474] [cursor=pointer]:
                  - /url: "#cite_ref-1"
                  - text: ^
