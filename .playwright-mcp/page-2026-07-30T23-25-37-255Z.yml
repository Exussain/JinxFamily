            - paragraph [ref=f5e297]:
              - generic [ref=f5e298]: Clash of Clans
              - text: is a
              - link "free-to-play" [ref=f5e299] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Free-to-play
              - link "mobile" [ref=f5e300] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Mobile_game
              - link "strategy video game" [ref=f5e301] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Strategy_video_game
              - text: developed and published by
              - link "Supercell" [ref=f5e302] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Supercell_(company)
              - text: . It was released for
              - link "iOS" [ref=f5e303] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/IOS
              - text: on 2 August 2012 and
              - link "Android" [ref=f5e304] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Android_(operating_system)
              - text: on 7 October 2013, and later
              - link "Windows" [ref=f5e305] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Windows
              - text: on 23 October 2023.
            - paragraph [ref=f5e306]:
              - text: The game is set in a fantasy-themed
              - superscript [ref=f5e307]:
                - link "[4]" [ref=f5e308] [cursor=pointer]:
                  - /url: "#cite_note-gbcoc-4"
              - link "persistent world" [ref=f5e309] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Persistent_world
              - superscript [ref=f5e310]:
                - link "[5]" [ref=f5e311] [cursor=pointer]:
                  - /url: "#cite_note-commto-5"
              - text: where the player is the chief of a village. Clash of Clans tasks players to build and upgrade their own village using the resources gained from attacking other players' villages with troops, earning rewards, buying them with medals, or producing them at their own village. Players can create clans with others – up to fifty in a clan – who then can participate in Clan Wars together, donate and receive troops, and chat with each other. Players can also build up a Clan Village called a Clan Capital.
              - superscript [ref=f5e312]:
                - link "[6]" [ref=f5e313] [cursor=pointer]:
                  - /url: "#cite_note-6"
            - paragraph [ref=f5e314]:
              - text: Clash of Clans received generally positive reviews from critics.; it is one of the highest-grossing mobile games of all time and a commercial success for Supercell, serving as a foundation of the company's
              - link "live service" [ref=f5e315] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Live_service_game
              - text: mobile games.
          - region [ref=f5e316]:
            - generic [ref=f5e317]:
              - heading "Gameplay" [level=2] [ref=f5e318]
              - generic [ref=f5e319]:
                - link "edit":
                  - /url: /w/index.php?title=Clash_of_Clans&action=edit&section=1
            - figure "A replay of gameplay, in which a player is attacking another player's village" [ref=f5e320]:
              - link [ref=f5e321] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/File:Clash_of_Clans_gameplay.jpg
            - paragraph [ref=f5e324]:
              - text: Clash of Clans is a
              - link "strategy video game" [ref=f5e325] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Strategy_video_game
              - text: with elements of
              - link "city-building games" [ref=f5e326] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/City-building_games
              - text: . Players build a village from the ground up, collecting and utilizing resources while also training troops to attack other players' villages to gain resources and trophies. Players can (and usually do) form communities called clans, which are groups of up to 50 people. Clan players can donate troops to each other and can go to war with other clans. There are multiple currencies or resources in the game, including Gold, Elixir, Dark Elixir, Gems and 3 different ores, Shiny Ore, Starry Ore, and Glowy Ore.
              - superscript [ref=f5e327]:
                - link "[4]" [ref=f5e328] [cursor=pointer]:
                  - /url: "#cite_note-gbcoc-4"
              - text: Gold and Elixir are used to build and upgrade buildings like defenses, resource collectors etc. Elixir and Dark Elixir are also used to upgrade army-related buildings, troops, spells, and heroes. In the past, they were also used to train the troops, but since July 2022, training has been made free.
              - superscript [ref=f5e329]:
                - link "[7]" [ref=f5e330] [cursor=pointer]:
                  - /url: "#cite_note-7"
            - paragraph [ref=f5e331]:
              - text: An update called Clash Anytime in March 2025 removed training time of troops, spells, and siege machines, as well as the recovery time of heroes.
              - superscript [ref=f5e332]:
                - link "[8]" [ref=f5e333] [cursor=pointer]:
                  - /url: "#cite_note-8"
              - superscript [ref=f5e334]:
                - link "[9]" [ref=f5e335] [cursor=pointer]:
                  - /url: "#cite_note-9"
            - paragraph [ref=f5e336]:
              - text: The most recent update from February 2026 includes the new Dragon Duke hero, the Greedy Raven pet, and Town Hall level 18.
              - superscript [ref=f5e337]:
                - link "[10]" [ref=f5e338] [cursor=pointer]:
                  - /url: "#cite_note-10"
            - paragraph [ref=f5e339]:
              - text: Gems are the premium currency. They can be earned by completing in-game achievements or bought using real money.
              - superscript [ref=f5e340]:
                - link "[4]" [ref=f5e341] [cursor=pointer]:
                  - /url: "#cite_note-gbcoc-4"
              - text: The 3 ores are all used to upgrade hero equipment, at different levels. Attacks are rated on a three-star scale and have a maximum timed length of three minutes.
              - superscript [ref=f5e342]:
                - link "[4]" [ref=f5e343] [cursor=pointer]:
                  - /url: "#cite_note-gbcoc-4"
            - paragraph [ref=f5e344]:
              - text: The game also features a single-player campaign in which the player can attack a series of villages held hostage by malevolent goblins
              - superscript [ref=f5e345]:
                - link "[11]" [ref=f5e346] [cursor=pointer]:
                  - /url: "#cite_note-tgcoc-11"
              - text: to earn resources; it is unique for being the only single-player campaign in a fully released game by Supercell.
            - paragraph [ref=f5e347]:
              - text: To perform any upgrade, an unassigned builder is needed. The player initially has one builder, but can have up to six builders. They are bought by using gems (up to 5th)
              - superscript [ref=f5e348]:
                - link "[12]" [ref=f5e349] [cursor=pointer]:
                  - /url: "#cite_note-12"
              - text: and the sixth is unlocked by completing a series of challenges in the Builder Base (another village).
              - superscript [ref=f5e350]:
                - link "[13]" [ref=f5e351] [cursor=pointer]:
                  - /url: "#cite_note-Newsweek-13"
            - region [ref=f5e352]:
              - generic [ref=f5e353]:
                - heading "Buildings" [level=3] [ref=f5e354]
                - generic [ref=f5e355]:
                  - link "edit":
                    - /url: /w/index.php?title=Clash_of_Clans&action=edit&section=2
              - paragraph [ref=f5e356]: To earn and store Gold and Elixir, players must build mines and storage buildings for each resource. Elixir is used to conduct research in the Laboratory to upgrade troops and to construct or upgrade certain buildings, primarily offensive ones. Gold is used to build defensive structures and to upgrade the Town Hall, which unlocks access to more buildings and higher levels for existing ones. At Town Hall 7, Dark Elixir becomes available. This resource is used to upgrade Dark Elixir troops, heroes such as the Barbarian King, and—starting at Town Hall 8—Dark Spells. To earn and store Dark Elixir, players must build Dark Elixir Drills and Dark Elixir Storages.
              - paragraph [ref=f5e357]:
                - text: There are several buildings available to the player to defend their village, including Cannons, Mortars, Archer Towers, Wizard Towers, Inferno Towers, Eagle Artillery, Scattershots, Monoliths, Air Defenses, Spell Towers, Clan Castle, Multi-Archer towers, and Ricochet Cannons. There are also traps, including Hidden Teslas, Bombs, Giant Bombs, Tornado Traps, Air Bombs, and Seeking Air Mines. Players can also build walls, which can be upgraded further as a player's town hall level increases.
                - superscript [ref=f5e358]:
                  - link "[14]" [ref=f5e359] [cursor=pointer]:
                    - /url: "#cite_note-Pocket-14"
                - superscript [ref=f5e360]:
                  - link "[15]" [ref=f5e361] [cursor=pointer]:
                    - /url: "#cite_note-148Apps-15"
                - text: As the Town Hall level increases, the player gets access to stronger buildings such as the Monolith, Eagle Artillery, and Inferno Towers.
                - superscript [ref=f5e362]:
                  - link "[16]" [ref=f5e363] [cursor=pointer]:
                    - /url: "#cite_note-TH12_release-16"
            - region [ref=f5e364]:
              - generic [ref=f5e365]:
                - heading "Troops and spells" [level=3] [ref=f5e366]
                - generic [ref=f5e367]:
                  - link "edit":
                    - /url: /w/index.php?title=Clash_of_Clans&action=edit&section=3
              - paragraph [ref=f5e368]:
                - text: The game has two kinds of barracks and spell factories, a basic version, a "dark" version. Initially, all of the basic versions were used to train troops using elixir, whereas the dark versions used dark elixir, and players would have to wait for troops to be trained and spells to be brewed ("training time"). However, an update in July 2022 made all troops free to train, with the primary limitation being space in the army camps.
                - superscript [ref=f5e369]:
                  - link "[17]" [ref=f5e370] [cursor=pointer]:
                    - /url: "#cite_note-17"
                - text: Later, in March 2025, an update removed all troop training times along with the requirement to heal heroes.
                - superscript [ref=f5e371]:
                  - link "[18]" [ref=f5e372] [cursor=pointer]:
                    - /url: "#cite_note-18"
                - text: Both sets of barracks and spell factories can be upgraded to higher levels to unlock more troops (eighteen total troops for the barracks, and twelve for the dark barracks).
              - paragraph [ref=f5e373]: "Each of the troops have their own group:"
              - list [ref=f5e374]:
                - listitem [ref=f5e375]:
                  - text: The Elixir Troops consist of Archers,
                  - link "Barbarians" [ref=f5e376] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Barbarian
                  - text: ", Balloons (piloted by bomb-wielding"
                  - link "skeletons" [ref=f5e377] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Skeleton_(undead)
                  - text: ),
                  - link "Dragons" [ref=f5e378] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Dragon
                  - text: (as well as baby dragons and electro dragons), Dragon Riders (skeletons riding dragon-shaped airplanes), Electro
                  - link "Titans" [ref=f5e379] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Titans
                  - text: ","
                  - link "Giants" [ref=f5e380] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Giant
                  - text: ","
                  - link "Goblins" [ref=f5e381] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Goblin
                  - text: ", Healers, Meteor"
                  - link "Golems" [ref=f5e382] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Golem
                  - text: made up of Meteormites,
                  - link "Miners" [ref=f5e383] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Miner
                  - text: ", P.E.K.K.A.s, Root Riders, Throwers (which resemble helmeted"
                  - link "Cyclopes" [ref=f5e384] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Cyclopes
                  - text: ), Wall Breakers (a bomb-wielding skeleton that targets walls),
                  - link "Wizards" [ref=f5e385] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Magician_(fantasy)
                  - text: ", and"
                  - link "Yetis" [ref=f5e386] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Yeti
                  - text: that spawn Yetimites.
                - listitem [ref=f5e387]:
                  - text: The Dark Elixir Troops consist of Apprentice Wardens, Bowlers,
                  - link "Druids" [ref=f5e388] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Druid
                  - text: ", Furnaces that spawn Firemites,"
                  - link "Golem" [ref=f5e389] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Golem
                  - text: ","
                  - link "Headhunter" [ref=f5e390] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Headhunting
                  - text: ","
                  - link "Hog" [ref=f5e391] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Pig
                  - text: Riders, Ice Golems, Lava
                  - link "Hounds" [ref=f5e392] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Hound
                  - text: ", Minions (which resemble blue"
                  - link "gargoyle" [ref=f5e393] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Gargoyle_(monster)
                  - text: "-like creatures),"
                  - link "Valkyries" [ref=f5e394] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Valkyrie
                  - text: ", and"
                  - link "Witches" [ref=f5e395] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Witch
                  - text: .
                - listitem [ref=f5e396]: The Heroes consist of Archer Queen, Barbarian King, Dragon Duke, Grand Warden, Minion Prince, and Royal Champion.
              - paragraph [ref=f5e397]:
                - text: At Town Hall 7, the Hero Hall can be built to unlock Heroes, powerful troops with abilities that can be activated during a battle.
                - superscript [ref=f5e398]:
                  - link "[19]" [ref=f5e399] [cursor=pointer]:
                    - /url: "#cite_note-19"
              - paragraph [ref=f5e400]:
                - text: At Town Hall 11, Super Troops are unlocked. Super Troops are troops that are more powerful than their elixir counterparts and have special abilities. Players can unlock a Super Troop for 3 days by spending Dark Elixir. Players are only allowed to have two Super Troops unlocked at any given time.
                - superscript [ref=f5e401]:
                  - link "[20]" [ref=f5e402] [cursor=pointer]:
                    - /url: "#cite_note-20"
                - text: .
              - list [ref=f5e403]:
                - listitem [ref=f5e404]: The Super Troops consist of the Super Barbarian, Super Archer, Sneaky Goblin, Super Wall Breaker, Super Giant, Rocket Balloon, Super Wizard, Super Dragon, Inferno Dragon, Super Minion, Super Valkyrie, Super Witch, Ice Hound, Super Bowler, Super Miner, Super Yeti, and Super Hog Rider.
              - paragraph [ref=f5e405]:
                - text: At Town Hall 12, the Workshop can be built to construct siege machines, which are powerful troop-like units that can house troops inside of them.
                - superscript [ref=f5e406]:
                  - link "[21]" [ref=f5e407] [cursor=pointer]:
                    - /url: "#cite_note-21"
              - paragraph [ref=f5e408]:
                - text: At Town Hall 14, the Pet House can be built to assign pets to heroes, each serving a different role in assisting a hero.
                - superscript [ref=f5e409]:
                  - link "[22]" [ref=f5e410] [cursor=pointer]:
                    - /url: "#cite_note-dotesports1-22"
            - region [ref=f5e411]:
              - generic [ref=f5e412]:
                - heading "Clans and Clan Wars" [level=3] [ref=f5e413]
                - generic [ref=f5e414]:
                  - link "edit":
                    - /url: /w/index.php?title=Clash_of_Clans&action=edit&section=4
              - paragraph [ref=f5e415]: Clans are groups of players who join to support each other, either by donating troops or offering advice. Players can join clans once they rebuild the Clan Castle. A major component of Clash of Clans is clans facing off against one another in Clan Wars. Clan leaders and co-leaders can initiate wars against other clans. Each clan is given one Preparation Day and one War Day.
              - paragraph [ref=f5e416]: "When a player attacks a member of the opposing clan, they earn stars based on the amount of destruction inflicted on the opponent's base: dealing 50% damage or more grants 1 star, destroying the Town Hall grants another, and destroying the base grants the third star. Each player is limited to two attacks per war, and the clan with the most stars at the end of War Day is declared the winner. If both clans earn the same number of stars, the winner is determined by which clan caused the greater percentage of destruction."
              - paragraph [ref=f5e417]:
                - text: "Players receive bonus war loot if they participate in the war by using their attacks. This loot varies depending on the base and is determined by Supercell: the top-ranked base receives the most war bonus loot, while the lowest-ranked receives the least. If the clan wins the war, the full bonus loot is awarded to the player. However, in the event of a loss or draw, only one-third of the bonus loot is delivered."
                - superscript [ref=f5e418]:
                  - link "[23]" [ref=f5e419] [cursor=pointer]:
                    - /url: "#cite_note-23"
              - paragraph [ref=f5e420]:
                - text: The available war sizes are 50v50, 40v40, 30v30, 25v25, 20v20, 15v15, 10v10, and 5v5.
                - superscript [ref=f5e421]:
                  - link "[24]" [ref=f5e422] [cursor=pointer]:
                    - /url: "#cite_note-24"
                - superscript [ref=f5e423]:
                  - link "[25]" [ref=f5e424] [cursor=pointer]:
                    - /url: "#cite_note-25"
                - superscript [ref=f5e425]:
                  - link "[26]" [ref=f5e426] [cursor=pointer]:
                    - /url: "#cite_note-26"
                - text: There were previously 35v35 and 45v45 sizes as well, but these were removed in the March 2016 update.
                - superscript [ref=f5e427]:
                  - link "[27]" [ref=f5e428] [cursor=pointer]:
                    - /url: "#cite_note-27"
                - superscript [ref=f5e429]:
                  - link "[28]" [ref=f5e430] [cursor=pointer]:
                    - /url: "#cite_note-28"
                - superscript [ref=f5e431]:
                  - link "[29]" [ref=f5e432] [cursor=pointer]:
                    - /url: "#cite_note-29"
                - text: In the May 2016 update, Friendly Challenges were introduced to allow clanmates to compete amongst other clanmates - however, these challenges do not provide loot or trophies and do not affect a player's army.
                - superscript [ref=f5e433]:
                  - link "[30]" [ref=f5e434] [cursor=pointer]:
                    - /url: "#cite_note-30"
                - text: In the October 2018 update, Clan War Leagues were introduced. Clans can fight seven other clans to advance to the next league and earn league medals by earning stars in Clan War Leagues. The clans in the group with the most stars will be promoted to a higher league, while the clans in the group with the fewest stars will be demoted to a lower league.
            - region [ref=f5e435]:
              - generic [ref=f5e436]:
                - heading "Builder Base" [level=3] [ref=f5e437]
                - generic [ref=f5e438]:
                  - link "edit":
                    - /url: /w/index.php?title=Clash_of_Clans&action=edit&section=5
              - figure "Gameplay from the original Builder Base mode, prior to the \"Builder Base 2.0\" update in 2023." [ref=f5e439]:
                - link [ref=f5e440] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Coc_attack.png
              - paragraph [ref=f5e443]:
                - text: Following an update on 22 May 2017, Supercell released the new "Builder Base" game mode to the game. It allows players to sail to a new island and create a new village with a different set of buildings.
                - superscript [ref=f5e444]:
                  - link "[31]" [ref=f5e445] [cursor=pointer]:
                    - /url: "#cite_note-31"
              - paragraph [ref=f5e446]:
                - text: In Clash of Clans' Builder Base 2.0 update, the Builder Base attack system was reworked, where players attack each other's bases sequentially instead of simultaneously. Players now alternate attacks across two stages of the opponent's base, with each stage having its own defenses and layout. The player who earns more stars across the two stages wins the battle. Rewards such as gold and elixir are granted based on getting a certain number of stars in a day (a maximum of 6 in a battle), while additional attacks help players climb the trophy leaderboard.
                - superscript [ref=f5e447]:
                  - link "[32]" [ref=f5e448] [cursor=pointer]:
                    - /url: "#cite_note-Clash_of_Clans-32"
              - paragraph [ref=f5e449]:
                - text: Players can spend gems to speed up the in-game time (which can be mined in the Gem Mine) or by using the Clock Tower (temporarily speeds up the process in the entire Builder Base). A new hero, the Battle Machine, was also introduced along with this update. In June 2019, Builder Hall level 9 was released.
                - superscript [ref=f5e450]:
                  - link "[13]" [ref=f5e451] [cursor=pointer]:
                    - /url: "#cite_note-Newsweek-13"
                - text: The May 2023 update brought Builder Hall 10, which is currently the highest Builder Hall level. The May 2023 update also brought the long-awaited Builder Base 2.0, with higher Builder Base levels having multiple levels to beat, and introducing many changes to the Builder Base, like new troop abilities and a new troop called the Electrofire Wizard. O.T.T.O, a secondary builder in the Builder Base, was also replaced by B.O.B in this update.
                - superscript [ref=f5e452]:
                  - link "[33]" [ref=f5e453] [cursor=pointer]:
                    - /url: "#cite_note-BB2-33"
            - region [ref=f5e454]:
              - generic [ref=f5e455]:
                - heading "Clan Games and Magic Items" [level=3] [ref=f5e456]
                - generic [ref=f5e457]:
                  - link "edit":
                    - /url: /w/index.php?title=Clash_of_Clans&action=edit&section=6
              - paragraph [ref=f5e458]:
                - text: In December 2017, Supercell introduced Clan Games, a feature where clan members could work together to complete tasks, which would then earn clan points. When enough points are accumulated, a new reward tier unlocks, and players can select one reward from each unlocked tier. This update also introduced Magic Items, obtainable as rewards from Clan Games and through events. These items can be used, e.g., to get resources, finish upgrades, or briefly add levels to troops or heroes.
                - superscript [ref=f5e459]:
                  - link "[34]" [ref=f5e460] [cursor=pointer]:
                    - /url: "#cite_note-34"
                - superscript [ref=f5e461]:
                  - link "[35]" [ref=f5e462] [cursor=pointer]:
                    - /url: "#cite_note-35"
            - region [ref=f5e463]:
              - generic [ref=f5e464]:
                - heading "Clan Capital" [level=3] [ref=f5e465]
                - generic [ref=f5e466]:
                  - link "edit":
                    - /url: /w/index.php?title=Clash_of_Clans&action=edit&section=7
              - paragraph [ref=f5e467]:
                - text: The Clan Capital is the central hub where the entire clan contributes to the construction and upgrading of a massive base. Every member of a clan is able to contribute to building a new region to strengthen its defenses and upgrade its troops. A clan will try to defeat other clans' Capitals over the course of a Raid Weekend. Capital Gold is earned during raids to upgrade and improve the Capital, but also Raid Medals that can be used to purchase items for players' villages. Reinforcement troops can be purchased without having to wait for other clanmates to donate.
                - superscript [ref=f5e468]:
                  - link "[36]" [ref=f5e469] [cursor=pointer]:
                    - /url: "#cite_note-36"
                - text: In December 2022, player decorations for their Capital Peak houses were introduced.
                - superscript [ref=f5e470]:
                  - link "[37]" [ref=f5e471] [cursor=pointer]:
                    - /url: "#cite_note-37"
            - region [ref=f5e472]:
              - generic [ref=f5e473]:
                - heading "Hero Equipments and Ores" [level=3] [ref=f5e474]
                - generic [ref=f5e475]:
                  - link "edit":
                    - /url: /w/index.php?title=Clash_of_Clans&action=edit&section=8
              - paragraph [ref=f5e476]:
                - text: Hero Equipments were introduced in December 2023, available to players above Town Hall 8.
                - superscript [ref=f5e477]:
                  - link "[38]" [ref=f5e478] [cursor=pointer]:
                    - /url: "#cite_note-38"
                - text: Hero Equipments allow the player to customize their Heroes' special abilities according to their strategy using the Blacksmith. Ores were introduced as a resource used to advance Hero Equipments to higher levels, consisting of Shiny, Glowy, and Starry types.
          - region [ref=f5e479]:
            - generic [ref=f5e480]:
              - heading "Development, release, and marketing" [level=2] [ref=f5e481]
              - generic [ref=f5e482]:
                - link "edit":
                  - /url: /w/index.php?title=Clash_of_Clans&action=edit&section=9
            - figure [ref=f5e483]:
              - link [ref=f5e484] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/File:Clash_of_Clans-_Designing_Games_That_People_Will_Play_For_Years_(16119522833).jpg
              - generic [ref=f5e486]:
                - text: Jonas Collaros, one of the programmers of Clash of Clans, speaks about the game's design at the 2015
                - link "GDC" [ref=f5e487] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Game_Developers_Conference
                - text: .
            - paragraph [ref=f5e488]:
              - text: Clash of Clans was developed by
              - link "Supercell" [ref=f5e489] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Supercell_(video_game_company)
              - text: ", the company behind other popular mobile games like"
              - link "Hay Day" [ref=f5e491] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Hay_Day
              - text: and
              - link "Brawl Stars" [ref=f5e493] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Brawl_Stars
              - text: .
              - superscript [ref=f5e494]:
                - link "[39]" [ref=f5e495] [cursor=pointer]:
                  - /url: "#cite_note-39"
              - text: The game took six months to develop with the gameplay changing little over the course of development.
              - superscript [ref=f5e496]:
                - link "[40]" [ref=f5e497] [cursor=pointer]:
                  - /url: "#cite_note-Chartrush-40"
              - text: According to Supercell's Lasse Louhento, the development team encountered no major hurdles during this time.
              - superscript [ref=f5e498]:
                - link "[40]" [ref=f5e499] [cursor=pointer]:
                  - /url: "#cite_note-Chartrush-40"
              - text: Inspiration for the game included the games
              - link "Backyard Monsters" [ref=f5e501] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Backyard_Monsters
              - text: and
              - link "Travian" [ref=f5e503] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Travian
              - text: with the art style being influenced by old
              - link "Super NES" [ref=f5e504] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Super_NES
              - text: and
              - link "arcade games" [ref=f5e505] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Arcade_game
              - text: .
              - superscript [ref=f5e506]:
                - link "[40]" [ref=f5e507] [cursor=pointer]:
                  - /url: "#cite_note-Chartrush-40"
              - text: Initially, the art style was more cartoon based, but this was changed as the team worried it would alienate the more hardcore segment of their audience.
              - superscript [ref=f5e508]:
                - link "[41]" [ref=f5e509] [cursor=pointer]:
                  - /url: "#cite_note-keystosuccess-41"
              - text: Throughout most of development the game was multiplayer-only - however, after
              - link "focus testing" [ref=f5e510] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Focus_testing
              - text: ", Supercell added a"
              - link "single-player" [ref=f5e511] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Single-player
              - text: mode.
              - superscript [ref=f5e512]:
                - link "[40]" [ref=f5e513] [cursor=pointer]:
                  - /url: "#cite_note-Chartrush-40"
              - text: The game was released for
              - link "iOS" [ref=f5e514] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/IOS
              - text: platforms on 2 August 2012,
              - superscript [ref=f5e515]:
                - link "[1]" [ref=f5e516] [cursor=pointer]:
                  - /url: "#cite_note-iOS-1"
              - text: and on
              - link "Google Play" [ref=f5e517] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Google_Play
              - text: for
              - link "Android" [ref=f5e518] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Android_(operating_system)
              - text: on 7 October 2013.
              - superscript [ref=f5e519]:
                - link "[2]" [ref=f5e520] [cursor=pointer]:
                  - /url: "#cite_note-Android-2"
            - paragraph [ref=f5e521]:
              - text: In 2016, an animated web series based on the game, Clash-A-Rama!, began being released to YouTube by Supercell. A comedic spin on the game, it was produced by Tolerable Entertainment with animation by
              - link "Rough Draft Studios" [ref=f5e522] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Rough_Draft_Studios
              - text: ; voice actors such as
              - link "Tom Kenny" [ref=f5e523] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Tom_Kenny
              - text: and
              - link "Charlie Adler" [ref=f5e524] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Charlie_Adler
              - text: were involved in voice acting.
              - superscript [ref=f5e525]:
                - link "[42]" [ref=f5e526] [cursor=pointer]:
                  - /url: "#cite_note-42"
            - paragraph [ref=f5e527]:
              - text: In February 2015 Supercell released their Clash of Clans
              - link "Super Bowl XLIX" [ref=f5e528] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Super_Bowl_XLIX
              - text: commercial, featuring
              - link "Liam Neeson" [ref=f5e529] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Liam_Neeson
              - text: parodying his character from
              - link "Taken" [ref=f5e531] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Taken_(film)
              - text: .
              - superscript [ref=f5e532]:
                - link "[43]" [ref=f5e533] [cursor=pointer]:
                  - /url: "#cite_note-43"
              - text: On 2 February
              - link "Business Insider" [ref=f5e535] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Business_Insider
              - text: reported the ad as the fifth most watched Super Bowl ad,
              - superscript [ref=f5e536]:
                - link "[44]" [ref=f5e537] [cursor=pointer]:
                  - /url: "#cite_note-44"
              - text: though on 6 February
              - link "VentureBeat" [ref=f5e539] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/VentureBeat
              - text: reported the ad was the most viewed of those that appeared on the Super Bowl.
              - superscript [ref=f5e540]:
                - link "[45]" [ref=f5e541] [cursor=pointer]:
                  - /url: "#cite_note-45"
              - link "YouTube" [ref=f5e542] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/YouTube
              - text: users later voted the advertisement the second-best Super Bowl ad, behind
              - link "Nissan's" [ref=f5e543] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Nissan
              - text: "\"With Dad\" ad."
              - superscript [ref=f5e544]:
                - link "[46]" [ref=f5e545] [cursor=pointer]:
                  - /url: "#cite_note-46"
            - paragraph [ref=f5e546]:
              - text: On 1 May 2024, Supercell announced a collaboration with the footballer
              - link "Erling Haaland" [ref=f5e547] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Erling_Haaland
              - text: with the "Clash With Haaland" event that would run until the end of the month. The event was announced with a video in which Haaland is captured by Clash of Clans troops who are searching for the "world's greatest attacker" and transport him into the game. The trailer also features a Clash of Clans remix of CTID's "Haaland (Ha Ha Ha)" song.
              - superscript [ref=f5e548]:
                - link "[47]" [ref=f5e549] [cursor=pointer]:
                  - /url: "#cite_note-47"
              - text: The event featured two temporary football-themed troops, a temporary spell, challenge levels, and football-inspired skins of heroes. Supercell claims that Haaland plays the game in his free time and that the first challenge level is his actual base.
              - superscript [ref=f5e550]:
                - link "[48]" [ref=f5e551] [cursor=pointer]:
                  - /url: "#cite_note-48"
            - paragraph [ref=f5e552]:
              - text: On 20 May 2025, Supercell announced an animated series adaptation for
              - link "Netflix" [ref=f5e553] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Netflix
              - text: ; it will be produced by Supercell and
              - link "Netflix Animation" [ref=f5e554] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Netflix_Animation
              - text: .
              - superscript [ref=f5e555]:
                - link "[49]" [ref=f5e556] [cursor=pointer]:
                  - /url: "#cite_note-49"
          - region [ref=f5e557]:
            - generic [ref=f5e558]:
              - heading "Reception" [level=2] [ref=f5e559]
              - generic [ref=f5e560]:
                - link "edit":
                  - /url: /w/index.php?title=Clash_of_Clans&action=edit&section=10
