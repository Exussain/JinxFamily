                      - superscript [ref=f5e602]:
                        - link "[53]" [ref=f5e603] [cursor=pointer]:
                          - /url: "#cite_note-Gamezebo-53"
                  - row [ref=f5e604]:
                    - cell "Modojo" [ref=f5e605]
                    - cell [ref=f5e606]:
                      - text: 3/5
                      - superscript [ref=f5e607]:
