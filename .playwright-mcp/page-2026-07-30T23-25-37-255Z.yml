            - region [ref=f5e628]:
              - generic [ref=f5e629]:
                - heading "Critical reception" [level=3] [ref=f5e630]
                - generic [ref=f5e631]:
                  - link "edit":
                    - /url: /w/index.php?title=Clash_of_Clans&action=edit&section=11
              - paragraph [ref=f5e632]:
                - text: Clash of Clans has received generally positive reviews. The iOS version holds an aggregate score of 74 out of 100 on
                - link "Metacritic" [ref=f5e633] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Metacritic
                - text: ","
                - superscript [ref=f5e634]:
                  - link "[51]" [ref=f5e635] [cursor=pointer]:
                    - /url: "#cite_note-MC-51"
                - text: and 80% on
                - link "GameRankings" [ref=f5e636] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/GameRankings
                - text: .
                - superscript [ref=f5e637]:
                  - link "[50]" [ref=f5e638] [cursor=pointer]:
                    - /url: "#cite_note-GR-50"
              - paragraph [ref=f5e639]:
                - link "Gamezebo" [ref=f5e641] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Gamezebo
                - generic [ref=f5e642]: "'"
                - text: s Leif Johnson was impressed, scoring the game 4.5 out of 5. Although he felt the gameplay was heavily skewed to encourage the player to purchase gems, he praised the addition of a single-player campaign. He concluded that "Clash of Clans is a simple game, but that's more of a strength than a weakness. It's simple enough to provide quick, painless matches on an
                - link "iPhone" [ref=f5e643] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/IPhone
                - text: in an idle moment, and there are enough different units to choose from in the battle mode to make playing against other players endlessly rewarding. Best of all, the option to fight against
                - link "NPC" [ref=f5e644] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Non-player_character
                - text: goblins gives Clash of Clans a small edge over similar strategy games that rely almost entirely on player-versus-player combat."
                - superscript [ref=f5e645]:
                  - link "[53]" [ref=f5e646] [cursor=pointer]:
                    - /url: "#cite_note-Gamezebo-53"
              - paragraph [ref=f5e647]:
                - generic [ref=f5e648]:
                  - link "Pocket Gamer" [ref=f5e649] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Pocket_Gamer
                  - text: "'"
                - text: s Peter Willington was equally impressed, scoring the game 9 out of 10 and giving it a "Gold Award". Reviewing the game several months after it was released for iOS devices, Willington praised the game for requiring real strategy to play. He wrote that the gameplay was built on the progression of "requiring more and more sophisticated units, asking you to strategize and really think about which elements you should focus on building within your camp." He concluded that "Clash of Clans is a superb game,
                - link "freemium" [ref=f5e650] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Freemium
                - text: or otherwise, with more nuance than most give it credit for. That's why it's passed the test of time since its launch and still has an active community devotedly constructing elaborate fortresses in the hope of becoming invincible."
                - superscript [ref=f5e651]:
                  - link "[14]" [ref=f5e652] [cursor=pointer]:
                    - /url: "#cite_note-Pocket-14"
              - paragraph [ref=f5e653]:
                - text: 148Apps
                - generic [ref=f5e654]: "'"
                - text: s Rob Rich scored the game 3.5 out of 5, writing "It's great to play an online freemium game that doesn't shy away from the single-player experience but also offers up some honest-to-goodness direct interaction, which is a very rare combination these days. It probably won't warm the hearts of any haters out there, but it does give genre fans something with a bit more action and strategy than they might be used to."
                - superscript [ref=f5e655]:
                  - link "[15]" [ref=f5e656] [cursor=pointer]:
                    - /url: "#cite_note-148Apps-15"
                - text: Tom's Guide enjoyed the player interaction.
                - superscript [ref=f5e657]:
                  - link "[11]" [ref=f5e658] [cursor=pointer]:
                    - /url: "#cite_note-tgcoc-11"
              - paragraph [ref=f5e659]:
                - text: Modojo's John Bedford scored the game 3 out of 5. He was critical of freemium gaming in general, writing "The novelty hasn't just worn off this particular style of greedy gaming, it's shriveled up and condensed itself into an infinitely dense singularity of self-loathing." Of the game itself, he concluded, "This is a game that follows in the footsteps of no small number of titles that have made feverish demands on our wallets in exchange for just a slightly thicker slice of the gameplay. You may have an unending appetite for these
                - link "micromanagement" [ref=f5e660] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Micromanagement
                - text: titles, in which case we recommend getting heartily stuck into Supercell's latest game. While Clash of Clans brings something new to accompany its competent but unexceptional empire gameplay, for most of us it'll be a case of too little, too late."
                - superscript [ref=f5e661]:
                  - link "[54]" [ref=f5e662] [cursor=pointer]:
                    - /url: "#cite_note-Modojo-54"
            - region [ref=f5e663]:
              - generic [ref=f5e664]:
                - heading "Commercial reception" [level=3] [ref=f5e665]
                - generic [ref=f5e666]:
                  - link "edit":
                    - /url: /w/index.php?title=Clash_of_Clans&action=edit&section=12
              - paragraph [ref=f5e667]:
                - text: Clash of Clans became an
                - link "App Store" [ref=f5e668] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/App_Store_(iOS)
                - text: top 5 download between December 2012 and May 2013,
                - superscript [ref=f5e669]:
                  - link "[56]" [ref=f5e670] [cursor=pointer]:
                    - /url: "#cite_note-56"
                - text: and this success has been described as helping to usher in a new era in single-player gaming on mobile devices.
                - superscript [ref=f5e671]:
                  - link "[57]" [ref=f5e672] [cursor=pointer]:
                    - /url: "#cite_note-57"
                - superscript [ref=f5e673]:
                  - link "[58]" [ref=f5e674] [cursor=pointer]:
                    - /url: "#cite_note-58"
              - paragraph [ref=f5e675]:
                - text: In 2013 Clash of Clans was the third-highest game in revenue generated on the App Store and number one on
                - link "Google Play" [ref=f5e676] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Google_Play
                - text: .
                - superscript [ref=f5e677]:
                  - link "[59]" [ref=f5e678] [cursor=pointer]:
                    - /url: "#cite_note-59"
              - paragraph [ref=f5e679]:
                - text: In February 2014 it was reported that the game was generating US$654,000 in daily revenue for Supercell.
                - superscript [ref=f5e680]:
                  - link "[60]" [ref=f5e681] [cursor=pointer]:
                    - /url: "#cite_note-gpd-60"
              - paragraph [ref=f5e682]:
                - text: In 2015, the game was the top-grossing app on both the App Store and Google Play, with an estimated revenue of 1.5 million dollars per day.
                - superscript [ref=f5e683]:
                  - link "[61]" [ref=f5e684] [cursor=pointer]:
                    - /url: "#cite_note-61"
                - superscript [ref=f5e685]:
                  - link "[62]" [ref=f5e686] [cursor=pointer]:
                    - /url: "#cite_note-62"
              - paragraph [ref=f5e687]:
                - text: It was the fourth most installed app in the App Store and the seventh most installed app in the Play Store, where it had amassed 500 million downloads by 2018.
                - superscript [ref=f5e688]:
                  - link "[63]" [ref=f5e689] [cursor=pointer]:
                    - /url: "#cite_note-63"
                - superscript [ref=f5e690]:
                  - link "[64]" [ref=f5e691] [cursor=pointer]:
                    - /url: "#cite_note-:0-64"
              - paragraph [ref=f5e692]:
                - text: As of 2018 Clash of Clans has generated more revenue than any other app on the App Store,
                - superscript [ref=f5e693]:
                  - link "[64]" [ref=f5e694] [cursor=pointer]:
                    - /url: "#cite_note-:0-64"
                - text: having brought in a revenue of over $6.4 billion since its launch.
                - superscript [ref=f5e695]:
                  - link "[65]" [ref=f5e696] [cursor=pointer]:
                    - /url: "#cite_note-65"
              - paragraph [ref=f5e697]:
                - text: As of 2020 Clash of Clans remains in the top 50 grossing apps in both the Play Store and App Store, more than eight years following its release in 2012.
                - superscript [ref=f5e698]:
                  - link "[66]" [ref=f5e699] [cursor=pointer]:
                    - /url: "#cite_note-66"
                - superscript [ref=f5e700]:
                  - link "[67]" [ref=f5e701] [cursor=pointer]:
                    - /url: "#cite_note-67"
          - region [ref=f5e702]:
            - generic [ref=f5e703]:
              - heading "Legacy" [level=2] [ref=f5e704]
              - generic [ref=f5e705]:
                - link "edit":
                  - /url: /w/index.php?title=Clash_of_Clans&action=edit&section=13
            - paragraph [ref=f5e706]:
              - text: Four spin-off games in the same universe of Clash of Clans were developed by Supercell. The first,
              - link "Clash Royale" [ref=f5e708] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Clash_Royale
              - text: ", was released in 2016."
              - superscript [ref=f5e709]:
                - link "[68]" [ref=f5e710] [cursor=pointer]:
                  - /url: "#cite_note-68"
              - text: The other three, Clash Quest, Clash Mini, and Clash Heroes, were announced in April 2021.
              - superscript [ref=f5e711]:
                - link "[69]" [ref=f5e712] [cursor=pointer]:
                  - /url: "#cite_note-clash.com2-69"
              - superscript [ref=f5e713]:
                - link "[70]" [ref=f5e714] [cursor=pointer]:
                  - /url: "#cite_note-70"
              - text: Clash Quest development was discontinued on 17 August 2022.
              - superscript [ref=f5e715]:
                - link "[71]" [ref=f5e716] [cursor=pointer]:
                  - /url: "#cite_note-71"
              - text: On 13 March 2024 Supercell announced that development on Clash Mini would also end, but elements from it would be brought to Clash Royale.
              - superscript [ref=f5e717]:
                - link "[72]" [ref=f5e718] [cursor=pointer]:
                  - /url: "#cite_note-72"
              - text: Supercell announced on 24 June 2024 that development on Clash Heroes had been terminated in favor of a replacement named Project R.I.S.E.
              - superscript [ref=f5e719]:
                - link "[73]" [ref=f5e720] [cursor=pointer]:
                  - /url: "#cite_note-73"
            - paragraph [ref=f5e721]:
              - text: In 2016, an animated web series based on the game and
              - link "Clash Royale" [ref=f5e723] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Clash_Royale
              - text: ", titled Clash-A-Rama!, began. The show was released on"
              - link "YouTube" [ref=f5e724] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/YouTube
              - text: by Supercell. It is a comedic spin on the game and was produced by Tolerable Entertainment with animation by
              - link "Rough Draft Studios" [ref=f5e725] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Rough_Draft_Studios
              - text: .
            - paragraph [ref=f5e726]:
              - text: In May 2025, Supercell announced a fully CGI animated series of the game on
              - link "Netflix" [ref=f5e727] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Netflix
              - text: now in pre-production, with Fletcher Moules as showrunner and executive producer alongside
              - link "Ron Weiner" [ref=f5e728] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Ron_Weiner
              - text: while animation will be provided by ICON Creative Studio. Unlike Crash-A-Rama, the series will follow a barbarian and his band of misfits defend their village while navigating through the politics of war.
              - superscript [ref=f5e729]:
                - link "[74]" [ref=f5e730] [cursor=pointer]:
                  - /url: "#cite_note-74"
          - region [ref=f5e731]:
