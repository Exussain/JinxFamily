                - /url: https://en.wikipedia.org/wiki/IOS
              - text: . Released as a
              - link "free-to-play" [ref=f3e291] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Free-to-play
              - text: title as part of the
              - link "Call of Duty" [ref=f3e293] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Call_of_Duty
              - text: video game series, it was one of the largest
              - link "mobile game" [ref=f3e294] [cursor=pointer]:
