            - paragraph [ref=f3e527]:
              - text: "Call of Duty: Mobile received \"generally favorable reviews\", according to the"
              - link "review aggregator" [ref=f3e528] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Review_aggregator
              - link "Metacritic" [ref=f3e529] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Metacritic
              - text: .
              - superscript [ref=f3e530]:
                - link "[36]" [ref=f3e531] [cursor=pointer]:
                  - /url: "#cite_note-MCiOS-36"
              - link "IGN" [ref=f3e533] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/IGN
              - text: wrote that the game "represents the best the juggernaut franchise has ever been on a handheld platform. The leveling path is rewarding, even without spending money, and there are lots of modes to jump around between, including an impressive battle royale mode."
              - superscript [ref=f3e534]:
                - link "[42]" [ref=f3e535] [cursor=pointer]:
                  - /url: "#cite_note-IGNiOS-42"
              - link "GameSpot" [ref=f3e537] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/GameSpot
              - text: "says \"beyond its messy micro-transaction menus and the slight time-saving purchases, there's not much else in Call of Duty: Mobile that detracts from its faithful recreation of the exhilarating and fast-paced multiplayer action of the core series.\""
              - superscript [ref=f3e538]:
                - link "[40]" [ref=f3e539] [cursor=pointer]:
                  - /url: "#cite_note-GSpotiOS-40"
              - link "Polygon" [ref=f3e541] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Polygon_(website)
              - text: "also praised the game stating, \"Call of Duty: Mobile doesn't come across like a deeply compromised or watered-down rendition of the age-old multiplayer format; it just feels like Call of Duty.\""
              - superscript [ref=f3e542]:
                - link "[44]" [ref=f3e543] [cursor=pointer]:
                  - /url: "#cite_note-44"
            - paragraph [ref=f3e544]:
              - text: In the first month, the game had over 148 million downloads and generated nearly US$54 million in revenue, making it the largest mobile game launch in history.
              - superscript [ref=f3e545]:
                - link "[45]" [ref=f3e546] [cursor=pointer]:
                  - /url: "#cite_note-45"
              - text: By June 2020, the game had generated over $327 million in revenue, and had seen over 250 million downloads.
              - superscript [ref=f3e547]:
                - link "[46]" [ref=f3e548] [cursor=pointer]:
                  - /url: "#cite_note-46"
              - superscript [ref=f3e549]:
                - link "[47]" [ref=f3e550] [cursor=pointer]:
                  - /url: "#cite_note-47"
              - superscript [ref=f3e551]:
                - link "[48]" [ref=f3e552] [cursor=pointer]:
                  - /url: "#cite_note-48"
              - text: By October 2020, that figure had risen to over $480 million with 270 million downloads.
              - superscript [ref=f3e553]:
                - link "[49]" [ref=f3e554] [cursor=pointer]:
                  - /url: "#cite_note-49"
              - text: As of February 2022, the game has generated over $1.5 billion globally in revenue from in-game spending and microtransactions,
              - superscript [ref=f3e555]:
                - link "[50]" [ref=f3e556] [cursor=pointer]:
                  - /url: "#cite_note-50"
              - text: with the game having seen over 500 million downloads by May 2021.
              - superscript [ref=f3e557]:
                - link "[51]" [ref=f3e558] [cursor=pointer]:
                  - /url: "#cite_note-51"
              - text: By November 2024, the game had amassed more than $3 billion in revenue, with the game having achieved over 1 billion downloads.
              - superscript [ref=f3e559]:
                - link "[52]" [ref=f3e560] [cursor=pointer]:
                  - /url: "#cite_note-52"
