          - region [ref=f3e299]:
            - generic [ref=f3e300]:
              - heading "Gameplay" [level=2] [ref=f3e301]
              - generic [ref=f3e302]:
                - link "edit":
                  - /url: /w/index.php?title=Call_of_Duty:_Mobile&action=edit&section=1
            - figure [ref=f3e303]:
              - link [ref=f3e304] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/File:CoD-Mobile-Gameplay.jpg
              - generic [ref=f3e306]:
                - text: "Gameplay of Call of Duty: Mobile. The game completely copies the previous \"older\" parts of its series (the picture shows the Crossfire map from the"
                - link "Modern Warfare" [ref=f3e308] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Call_of_Duty_4:_Modern_Warfare
                - text: subseries).
            - paragraph [ref=f3e309]:
              - text: The game's two primary modes are
              - link "multiplayer" [ref=f3e310] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Multiplayer_video_game
              - text: and
              - link "battle royale" [ref=f3e311] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Battle_royale_game
              - text: ". Players can choose to play ranked or non-ranked matches. Apart from standard matchmaking, a private room for both of these modes can also be accessed where players can invite and battle with their in-game friends. The game includes two types of in-game currencies: \"Credits\", which are earned through playing the game, and \"COD Points\", which are bought with real-world money. It is possible to play the full game without paying, though some exclusive character and weapon skins can only be bought with COD Points."
            - paragraph [ref=f3e312]: "Additional modes include Zombies, which can be played in a more traditional \"Endless\" mode and in a new \"Raid\" mode where players survive for a fixed number of rounds and fight a boss afterward, and \"DMZ: Recon\", an adaptation of Call of Duty: Modern Warfare II's DMZ extraction mode, where players can fight against AI enemies and other players to extract loot and weapons for cosmetic rewards."
          - region [ref=f3e313]:
            - generic [ref=f3e314]:
              - heading "Seasonal updates" [level=2] [ref=f3e315]
              - generic [ref=f3e316]:
                - link "edit":
                  - /url: /w/index.php?title=Call_of_Duty:_Mobile&action=edit&section=2
            - paragraph [ref=f3e317]:
              - text: "Call of Duty: Mobile has a seasonal update system. New weapons, skins, maps, and limited-time events are added through the Battle Pass each season."
              - superscript [ref=f3e318]:
                - link "[1]" [ref=f3e319] [cursor=pointer]:
                  - /url: "#cite_note-1"
              - text: Seasons also include special challenges and game modes that reward players with in-game items and experience points.
              - superscript [ref=f3e320]:
                - link "[2]" [ref=f3e321] [cursor=pointer]:
                  - /url: "#cite_note-2"
              - text: This system helps keep players engaged and keeps the game fresh each season.
            - paragraph [ref=f3e322]:
              - text: Characters, weapon skins, and events are all designed with a specific theme in mind for each season. These themes frequently show teamwork, futuristic details, or military environments. Each season has a similar identity because to the theme-based format. The Battle Pass is divided into free and premium tiers. Players can unlock rewards. Character skins and special decorations are examples of premium prizes. Seasonal updates often include limited-time events.
              - superscript [ref=f3e323]:
                - link "[3]" [ref=f3e324] [cursor=pointer]:
                  - /url: "#cite_note-3"
              - text: . Special objectives, changing game modes, and login rewards are frequently included in these events. Rewards are no longer available after the event finishes. Season updates also include technical improvements and bug fixes. Developers can adjust weapon performance and game mechanics to maintain balance. These updates support the game's long-term development as a live service title.
              - superscript [ref=f3e325]:
                - link "[4]" [ref=f3e326] [cursor=pointer]:
                  - /url: "#cite_note-4"
            - region [ref=f3e327]:
              - generic [ref=f3e328]:
                - heading "Multiplayer" [level=3] [ref=f3e329]
                - generic [ref=f3e330]:
                  - link "edit":
                    - /url: /w/index.php?title=Call_of_Duty:_Mobile&action=edit&section=3
              - paragraph [ref=f3e331]:
                - text: The multiplayer mode is a
                - link "first-person shooter" [ref=f3e332] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/First-person_shooter
                - text: similar to previous
                - link "Call of Duty games" [ref=f3e333] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Call_of_Duty
                - text: . The game also has 'Scorestreaks,' which are special weapons that become available as the player reaches certain point thresholds. The primary modes which the game features include
                - link "Team Deathmatch" [ref=f3e334] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Deathmatch_(video_games)#Variations
                - text: ", Frontline, Domination, Hardpoint, Search and Destroy, Control, Free For All, and Kill Confirmed. Additionally, the game features special and limited multiplayer modes that last for varying lengths of time. These include:"
                - link "Prop Hunt" [ref=f3e336] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Garry's_Mod#Prop_Hunt
                - text: ","
                - superscript [ref=f3e337]:
                  - link "[5]" [ref=f3e338] [cursor=pointer]:
                    - /url: "#cite_note-5"
                - text: Rapid Fire, Sticks and Stones,
                - superscript [ref=f3e339]:
                  - link "[6]" [ref=f3e340] [cursor=pointer]:
                    - /url: "#cite_note-6"
                - text: 2v2,
                - superscript [ref=f3e341]:
                  - link "[7]" [ref=f3e342] [cursor=pointer]:
                    - /url: "#cite_note-7"
                - text: Capture the Flag,
                - superscript [ref=f3e343]:
                  - link "[8]" [ref=f3e344] [cursor=pointer]:
                    - /url: "#cite_note-8"
                - text: One Shot One Kill,
                - superscript [ref=f3e345]:
                  - link "[9]" [ref=f3e346] [cursor=pointer]:
                    - /url: "#cite_note-9"
                - text: Snipers Only,
                - superscript [ref=f3e347]:
                  - link "[10]" [ref=f3e348] [cursor=pointer]:
                    - /url: "#cite_note-10"
                - text: Gun Game,
                - superscript [ref=f3e349]:
                  - link "[11]" [ref=f3e350] [cursor=pointer]:
                    - /url: "#cite_note-11"
                - text: and Attack of the Undead among others.
            - region [ref=f3e351]:
              - generic [ref=f3e352]:
                - heading "Battle Royale" [level=3] [ref=f3e353]
                - generic [ref=f3e354]:
                  - link "edit":
                    - /url: /w/index.php?title=Call_of_Duty:_Mobile&action=edit&section=4
              - paragraph [ref=f3e355]:
                - text: The game also includes
                - link "battle royale" [ref=f3e356] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Battle_royale_game
                - text: modes featuring up to 100 players. Players can choose to play solo, in a duo, or in a four-man squad. At the start of a match, all players choose an ability from
                - link "healing" [ref=f3e357] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Healing
                - text: to making a
                - link "launch pad" [ref=f3e358] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Launch_pad
                - text: . Once all 100 players are ready, they board a transport plane that flies across the
                - link "map" [ref=f3e359] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Map
                - text: in a randomized trajectory. This flight path changes every game. Every team is automatically given a jump leader who decides when and where the team will land, However, players can choose to break away and jump independently if they prefer.
                - superscript [ref=f3e360]:
                  - link "[12]" [ref=f3e361] [cursor=pointer]:
                    - /url: "#cite_note-12"
              - paragraph [ref=f3e362]: "Each player starts with a melee as their only weapon. Scattered across the map are various weapons, vehicles, and equipment that players can use to eliminate enemies and increase their chances of survival. The mode has high tier loot zones (marked in yellow on the map) that provide players with better items. The safe zone gradually shrinks as the match progresses, forcing players to move inward. Those who remain outside the zone for too long will take continuous damage and eventually be eliminated. The last surviving player or team wins the match. Battle royale also has limited modes like Battle Royale Isolated, Battle Royale Alcatraz, Battle Royale Blackout, Battle Royale Krai, and Battle Royale Blitz. The game also features a first-person shooter mode known as DMZ: Recon, which is an extraction based game mode (in effect as of 2025)."
            - region [ref=f3e363]:
              - generic [ref=f3e364]:
                - heading "Additional Battle royale Info" [level=3] [ref=f3e365]
                - generic [ref=f3e366]:
                  - link "edit":
                    - /url: /w/index.php?title=Call_of_Duty:_Mobile&action=edit&section=5
              - list [ref=f3e367]:
                - listitem [ref=f3e368]: "Revive System: Some battle royale modes allow players to revive teammates if they collect their dog tags within a limited time."
                - listitem [ref=f3e369]: "Airdrops: Supply drops periodically fall from the sky, containing rare weapons, armor, and perks."
                - listitem [ref=f3e370]: "Classes: Players can choose from different character classes, such as Scout, Ninja, Medic, Defender, and more, each with unique abilities."
                - listitem [ref=f3e371]: "Boss Fights: Some maps include AI-controlled bosses, such as the Butcher, which drop high-tier loot when defeated."
                - listitem [ref=f3e372]: "Vehicles: The game features land, air, and water vehicles, such as ATVs, helicopters, and boats, which help players traverse the map quickly."
                - listitem [ref=f3e373]: "Customization: Players can modify their loadouts with custom weapons, perks, and attachments before the match begins."
            - region [ref=f3e374]:
              - generic [ref=f3e375]:
                - heading "Zombies" [level=3] [ref=f3e376]
                - generic [ref=f3e377]:
                  - link "edit":
                    - /url: /w/index.php?title=Call_of_Duty:_Mobile&action=edit&section=6
              - paragraph [ref=f3e378]:
                - text: A
                - link "Zombies" [ref=f3e379] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Zombie
                - text: mode was added in November 2019. It featured one map called Shi No Numa. It placed teams of players against zombies that attacked in waves. It was playable in Endless Survival Mode, which ran like the classic
                - 'link "Call of Duty: World at War" [ref=f3e381] [cursor=pointer]':
                  - /url: https://en.wikipedia.org/wiki/Call_of_Duty:_World_at_War
                - text: experience, and Raid Mode, which threw a set number of waves at the players before transitioning to a boss encounter. The players could choose whether to play it on Normal or Heroic difficulty.
                - superscript [ref=f3e382]:
                  - link "[13]" [ref=f3e383] [cursor=pointer]:
                    - /url: "#cite_note-13"
                - text: The mode was removed in March 2020 due to it not reaching the desired level of quality.
                - superscript [ref=f3e384]:
                  - link "[14]" [ref=f3e385] [cursor=pointer]:
                    - /url: "#cite_note-14"
                - superscript [ref=f3e386]:
                  - link "[15]" [ref=f3e387] [cursor=pointer]:
                    - /url: "#cite_note-15"
                - text: This mode was added back to the game in October 2022, again only featuring the Shi No Numa map.
                - superscript [ref=f3e388]:
                  - link "[16]" [ref=f3e389] [cursor=pointer]:
                    - /url: "#cite_note-16"
              - paragraph [ref=f3e390]:
                - text: Undead Siege, a zombie survival mode, was added into the game in August 2021. In it, a team of four players have to survive and protect their teleportation device from continuous waves of zombies. During the day, players have to collect supplies which are used during the night to survive against a horde of zombies.
                - superscript [ref=f3e391]:
                  - link "[17]" [ref=f3e392] [cursor=pointer]:
                    - /url: "#cite_note-17"
                - text: In addition, players during the day also take part in Daytime
                - link "Side Missions" [ref=f3e393] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Quest_(video_games)
                - text: ", which include the Butcher, breaking the Aether Crystal Cluster, feeding 10 zombies to Cerberus and helping transport a big Aether Crystal. The mode has 3 difficulties - Casual, Hardcore and Nightmare. In casual, the team only has to survive for 3 nights while in other difficulties, the team has to survive for 5 nights."
          - region [ref=f3e394]:
            - generic [ref=f3e395]:
              - heading "Development and release" [level=2] [ref=f3e396]
              - generic [ref=f3e397]:
                - link "edit":
                  - /url: /w/index.php?title=Call_of_Duty:_Mobile&action=edit&section=7
            - paragraph [ref=f3e398]:
              - text: "Call of Duty: Mobile was announced in March 2019, with TiMi-J3, itself a"
              - link "TiMi Studio Group" [ref=f3e399] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/TiMi_Studio_Group
              - text: division, which is a subsidiary of
              - link "Tencent Games" [ref=f3e400] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Tencent_Games
              - text: ", leading development. Many of the game's features were revealed at this announcement, promising a familiar experience for fans of the"
              - link "console" [ref=f3e401] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Video_game_console
              - text: game. The aim of the game was to take familiar aspects from the franchise's previous games and allow users to access them from their mobile devices.
              - superscript [ref=f3e402]:
                - link "[18]" [ref=f3e403] [cursor=pointer]:
                  - /url: "#cite_note-arstechnica-18"
              - superscript [ref=f3e404]:
                - link "[19]" [ref=f3e405] [cursor=pointer]:
                  - /url: "#cite_note-19"
              - text: It features two in-game currencies, as well as a
              - link "battle pass" [ref=f3e406] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Battle_pass
              - text: .
              - superscript [ref=f3e407]:
                - link "[20]" [ref=f3e408] [cursor=pointer]:
                  - /url: "#cite_note-20"
              - text: The initial release was in Australia on June 15, 2019, following the soft-launches in Australia, Canada and Peru.
              - superscript [ref=f3e409]:
                - link "[21]" [ref=f3e410] [cursor=pointer]:
                  - /url: "#cite_note-21"
              - superscript [ref=f3e411]:
                - link "[22]" [ref=f3e412] [cursor=pointer]:
                  - /url: "#cite_note-22"
              - superscript [ref=f3e413]:
                - link "[23]" [ref=f3e414] [cursor=pointer]:
                  - /url: "#cite_note-23"
              - link "Garena" [ref=f3e415] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Garena
              - text: released the game in Hong Kong, Indonesia, Macau, Malaysia, Philippines, Singapore, Taiwan, and Thailand on September 29, 2019. The game was released in Europe, North America and Latin America by
              - link "Activision" [ref=f3e416] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Activision
              - text: on September 30, 2019, and by Tencent Games in South Korea on October 1, 2019.
              - superscript [ref=f3e417]:
                - link "[24]" [ref=f3e418] [cursor=pointer]:
                  - /url: "#cite_note-24"
              - superscript [ref=f3e419]:
                - link "[25]" [ref=f3e420] [cursor=pointer]:
                  - /url: "#cite_note-25"
              - text: VNG Games released the game after the worldwide release in partnership with Activision and TiMi Studios in Vietnam on April 20, 2020.
              - superscript [ref=f3e421]:
                - link "[26]" [ref=f3e422] [cursor=pointer]:
                  - /url: "#cite_note-26"
              - superscript [ref=f3e423]:
                - link "[27]" [ref=f3e424] [cursor=pointer]:
                  - /url: "#cite_note-27"
              - text: Tencent Games published the game for
              - link "Mainland China" [ref=f3e425] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Mainland_China
              - text: on December 24, 2020.
              - superscript [ref=f3e426]:
                - link "[28]" [ref=f3e427] [cursor=pointer]:
                  - /url: "#cite_note-28"
            - paragraph [ref=f3e428]:
              - text: "Call of Duty: Mobile features many playable characters, maps, and game modes from previous games in the series."
              - superscript [ref=f3e429]:
                - link "[29]" [ref=f3e430] [cursor=pointer]:
                  - /url: "#cite_note-gamesradar-29"
              - text: Different control settings were included to cater to player's preferences.
              - superscript [ref=f3e431]:
                - link "[30]" [ref=f3e432] [cursor=pointer]:
                  - /url: "#cite_note-30"
              - text: A "zombies" game mode was added to the game in November 2019. This game mode followed the classic Call of Duty zombies "survival" formula where the player fights off endless waves of zombies, aiming to survive as long as possible. A "Raid" mode was also included where the player had to defeat a set amount of waves of zombies before encountering one of two final bosses.
              - superscript [ref=f3e433]:
                - link "[31]" [ref=f3e434] [cursor=pointer]:
                  - /url: "#cite_note-31"
          - region [ref=f3e435]:
            - generic [ref=f3e436]:
              - heading "Esports" [level=2] [ref=f3e437]
              - generic [ref=f3e438]:
                - link "edit":
                  - /url: /w/index.php?title=Call_of_Duty:_Mobile&action=edit&section=8
            - paragraph [ref=f3e439]:
              - text: "The Call of Duty: Mobile World Championship 2020 Tournament was a partnership between"
              - link "Activision Blizzard" [ref=f3e440] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Activision_Blizzard
              - text: and
              - link "Sony Mobile Communications" [ref=f3e441] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Sony_Mobile
              - text: ", and marks the game's entry into the top tier of"
              - link "esports" [ref=f3e442] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Esports
              - text: .
              - superscript [ref=f3e443]:
                - link "[32]" [ref=f3e444] [cursor=pointer]:
                  - /url: "#cite_note-32"
              - text: It featured more than $1 million in total prizes, which include both cash and in-game cosmetics.
              - superscript [ref=f3e445]:
                - link "[33]" [ref=f3e446] [cursor=pointer]:
                  - /url: "#cite_note-33"
              - text: Competing teams were drawn directly from the game's community through four open online qualifiers from April 20 to May 24, 2020. Eligible players ranked veteran or higher have the chance to play.
              - superscript [ref=f3e447]:
                - link "[34]" [ref=f3e448] [cursor=pointer]:
                  - /url: "#cite_note-34"
              - text: The 2021 tournament featured a $2 million prize pool.
              - superscript [ref=f3e449]:
                - text: "["
                - link "citation needed" [ref=f3e451] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Wikipedia:Citation_needed
                - text: "]"
              - text: "In addition to the official Call of Duty: Mobile World Championship, third-party tournaments have emerged, providing additional competitive opportunities for players. Platforms such as Money Gaming host regular COD:Mobile Battle Royale events, allowing players of all skill levels to compete for real cash prizes."
              - superscript [ref=f3e452]:
                - link "[35]" [ref=f3e453] [cursor=pointer]:
                  - /url: "#cite_note-35"
          - region [ref=f3e454]:
