          - region [ref=f21e569]:
            - heading "Development" [level=2] [ref=f21e571]
            - paragraph [ref=f21e572]:
              - text: Valorant was developed and published by
              - link "Riot Games" [ref=f21e573] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Riot_Games
              - text: ", the studio behind"
              - link "League of Legends" [ref=f21e575] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/League_of_Legends
              - text: .
              - superscript [ref=f21e576]:
                - link "[51]" [ref=f21e577] [cursor=pointer]:
                  - /url: "#cite_note-Browne_2020-51"
              - superscript [ref=f21e578]:
                - link "[10]" [ref=f21e579] [cursor=pointer]:
                  - /url: "#cite_note-First_Announced_1-10"
              - text: Development started in 2014, within their
              - link "research and development" [ref=f21e580] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Research_and_development
              - text: division.
              - superscript [ref=f21e581]:
                - link "[7]" [ref=f21e582] [cursor=pointer]:
                  - /url: "#cite_note-Goslin_2020a-7"
              - text: Game director Joe Ziegler is credited with the initial idea of Valorant while formulating potential games with other Riot developers.
              - superscript [ref=f21e583]:
                - link "[7]" [ref=f21e584] [cursor=pointer]:
                  - /url: "#cite_note-Goslin_2020a-7"
              - text: David Nottingham is the
              - link "creative director" [ref=f21e585] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Creative_director
              - text: for Valorant.
              - superscript [ref=f21e586]:
                - link "[7]" [ref=f21e587] [cursor=pointer]:
                  - /url: "#cite_note-Goslin_2020a-7"
              - text: Trevor Romleski, former
              - link "League of Legends" [ref=f21e589] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/League_of_Legends
              - generic [ref=f21e590]: "'s"
              - text: designer and Salvatore Garozzo, former
              - link "professional player" [ref=f21e591] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Esports
              - text: and map designer for
              - 'link "Counter-Strike: Global Offensive" [ref=f21e593] [cursor=pointer]':
                - /url: https://en.wikipedia.org/wiki/Counter-Strike:_Global_Offensive
              - text: are its game designers.
              - superscript [ref=f21e594]:
                - link "[52]" [ref=f21e595] [cursor=pointer]:
                  - /url: "#cite_note-Rubio_2020-52"
              - text: Moby Francke, former
              - link "Valve" [ref=f21e596] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Valve_Corporation
              - text: developer, who has been art and character designer for
              - link "Half-Life 2" [ref=f21e598] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Half-Life_2
              - text: and
              - link "Team Fortress 2" [ref=f21e600] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Team_Fortress_2
              - text: ", is the art director."
              - superscript [ref=f21e601]:
                - link "[53]" [ref=f21e602] [cursor=pointer]:
                  - /url: "#cite_note-Pack_2020-53"
              - superscript [ref=f21e603]:
                - link "[54]" [ref=f21e604] [cursor=pointer]:
                  - /url: "#cite_note-Petitte_2013-54"
            - paragraph [ref=f21e605]:
              - text: "Valorant was developed with two main focuses: making tactical shooters and e-sports more accessible to new players, and creating a game that would attract a large competitive scene, while solving many of the points of criticism voiced by professional players from games in the genre."
              - superscript [ref=f21e606]:
                - link "[55]" [ref=f21e607] [cursor=pointer]:
                  - /url: "#cite_note-55"
              - superscript [ref=f21e608]:
                - link "[56]" [ref=f21e609] [cursor=pointer]:
                  - /url: "#cite_note-:0-56"
              - superscript [ref=f21e610]:
                - link "[57]" [ref=f21e611] [cursor=pointer]:
                  - /url: "#cite_note-57"
              - text: Games aimed at large, active communities and player bases, typically
              - link "free-to-play" [ref=f21e612] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Free-to-play
              - text: games like
              - link "Fortnite" [ref=f21e614] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Fortnite
              - text: or Riot's own
              - link "League of Legends" [ref=f21e616] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/League_of_Legends
              - text: ", tend to put an emphasis on a wider array of system performance improvements and game stability rather than newer technologies or graphics as a way of making sure they're as accessible as possible. In interviews leading up to the game's launch, game director Joe Ziegler and producer Anna Donlon said that Valorant was made for people playing their first tactical shooter just as much as it was for professional players, and that accessibility of the game was a large priority."
              - superscript [ref=f21e617]:
                - link "[56]" [ref=f21e618] [cursor=pointer]:
                  - /url: "#cite_note-:0-56"
            - paragraph [ref=f21e619]:
              - text: Riot chose to develop Valorant using
              - link "Unreal Engine 4" [ref=f21e620] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Unreal_Engine_4
              - text: ", which the development team said would allow it to focus on gameplay and optimizations rather than spending time on core systems."
              - superscript [ref=f21e621]:
                - link "[58]" [ref=f21e622] [cursor=pointer]:
                  - /url: "#cite_note-Reid_2020-58"
              - superscript [ref=f21e623]:
                - link "[59]" [ref=f21e624] [cursor=pointer]:
                  - /url: "#cite_note-59"
              - text: To meet the goal of a lower performance barrier so more people could play Valorant, the team set notably low minimum and recommended hardware requirements for the game. To reach 30
              - link "frames per second" [ref=f21e625] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Frames_per_second
              - text: on these small requirements, the game's engineering team, led by Marcus Reid, who previously worked on
              - link "Gears of War 4" [ref=f21e627] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Gears_of_War_4
              - text: ", had to make several modifications to the engine. These modifications included editing the renderer using the engine's mobile rendering path as base, or reworking the game's lighting systems to fit the static lighting that tactical shooters often require, as to not interfere with gameplay."
              - superscript [ref=f21e628]:
                - link "[58]" [ref=f21e629] [cursor=pointer]:
                  - /url: "#cite_note-Reid_2020-58"
              - text: Unreal's modern underpinnings also helped to solve many of the issues that Riot set out to solve from other games in the genre, and additional modifications helped to meet the game's other goal of creating a suitable competitive environment, including optimizing server performance by disabling character animations in non-combat situations and removing unnecessary evaluations in the hit registration process.
              - superscript [ref=f21e630]:
                - link "[60]" [ref=f21e631] [cursor=pointer]:
                  - /url: "#cite_note-60"
              - superscript [ref=f21e632]:
                - link "[56]" [ref=f21e633] [cursor=pointer]:
                  - /url: "#cite_note-:0-56"
              - superscript [ref=f21e634]:
                - link "[58]" [ref=f21e635] [cursor=pointer]:
                  - /url: "#cite_note-Reid_2020-58"
              - text: During development, Riot made promises to work towards a
              - link "ping" [ref=f21e636] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Ping_(networking_utility)
              - text: of less than 35 milliseconds for at least 70% of the game's players.
              - superscript [ref=f21e637]:
                - link "[61]" [ref=f21e638] [cursor=pointer]:
                  - /url: "#cite_note-WaPo0414-61"
              - text: To accomplish this, Riot promised 128-tick servers in or near most major cities in the world, as well as working with
              - link "internet service providers" [ref=f21e639] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/ISP
              - text: to set up
              - link "dedicated connections" [ref=f21e640] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Peering
              - text: to those servers.
              - superscript [ref=f21e641]:
                - link "[61]" [ref=f21e642] [cursor=pointer]:
                  - /url: "#cite_note-WaPo0414-61"
              - text: Due to the increase in internet traffic during the
              - link "COVID-19 pandemic" [ref=f21e643] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/COVID-19_pandemic
              - text: ", Riot has had trouble optimizing connections to their promised levels."
              - superscript [ref=f21e644]:
                - link "[62]" [ref=f21e645] [cursor=pointer]:
                  - /url: "#cite_note-PCGamer0506-62"
              - text: As of July 29, 2025, Riot carried out their transition to
              - link "Unreal Engine 5" [ref=f21e646] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Unreal_Engine_5
              - text: with update 11.02 on all platforms and regions.
              - superscript [ref=f21e647]:
                - link "[63]" [ref=f21e648] [cursor=pointer]:
                  - /url: "#cite_note-63"
            - region [ref=f21e649]:
              - heading "Mobile spin-off" [level=3] [ref=f21e651]
              - paragraph [ref=f21e652]:
                - text: On June 2, 2021,
                - link "Riot Games" [ref=f21e653] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Riot_Games
                - text: announced its plans to develop a
                - link "mobile version" [ref=f21e654] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Mobile_game
                - text: of Valorant, which would reportedly be the first step it intends to take to expand the game's
                - link "universe" [ref=f21e655] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fictional_universe
                - text: .
                - superscript [ref=f21e656]:
                  - link "[64]" [ref=f21e657] [cursor=pointer]:
                    - /url: "#cite_note-64"
              - paragraph [ref=f21e658]:
                - text: Riot Games launched Valorant Mobile in China on August 19, 2025, with a global release set at a later date.
                - superscript [ref=f21e659]:
                  - link "[65]" [ref=f21e660] [cursor=pointer]:
                    - /url: "#cite_note-65"
                - superscript [ref=f21e661]:
                  - link "[66]" [ref=f21e662] [cursor=pointer]:
                    - /url: "#cite_note-66"
            - region [ref=f21e663]:
              - heading "Console port" [level=3] [ref=f21e665]
              - paragraph [ref=f21e666]:
                - text: On June 7, 2024, during
                - link "Summer Game Fest" [ref=f21e667] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Summer_Game_Fest
                - text: ", Riot announced that Valorant was to be ported over to the"
                - link "PlayStation 5" [ref=f21e668] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/PlayStation_5
                - text: and
                - link "Xbox Series X/S" [ref=f21e669] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Xbox_Series_X/S
                - text: ", with a limited beta beginning on June 14. The PS5 and Series X/S versions do not have cross-play with the PC version as the gameplay is tailor-made for the consoles, but inventory and progress will be synced with the PC version."
                - superscript [ref=f21e670]:
                  - link "[67]" [ref=f21e671] [cursor=pointer]:
                    - /url: "#cite_note-VergeConsole-67"
          - region [ref=f21e672]:
            - heading "Release" [level=2] [ref=f21e674]
            - paragraph [ref=f21e675]:
              - text: Valorant was teased under a tentative title Project A in October 2019.
              - superscript [ref=f21e676]:
                - link "[68]" [ref=f21e677] [cursor=pointer]:
                  - /url: "#cite_note-Webster_2020-68"
              - text: It was announced on March 1, 2020, with a gameplay video on
              - link "YouTube" [ref=f21e678] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/YouTube
              - text: called "The Round".
              - superscript [ref=f21e679]:
                - link "[10]" [ref=f21e680] [cursor=pointer]:
                  - /url: "#cite_note-First_Announced_1-10"
              - superscript [ref=f21e681]:
                - link "[69]" [ref=f21e682] [cursor=pointer]:
                  - /url: "#cite_note-First_Announced_2-69"
              - superscript [ref=f21e683]:
                - link "[70]" [ref=f21e684] [cursor=pointer]:
                  - /url: "#cite_note-First_Announced_3-70"
              - text: The closed beta of the game was launched on April 7, 2020.
              - superscript [ref=f21e685]:
                - link "[68]" [ref=f21e686] [cursor=pointer]:
                  - /url: "#cite_note-Webster_2020-68"
              - text: For a chance to obtain a beta access key, players were required to sign up for accounts with both Riot Games and the streaming platform
              - link "Twitch" [ref=f21e687] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Twitch_(website)
              - text: and watch related streams.
              - superscript [ref=f21e688]:
                - link "[71]" [ref=f21e689] [cursor=pointer]:
                  - /url: "#cite_note-71"
              - text: This beta ended on May 28, 2020, with the game being fully released on June 2, 2020.
              - superscript [ref=f21e690]:
                - link "[72]" [ref=f21e691] [cursor=pointer]:
                  - /url: "#cite_note-espn-72"
            - paragraph [ref=f21e692]:
              - text: The limited beta for the console port of Valorant opened on June 14, 2024. It will initially be limited to the United States, Canada, Europe and Japan with other regions joining at later dates. Unlike the PC beta, players are only required to sign up for accounts with Riot Games.
              - superscript [ref=f21e693]:
                - link "[67]" [ref=f21e694] [cursor=pointer]:
                  - /url: "#cite_note-VergeConsole-67"
            - paragraph [ref=f21e695]:
              - text: Valorant had a full release on consoles on August 2, 2024.
              - superscript [ref=f21e696]:
                - link "[73]" [ref=f21e697] [cursor=pointer]:
                  - /url: "#cite_note-73"
