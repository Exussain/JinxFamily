                  - /url: https://en.wikipedia.org/wiki/Kernel_(operating_system)
                - text: driver, which allows access to the computer system.
                - link "OSNews" [ref=f21e901] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/OSNews
                - text: expressed concern that Riot Games and its owner, Chinese technology conglomerate
                - link "Tencent" [ref=f21e902] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tencent
                - text: ", could spy on players and that the kernel driver could be potentially exploited by third parties."
                - superscript [ref=f21e903]:
                  - link "[96]" [ref=f21e904] [cursor=pointer]:
                    - /url: "#cite_note-Holwerda_2020-96"
                - text: However, Riot Games stated that the driver does not send any information back to them, and launched a
                - link "bug bounty program" [ref=f21e905] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Bug_bounty_program
                - text: to offer rewards for reports that demonstrate vulnerabilities with the software.
                - superscript [ref=f21e906]:
                  - link "[97]" [ref=f21e907] [cursor=pointer]:
                    - /url: "#cite_note-Orland_2020a-97"
                - superscript [ref=f21e908]:
                  - link "[98]" [ref=f21e909] [cursor=pointer]:
                    - /url: "#cite_note-Orland_2020b-98"
                - text: As of May 2026 , the program will reward white hat hackers up to a maximum of $100,000 for reports on its vulnerabilities, depending on the severity of the exploit.
                - superscript [ref=f21e910]:
                  - link "[99]" [ref=f21e911] [cursor=pointer]:
                    - /url: "#cite_note-:2-99"
                - text: Gameplay bugs do not qualify for this bounty.
                - superscript [ref=f21e912]:
                  - link "[99]" [ref=f21e913] [cursor=pointer]:
                    - /url: "#cite_note-:2-99"
              - paragraph [ref=f21e914]:
                - text: Valorant will not run on
                - link "Windows 11" [ref=f21e915] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Windows_11
                - text: if the system does not have a
                - link "Trusted Platform Module" [ref=f21e916] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Trusted_Platform_Module
                - text: (TPM) 2.0 compliant
                - link "cryptoprocessor" [ref=f21e917] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Secure_cryptoprocessor
                - text: and
                - link "UEFI secure boot" [ref=f21e918] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/UEFI_secure_boot
                - text: enabled, as mandated by Microsoft's minimum system requirements for the operating system.
                - superscript [ref=f21e919]:
                  - link "[100]" [ref=f21e920] [cursor=pointer]:
                    - /url: "#cite_note-100"
          - region [ref=f21e921]:
            - heading "Esports" [level=2] [ref=f21e923]
            - note [ref=f21e924]:
              - text: "Main article:"
              - link "Valorant Champions Tour" [ref=f21e925] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Valorant_Champions_Tour
            - figure [ref=f21e926]:
              - link [ref=f21e927] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/File:Valorant_Champions_İstanbul_2022.jpg
              - generic [ref=f21e929]:
                - link "2022 Valorant Champions" [ref=f21e930] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/2022_Valorant_Champions
                - text: at
                - link "Volkswagen Arena Istanbul" [ref=f21e931] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Volkswagen_Arena_(Istanbul)
            - paragraph [ref=f21e932]:
              - text: Valorant has an active
              - link "esports" [ref=f21e933] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Esports
              - text: scene. The highest tier of Valorant Esports is run by Riot Games.
            - paragraph [ref=f21e934]:
              - text: In 2020, Riot Games launched "First Strike", a tournament designed to establish a foundation for an esports scene to be created with the game.
              - superscript [ref=f21e935]:
                - link "[101]" [ref=f21e936] [cursor=pointer]:
                  - /url: "#cite_note-101"
            - region [ref=f21e937]:
              - heading "Open-qualifiers era (2021–22)" [level=3] [ref=f21e939]
              - paragraph [ref=f21e940]:
                - text: In November 2020, Riot Games announced the
                - link "Valorant Champions Tour" [ref=f21e941] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Valorant_Champions_Tour
                - text: "(VCT), which is a year-long tournament circuit consisting of three levels:"
              - list [ref=f21e942]:
                - listitem [ref=f21e943]: Champions - the world championship
                - listitem [ref=f21e944]: Masters - international competitions in mid-season, divided into many stages
                - listitem [ref=f21e945]: Challengers - regional competitions which are qualifiers for Masters
              - paragraph [ref=f21e946]: Teams will qualify directly for Champions via top places in Circuit Point Standings of their region, based on results of Challengers and Masters. Teams who are at middle places in Circuit Point Standings will have one more chance to qualify for Champions by winning the Last Chance Qualifiers (North America, EMEA, South America, Asia Pacific).
            - region [ref=f21e947]:
              - heading "Partnerships era (2023–present)" [level=3] [ref=f21e949]
              - paragraph [ref=f21e950]:
                - text: In 2023, Riot Games announced a partner team model for their Valorant Champions Tour.
                - superscript [ref=f21e951]:
                  - link "[102]" [ref=f21e952] [cursor=pointer]:
                    - /url: "#cite_note-102"
                - text: The 30 initial franchised teams, along with two invitees from China, played their first LAN tournament at the VCT LOCK//IN at São Paulo, Brazil, which officially marked as the beginning of the
                - link "VCT 2023 season" [ref=f21e953] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Valorant_Champions_Tour#2023–present:_Partnerships_era
                - text: .
                - superscript [ref=f21e954]:
                  - link "[103]" [ref=f21e955] [cursor=pointer]:
                    - /url: "#cite_note-103"
                - superscript [ref=f21e956]:
                  - link "[104]" [ref=f21e957] [cursor=pointer]:
                    - /url: "#cite_note-104"
                - text: These partnered teams compete in 4 regional leagues to qualify for Masters and Champions.
              - region [ref=f21e958]:
                - heading "Partner System" [level=4] [ref=f21e960]
                - paragraph [ref=f21e961]:
                  - text: "Reference:"
                  - superscript [ref=f21e962]:
                    - link "[105]" [ref=f21e963] [cursor=pointer]:
                      - /url: "#cite_note-valorantesports.com-105"
                - list [ref=f21e964]:
                  - listitem [ref=f21e965]: "Champions: the world championship"
                  - listitem [ref=f21e966]: "Masters: international competitions in mid-season, divided into two stages"
                  - listitem [ref=f21e967]: "International Leagues: four competitions divided by international territory (Americas, China, EMEA, Pacific) which are qualifiers for Masters and Champions"
              - region [ref=f21e968]:
                - heading "Non-Partner System" [level=4] [ref=f21e970]
                - paragraph [ref=f21e971]:
                  - text: "Reference:"
                  - superscript [ref=f21e972]:
                    - link "[105]" [ref=f21e973] [cursor=pointer]:
                      - /url: "#cite_note-valorantesports.com-105"
                - list [ref=f21e974]:
                  - listitem [ref=f21e975]: "Ascension: four competitions divided by international territory (Americas, China, EMEA, Pacific) which serve as promotion into the International Leagues"
                  - listitem [ref=f21e976]: "Challengers: regional competitions which are qualifiers for Ascension"
