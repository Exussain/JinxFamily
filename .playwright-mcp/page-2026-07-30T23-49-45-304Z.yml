            - paragraph [ref=f21e340]:
              - generic [ref=f21e341]: Valorant
              - text: (stylized in all caps) is a 2020
              - link "first-person" [ref=f21e342] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/First-person_shooter
              - link "tactical" [ref=f21e343] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Tactical_shooter
              - link "hero shooter" [ref=f21e344] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Hero_shooter
              - text: video game developed and published by
              - link "Riot Games" [ref=f21e345] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Riot_Games
              - text: .
              - superscript [ref=f21e346]:
                - link "[5]" [ref=f21e347] [cursor=pointer]:
                  - /url: "#cite_note-playvalorant.com-5"
              - text: A
              - link "free-to-play" [ref=f21e348] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Free-to-play
              - text: game, Valorant takes inspiration from the
              - link "Counter-Strike" [ref=f21e350] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Counter-Strike
              - text: series, borrowing several mechanics such as the buy menu, spray patterns, and inaccuracy while moving. Development started in 2014 and was teased under the codename Project A in 2019; the game was released on June 2, 2020, for
              - link "Windows" [ref=f21e351] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Microsoft_Windows
              - text: . It was
              - link "ported" [ref=f21e352] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Ported
              - text: to the
              - link "PlayStation 5" [ref=f21e353] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/PlayStation_5
              - text: and
              - link "Xbox Series X/S" [ref=f21e354] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Xbox_Series_X_and_Series_S
              - text: in June 2024, albeit without
              - link "crossplay" [ref=f21e355] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Cross-platform_play
              - text: between PC and console clients. A mobile version, Valorant Mobile (
              - link "Chinese" [ref=f21e356] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Simplified_Chinese_characters
              - text: ":"
              - generic [ref=f21e357]:
                - text: 《无畏契约：源能行动》
                - superscript [ref=f21e358]:
                  - link "[6]" [ref=f21e359] [cursor=pointer]:
                    - /url: "#cite_note-6"
              - text: ), launched in China on August 19, 2025, with a global release set at a later date.
          - region [ref=f21e360]:
            - heading "Gameplay" [level=2] [ref=f21e362]
            - figure "Gameplay screenshot" [ref=f21e363]:
              - link [ref=f21e364] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/File:Valorant_gameplay.jpg
            - paragraph [ref=f21e367]:
              - text: Valorant is a team-based
              - link "first-person" [ref=f21e368] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/First-person_shooter
              - link "tactical" [ref=f21e369] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Tactical_shooter
              - link "hero shooter" [ref=f21e370] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Hero_shooter
              - text: set in the near future.
              - superscript [ref=f21e371]:
                - link "[7]" [ref=f21e372] [cursor=pointer]:
                  - /url: "#cite_note-Goslin_2020a-7"
              - superscript [ref=f21e373]:
                - link "[8]" [ref=f21e374] [cursor=pointer]:
                  - /url: "#cite_note-Goslin_2020b-8"
              - superscript [ref=f21e375]:
                - link "[9]" [ref=f21e376] [cursor=pointer]:
                  - /url: "#cite_note-Goslin_2020c-9"
              - superscript [ref=f21e377]:
                - link "[10]" [ref=f21e378] [cursor=pointer]:
                  - /url: "#cite_note-First_Announced_1-10"
              - text: Players play as one of a set of Agents, characters based on several countries and cultures around the world.
              - superscript [ref=f21e379]:
                - link "[10]" [ref=f21e380] [cursor=pointer]:
                  - /url: "#cite_note-First_Announced_1-10"
              - text: In the main game mode, players are assigned to either the attacking or defending team with each team having five players on it. Agents have unique abilities, each requiring charges, as well as a unique ultimate ability that requires charging through kills or orbs. Every player starts each round with a "classic" pistol and one or more "signature ability" charges.
              - superscript [ref=f21e381]:
                - link "[8]" [ref=f21e382] [cursor=pointer]:
                  - /url: "#cite_note-Goslin_2020b-8"
              - text: Other weapons and ability charges can be purchased using an in-game economic system that awards money based on the outcome of the previous round, any kills the player is responsible for, and any objectives completed. The game has an assortment of weapons including secondary guns like
              - link "sidearms" [ref=f21e383] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Sidearm_(weapon)
              - text: and primary guns like
              - link "submachine guns" [ref=f21e384] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Submachine_guns
              - text: ","
              - link "shotguns" [ref=f21e385] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Shotguns
              - text: ","
              - link "machine guns" [ref=f21e386] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Machine_guns
              - text: ","
              - link "assault rifles" [ref=f21e387] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Assault_rifles
              - text: and
              - link "sniper rifles" [ref=f21e388] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Sniper_rifles
              - text: .
              - superscript [ref=f21e389]:
                - link "[11]" [ref=f21e390] [cursor=pointer]:
                  - /url: "#cite_note-11"
              - text: There are
              - link "automatic" [ref=f21e391] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Automatic_firearm
              - text: and
              - link "semi-automatic" [ref=f21e392] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Semi-automatic_firearm
              - text: weapons that each have a unique shooting pattern that has to be controlled by the player to be able to shoot accurately.
              - superscript [ref=f21e393]:
                - link "[12]" [ref=f21e394] [cursor=pointer]:
                  - /url: "#cite_note-12"
              - text: As of May 2026 , the game offers 29 agents to choose from.
              - superscript [ref=f21e395]:
                - link "[13]" [ref=f21e396] [cursor=pointer]:
                  - /url: "#cite_note-13"
              - text: Five agents are unlocked at account creation, with the rest unlocked using an in-game currency called Kingdom Credits. Kingdom Credits can be acquired by playing games or completing daily and weekly tasks, and can be spent on unlocking new agents or cosmetic items. However, within the first 28 days of release, new Agents can only be unlocked with Valorant Points (VP), Agent Recruitment Events, or by having a linked and active
              - link "Xbox" [ref=f21e397] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Xbox
              - link "Game Pass" [ref=f21e398] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Xbox_Game_Pass
              - text: subscription.
              - superscript [ref=f21e399]:
                - link "[14]" [ref=f21e400] [cursor=pointer]:
                  - /url: "#cite_note-14"
              - superscript [ref=f21e401]:
                - link "[15]" [ref=f21e402] [cursor=pointer]:
                  - /url: "#cite_note-15"
              - text: VP is an in-game currency that can only obtained by purchasing it with real money, and it can be spent on cosmetic items or new agents.
              - superscript [ref=f21e403]:
                - link "[16]" [ref=f21e404] [cursor=pointer]:
                  - /url: "#cite_note-16"
              - superscript [ref=f21e405]:
                - link "[17]" [ref=f21e406] [cursor=pointer]:
                  - /url: "#cite_note-17"
            - region [ref=f21e407]:
              - heading "Unrated" [level=3] [ref=f21e409]
              - paragraph [ref=f21e410]:
                - text: In the standard non-ranked mode, the match is played as best of 25, with the first team to win 13 rounds winning the match. The attacking team has a bomb-type device called the Spike. They must deliver and activate the Spike on one of the multiple specified locations (bomb sites). If the attacking team successfully protects the activated Spike for 45 seconds it detonates, destroying everything in a specific area, and they receive a point.
                - superscript [ref=f21e411]:
                  - link "[8]" [ref=f21e412] [cursor=pointer]:
                    - /url: "#cite_note-Goslin_2020b-8"
                - text: If the defending team can deactivate the Spike, or the 100-second round timer expires without the attacking team activating the spike, the defending team receives a point.
                - superscript [ref=f21e413]:
                  - link "[18]" [ref=f21e414] [cursor=pointer]:
                    - /url: "#cite_note-Shea_2020-18"
                - text: If all the members of a team are eliminated before the Spike is activated, or if all members of the defending team are eliminated after the Spike is activated, the opposing team earns a point.
                - superscript [ref=f21e415]:
                  - link "[8]" [ref=f21e416] [cursor=pointer]:
                    - /url: "#cite_note-Goslin_2020b-8"
                - text: If both teams win 12 rounds, sudden death occurs, in which the winning team of that round wins the match, differing from overtime for competitive matches. Additionally, if after 4 rounds, a team wishes to forfeit that match, they may request a vote to surrender. If the vote reaches 4 (in contrast to 5 for competitive), the winning team gets all the victory credit for every round needed to bring them to 13, with the forfeiting team receiving losing credit.
                - superscript [ref=f21e417]:
                  - link "[19]" [ref=f21e418] [cursor=pointer]:
                    - /url: "#cite_note-19"
                - text: "A team gets only three chances to surrender: once in the first half, once in the pistol round of the second half, and once more in the second half."
            - region [ref=f21e419]:
              - heading "Spike Rush" [level=3] [ref=f21e421]
              - paragraph [ref=f21e422]:
                - text: In the Spike Rush mode, the match is played as best of 7 rounds, with the first team to win 4 rounds winning the match. Players begin the round with all abilities fully charged except their ultimate, which charges twice as fast as in standard games. All players on the attacking team carry a spike, but only one spike may be activated per round. Guns are randomized in every round and every player begins with the same gun. Ultimate point orbs in the standard game are present, as well as multiple different power-up orbs.
                - superscript [ref=f21e423]:
                  - link "[20]" [ref=f21e424] [cursor=pointer]:
                    - /url: "#cite_note-WaPo0721-20"
            - region [ref=f21e425]:
              - heading "Swiftplay" [level=3] [ref=f21e427]
              - paragraph [ref=f21e428]:
                - text: Swiftplay matches are simply a shortened version of the Unrated game mode. 10 players are split into 2 teams, attackers and defenders. Attackers must plant the spike while the Defenders must stop them. What differs Swiftplay to Unrated is that it is best of 9 rounds - the first team to win 5 rounds wins the match. On round 4, the team's players switch, as they would do in round 13 in the Unrated game mode. The game's currency system is different than Unrated, with players earning more credits earlier, allowing for more parity across the two teams. Swiftplay is meant as a quick game mode, averaging around 15 minutes per game, as opposed to around 40 minutes for Unrated.
                - superscript [ref=f21e429]:
                  - link "[21]" [ref=f21e430] [cursor=pointer]:
                    - /url: "#cite_note-21"
            - region [ref=f21e431]:
              - heading "Competitive" [level=3] [ref=f21e433]
              - paragraph [ref=f21e434]:
                - text: Competitive matches are the same as unranked matches with the addition of a win-based ranking system that assigns a rank to each player after 5 games are played. Players are required to reach level 20 before playing this mode.
                - superscript [ref=f21e435]:
                  - link "[22]" [ref=f21e436] [cursor=pointer]:
                    - /url: "#cite_note-22"
                - superscript [ref=f21e437]:
                  - link "[23]" [ref=f21e438] [cursor=pointer]:
                    - /url: "#cite_note-23"
                - text: In July 2020, Riot introduced a "win by two" condition for competitive matches, where instead of playing a single sudden death round at 12-12, teams will alternate playing rounds on attack and defense in overtime until a team claims victory by securing a two-match lead. Each overtime round gives players the same amount of money to purchase guns and abilities, as well as approximately half of their ultimate ability charge. After each group of two rounds, players may vote to end the game in a draw, requiring 6 players after the first set, 3 after the second, and thereafter only 1 player to agree to a draw. The competitive ranking system ranges from Iron to Radiant. Every rank except for Radiant has 3 tiers.
                - superscript [ref=f21e439]:
                  - link "[24]" [ref=f21e440] [cursor=pointer]:
                    - /url: "#cite_note-24"
                - superscript [ref=f21e441]:
                  - link "[25]" [ref=f21e442] [cursor=pointer]:
                    - /url: "#cite_note-25"
                - superscript [ref=f21e443]:
                  - link "[26]" [ref=f21e444] [cursor=pointer]:
                    - /url: "#cite_note-26"
                - text: Radiant is reserved for the top 500 players of a region, and both Immortal and Radiant have a number associated to their rank allowing players to have a metric in which they can compare how they rank up to others at their level.
                - superscript [ref=f21e445]:
                  - link "[27]" [ref=f21e446] [cursor=pointer]:
                    - /url: "#cite_note-27"
            - region [ref=f21e447]:
              - heading "Premier" [level=3] [ref=f21e449]
              - paragraph [ref=f21e450]:
                - text: Premier is a 5v5 gamemode that allows players a path-to-pro competitive game mode that is aimed towards players that wish to be a professional player. Premier was first introduced in alpha testing in Brazil before being rolled out worldwide by 2024. Players will need to create a team of five to compete against other teams in divisions. Each season will last a few weeks and the top teams will be invited to compete in the Division Championship, with winning teams able to be promoted to their region's Challengers league and therefore be part of the VCT ecosystem. This gamemode includes a pick-and-ban system for maps unlike all the other gamemodes where the players have to play the map selected by the system.
                - superscript [ref=f21e451]:
                  - link "[28]" [ref=f21e452] [cursor=pointer]:
                    - /url: "#cite_note-28"
            - region [ref=f21e453]:
              - heading "Deathmatch" [level=3] [ref=f21e455]
              - paragraph [ref=f21e456]:
                - text: The Deathmatch mode was introduced on August 5, 2020.
                - superscript [ref=f21e457]:
                  - link "[29]" [ref=f21e458] [cursor=pointer]:
                    - /url: "#cite_note-29"
                - text: 14 players enter a 9-minute
                - link "free-for-all" [ref=f21e459] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Deathmatch_(video_games)
                - text: match and the first person to reach 40 kills or the player who has the most kills when time is up wins the match. The players will spawn with a random agent, equipped with a max shield and an infinite supply of credits to buy any weapons from the buy menu. All abilities are disabled during the match, which indulges pure gunplay.
                - superscript [ref=f21e460]:
                  - link "[30]" [ref=f21e461] [cursor=pointer]:
                    - /url: "#cite_note-30"
                - text: Green health packs drop on every kill, which reset the player to maximum health, armor, and replenish the ammunition in each of their guns.
                - superscript [ref=f21e462]:
                  - link "[31]" [ref=f21e463] [cursor=pointer]:
                    - /url: "#cite_note-31"
            - region [ref=f21e464]:
              - heading "Team Deathmatch" [level=3] [ref=f21e466]
              - paragraph [ref=f21e467]:
                - text: "The Team Deathmatch gamemode was announced on June 15, 2023, and went live on June 27 with patch 7.0. This gamemode combines and borrows elements from the standard unrated mode as well as the regular deathmatch mode. It is a free-for-all gamemode where players are split into two teams with five players each. Each match lasts for 9 minutes and 30 seconds, and the first team that reaches 100 kills win. If neither team has reached 100 kills at the end of the 9.5 minutes, then the team with the most kills wins. Each match is split into four stages, with the weapon selection becoming progressively more powerful as players advance through the stages. Players are respawned in a spawn room after being killed. where they will be able to select and adjust their weapons loadout if needed. Unlike the regular deathmatch mode, players need to select their agents before the match begins, as agent abilities are allowed in this gamemode. Players can charge their agents' ultimate abilities either by acquiring Ultimate Orbs spawned randomly throughout the map, or by getting kills. Their ultimate abilities will be available for use after their ult percentages reach 100%. Agents can also use their normal abilities multiple times, but they will have a cooldown between uses. Unlike all other gamemodes, this mode is not played on the standard maps, but rather on its own set of five maps that are specifically designed for team deathmatch: Piazza, District, Kasbah, Drift, and Glitch."
                - superscript [ref=f21e468]:
                  - link "[32]" [ref=f21e469] [cursor=pointer]:
                    - /url: "#cite_note-32"
                - superscript [ref=f21e470]:
                  - link "[33]" [ref=f21e471] [cursor=pointer]:
                    - /url: "#cite_note-33"
                - superscript [ref=f21e472]:
                  - link "[34]" [ref=f21e473] [cursor=pointer]:
                    - /url: "#cite_note-34"
            - region [ref=f21e474]:
              - heading "Escalation" [level=3] [ref=f21e476]
              - paragraph [ref=f21e477]:
                - text: The Escalation gamemode was introduced on February 17, 2021
                - superscript [ref=f21e478]:
                  - link "[35]" [ref=f21e479] [cursor=pointer]:
                    - /url: "#cite_note-35"
                - text: and is similar to the "gungame" concept found in
                - link "Counter-Strike" [ref=f21e481] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Counter-Strike
                - text: and
                - 'link "Call of Duty: Black Ops" [ref=f21e483] [cursor=pointer]':
                  - /url: https://en.wikipedia.org/wiki/Call_of_Duty:_Black_Ops
                - text: ", though it is team-based rather than free-for-all with 5 players on each team. The game will pick a random selection of 12 weapons to move through. As with other gungame versions, a team needs to get a certain number of kills to advance to the next weapon and the weapons get progressively worse as the team moves through them."
                - superscript [ref=f21e484]:
                  - link "[36]" [ref=f21e485] [cursor=pointer]:
                    - /url: "#cite_note-escalation021621-36"
                - text: There are two winning conditions, if one team successfully goes through all 12 levels, or if one team is on a higher level than the opposing team within 10 minutes. Just like Deathmatch, players spawn in as a random agent, unable to use abilities, as the gamemode is set for pure gun fights. Though, abilities like Sova's shock darts, Raze's boom bot, and rocket launcher, are abilities that everyone gets to use as a weapon. After a kill, green health packs drop, which replenishes the player's health, armor, and ammo to its maximum. The gamemode also has auto respawns on, respawning players in random locations around the map.
                - superscript [ref=f21e486]:
                  - link "[37]" [ref=f21e487] [cursor=pointer]:
                    - /url: "#cite_note-37"
                - superscript [ref=f21e488]:
                  - link "[38]" [ref=f21e489] [cursor=pointer]:
                    - /url: "#cite_note-38"
            - region [ref=f21e490]:
              - heading "Replication" [level=3] [ref=f21e492]
              - paragraph [ref=f21e493]:
                - text: The Replication gamemode went live on May 11, 2021.
                - superscript [ref=f21e494]:
                  - link "[39]" [ref=f21e495] [cursor=pointer]:
                    - /url: "#cite_note-39"
                - text: During the agent select, players vote on which agent they would want to play as. At the end of the time, or after everyone has voted, the game randomly selects one of the player's votes. The entire team will then play as that agent, even if one of the players has not unlocked that agent. It is a best of nine, with the players switching sides after the fourth round. Players can buy guns and shields with a pre-set number of credits. Abilities are pre-bought. Weapons and shields are reset every round.
                - superscript [ref=f21e496]:
                  - link "[40]" [ref=f21e497] [cursor=pointer]:
                    - /url: "#cite_note-40"
                - text: This gamemode was removed in patch 7.0.
                - superscript [ref=f21e498]:
                  - link "[41]" [ref=f21e499] [cursor=pointer]:
                    - /url: "#cite_note-41"
            - region [ref=f21e500]:
              - heading "Skirmish" [level=3] [ref=f21e502]
              - paragraph [ref=f21e503]:
                - text: Skirmish was introduced on October 3, 2025, and is only available in custom mode. Players are placed in a choice of 3 small enclosed arenas with the options of 1v1 to 5v5. Abilities are automatically disabled but hosts have the option to enable. No economy system exists and players are able to set any loadout and change them between rounds. Round timers are unlimited and players are forced to eliminate the enemy team until no players on the opposing side are alive to win a round. The default score to win are 10 rounds.
                - superscript [ref=f21e504]:
                  - link "[42]" [ref=f21e505] [cursor=pointer]:
                    - /url: "#cite_note-42"
            - region [ref=f21e506]:
              - heading "Snowball Fight" [level=3] [ref=f21e508]
              - paragraph [ref=f21e509]:
                - text: Snowball Fight was a limited-time gamemode that was released on December 15, 2020, and is only available during the Christmas season.
                - superscript [ref=f21e510]:
                  - link "[43]" [ref=f21e511] [cursor=pointer]:
                    - /url: "#cite_note-43"
                - text: It is a Team Deathmatch game mode, with 50 kills to win. The gamemode was first played exclusively on the map Icebox, although patch 11.11 later added all standard maps to the mode. Abilities are not allowed to be used, and players spawn in as a random agent. The only weapon available is the snowball launcher, which is an instant kill, but slow, and uses a projectile-based arc. There is infinite ammo. Throughout the game a "portal" will spawn, delivering gifts, which each contain a random power up.
                - superscript [ref=f21e512]:
                  - link "[44]" [ref=f21e513] [cursor=pointer]:
                    - /url: "#cite_note-44"
                - superscript [ref=f21e514]:
                  - link "[45]" [ref=f21e515] [cursor=pointer]:
                    - /url: "#cite_note-45"
            - region [ref=f21e516]:
              - heading "All Random, One Site" [level=3] [ref=f21e518]
              - paragraph [ref=f21e519]:
                - text: All Random, One Site was introduced on January 6, 2026. It is a limited-time gamemode that involves a fast-paced 5v5 on a random choice of a small map pool, with barriers blocking off all bomb sites but one. The sole open bomb site is randomly chosen every round and are announced to players before the round begins. Players control a random agent every round. All players start off with 0% ultimate charge, with ultimate orbs placed around the map and granting 50% ultimate charge when captured. Kills grant 50% ultimate charge and killed players drop Ground Orbs containing their accumulated charge. No economy exists and players are free to set any loadout every round, though offerings are limited and escalate as the match progresses.
                - superscript [ref=f21e520]:
                  - link "[46]" [ref=f21e521] [cursor=pointer]:
                    - /url: "#cite_note-46"
            - region [ref=f21e522]:
              - heading "Knockout" [level=3] [ref=f21e524]
              - paragraph [ref=f21e525]:
                - text: Knockout was first showcased prior to the
                - link "Masters Santiago" [ref=f21e526] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Valorant_Masters_Santiago_2026
                - text: grand finals and went live on patch 12.05. The objective of this game mode is to eliminate all enemy players until none are left, or, if the three minute round timer expires, have more teammates alive by the end of the round. The matches take place on the Team Deathmatch maps. If a teammate gets killed, killing an enemy player will revive the earliest fallen teammate. Reviving takes 1 second initially, but every 15 seconds the time it takes to revive is increased by 1 second. All abilities are on cooldowns similar to Team Deathmatch, but ultimate abilities are standardized to four charges. Matches are best-of-7, meaning that four rounds are required for one team to win.
          - region [ref=f21e527]:
            - heading "Agents" [level=2] [ref=f21e529]
            - figure "Cover art featuring Jett, one of the game's playable Agents" [ref=f21e530]:
              - link [ref=f21e531] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/File:Valorant_cover.jpg
            - paragraph [ref=f21e534]: "There are a large variety of playable agents available in the game. Agents are divided into 4 roles: Duelists, Sentinels, Initiators, and Controllers. Each agent has a different role which indicates how the agent is usually played."
            - paragraph [ref=f21e535]:
              - text: Duelists specialize in attacking and entering a bomb site for the team.
              - link "Riot" [ref=f21e536] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Riot_Games
              - text: "'s official definition for duelists is \"self-sufficient fraggers.\""
              - superscript [ref=f21e537]:
                - link "[47]" [ref=f21e538] [cursor=pointer]:
                  - /url: "#cite_note-:03-47"
              - text: Duelists mainly create space for their team while entering onto a site, giving their teammates information, and making entering a site easier. Their abilities tend to consist of flashes which blind enemies, and movement-based abilities that allow for them to cover large distances faster than other agents. This type of ability kit allows for duelists to shine best when they are able to catch players off guard and get impact frags. On attack, duelists are most often expected to play forward, leading the attack. They are expected to be in front of everyone to get opening picks on enemies since their abilities often give them a competitive advantage when gunfighting an enemy. On defense, duelists will be holding choke points where enemies try to enter sites. Due to the mobility in their kits, they are able to get a pick and reposition, giving their team a numbers advantage.
              - superscript [ref=f21e539]:
                - link "[48]" [ref=f21e540] [cursor=pointer]:
                  - /url: "#cite_note-playvalorant.com5-48"
              - superscript [ref=f21e541]:
                - link "[49]" [ref=f21e542] [cursor=pointer]:
                  - /url: "#cite_note-:1-49"
            - paragraph [ref=f21e543]:
              - text: Sentinels are the defensive line, which specializes in locking down sites and protecting teammates from enemies. Their abilities mainly consist of static 'objects' that are obstacles to the enemies. These objects can give the team valuable information and/or deal damage. On attack, sentinels can use their abilities to cut off certain parts of the map or set up 'objects' that can ensure the enemy cannot flank without being noticed. On defense, sentinels can use their abilities to slow enemies from entering a site. This provides valuable time for the sentinels' team members to come and provide defensive support.
              - superscript [ref=f21e544]:
                - link "[48]" [ref=f21e545] [cursor=pointer]:
                  - /url: "#cite_note-playvalorant.com5-48"
              - superscript [ref=f21e546]:
                - link "[49]" [ref=f21e547] [cursor=pointer]:
                  - /url: "#cite_note-:1-49"
              - superscript [ref=f21e548]:
                - link "[50]" [ref=f21e549] [cursor=pointer]:
                  - /url: "#cite_note-:3-50"
            - paragraph [ref=f21e550]:
              - text: Initiators plan out the offensive pushes. Initiators specialize in breaking through defensive enemy positions. Initiators' abilities can consist of flashes but also abilities that can reveal the location of enemies. This information allows for attackers to know where enemies are and make taking a site easier. On defense, initiators can use their abilities to provide information on where the attackers are going, as well as helping their teammates retake a lost site.
              - superscript [ref=f21e551]:
                - link "[48]" [ref=f21e552] [cursor=pointer]:
                  - /url: "#cite_note-playvalorant.com5-48"
              - superscript [ref=f21e553]:
                - link "[49]" [ref=f21e554] [cursor=pointer]:
                  - /url: "#cite_note-:1-49"
            - paragraph [ref=f21e555]:
              - text: Controllers specialize in "slicing up dangerous territory to set their team up for success."
              - superscript [ref=f21e556]:
                - link "[47]" [ref=f21e557] [cursor=pointer]:
                  - /url: "#cite_note-:03-47"
              - text: They use their abilities to create coverage or clear out areas of space with
              - link "crowd control" [ref=f21e558] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Crowd_control_(video_games)
              - text: . To help their team enter into enemy territory, their abilities consist of some kind of smoke, as well as molotovs, stuns, or flashes. With their smokes, controllers can control
              - link "sightlines" [ref=f21e559] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Sightline
              - text: on the map, making it safer to move through the map without getting seen. On offense, controllers can smoke off certain sightlines and use their crowd control on common defensive spots to force enemies into the open. On defense, controllers can smoke and/or use crowd control on entryways to delay or discourage the enemy team from moving forward.
              - superscript [ref=f21e560]:
                - link "[48]" [ref=f21e561] [cursor=pointer]:
                  - /url: "#cite_note-playvalorant.com5-48"
              - superscript [ref=f21e562]:
                - link "[49]" [ref=f21e563] [cursor=pointer]:
                  - /url: "#cite_note-:1-49"
