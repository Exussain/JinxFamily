            - paragraph [ref=f22e353]:
              - generic [ref=f22e354]: Marvel Rivals
              - superscript [ref=f22e355]:
                - link "[b]" [ref=f22e356] [cursor=pointer]:
                  - /url: "#cite_note-11"
              - text: is a free-to-play
              - link "hero shooter" [ref=f22e357] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Hero_shooter
              - link "video game" [ref=f22e358] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Video_game
              - text: developed and published by
              - link "NetEase Games" [ref=f22e359] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/NetEase_Games
              - text: in collaboration with
              - link "Marvel Games" [ref=f22e360] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Marvel_Games
              - text: . The game was released for
              - link "PlayStation 5" [ref=f22e361] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/PlayStation_5
              - text: ","
              - link "Windows" [ref=f22e362] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Windows
              - text: ", and"
              - link "Xbox Series X/S" [ref=f22e363] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Xbox_Series_X_and_Series_S
              - text: on December 6, 2024, with a
              - link "PlayStation 4" [ref=f22e364] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/PlayStation_4
              - text: version released on September 12, 2025 and a
              - link "Nintendo Switch 2" [ref=f22e365] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Nintendo_Switch_2
              - text: version currently in development. The game is
              - link "free-to-play" [ref=f22e366] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Free-to-play
              - text: with a current lineup of 53 playable characters from
              - link "Marvel Comics" [ref=f22e367] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Marvel_Comics
              - text: ", and features"
              - link "cross-play" [ref=f22e368] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Cross-platform_play
              - text: across all supported platforms.
            - paragraph [ref=f22e369]:
              - link "Marvel Comics" [ref=f22e370] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Marvel_Comics
              - text: has released two digital
              - link "ongoing series" [ref=f22e371] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Ongoing_series
              - text: "based on the game: Marvel Rivals Infinity Comic (2024) and Marvel Rivals: Unleashed Infinity Comic (2025). Characters from the game have also been featured in other Marvel comic series."
          - region [ref=f22e372]:
            - generic [ref=f22e373]:
              - heading "Premise" [level=2] [ref=f22e374]
              - generic [ref=f22e375]:
