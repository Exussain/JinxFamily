            - paragraph [ref=f22e1234]:
              - text: Marvel Rivals received "mixed or average" reviews for the PC version and "generally favorable" reviews for the PlayStation 5 and Xbox Series X versions, according to the
              - link "review aggregator" [ref=f22e1235] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Review_aggregator
              - text: website
              - link "Metacritic" [ref=f22e1236] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Metacritic
              - text: .
              - superscript [ref=f22e1237]:
                - link "[105]" [ref=f22e1238] [cursor=pointer]:
                  - /url: "#cite_note-PC_Reviews_(MC)-108"
              - superscript [ref=f22e1239]:
                - link "[106]" [ref=f22e1240] [cursor=pointer]:
                  - /url: "#cite_note-PS5_Reviews_(MC)-109"
            - paragraph [ref=f22e1241]:
              - text: Marvel Rivals has been praised for its monetization model, which does not involve
              - link "pay-to-win" [ref=f22e1242] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Pay-to-win
              - text: elements (all gameplay elements such as heroes are free) and time limits on purchased battle passes.
              - superscript [ref=f22e1243]:
                - link "[117]" [ref=f22e1244] [cursor=pointer]:
                  - /url: "#cite_note-120"
              - superscript [ref=f22e1245]:
                - link "[118]" [ref=f22e1246] [cursor=pointer]:
                  - /url: "#cite_note-121"
              - superscript [ref=f22e1247]:
                - link "[119]" [ref=f22e1248] [cursor=pointer]:
                  - /url: "#cite_note-122"
            - paragraph [ref=f22e1249]:
              - link "Game Rant" [ref=f22e1251] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Game_Rant
              - text: mentions the introduction of a "vote to surrender" feature in the game's competitive mode sparked debate within the player community. This feature allows teams to end matches early if a majority agrees, but only becomes available once a full round is played. Supporters argued it helps avoid frustrating, unwinnable situations, particularly during connectivity issues or unbalanced matches. Critics, however, feared it might foster a defeatist attitude and disrupt team dynamics, potentially leading to increased negativity and premature match endings.
              - superscript [ref=f22e1252]:
                - link "[120]" [ref=f22e1253] [cursor=pointer]:
                  - /url: "#cite_note-123"
              - text: As of the June 26, 2025 patch, the developers made the surrender system more forgiving for teams that encounter a teammate that disconnected; the voting threshold to surrender now adjusts to the number of players remaining on your team, which rendered a positive reception from players.
              - superscript [ref=f22e1254]:
                - link "[121]" [ref=f22e1255] [cursor=pointer]:
                  - /url: "#cite_note-124"
              - superscript [ref=f22e1256]:
                - link "[122]" [ref=f22e1257] [cursor=pointer]:
                  - /url: "#cite_note-125"
            - region [ref=f22e1258]:
              - generic [ref=f22e1259]:
                - heading "Financial and player metrics" [level=3] [ref=f22e1260]
                - generic [ref=f22e1261]:
                  - link "edit":
                    - /url: /w/index.php?title=Marvel_Rivals&action=edit&section=16
              - paragraph [ref=f22e1262]:
                - text: Marvel Rivals reached 10 million players worldwide within 72 hours of its release on December 6, 2024.
                - superscript [ref=f22e1263]:
                  - link "[123]" [ref=f22e1264] [cursor=pointer]:
                    - /url: "#cite_note-kuh-numb-126"
                - superscript [ref=f22e1265]:
                  - link "[124]" [ref=f22e1266] [cursor=pointer]:
                    - /url: "#cite_note-127"
                - text: The game's player base surpassed 20 million by December 17.
                - superscript [ref=f22e1267]:
                  - link "[125]" [ref=f22e1268] [cursor=pointer]:
                    - /url: "#cite_note-128"
                - text: During its first month, the game peaked at over 480,000 concurrent players and maintained most of its in-game player count on Steam.
                - superscript [ref=f22e1269]:
                  - link "[126]" [ref=f22e1270] [cursor=pointer]:
                    - /url: "#cite_note-129"
                - superscript [ref=f22e1271]:
                  - link "[127]" [ref=f22e1272] [cursor=pointer]:
                    - /url: "#cite_note-130"
                - text: GameLook, a Chinese video game industry research outlet, estimated that Marvel Rivals generated approximately US$135 million in revenue across all platforms during this period.
                - superscript [ref=f22e1273]:
                  - link "[128]" [ref=f22e1274] [cursor=pointer]:
                    - /url: "#cite_note-131"
                - text: On the Newzoo chart, it ranked 6th among the top 20 games by revenue for December in the United States, United Kingdom, Germany, France, Spain, and Italy.
                - superscript [ref=f22e1275]:
                  - link "[129]" [ref=f22e1276] [cursor=pointer]:
                    - /url: "#cite_note-132"
                - text: Microsoft also reported that Marvel Rivals was among the Xbox games with the highest single-day active user counts throughout the year.
                - superscript [ref=f22e1277]:
                  - link "[130]" [ref=f22e1278] [cursor=pointer]:
                    - /url: "#cite_note-133"
                - superscript [ref=f22e1279]:
                  - link "[131]" [ref=f22e1280] [cursor=pointer]:
                    - /url: "#cite_note-134"
                - superscript [ref=f22e1281]:
                  - link "[132]" [ref=f22e1282] [cursor=pointer]:
                    - /url: "#cite_note-135"
              - paragraph [ref=f22e1283]:
                - text: Following the launch of Season 1 in January 2025, Marvel Rivals again reached a peak of 644,269 concurrent players on Steam.
                - superscript [ref=f22e1284]:
                  - link "[133]" [ref=f22e1285] [cursor=pointer]:
                    - /url: "#cite_note-mrjgeb-136"
                - superscript [ref=f22e1286]:
                  - link "[134]" [ref=f22e1287] [cursor=pointer]:
                    - /url: "#cite_note-eu644-137"
                - superscript [ref=f22e1288]:
                  - link "[135]" [ref=f22e1289] [cursor=pointer]:
                    - /url: "#cite_note-pcg644-138"
                - text: It became the 14th highest-ranking game of all time on the platform by this metric.
                - superscript [ref=f22e1290]:
                  - link "[134]" [ref=f22e1291] [cursor=pointer]:
                    - /url: "#cite_note-eu644-137"
                - superscript [ref=f22e1292]:
                  - link "[135]" [ref=f22e1293] [cursor=pointer]:
                    - /url: "#cite_note-pcg644-138"
                - text: On the Newzoo chart, the game ranked 5th among the top 20 games by revenue for the same month in the United States, United Kingdom, Germany, France, Spain, and Italy.
                - superscript [ref=f22e1294]:
                  - link "[136]" [ref=f22e1295] [cursor=pointer]:
                    - /url: "#cite_note-139"
                - text: By February 2025, NetEase reported that the game had surpassed 40 million players worldwide.
                - superscript [ref=f22e1296]:
                  - link "[137]" [ref=f22e1297] [cursor=pointer]:
                    - /url: "#cite_note-biz40m-140"
                - superscript [ref=f22e1298]:
                  - link "[138]" [ref=f22e1299] [cursor=pointer]:
                    - /url: "#cite_note-141"
                - superscript [ref=f22e1300]:
                  - link "[139]" [ref=f22e1301] [cursor=pointer]:
                    - /url: "#cite_note-vg24740m-142"
                - text: Sony reported that Marvel Rivals was the 3rd most downloaded free-to-play title on PlayStation 4 and PlayStation 5 in the United States and Canada, and 6th in Europe, during 2025.
                - superscript [ref=f22e1302]:
                  - link "[140]" [ref=f22e1303] [cursor=pointer]:
                    - /url: "#cite_note-143"
                - text: Valve reported that the game was also among the 12 best-selling titles on Steam through 2025.
                - superscript [ref=f22e1304]:
                  - link "[141]" [ref=f22e1305] [cursor=pointer]:
                    - /url: "#cite_note-144"
                - superscript [ref=f22e1306]:
                  - link "[142]" [ref=f22e1307] [cursor=pointer]:
                    - /url: "#cite_note-145"
                - superscript [ref=f22e1308]:
                  - link "[143]" [ref=f22e1309] [cursor=pointer]:
                    - /url: "#cite_note-146"
                - text: At Sony's PlayStation Partner Awards 2025, the game received a Grand Award in recognition of its status as one of "the top five titles developed in the Japan / Asia regions with the highest worldwide sales between October 2024 and September 2025".
                - superscript [ref=f22e1310]:
                  - link "[144]" [ref=f22e1311] [cursor=pointer]:
                    - /url: "#cite_note-147"
              - paragraph [ref=f22e1312]:
                - text: In January 2026, Marvel Rivals recorded more than 200,000 concurrent players, following the launch of Season 6.
                - superscript [ref=f22e1313]:
                  - link "[145]" [ref=f22e1314] [cursor=pointer]:
                    - /url: "#cite_note-148"
                - superscript [ref=f22e1315]:
                  - link "[146]" [ref=f22e1316] [cursor=pointer]:
                    - /url: "#cite_note-149"
                - text: The player count marked an increase from Season 5's launch peak of 160,000 and higher than the lowest point recorded during Season 4, which saw 132,000 concurrent players.
                - superscript [ref=f22e1317]:
                  - link "[147]" [ref=f22e1318] [cursor=pointer]:
                    - /url: "#cite_note-150"
                - text: As of June 2026, Marvel Rivals has over 50 million players worldwide.
                - superscript [ref=f22e1319]:
                  - link "[148]" [ref=f22e1320] [cursor=pointer]:
                    - /url: "#cite_note-151"
            - region [ref=f22e1321]:
              - generic [ref=f22e1322]:
                - heading "Censorship" [level=3] [ref=f22e1323]
                - generic [ref=f22e1324]:
                  - link "edit":
                    - /url: /w/index.php?title=Marvel_Rivals&action=edit&section=17
              - note [ref=f22e1325]:
                - text: "Further information:"
                - link "Censorship in China" [ref=f22e1326] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Censorship_in_China
                - text: and
                - link "Chinese censorship abroad" [ref=f22e1327] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Chinese_censorship_abroad
              - paragraph [ref=f22e1328]:
                - text: After release, discussion proceeded on in-game censorship of controversial terms beyond China's borders.
                - superscript [ref=f22e1329]:
                  - link "[149]" [ref=f22e1330] [cursor=pointer]:
                    - /url: "#cite_note-:1-152"
                - text: Specifically, censorship of "
                - link "Winnie the Pooh" [ref=f22e1331] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Winnie-the-Pooh
                - text: "\" caused speculation that the China-based developer NetEase blocked the phrase due to"
                - link "censorship of Winnie-the-Pooh in China" [ref=f22e1332] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Censorship_of_Winnie-the-Pooh_in_China
                - text: . Other phrases
                - link "restricted in China" [ref=f22e1333] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Censorship_in_China
                - text: "that are banned in-game include: \""
                - link "1989" [ref=f22e1334] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/1989_Tiananmen_Square_protests_and_massacre
                - text: "\", \""
                - link "Tiananmen Square" [ref=f22e1335] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tiananmen_Square
                - text: "\", \""
                - link "Free Taiwan" [ref=f22e1336] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Political_status_of_Taiwan
                - text: "\", \"Free Hong Kong\" and terms pertaining to the"
                - link "persecution of Uyghurs in China" [ref=f22e1337] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Persecution_of_Uyghurs_in_China
                - text: .
                - superscript [ref=f22e1338]:
                  - link "[149]" [ref=f22e1339] [cursor=pointer]:
                    - /url: "#cite_note-:1-152"
                - superscript [ref=f22e1340]:
                  - link "[150]" [ref=f22e1341] [cursor=pointer]:
                    - /url: "#cite_note-153"
                - text: The censorship extends beyond content specific to China, also restricting words such as "
                - link "ISIS" [ref=f22e1342] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/ISIS
                - text: "\", \""
                - link "Hitler" [ref=f22e1343] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Adolf_Hitler
                - text: "\", and \""
                - link "Epstein" [ref=f22e1344] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Jeffrey_Epstein
                - text: "\". Attempting to use these banned messages in the in-game chat will result in a message stating, \"Text contains inappropriate content.\""
                - superscript [ref=f22e1345]:
                  - link "[151]" [ref=f22e1346] [cursor=pointer]:
                    - /url: "#cite_note-154"
            - region [ref=f22e1347]:
