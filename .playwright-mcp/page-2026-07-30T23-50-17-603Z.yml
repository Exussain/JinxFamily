                  - row [ref=f22e831]:
                    - cell "5" [ref=f22e832]
                    - cell "November 14, 2025" [ref=f22e833]
                    - cell "January 16, 2026" [ref=f22e834]
                    - cell [ref=f22e835]:
                      - text: "\"Love is a Battlefield\" – Introduced Gambit and Rogue as playable heroes."
                      - superscript [ref=f22e836]:
                        - link "[47]" [ref=f22e837] [cursor=pointer]:
                          - /url: "#cite_note-50"
                      - text: Added Times Square and
                      - link "Grand Garden" [ref=f22e838] [cursor=pointer]:
                        - /url: https://en.wikipedia.org/wiki/Elders_of_the_Universe
                      - text: maps, and included Gambit striking a deal with the
                      - link "Grandmaster" [ref=f22e839] [cursor=pointer]:
                        - /url: https://en.wikipedia.org/wiki/Grandmaster_(Marvel_Comics)
                      - text: and stealing a contract from the
                      - link "Collector" [ref=f22e840] [cursor=pointer]:
                        - /url: https://en.wikipedia.org/wiki/Collector_(character)
                      - text: as the central story focus. Based on the
                      - link "Mr. & Mrs. X" [ref=f22e842] [cursor=pointer]:
                        - /url: https://en.wikipedia.org/wiki/Mr._&_Mrs._X
