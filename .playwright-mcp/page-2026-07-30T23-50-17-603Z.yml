                  - rowgroup
              - paragraph [ref=f22e723]:
                - link "The Hood" [ref=f22e724] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/The_Hood_(Marvel_Comics)
                - text: will be added in Season 9.5.
                - superscript [ref=f22e725]:
                  - link "[27]" [ref=f22e726] [cursor=pointer]:
                    - /url: "#cite_note-30"
              - paragraph [ref=f22e727]:
                - text: Many characters, in addition to cosmetic skins original to the game, have unlockable or purchasable cosmetics based on alternative versions of themselves from various comic book series,
                - superscript [ref=f22e728]:
                  - link "[28]" [ref=f22e729] [cursor=pointer]:
                    - /url: "#cite_note-31"
                - link "Marvel Cinematic Universe" [ref=f22e730] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Marvel_Cinematic_Universe
                - text: appearances,
                - superscript [ref=f22e731]:
                  - link "[29]" [ref=f22e732] [cursor=pointer]:
                    - /url: "#cite_note-32"
                - text: or other video games such as
                - link "Marvel's Spider-Man 2" [ref=f22e734] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Marvel's_Spider-Man_2
                - superscript [ref=f22e735]:
                  - link "[30]" [ref=f22e736] [cursor=pointer]:
                    - /url: "#cite_note-33"
                - text: and
                - link "Marvel Cosmic Invasion" [ref=f22e738] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Marvel_Cosmic_Invasion
                - text: .
                - superscript [ref=f22e739]:
                  - link "[31]" [ref=f22e740] [cursor=pointer]:
                    - /url: "#cite_note-34"
            - region [ref=f22e741]:
              - generic [ref=f22e742]:
                - heading "Seasonal content" [level=3] [ref=f22e743]
                - generic [ref=f22e744]:
                  - link "edit":
                    - /url: /w/index.php?title=Marvel_Rivals&action=edit&section=5
              - paragraph [ref=f22e745]:
                - text: New content is routinely added to Marvel Rivals through seasonal updates. Initially, each season was to last three months long and split into two halves, releasing new content with each half season, including at least one new hero.
                - superscript [ref=f22e746]:
                  - link "[32]" [ref=f22e747] [cursor=pointer]:
                    - /url: "#cite_note-35"
                - text: From season 3 onward, seasons have lasted two months but still split into two halves, effectively introducing a new hero on a monthly basis.
                - superscript [ref=f22e748]:
                  - link "[33]" [ref=f22e749] [cursor=pointer]:
                    - /url: "#cite_note-36"
              - paragraph [ref=f22e750]:
                - text: Each season features a purchasable
                - link "battle pass" [ref=f22e751] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Battle_pass
                - text: which includes cosmetic items (such as character skins, emotes, sprays and player banners) that the player can buy by using Chrono Tokens, the in-game currency earned from playing matches and completing daily, weekly, and seasonal challenges. Once the player purchases a battle pass for the season, it will no longer expire. Other cosmetic contents are available for purchase within the in-game story using Lattice, a premium currency that can be obtained through Achievement rewards, events, the Battle Pass, or with real-world currency.
                - superscript [ref=f22e752]:
                  - link "[34]" [ref=f22e753] [cursor=pointer]:
                    - /url: "#cite_note-37"
                - superscript [ref=f22e754]:
                  - link "[35]" [ref=f22e755] [cursor=pointer]:
                    - /url: "#cite_note-38"
                - text: Furthermore, Marvel Rivals has offered short term events around holiday or seasonal themes, which may include limited-time modes and themed cosmetics for completing challenges; for example, the first Winter Celebration event (December 2024–January 2025) featured a 4v4 game mode similar to
                - link "Splatoon" [ref=f22e757] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Splatoon
                - text: where players used Jeff the Land Shark's spit attack to cover the most area on a map with their team's colour.
                - superscript [ref=f22e758]:
                  - link "[36]" [ref=f22e759] [cursor=pointer]:
                    - /url: "#cite_note-Splatoon-39"
