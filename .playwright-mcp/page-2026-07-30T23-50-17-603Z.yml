                  - link "Convoy" [ref=f22e411] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Payload_(disambiguation)
                  - text: "– Two teams are randomly assigned offense or defense. Offense teams escort a moving object through the map while defence teams must stop the object by capturing it. The object will passively move forward while captured by offence and backwards while captured by defence; only offence may increase the object's speed, by standing near it. Regardless of the team that has captured it, the object will remain stationary if a member of the opposing team is nearby. In competitive mode, team roles will swap once offence has escorted the object to its destination or the timer runs out; if both teams successfully escort the object to its destination as offence, tiebreaker rounds will occur using the leftover offence time of each team. Maps currently include Yggsgard: Yggdrasil Path, Tokyo 2099: Spider-Islands, Empire of Eternal Night: Midtown, Hellfire Gala: Arakko, Museum of Contemplation, and Thebes."
                - listitem [ref=f22e412]:
                  - link "Domination" [ref=f22e413] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/King_of_the_hill_(game)
                  - text: "– Two teams attack a zone within an area map; one from a pool of three for each map. When the zone is captured, the defending team will gradually gain points until 100% is reached. This is then repeated on another area map until a team has captured two zones, achieving victory. Maps currently include, Yggsgard: Royal Palace, Hydra Charteris Base: Hell's Heaven, Intergalactic Empire of Wakanda: Birnin T'Challa, Hellfire Gala: Krakoa, and Klyntar: Celestial Husk."
                - listitem [ref=f22e414]: "Convergence – Two teams are randomly assigned offense or defense. Offence teams must attack and secure a starting checkpoint while defence teams must prevent the checkpoint from capture until the timer ends. If offence successfully captures the checkpoint, the game shifts into mechanics identical to Convoy. Maps currently include, Tokyo 2099: Shin-Shibuya, Intergalactic Empire of Wakanda: Hall of Djalia, Klyntar: Symbiotic Surface, Empire of Eternal Night: Central Park, K'un-Lun: Heart of Heaven, and Lower Manhattan."
                - listitem [ref=f22e415]:
                  - text: Resource Rumble – Two teams battle over one of three zones on a singular map to collect resources. Once the zone is depleted of resources, another zone will unlock. If a team collects all resources from two zones, they win. If both teams collect enough resources from the first two zones, the third zone will unlock and teams must fight to capture it and steal the other team's resources to win. This mode is currently only available in custom match.
                  - superscript [ref=f22e416]:
                    - link "[17]" [ref=f22e417] [cursor=pointer]:
                      - /url: "#cite_note-:4-19"
                  - text: "Maps currently include, Klyntar: Throne of Knull."
                - listitem [ref=f22e418]: "Conquest – Two teams battle to eliminate opposition. Eliminated heroes drop points that can be picked up by opponents, adding to their team's count, or allies, denying the opposition of the point. The game ends when a team reaches 50 points or the timer runs out, with the team holding the most points winning. Maps currently include, Tokyo 2099: Ninomaru."
                - listitem [ref=f22e419]:
                  - text: Doom Match – A free-for-all
                  - link "deathmatch" [ref=f22e420] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Deathmatch_(video_games)
                  - text: "between up to 12 players. The game ends when a player reaches 16 Final Hits, and the top half of players are declared the match's winners. Maps currently include, Empire of Eternal Night: Sanctum Sanctorum and Alchemax Headquarters."
                - listitem [ref=f22e421]:
                  - text: 18 vs. 18 Annihilation - Players are divided into two teams without hero duplicate restrictions in a 36-player
                  - link "deathmatch" [ref=f22e422] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Deathmatch_(video_games)
                  - text: . Teams are rewarded points for each kill with a target score of 120 under a 6-minute time limit. If the timer expires, the side with the higher score wins. This mode can be played either player vs. player, or player vs. AI. Maps currently include, Grand Garden.
                - listitem [ref=f22e423]: "18 vs. 18 Bounty Annihilation - Players are divided into two teams without hero duplicate restrictions in a 36-player fight over control zones. One of three zones on the map is active at a time, then the objective zone will change once 100 total points have been accrued. Players capturing a zone begins generating points, and scoring kills grants 1 point. After dying, players can choose where they respawn from one of three points. The first team to earn 300 points wins. Maps currently include, K'un-Lun: Shenloong Arena"
              - paragraph [ref=f22e424]: Quick Match and Practice Vs. AI feature non-ranked games where three modes are available; Domination, Convoy, and Convergence. In Practise Vs. AI, AI opponents are used instead of real players.
              - paragraph [ref=f22e425]:
                - text: Competitive also features the aforementioned modes but is unlocked at Level 15. Here, players occupy one of nine ranks, which each containing three tiers; at the beginning of each season, players carry out "placement matches", which, alongside a projected rank based on past performance, are used to assign the player an initial rank for the respective season.
                - superscript [ref=f22e426]:
                  - link "[18]" [ref=f22e427] [cursor=pointer]:
                    - /url: "#cite_note-20"
                - text: During games, players are matched with others based on rank, with promotion and demotion between ranks occurring based on wins and losses. During games at Gold rank and higher, players are able to elect three heroes per team to be banned from use. Depending on their final rank, players are rewarded with cosmetic items at the end of each season.
                - superscript [ref=f22e428]:
                  - link "[19]" [ref=f22e429] [cursor=pointer]:
                    - /url: "#cite_note-21"
              - paragraph [ref=f22e430]: Players can also partake in Tournament matches after both earning at least Platinum rank and joining a Faction. Tournament matches feature the same modes and rulesets as Competitive, typically in best of three or best of five formats using multiple matches of different game modes. There are three hero bans per team that apply solely to the opposing team, and there are two protect slots that prevent heroes from being banned. Custom Games allow any of the aforementioned modes and rulesets to be used.
              - paragraph [ref=f22e431]:
                - text: "The arcade hub features more casual modes: Doom Match, Conquest, and Free Fight. Free Fight uses Quick Match rulesets but allows duplicate heroes, using Competitive's hero ban system to compensate. The Arcade hub has previously contained modes such as Clone Rumble, Giant-Sized Brain Blast and Conquest (Annihilation). These were removed on the December 18, 2025 Winter update."
                - superscript [ref=f22e432]:
                  - link "[20]" [ref=f22e433] [cursor=pointer]:
                    - /url: "#cite_note-22"
              - paragraph [ref=f22e434]:
                - text: There have also been several limited-time game modes, such as Jeff's Winter Splash Festival, Clash of Dancing Lions, Giant-Sized Hive Mind and Ultron's Battle Matrix Protocol. Marvel Zombies (inspired by the animated series
                - generic [ref=f22e435]:
                  - link "Marvel Zombies" [ref=f22e436] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Marvel_Zombies_(TV_series)
                  - text: )
                - text: was the game's first
                - link "PvE" [ref=f22e437] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Player_versus_environment
                - text: mode, with more planned for the future.
                - superscript [ref=f22e438]:
                  - link "[17]" [ref=f22e439] [cursor=pointer]:
                    - /url: "#cite_note-:4-19"
                - text: The second PvE mode, Blood Hunt (inspired by the comic book crossover
                - link "Blood Hunt" [ref=f22e440] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Blood_Hunt_(comics)
                - text: ) was added to the game on April 23rd, 2026.
                - superscript [ref=f22e441]:
                  - link "[21]" [ref=f22e442] [cursor=pointer]:
                    - /url: "#cite_note-23"
            - region [ref=f22e443]:
              - generic [ref=f22e444]:
                - heading "Playable characters" [level=3] [ref=f22e445]
                - generic [ref=f22e446]:
                  - link "edit":
                    - /url: /w/index.php?title=Marvel_Rivals&action=edit&section=4
              - generic [ref=f22e450]:
                - text: It has been suggested that this section be
                - link "split" [ref=f22e451] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Wikipedia:Splitting
                - text: out into another article titled
                - link "Characters of the Marvel Rivals franchise" [ref=f22e453] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Characters_of_the_Marvel_Rivals_franchise?action=edit&redlink=1
                - text: . (
                - link "Discuss" [ref=f22e454] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Talk:Marvel_Rivals#Reasons_for_split
                - text: )
                - generic [ref=f22e455]: (June 2026)
              - paragraph [ref=f22e456]:
                - text: As of July 2026 , 53
                - link "playable characters" [ref=f22e457] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Player_character
                - text: have been officially announced, with 52 currently playable in-game.
              - paragraph [ref=f22e458]:
                - text: Guangyun Chen, the game's creative director, has expressed the aim to include both fan favourites and lesser known characters in the roster, saying, "When it comes to designing characters in our game, we usually dive really deep into the background and personality of each Marvel character, so every character's gameplay mechanic and skill is really crafted to reflect who these heroes really are in the comics."
                - superscript [ref=f22e459]:
                  - link "[2]" [ref=f22e460] [cursor=pointer]:
                    - /url: "#cite_note-Cawley2024-3"
              - paragraph [ref=f22e461]:
                - text: "Playable characters are divided into three main roles: Vanguard, Duelist, and Strategist. Vanguard heroes function like"
                - link "tanks" [ref=f22e462] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tank_(video_games)
                - text: . Duelist heroes are designed to deal maximum damage and secure kills. Strategist heroes support their teammates through
                - link "healing" [ref=f22e463] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Healer_(video_games)
                - text: ","
                - link "buffs" [ref=f22e464] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Status_effect
                - text: and other utility abilities.
                - superscript [ref=f22e465]:
                  - link "[22]" [ref=f22e466] [cursor=pointer]:
                    - /url: "#cite_note-24"
                - text: Each character's skillset is based on their comic book counterparts and typically features active and passive abilities, as well as a basic primary attack. Furthermore, each character possesses a unique ultimate ability that can only be used after the build-up of an ultimate charge meter, either passively over time or by engaging in combat.
              - paragraph [ref=f22e467]:
                - text: Unique to Rivals is the idea of Team-ups, where a hero gains an additional ability from another hero. Initially at launch, there were a limited number of Team-ups, and required the allied team to have both heroes selected to take advantage of this. With the launch of Season 9 in July 2026, each hero gained at least two different Team-up abilities regardless of what other heroes their allies were playing, selecting this Team-Up from the character select screen. Having the associated hero of a Team-up on the allied team grants an enhanced effect to the ability.
                - superscript [ref=f22e468]:
                  - link "[23]" [ref=f22e469] [cursor=pointer]:
                    - /url: "#cite_note-25"
                - superscript [ref=f22e470]:
                  - link "[24]" [ref=f22e471] [cursor=pointer]:
                    - /url: "#cite_note-26"
                - text: For example, The Hulk can either choose either a Captain America Team-up that grants a ground slam ability and a cooldown reduction passive or a Wolverine Team-up that grants a fury state ability and the Unstoppable status effect at low health. If Captain America is on his team, then his ground slam Team-up deals more damage and applies the Vulnerability status to enemies hit. Whereas Wolverine on his team grants Hulk the ability throw Wolverine towards foes in a "Fastball Special" when Hulk's fury state Team-up equipped.
              - paragraph [ref=f22e472]:
                - text: The game does not require players into a "role queue", which would otherwise mandate a specific blend of heroes on a team; Chen said this was "to offer a wider variety of team composition", as well as to allow players to use team-up abilities without restrictions.
                - superscript [ref=f22e473]:
                  - link "[25]" [ref=f22e474] [cursor=pointer]:
                    - /url: "#cite_note-27"
