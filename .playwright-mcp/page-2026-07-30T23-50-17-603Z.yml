                  - /url: /w/index.php?title=Marvel_Rivals&action=edit&section=1
            - paragraph [ref=f22e376]:
              - text: The story follows a hostile meeting between
              - link "Doctor Doom" [ref=f22e377] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Doctor_Doom
              - text: and his heroic
              - link "2099 counterpart" [ref=f22e378] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Doom_2099
              - text: ", which causes a \"timestream entanglement\" that leads to new worlds being created and heroes and villains from across the"
              - link "multiverse" [ref=f22e379] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Multiverse_(Marvel_Comics)
              - text: fighting one another to defeat both Doom variants before one claims victory over the new worlds.
