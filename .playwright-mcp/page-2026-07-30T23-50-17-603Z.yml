                      - link "Deadpool" [ref=f22e851] [cursor=pointer]:
                        - /url: https://en.wikipedia.org/wiki/Deadpool_(comic_book)#Volume_7:_King_Deadpool
                      - text: (2019) comic series.
                  - row [ref=f22e852]:
                    - cell "7" [ref=f22e853]
                    - cell "March 20, 2026" [ref=f22e854]
                    - cell "May 15, 2026" [ref=f22e855]
                    - cell [ref=f22e856]:
                      - text: "\"The Hunt is On\" – Introduced White Fox and Black Cat as playable heroes."
                      - superscript [ref=f22e857]:
                        - link "[49]" [ref=f22e858] [cursor=pointer]:
                          - /url: "#cite_note-52"
                      - text: Added a Lower Manhattan map, and included
                      - link "Wilson Fisk" [ref=f22e859] [cursor=pointer]:
                        - /url: https://en.wikipedia.org/wiki/Kingpin_(character)
                      - text: "'s anti-superhero mayoral efforts to save New York from a multiversal"
                      - link "Alchemax" [ref=f22e860] [cursor=pointer]:
                        - /url: https://en.wikipedia.org/wiki/Alchemax
                      - text: invasion as the central story focus. Based on the "
                      - link "Devil's Reign" [ref=f22e861] [cursor=pointer]:
                        - /url: https://en.wikipedia.org/wiki/Devil's_Reign
                      - text: "\" (2021) comics storyline."
                  - row [ref=f22e862]:
                    - cell "8" [ref=f22e863]
                    - cell "May 15, 2026" [ref=f22e864]
                    - cell "July 10, 2026" [ref=f22e865]
                    - cell [ref=f22e866]:
                      - text: "\"Sins of Alchemax\" – Introduced Devil Dinosaur and Cyclops as playable heroes."
                      - superscript [ref=f22e867]:
                        - link "[50]" [ref=f22e868] [cursor=pointer]:
                          - /url: "#cite_note-53"
                      - text: Added
                      - link "Alchemax Headquarters" [ref=f22e869] [cursor=pointer]:
                        - /url: https://en.wikipedia.org/wiki/Alchemax
                      - text: ", Shenloong Arena and Hellfire Bay Beach maps and includes Alchemax's capture of Cyclops and"
                      - link "Moon Girl" [ref=f22e870] [cursor=pointer]:
                        - /url: https://en.wikipedia.org/wiki/Moon_Girl_And_Devil_Dinosaur
                      - text: as the central story focus.
                  - row [ref=f22e871]:
                    - cell "9" [ref=f22e872]
                    - cell "July 10, 2026" [ref=f22e873]
                    - cell [ref=f22e874]
                    - cell [ref=f22e875]:
                      - text: "\"The Mystery of Thebes\" – Introduces Jubilee and The Hood as playable heroes."
                      - superscript [ref=f22e876]:
                        - link "[51]" [ref=f22e877] [cursor=pointer]:
                          - /url: "#cite_note-54"
                      - text: Adds a Thebes map, and includes the murder mystery of
                      - link "Apocalypse" [ref=f22e878] [cursor=pointer]:
                        - /url: https://en.wikipedia.org/wiki/Apocalypse_(character)
                      - text: as the central story focus.
          - region [ref=f22e879]:
            - generic [ref=f22e880]:
              - heading "Development" [level=2] [ref=f22e881]
              - generic [ref=f22e882]:
                - link "edit":
                  - /url: /w/index.php?title=Marvel_Rivals&action=edit&section=6
            - paragraph [ref=f22e883]:
              - link "Marvel Games" [ref=f22e884] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Marvel_Games
              - text: partnered with NetEase Games to develop a team-based PvP hero shooter game.
              - superscript [ref=f22e885]:
                - link "[52]" [ref=f22e886] [cursor=pointer]:
                  - /url: "#cite_note-gschoose-55"
              - text: NetEase Games is mainly responsible for the design and development of gameplay content, while Marvel Games has a supervisory role ensuring the content conforms to the tone of the Marvel brand and intellectual property.
              - superscript [ref=f22e887]:
                - link "[53]" [ref=f22e888] [cursor=pointer]:
                  - /url: "#cite_note-ignch30924-56"
              - text: NetEase Games' development team for Marvel Rivals, based in
              - link "Guangzhou" [ref=f22e889] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Guangzhou
              - text: ", is led by lead producer Weicong Wu and creative director Guangyun Chen."
              - superscript [ref=f22e890]:
                - link "[4]" [ref=f22e891] [cursor=pointer]:
                  - /url: "#cite_note-gr19225-5"
            - paragraph [ref=f22e892]:
              - text: The game is built on
              - link "Unreal Engine 5" [ref=f22e893] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Unreal_Engine_5
              - text: .
              - superscript [ref=f22e894]:
                - link "[9]" [ref=f22e895] [cursor=pointer]:
                  - /url: "#cite_note-gnnrelease-10"
              - superscript [ref=f22e896]:
                - link "[54]" [ref=f22e897] [cursor=pointer]:
                  - /url: "#cite_note-57"
              - text: Marvel Games senior producer Danny Koo characterized Marvel Rivals visually as a blend of Eastern and Western art styles.
              - superscript [ref=f22e898]:
                - link "[52]" [ref=f22e899] [cursor=pointer]:
                  - /url: "#cite_note-gschoose-55"
            - paragraph [ref=f22e900]:
              - text: Each season is preceded by a planning process for that seasons' content.
              - superscript [ref=f22e901]:
                - link "[53]" [ref=f22e902] [cursor=pointer]:
                  - /url: "#cite_note-ignch30924-56"
              - text: The developers first plan the theme of the season and then consider the kind of new experiences they want to bring to players for that season, which serves as the basis to evaluate what kind of heroes are more suitable.
              - superscript [ref=f22e903]:
                - link "[53]" [ref=f22e904] [cursor=pointer]:
                  - /url: "#cite_note-ignch30924-56"
              - text: At the same time, they consider what new gameplay may appear and the corresponding new level maps.
              - superscript [ref=f22e905]:
                - link "[53]" [ref=f22e906] [cursor=pointer]:
                  - /url: "#cite_note-ignch30924-56"
            - paragraph [ref=f22e907]:
              - text: While the development team has experimented with additional gameplay modes, there were no initial plans to introduce a
              - link "player versus environment" [ref=f22e908] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Player_versus_environment
              - text: game mode, as of February 2025 .
              - superscript [ref=f22e909]:
                - link "[55]" [ref=f22e910] [cursor=pointer]:
                  - /url: "#cite_note-58"
              - text: They later announced the Marvel Zombies PvE mode.
            - region [ref=f22e911]:
              - generic [ref=f22e912]:
                - heading "Audio" [level=3] [ref=f22e913]
                - generic [ref=f22e914]:
                  - link "edit":
                    - /url: /w/index.php?title=Marvel_Rivals&action=edit&section=7
              - link [ref=f22e916] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/File:Wiki_letter_w_cropped.svg
                - img "[icon]" [ref=f22e917]
              - generic [ref=f22e918]:
                - text: This section needs expansion. You can help by
                - link "adding missing information" [ref=f22e919] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/w/index.php?title=Marvel_Rivals&action=edit&section=
                - text: .
                - generic [ref=f22e920]: (October 2025)
          - region [ref=f22e922]:
            - generic [ref=f22e923]:
              - heading "Release and marketing" [level=2] [ref=f22e924]
              - generic [ref=f22e925]:
                - link "edit":
                  - /url: /w/index.php?title=Marvel_Rivals&action=edit&section=8
            - paragraph [ref=f22e926]:
              - text: Marvel Games first announced the game through a trailer released on March 27, 2024.
              - superscript [ref=f22e927]:
                - link "[14]" [ref=f22e928] [cursor=pointer]:
                  - /url: "#cite_note-The_Verge_Rivals-16"
              - text: On November 30, 2024, less than a week before the game's release, the launch trailer for the game was released, showcasing 5 new playable heroes that would be added upon launch.
              - superscript [ref=f22e929]:
                - link "[56]" [ref=f22e930] [cursor=pointer]:
                  - /url: "#cite_note-Marvel_Rivals_Launch_Trailer-59"
            - region [ref=f22e931]:
              - generic [ref=f22e932]:
                - heading "Playtests" [level=3] [ref=f22e933]
                - generic [ref=f22e934]:
                  - link "edit":
                    - /url: /w/index.php?title=Marvel_Rivals&action=edit&section=9
              - paragraph [ref=f22e935]:
                - text: Marvel Rivals had a closed
                - link "alpha test" [ref=f22e936] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Software_testing#Alpha_testing
                - text: accessible to the public lasting ten days, from May 10–20, 2024.
                - superscript [ref=f22e937]:
                  - link "[57]" [ref=f22e938] [cursor=pointer]:
                    - /url: "#cite_note-Variety-60"
                - text: Players could earn permanent rewards transferrable to the game's final release through gameplay. Included rewards were an exclusive alpha tester title and a playable
                - link "skin" [ref=f22e939] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Glossary_of_video_game_terms#skin
                - text: for the character Scarlet Witch, both earned through the test's dedicated
                - link "battle pass" [ref=f22e940] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Battle_pass
                - text: . Additional permanent rewards were the "Dawn of Legends" title, gained from placing Top 32 in the game's eponymous alpha tournament, and an in-game spray decoration, gained by playing with/against a game developer during the
                - link "playtest" [ref=f22e941] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Playtest
                - text: .
                - superscript [ref=f22e942]:
                  - link "[58]" [ref=f22e943] [cursor=pointer]:
                    - /url: "#cite_note-61"
              - paragraph [ref=f22e944]:
                - text: NetEase received backlash during the alpha playtest when streamer
                - link "Brandon Larned" [ref=f22e945] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Seagull_(gamer)
                - text: called out the company on social media for including a non-disparagement clause in the contract given to
                - link "content creators" [ref=f22e946] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Content_creation
                - text: who had access to the alpha test, barring reviews from saying anything negative about the game. Following the controversy, NetEase apologized and stated it would be revising its contract to be more creator-friendly.
                - superscript [ref=f22e947]:
                  - link "[59]" [ref=f22e948] [cursor=pointer]:
                    - /url: "#cite_note-62"
                - superscript [ref=f22e949]:
                  - link "[60]" [ref=f22e950] [cursor=pointer]:
                    - /url: "#cite_note-63"
                - superscript [ref=f22e951]:
                  - link "[61]" [ref=f22e952] [cursor=pointer]:
                    - /url: "#cite_note-64"
              - paragraph [ref=f22e953]:
                - text: A closed
                - link "beta test" [ref=f22e954] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Software_testing#Beta_testing
                - text: for Marvel Rivals took place from July 23 to August 5, 2024, for both consoles and PC.
                - superscript [ref=f22e955]:
                  - link "[62]" [ref=f22e956] [cursor=pointer]:
                    - /url: "#cite_note-Beta_ComicBook-65"
                - superscript [ref=f22e957]:
                  - link "[63]" [ref=f22e958] [cursor=pointer]:
                    - /url: "#cite_note-Beta_Official-66"
            - region [ref=f22e959]:
              - generic [ref=f22e960]:
                - heading "Release" [level=3] [ref=f22e961]
                - generic [ref=f22e962]:
                  - link "edit":
                    - /url: /w/index.php?title=Marvel_Rivals&action=edit&section=10
              - paragraph [ref=f22e963]:
                - text: Marvel Rivals is
                - link "free-to-play" [ref=f22e964] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Free-to-play
                - text: from its initial release. Though the game was set to release for Windows via
                - link "Steam" [ref=f22e965] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Steam_(service)
                - text: and
                - link "Epic Games" [ref=f22e966] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Epic_Games_Store
                - text: ","
                - link "NetEase Games" [ref=f22e967] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/NetEase
                - text: had stated that it is exploring potential releases on other platforms.
                - superscript [ref=f22e968]:
                  - link "[64]" [ref=f22e969] [cursor=pointer]:
                    - /url: "#cite_note-67"
                - superscript [ref=f22e970]:
                  - link "[65]" [ref=f22e971] [cursor=pointer]:
                    - /url: "#cite_note-68"
                - text: During
                - link "Sony" [ref=f22e972] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Sony
                - text: "'s"
                - link "State of Play" [ref=f22e973] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/State_of_Play_(livestream_event)
                - text: held in May, the game was revealed to also be released for
                - link "PlayStation 5" [ref=f22e974] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/PlayStation_5
                - text: and
                - link "Xbox Series X/S" [ref=f22e975] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Xbox_Series_X_and_Series_S
                - text: ", as well as its upcoming beta playtest."
                - superscript [ref=f22e976]:
                  - link "[13]" [ref=f22e977] [cursor=pointer]:
                    - /url: "#cite_note-State_of_Play-15"
                - superscript [ref=f22e978]:
                  - link "[66]" [ref=f22e979] [cursor=pointer]:
                    - /url: "#cite_note-Rivals_PS5_Xbox-69"
                - superscript [ref=f22e980]:
                  - link "[67]" [ref=f22e981] [cursor=pointer]:
                    - /url: "#cite_note-70"
                - text: On November 16, 2024, it was confirmed that Marvel Rivals features an option to select between English, Japanese or Mandarin voice overs at a launch date.
                - superscript [ref=f22e982]:
                  - link "[68]" [ref=f22e983] [cursor=pointer]:
                    - /url: "#cite_note-71"
              - paragraph [ref=f22e984]:
                - text: Marvel Rivals was released on December 6, 2024.
                - superscript [ref=f22e985]:
                  - link "[69]" [ref=f22e986] [cursor=pointer]:
                    - /url: "#cite_note-72"
                - superscript [ref=f22e987]:
                  - link "[70]" [ref=f22e988] [cursor=pointer]:
                    - /url: "#cite_note-73"
                - text: Thaddeus Sasser, a director of NetEase Games'
                - link "Seattle" [ref=f22e989] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Seattle
                - text: "-based design team,"
                - superscript [ref=f22e990]:
                  - link "[4]" [ref=f22e991] [cursor=pointer]:
                    - /url: "#cite_note-gr19225-5"
                - text: stated there is a switching cost in which players who are invested in one game are less willing to move to other games; he contrasted the success of the Marvel Rivals release with the commercial failure of
                - link "hero shooter" [ref=f22e992] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Hero_shooter
                - link "Concord" [ref=f22e994] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Concord_(video_game)
                - text: released the same year, attributing the latter's underperformance to it not providing unique value to overcome this consideration.
                - superscript [ref=f22e995]:
                  - link "[71]" [ref=f22e996] [cursor=pointer]:
                    - /url: "#cite_note-74"
                - superscript [ref=f22e997]:
                  - link "[72]" [ref=f22e998] [cursor=pointer]:
                    - /url: "#cite_note-75"
                - superscript [ref=f22e999]:
                  - link "[73]" [ref=f22e1000] [cursor=pointer]:
                    - /url: "#cite_note-76"
              - paragraph [ref=f22e1001]:
                - text: In February 2025, NetEase laid off their Seattle-based design team including director Sasser.
                - superscript [ref=f22e1002]:
                  - link "[74]" [ref=f22e1003] [cursor=pointer]:
                    - /url: "#cite_note-ignseattle-77"
                - superscript [ref=f22e1004]:
                  - link "[75]" [ref=f22e1005] [cursor=pointer]:
                    - /url: "#cite_note-:0-78"
                - superscript [ref=f22e1006]:
                  - link "[76]" [ref=f22e1007] [cursor=pointer]:
                    - /url: "#cite_note-79"
                - text: This team reportedly comprised six people.
                - superscript [ref=f22e1008]:
                  - link "[77]" [ref=f22e1009] [cursor=pointer]:
                    - /url: "#cite_note-80"
                - link "Kotaku" [ref=f22e1011] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Kotaku
                - text: reported that "the size and location of the teams that worked on the hero shooter have been hard to pin down, and it's not immediately clear what the extent of the teams impacted were or why".
                - superscript [ref=f22e1012]:
                  - link "[78]" [ref=f22e1013] [cursor=pointer]:
                    - /url: "#cite_note-81"
                - text: NetEase said in a response to the closure that they "recently made the difficult decision to adjust Marvel Rivals' development team structure for organizational reasons and to optimize development efficiency for the game" with work still ongoing by their
                - link "Guangzhou" [ref=f22e1014] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Guangzhou
                - text: "-based core development team."
                - superscript [ref=f22e1015]:
                  - link "[4]" [ref=f22e1016] [cursor=pointer]:
                    - /url: "#cite_note-gr19225-5"
                - superscript [ref=f22e1017]:
                  - link "[74]" [ref=f22e1018] [cursor=pointer]:
                    - /url: "#cite_note-ignseattle-77"
                - superscript [ref=f22e1019]:
                  - link "[79]" [ref=f22e1020] [cursor=pointer]:
                    - /url: "#cite_note-82"
              - paragraph [ref=f22e1021]:
                - text: The game was released on the
                - link "PlayStation 4" [ref=f22e1022] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/PlayStation_4
                - text: on September 12, 2025, alongside the start of the fourth season;
                - superscript [ref=f22e1023]:
                  - link "[80]" [ref=f22e1024] [cursor=pointer]:
                    - /url: "#cite_note-83"
                - text: the game runs at 30 frames per second (fps) at 1080p on base consoles, with the PlayStation 4 Pro version running at 1440p and 60 fps.
                - superscript [ref=f22e1025]:
                  - link "[81]" [ref=f22e1026] [cursor=pointer]:
                    - /url: "#cite_note-84"
              - paragraph [ref=f22e1027]:
                - text: In March 2026, Marvel Games executive producer Danny Koo confirmed that a
                - link "Nintendo Switch 2" [ref=f22e1028] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Nintendo_Switch_2
                - text: version of Marvel Rivals is currently in development.
                - superscript [ref=f22e1029]:
                  - link "[82]" [ref=f22e1030] [cursor=pointer]:
                    - /url: "#cite_note-85"
            - region [ref=f22e1031]:
              - generic [ref=f22e1032]:
                - heading "Comics" [level=3] [ref=f22e1033]
                - generic [ref=f22e1034]:
                  - link "edit":
                    - /url: /w/index.php?title=Marvel_Rivals&action=edit&section=11
              - paragraph [ref=f22e1035]:
                - text: Marvel Rivals Infinity Comic (2024) was initially a six-issue digital
                - link "limited series" [ref=f22e1036] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Limited_series_(comics)
                - text: by writer Paul Allor and artist Luca Claretti; it was published by
                - link "Marvel Comics" [ref=f22e1037] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Marvel_Comics
                - text: as part of their
                - link "Infinity Comics" [ref=f22e1039] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Marvel's_Infinity_Comics
                - text: program on
                - link "Marvel Unlimited" [ref=f22e1040] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Marvel_Unlimited
                - text: .
                - superscript [ref=f22e1041]:
                  - link "[83]" [ref=f22e1042] [cursor=pointer]:
                    - /url: "#cite_note-BleedCool-86"
                - superscript [ref=f22e1043]:
                  - link "[84]" [ref=f22e1044] [cursor=pointer]:
                    - /url: "#cite_note-AIPT-87"
                - text: The series then returned in 2025 as an
                - link "ongoing series" [ref=f22e1045] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ongoing_series
                - text: .
                - superscript [ref=f22e1046]:
                  - link "[85]" [ref=f22e1047] [cursor=pointer]:
                    - /url: "#cite_note-88"
                - superscript [ref=f22e1048]:
                  - link "[86]" [ref=f22e1049] [cursor=pointer]:
                    - /url: "#cite_note-89"
                - superscript [ref=f22e1050]:
                  - link "[87]" [ref=f22e1051] [cursor=pointer]:
                    - /url: "#cite_note-90"
                - text: "A second digital ongoing series, Marvel Rivals: Unleashed Infinity Comic (2025), began in October 21, 2025; this series is also written by Allor."
                - superscript [ref=f22e1052]:
                  - link "[88]" [ref=f22e1053] [cursor=pointer]:
                    - /url: "#cite_note-91"
                - superscript [ref=f22e1054]:
                  - link "[89]" [ref=f22e1055] [cursor=pointer]:
                    - /url: "#cite_note-92"
              - paragraph [ref=f22e1056]:
                - text: "Sai: Dimensional Rivals (2026) is a five-issue limited series by"
                - link "Peach Momoko" [ref=f22e1057] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Peach_Momoko
                - text: along with other creators such as
                - link "Stan Sakai" [ref=f22e1058] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Stan_Sakai
                - text: ","
                - link "Esad Ribić" [ref=f22e1059] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Esad_Ribić
                - text: ", Natacha Bustos,"
                - link "Mike del Mundo" [ref=f22e1060] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Mike_del_Mundo
                - text: ", and"
                - link "Sara Pichelli" [ref=f22e1061] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Sara_Pichelli
                - text: .
                - link "Sai" [ref=f22e1062] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Psylocke#Sai
                - text: was created by Momoko as the
                - link "Ultimate Universe" [ref=f22e1063] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ultimate_Universe
                - text: take on the X-Men character Psylocke; she debuted in the 2021 Demon Days Saga comic series before appearing as a character in Marvel Rivals.
                - superscript [ref=f22e1064]:
                  - link "[90]" [ref=f22e1065] [cursor=pointer]:
                    - /url: "#cite_note-93"
                - superscript [ref=f22e1066]:
                  - link "[91]" [ref=f22e1067] [cursor=pointer]:
                    - /url: "#cite_note-94"
                - superscript [ref=f22e1068]:
                  - link "[92]" [ref=f22e1069] [cursor=pointer]:
                    - /url: "#cite_note-95"
                - text: In April 2026, Justin Carter of
                - link "Gizmodo" [ref=f22e1071] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Gizmodo
                - text: wrote that Marvel Rivals "has had several tie-in comics and reverberated into the main Marvel books—this summer's '
                - link "Queen in Black" [ref=f22e1072] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Queen_in_Black
                - text: "' event focuses on Hela and comes after Rivals' third, symbiote-heavy season\"."
                - superscript [ref=f22e1073]:
                  - link "[93]" [ref=f22e1074] [cursor=pointer]:
                    - /url: "#cite_note-96"
            - region [ref=f22e1075]:
              - generic [ref=f22e1076]:
                - heading "Other tie-in media" [level=3] [ref=f22e1077]
                - generic [ref=f22e1078]:
                  - link "edit":
                    - /url: /w/index.php?title=Marvel_Rivals&action=edit&section=12
              - paragraph [ref=f22e1079]:
                - text: A new game mode inspired by Marvel Rivals was added to the tabletop
                - link "Marvel Multiverse Role-Playing Game" [ref=f22e1081] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Marvel_Multiverse_Role-Playing_Game
                - text: .
                - superscript [ref=f22e1082]:
                  - link "[83]" [ref=f22e1083] [cursor=pointer]:
                    - /url: "#cite_note-BleedCool-86"
                - superscript [ref=f22e1084]:
                  - link "[84]" [ref=f22e1085] [cursor=pointer]:
                    - /url: "#cite_note-AIPT-87"
                - text: Additionally, a Marvel Rivals themed glider for use in
                - link "Fortnite Battle Royale" [ref=f22e1087] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fortnite_Battle_Royale
                - text: was made available via playing challenges in Marvel Rivals and linking an Epic Games account to receive it.
                - superscript [ref=f22e1088]:
                  - link "[94]" [ref=f22e1089] [cursor=pointer]:
                    - /url: "#cite_note-97"
                - text: Furthermore, a skin based on Doctor Doom 2099 was made available for use in Fortnite, with a LEGO style for use in LEGO Fortnite experiences.
                - superscript [ref=f22e1090]:
                  - link "[95]" [ref=f22e1091] [cursor=pointer]:
                    - /url: "#cite_note-98"
          - region [ref=f22e1092]:
            - generic [ref=f22e1093]:
              - heading "Esports" [level=2] [ref=f22e1094]
              - generic [ref=f22e1095]:
                - link "edit":
                  - /url: /w/index.php?title=Marvel_Rivals&action=edit&section=13
            - paragraph [ref=f22e1096]:
              - text: Marvel Rivals has quickly established a competitive esports scene since its launch, with NetEase actively organizing and supporting various tournaments.
              - superscript [ref=f22e1097]:
                - link "[96]" [ref=f22e1098] [cursor=pointer]:
                  - /url: "#cite_note-99"
              - text: The game's competitive structure includes both open qualifiers for all players and invitation-only events for professional teams.
              - superscript [ref=f22e1099]:
                - text: "["
                - link "citation needed" [ref=f22e1101] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Wikipedia:Citation_needed
                - text: "]"
              - superscript [ref=f22e1102]:
                - link "[97]" [ref=f22e1103] [cursor=pointer]:
                  - /url: "#cite_note-100"
              - text: Balance patches have also been implemented.
              - superscript [ref=f22e1104]:
                - link "[98]" [ref=f22e1105] [cursor=pointer]:
                  - /url: "#cite_note-101"
            - region [ref=f22e1106]:
              - generic [ref=f22e1107]:
                - heading "Tournaments and other competitive events" [level=3] [ref=f22e1108]
                - generic [ref=f22e1109]:
                  - link "edit":
                    - /url: /w/index.php?title=Marvel_Rivals&action=edit&section=14
              - list [ref=f22e1110]:
                - listitem [ref=f22e1111]:
                  - text: "Marvel Rivals Championship (MRC): A seasonal in-game event open to all players, including both casual teams and those sponsored by esports organizations."
                  - superscript [ref=f22e1112]:
                    - link "[99]" [ref=f22e1113] [cursor=pointer]:
                      - /url: "#cite_note-102"
                  - superscript [ref=f22e1114]:
                    - link "[100]" [ref=f22e1115] [cursor=pointer]:
                      - /url: "#cite_note-103"
                  - superscript [ref=f22e1116]:
                    - link "[101]" [ref=f22e1117] [cursor=pointer]:
                      - /url: "#cite_note-104"
                - listitem [ref=f22e1118]:
                  - text: "Marvel Rivals Invitational (MRI): Invite-only tournaments featuring established esports organizations."
                  - superscript [ref=f22e1119]:
                    - link "[102]" [ref=f22e1120] [cursor=pointer]:
                      - /url: "#cite_note-105"
                  - superscript [ref=f22e1121]:
                    - text: "["
                    - link "better source needed" [ref=f22e1123] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/Wikipedia:Verifiability#Questionable_sources
                      - generic "This claim needs references to better sources. (June 2025)" [ref=f22e1124]: better source needed
                    - text: "]"
                - listitem [ref=f22e1125]:
                  - text: "Marvel Rivals Ignite 2025: A tournament for teams that clear both the open qualifiers and the regional playoffs."
                  - link "Screen Rant" [ref=f22e1127] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Screen_Rant
                  - text: noted that the $3 million prize pool is "one of the largest competitive prize pools seen for the game so far".
                  - superscript [ref=f22e1128]:
                    - link "[103]" [ref=f22e1129] [cursor=pointer]:
                      - /url: "#cite_note-106"
              - list [ref=f22e1130]:
                - listitem [ref=f22e1131]:
                  - text: "Rivals Fight Night: A recurring event which has North American and European brackets."
                  - superscript [ref=f22e1132]:
                    - link "[104]" [ref=f22e1133] [cursor=pointer]:
                      - /url: "#cite_note-107"
                  - superscript [ref=f22e1134]:
                    - text: "["
                    - link "better source needed" [ref=f22e1136] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/Wikipedia:Verifiability#Questionable_sources
                      - generic "This claim needs references to better sources. (June 2025)" [ref=f22e1137]: better source needed
                    - text: "]"
          - region [ref=f22e1138]:
