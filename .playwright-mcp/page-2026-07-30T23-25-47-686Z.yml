            - paragraph [ref=f6e300]:
              - generic [ref=f6e301]: Brawl Stars
              - text: is a
              - link "multiplayer online battle arena" [ref=f6e302] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Multiplayer_online_battle_arena
              - superscript [ref=f6e303]:
                - link "[1]" [ref=f6e304] [cursor=pointer]:
                  - /url: "#cite_note-vb1-1"
              - text: and
              - link "hero shooter" [ref=f6e305] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Hero_shooter
              - superscript [ref=f6e306]:
                - link "[2]" [ref=f6e307] [cursor=pointer]:
                  - /url: "#cite_note-2"
              - text: video game developed and published by Finnish video game company
              - link "Supercell" [ref=f6e308] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Supercell_(company)
              - text: .
              - superscript [ref=f6e309]:
                - link "[3]" [ref=f6e310] [cursor=pointer]:
                  - /url: "#cite_note-3"
              - text: The game was released worldwide on 12 December 2018, on
              - link "iOS" [ref=f6e311] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/IOS
              - text: and
              - link "Android" [ref=f6e312] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Android_(operating_system)
              - text: platforms. The game features a variety of game modes, each with a distinctive objective. Players are able to choose from over 100 unlockable characters, called "Brawlers", who each have different abilities and playstyles.
              - superscript [ref=f6e313]:
                - link "[4]" [ref=f6e314] [cursor=pointer]:
                  - /url: "#cite_note-RB-4"
              - superscript [ref=f6e315]:
                - link "[5]" [ref=f6e316] [cursor=pointer]:
                  - /url: "#cite_note-5"
          - region [ref=f6e317]:
            - heading "Gameplay" [level=2] [ref=f6e319]
            - figure "Screenshot of gameplay from the map \"Snake Prairie\" on the game mode \"Bounty\"" [ref=f6e320]:
              - link [ref=f6e321] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/File:Brawl_Stars_Bounty_gameplay.png
            - paragraph [ref=f6e324]:
              - text: In Brawl Stars, players battle against other players,
              - link "AI opponents" [ref=f6e325] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Artificial_intelligence_in_video_games
              - text: ", or PvE bosses in multiple game modes. Players can choose between different Brawlers, who can be unlocked through the Starr Road or purchased through the Shop to use in battles."
              - superscript [ref=f6e326]:
                - link "[6]" [ref=f6e327] [cursor=pointer]:
                  - /url: "#cite_note-:1-6"
              - text: In December 2022, a new progressive unlock system called the "Starr Road" replaced Boxes as the main method to unlock Brawlers.
              - superscript [ref=f6e328]:
                - link "[7]" [ref=f6e329] [cursor=pointer]:
                  - /url: "#cite_note-:6-7"
              - text: The cost to unlock each Brawler on the Starr Road depends on its rarity.
              - superscript [ref=f6e330]:
                - link "[8]" [ref=f6e331] [cursor=pointer]:
                  - /url: "#cite_note-8"
              - superscript [ref=f6e332]:
                - text: "["
                - link "unreliable source?" [ref=f6e334] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Wikipedia:Reliable_sources
                - text: "]"
            - paragraph [ref=f6e335]:
              - text: During a match, players can use their Brawler's normal attack or their Super, a special attack that charges up through damaging opponents or in some cases through additional means. Players can also equip their Brawlers with
              - link "power-ups" [ref=f6e336] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Power-up
              - text: known as Gadgets, Star Powers, Gears, Hypercharges, and Buffies; Gadgets and Hypercharges can be activated during a match,
              - superscript [ref=f6e337]:
                - link "[9]" [ref=f6e338] [cursor=pointer]:
                  - /url: "#cite_note-9"
              - superscript [ref=f6e339]:
                - link "[10]" [ref=f6e340] [cursor=pointer]:
                  - /url: "#cite_note-10"
              - text: Star Powers and Gears are passive abilities.
              - superscript [ref=f6e341]:
                - link "[11]" [ref=f6e342] [cursor=pointer]:
                  - /url: "#cite_note-11"
              - superscript [ref=f6e343]:
                - link "[12]" [ref=f6e344] [cursor=pointer]:
                  - /url: "#cite_note-12"
              - text: With the exceptions of Gears, each of these upgrades are specific to each Brawler and can be upgraded with Buffies, which are obtained from Claw Machines.
            - region [ref=f6e345]:
              - heading "Game Modes" [level=3] [ref=f6e347]
              - paragraph [ref=f6e348]:
                - text: Brawl Stars has a variety of different permanent and temporary game modes that players can choose from, each having different objectives and maps. Players can invite friends to play with them while staying under the maximum team size of the game mode. Most modes involve two teams with three players each, other modes can involve either five or two player teams.
                - superscript [ref=f6e349]:
                  - link "[13]" [ref=f6e350] [cursor=pointer]:
                    - /url: "#cite_note-13"
                - superscript [ref=f6e351]:
                  - text: "["
                  - link "unreliable source?" [ref=f6e353] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Wikipedia:Reliable_sources
                  - text: "]"
                - superscript [ref=f6e354]:
                  - link "[14]" [ref=f6e355] [cursor=pointer]:
                    - /url: "#cite_note-14"
              - list [ref=f6e356]:
                - listitem [ref=f6e357]:
                  - text: "Showdown: A"
                  - link "battle royale" [ref=f6e358] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Battle_royale_game
                  - text: "-style game mode involving one (solo), two (duo), or three (trio) players per team. Ten (twelve in Trio Showdown) players battle for survival, with Power Cube boxes scattered across the map providing boosts to attack and"
                  - link "health" [ref=f6e359] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Health_(game_terminology)
                  - text: .
                  - superscript [ref=f6e360]:
                    - link "[15]" [ref=f6e361] [cursor=pointer]:
                      - /url: "#cite_note-15"
                  - superscript [ref=f6e362]:
                    - text: "["
                    - link "unreliable source?" [ref=f6e364] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/Wikipedia:Reliable_sources
                    - text: "]"
                  - superscript [ref=f6e365]:
                    - link "[16]" [ref=f6e366] [cursor=pointer]:
                      - /url: "#cite_note-16"
                  - superscript [ref=f6e367]:
                    - text: "["
