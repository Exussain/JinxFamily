                  - link "Deathmatch" [ref=f6e400] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Deathmatch_(video_games)
                  - text: game modes. In Wipeout, two teams of either three or five (four teams in the case of Trio Wipeout) must defeat 10 or 20 enemy Brawlers. In Bounty, teams must earn 20 points by defeating Brawlers, who become worth more points for each kill, with a blue star deciding the draw from overtime.
                  - superscript [ref=f6e401]:
                    - link "[18]" [ref=f6e402] [cursor=pointer]:
                      - /url: "#cite_note-:2-18"
                  - superscript [ref=f6e403]:
                    - link "[22]" [ref=f6e404] [cursor=pointer]:
                      - /url: "#cite_note-22"
                  - superscript [ref=f6e405]:
                    - text: "["
                    - link "unreliable source?" [ref=f6e407] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/Wikipedia:Reliable_sources
                    - text: "]"
                  - superscript [ref=f6e408]:
                    - link "[23]" [ref=f6e409] [cursor=pointer]:
                      - /url: "#cite_note-23"
                  - superscript [ref=f6e410]:
                    - text: "["
                    - link "unreliable source?" [ref=f6e412] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/Wikipedia:Reliable_sources
                    - text: "]"
                  - superscript [ref=f6e413]:
                    - link "[24]" [ref=f6e414] [cursor=pointer]:
                      - /url: "#cite_note-24"
                  - superscript [ref=f6e415]:
                    - text: "["
                    - link "unreliable source?" [ref=f6e417] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/Wikipedia:Reliable_sources
                    - text: "]"
                - listitem [ref=f6e418]:
                  - text: "Heist: Two teams of three Brawlers each attempt to destroy the opponents' highly durable"
                  - link "safe" [ref=f6e419] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Safe
                  - text: located near their spawn point, before the enemy team can destroy their own safe.
                  - superscript [ref=f6e420]:
                    - link "[25]" [ref=f6e421] [cursor=pointer]:
                      - /url: "#cite_note-25"
                  - superscript [ref=f6e422]:
                    - text: "["
                    - link "unreliable source?" [ref=f6e424] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/Wikipedia:Reliable_sources
                    - text: "]"
                  - superscript [ref=f6e425]:
                    - link "[18]" [ref=f6e426] [cursor=pointer]:
                      - /url: "#cite_note-:2-18"
                  - text: After the April 2025 update, the safe gains a temporary shield after reaching a certain amount of damage, pushing enemy Brawlers away.
                - listitem [ref=f6e427]:
                  - text: "Hot Zone: A"
                  - link "king of the hill" [ref=f6e428] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/King_of_the_hill_(game)
                  - text: game mode. Two teams of three Brawlers each must stay in all Hot Zones for a combined total of 100 seconds. The match ends if this requirement is met or one team had stayed in the Hot Zones longer than the other throughout the time limit. A 2v2 version of the mode was added later during special events.
                  - superscript [ref=f6e429]:
                    - link "[26]" [ref=f6e430] [cursor=pointer]:
                      - /url: "#cite_note-26"
                  - superscript [ref=f6e431]:
                    - text: "["
                    - link "unreliable source?" [ref=f6e433] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/Wikipedia:Reliable_sources
                    - text: "]"
                  - superscript [ref=f6e434]:
                    - link "[18]" [ref=f6e435] [cursor=pointer]:
                      - /url: "#cite_note-:2-18"
                - listitem [ref=f6e436]:
                  - text: "Knockout: A deathmatch game mode where players cannot respawn and rounds are won by defeating the entire enemy team. The first team to win two rounds wins the game. A variation with five Brawlers is unique in that each elimination causes the remaining teammates to gain extra damage and health."
                  - superscript [ref=f6e437]:
                    - link "[27]" [ref=f6e438] [cursor=pointer]:
                      - /url: "#cite_note-27"
                  - superscript [ref=f6e439]:
                    - text: "["
                    - link "unreliable source?" [ref=f6e441] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/Wikipedia:Reliable_sources
                    - text: "]"
                  - superscript [ref=f6e442]:
                    - link "[18]" [ref=f6e443] [cursor=pointer]:
                      - /url: "#cite_note-:2-18"
                - listitem [ref=f6e444]:
                  - text: "Duels: Two players go against each other in a 1v1. Each player assembles a team of three Brawlers; after one of the players' Brawlers is defeated, the player plays the next one. The goal is to defeat all three of the opponents' Brawlers while not losing all their Brawlers in the process."
                  - superscript [ref=f6e445]:
                    - link "[18]" [ref=f6e446] [cursor=pointer]:
                      - /url: "#cite_note-:2-18"
                  - superscript [ref=f6e447]:
                    - link "[28]" [ref=f6e448] [cursor=pointer]:
                      - /url: "#cite_note-28"
                  - superscript [ref=f6e449]:
                    - text: "["
                    - link "unreliable source?" [ref=f6e451] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/Wikipedia:Reliable_sources
                    - text: "]"
                - listitem [ref=f6e452]:
                  - text: "Brawl Arena: Added in the April 2025 update, two teams of three Brawlers try to destroy enemy turrets to win, while fighting enemy minions to level up and increase their stats."
                  - superscript [ref=f6e453]:
                    - link "[29]" [ref=f6e454] [cursor=pointer]:
                      - /url: "#cite_note-29"
                - listitem [ref=f6e455]:
                  - text: "Mega Pig: Players can join clubs or create them"
                  - superscript [ref=f6e456]:
                    - link "[30]" [ref=f6e457] [cursor=pointer]:
                      - /url: "#cite_note-30"
                  - text: to participate in Mega Pig, an event that occurs around once a month over a weekend. Each win adds to a club's points, which increases the Starr Drops they get at the end of the event,
                  - superscript [ref=f6e458]:
                    - link "[31]" [ref=f6e459] [cursor=pointer]:
                      - /url: "#cite_note-:3-31"
                  - text: with a Mega Tree event during Christmas.
                  - superscript [ref=f6e460]:
                    - link "[32]" [ref=f6e461] [cursor=pointer]:
                      - /url: "#cite_note-32"
                  - text: Each player has six tickets they can use to play games, each game costing one. Once a player runs out of tickets, they can't contribute to the pig anymore (unless they help someone else in their club win games). On certain occasions such as collaborations, or seasonal events like Brawlidays (Christmas), the Mega Pig may be modified in a different theme with event-specific rewards.
                  - superscript [ref=f6e462]:
                    - link "[31]" [ref=f6e463] [cursor=pointer]:
                      - /url: "#cite_note-:3-31"
                - listitem [ref=f6e464]:
                  - text: "Map Maker: A mode where players can freely create maps and may apply custom modifiers to various modes in the game. Players can submit their maps into candidates of the day, allowing for a selection of random player-submitted maps to be played by other players, who can give the map a like or dislike, increasing or decreasing their chance of being selected. The map with the most likes becomes the 'winner of the day' the next day. It is featured in a second Map Maker slot available for all players to play for a day."
                  - superscript [ref=f6e465]:
                    - link "[33]" [ref=f6e466] [cursor=pointer]:
                      - /url: "#cite_note-33"
            - region [ref=f6e467]:
              - heading "Brawl Pass" [level=3] [ref=f6e469]
              - paragraph [ref=f6e470]:
                - text: On 14 May 2020, a game update added a new reward system called the “Brawl Pass”.
                - superscript [ref=f6e471]:
                  - link "[34]" [ref=f6e472] [cursor=pointer]:
                    - /url: "#cite_note-Mons-34"
                - text: The Brawl Pass is the game's version of a
                - link "battle pass" [ref=f6e473] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Battle_pass
                - text: . When players compete in battles, they earn
                - link "XP" [ref=f6e474] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Experience_point
                - text: (formerly known as Tokens) to progress along the Brawl Pass and unlock tiers with various rewards. All players have the free Brawl Pass by default. Players could purchase the premium Brawl Pass with Gems, until 4 January 2024, where the pass and its newly introduced Brawl Pass Plus variant could only be bought with real money.
                - superscript [ref=f6e475]:
                  - link "[35]" [ref=f6e476] [cursor=pointer]:
                    - /url: "#cite_note-35"
                - superscript [ref=f6e477]:
                  - link "[36]" [ref=f6e478] [cursor=pointer]:
                    - /url: "#cite_note-TB-36"
            - region [ref=f6e479]:
              - heading "Ranked" [level=3] [ref=f6e481]
              - paragraph [ref=f6e482]:
                - text: In Ranked, formerly called Power League, a random 3v3 game mode and map are chosen. Winning a game increases Points and gives Pro Pass XP, and Point thresholds increase a player's rank. As a player breaks through certain Point thresholds, 200 Pro Pass XP is obtained, which can give the player unique cosmetic items, Starr drops or skins. A list of the ranks as of February 2025 from lowest to highest is Bronze, Silver, Gold, Diamond, Mythic, Legendary, Masters, and Pro. Twelve Brawlers at Power Level 11 are required to pass into Mythic from Diamond.
                - superscript [ref=f6e483]:
                  - link "[37]" [ref=f6e484] [cursor=pointer]:
                    - /url: "#cite_note-37"
            - region [ref=f6e485]:
              - heading "Pro Pass" [level=3] [ref=f6e487]
              - paragraph [ref=f6e488]:
                - text: The Pro Pass in Brawl Stars is a ranked pass that resets every four seasons to link with major
                - link "Esports" [ref=f6e489] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Esports
                - text: events. It offers a structured rewards system across 100 tiers, featuring both free and paid tracks. One of the most notable rewards is the Pro Skin Upgrade, which enhances an existing skin with exclusive Ranked-themed effects such as new
                - link "animations" [ref=f6e490] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Animation
                - text: ","
                - link "visual effects" [ref=f6e491] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Visual_effects
                - text: ", and upgraded"
                - link "textures" [ref=f6e492] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Texture_(visual_arts)
                - text: . Players earn four Pro Skin Upgrades throughout the Pro Pass at tiers 10, 30, 60, and 100, but these must be unlocked during the active season.
                - superscript [ref=f6e493]:
                  - link "[38]" [ref=f6e494] [cursor=pointer]:
                    - /url: "#cite_note-:4-38"
              - paragraph [ref=f6e495]:
                - text: In addition to skin upgrades, the Pro Pass provides a variety of rewards, including Hypercharge Drops, Ranked Drops, and Starr Drops. Players can also collect Gems on the free track, while the paid track offers an additional Gems, along with exclusive cosmetics like Pins, Sprays, and Player Icons. These rewards encourage Ranked Mode participation and provide players with valuable in-game items to enhance their experience.
                - superscript [ref=f6e496]:
                  - link "[38]" [ref=f6e497] [cursor=pointer]:
                    - /url: "#cite_note-:4-38"
              - paragraph [ref=f6e498]:
                - text: Players can earn Pro Pass XP in Brawl Stars by participating in Ranked Mode and official events. The primary way to gain XP is by winning Ranked Matches. Additionally, Rank Promotions provide an XP bonus once per month, helping players to progress faster. XP can also be obtained from Ranked Starr Drops, and by participating in official Brawl Stars events.
                - superscript [ref=f6e499]:
                  - link "[38]" [ref=f6e500] [cursor=pointer]:
                    - /url: "#cite_note-:4-38"
                - text: By watching esports tournaments and participating in "Pick-ems" on the official website, people can earn extra Pro Pass XP.
            - region [ref=f6e501]:
              - heading "Resources" [level=3] [ref=f6e503]
              - paragraph [ref=f6e504]:
                - text: Players can upgrade Brawlers' stats using Coins and Power Points. Coins are additionally used for buying Brawler-specific upgrades such as Gadgets, Star Powers and Hypercharges. Credits are used to unlock Brawlers, XP Doublers (formerly Token Doublers) are used to speed up progress through the Brawl Pass, and Bling is used to buy most cosmetics, which was added in April 2023, replacing Star Points.
                - superscript [ref=f6e505]:
                  - link "[39]" [ref=f6e506] [cursor=pointer]:
                    - /url: "#cite_note-39"
                - superscript [ref=f6e507]:
                  - link "[40]" [ref=f6e508] [cursor=pointer]:
                    - /url: "#cite_note-40"
              - paragraph [ref=f6e509]:
                - text: Gems are used to top off any currency that the player does not have enough of, as well as certain cosmetics exclusively available for gems.
                - superscript [ref=f6e510]:
                  - link "[41]" [ref=f6e511] [cursor=pointer]:
                    - /url: "#cite_note-Supercell-41"
                - text: Gems are available for free, but the main way of obtaining them is through money. Winning matches with Brawlers and doing certain challenges progresses their Record level, which can unlock Brawler cosmetics and progression items (Power Points, Coins, Titles, and Credits).
                - superscript [ref=f6e512]:
                  - link "[42]" [ref=f6e513] [cursor=pointer]:
                    - /url: "#cite_note-42"
            - region [ref=f6e514]:
              - heading "Starr Road" [level=3] [ref=f6e516]
              - paragraph [ref=f6e517]:
                - text: The Starr Road was introduced as the method of unlocking Brawlers, after the removal of Boxes in December 2022.
                - superscript [ref=f6e518]:
                  - link "[7]" [ref=f6e519] [cursor=pointer]:
                    - /url: "#cite_note-:6-7"
                - superscript [ref=f6e520]:
                  - link "[43]" [ref=f6e521] [cursor=pointer]:
                    - /url: "#cite_note-43"
                - text: Players can select a Brawler from a selection of up to four from the same rarity (from a choice of either Epic, Mythic, Legendary, or Ultra Legendary) to initiate the unlocking process. Progress is made through Credits, a currency obtained in the Trophy Road, shop freebies, daily login rewards, from Starr Drops and Chaos Drops, and from the Brawl Pass. Players can switch to a different Brawler they wish to unlock at any time, with the accumulated credits transitioning to the new selection.
                - superscript [ref=f6e522]:
                  - link "[44]" [ref=f6e523] [cursor=pointer]:
                    - /url: "#cite_note-:5-44"
              - paragraph [ref=f6e524]:
                - text: Once a Brawler is unlocked, it becomes a permanent addition to the player's collection. The Starr Road then presents a new selection of Brawlers from the next rarity tier to unlock. Alternatively, players have the option to acquire Brawlers from the Starr Road using Gems.
                - superscript [ref=f6e525]:
                  - link "[44]" [ref=f6e526] [cursor=pointer]:
                    - /url: "#cite_note-:5-44"
              - paragraph [ref=f6e527]:
                - text: Until 29 February 2024, the Chromatic Shop allowed players to unlock certain Brawlers through Chroma Credits, a currency obtainable through the Brawl Pass and used exclusively for unlocking Brawlers who debuted as part of a Brawl Pass. Alternatively, Gems could be used to purchase the Chromatics.
                - superscript [ref=f6e528]:
                  - link "[45]" [ref=f6e529] [cursor=pointer]:
                    - /url: "#cite_note-45"
              - paragraph [ref=f6e530]:
                - text: Rare and Super Rare Brawlers are unlocked through the Trophy Road after reaching certain Trophy counts as opposed to using the Starr Road.
                - superscript [ref=f6e531]:
                  - link "[46]" [ref=f6e532] [cursor=pointer]:
                    - /url: "#cite_note-46"
            - region [ref=f6e533]:
              - heading "Brawlers" [level=3] [ref=f6e535]
              - paragraph [ref=f6e536]:
                - text: "As of 11 June 2026, Brawl Stars has 104 Brawlers with the newest Brawlers Bolt and Starr Nova and 7 classes: Damage Dealers, Marksmen, Tanks, Assassins, Supports, Controllers, and Artillery. Brawlers also have Rarities, which vary based on a Brawler's concept difficulty: Rare, Super Rare, Epic, Mythic, Legendary, and Ultra Legendary (introduced on 29 May 2025 with the new brawler Kaze)"
                - superscript [ref=f6e537]:
                  - link "[47]" [ref=f6e538] [cursor=pointer]:
                    - /url: "#cite_note-47"
                - text: . In the 2026 update, the new brawlers released are Starr Nova, Damian, Bolt, Sirius, and Najia
                - superscript [ref=f6e539]:
                  - link "[48]" [ref=f6e540] [cursor=pointer]:
                    - /url: "#cite_note-48"
                - text: .
          - region [ref=f6e541]:
            - heading "Setting" [level=2] [ref=f6e543]
            - paragraph [ref=f6e544]:
              - text: Brawl Stars takes place in a fictional abandoned
              - link "amusement park" [ref=f6e545] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Amusement_park
              - text: named Starr Park. Initially introduced in a live-action short film,
              - superscript [ref=f6e546]:
                - link "[49]" [ref=f6e547] [cursor=pointer]:
                  - /url: "#cite_note-49"
              - text: in-game surveillance footage showed that Starr Park closed in 1995 due to magic purple gems that granted several staff and visitors in Starr Park immortality, but in the ensuing chaos, gave life to inanimate objects and mutated plant life and animals.
              - superscript [ref=f6e548]:
                - link "[50]" [ref=f6e549] [cursor=pointer]:
                  - /url: "#cite_note-50"
          - region [ref=f6e550]:
            - heading "Development and release" [level=2] [ref=f6e552]
            - paragraph [ref=f6e553]:
              - link "Supercell" [ref=f6e554] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Supercell_(company)
              - text: set out to develop a team-based game similar to
              - link "League of Legends" [ref=f6e556] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/League_of_Legends
              - text: and
              - link "Overwatch" [ref=f6e557] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Overwatch_(2016_video_game)
              - text: . The team wanted to create such a game that was designed with mobile devices in mind first. According to Frank Keienburg, Brawl Stars'
              - link "General Manager" [ref=f6e558] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/General_Manager
              - text: (i.e. project lead), "Our focus was on retaining a lot of depth while stripping away all the fluff".
              - superscript [ref=f6e559]:
                - link "[51]" [ref=f6e560] [cursor=pointer]:
                  - /url: "#cite_note-Redbull-51"
              - text: Although the game contains some elements of the battle royale genre, these were implemented before the genre as a whole took off and the team did not set out to make a game with those elements.
              - superscript [ref=f6e561]:
                - link "[52]" [ref=f6e562] [cursor=pointer]:
                  - /url: "#cite_note-Newsweeklaunch-52"
            - paragraph [ref=f6e563]:
              - text: The game is notable for its long
              - link "soft launch" [ref=f6e564] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Soft_launch
              - text: period during which virtually every aspect of the game changed.
              - superscript [ref=f6e565]:
                - link "[53]" [ref=f6e566] [cursor=pointer]:
                  - /url: "#cite_note-53"
              - text: Supercell officially announced the game via a
              - link "livestream" [ref=f6e567] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Livestream
              - text: video on 14 June 2017.
              - superscript [ref=f6e568]:
                - link "[54]" [ref=f6e569] [cursor=pointer]:
                  - /url: "#cite_note-54"
              - superscript [ref=f6e570]:
                - text: "["
                - link "unreliable source?" [ref=f6e572] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Wikipedia:Reliable_sources
                - text: "]"
              - text: It received an
              - link "iOS" [ref=f6e573] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/IOS
              - text: soft launch in Canada the following day.
              - superscript [ref=f6e574]:
                - link "[55]" [ref=f6e575] [cursor=pointer]:
                  - /url: "#cite_note-55"
              - text: The soft launch would last a total of 522 days, during which internally it was doubted whether or not the game would ever actually see a general release.
              - superscript [ref=f6e576]:
                - link "[52]" [ref=f6e577] [cursor=pointer]:
                  - /url: "#cite_note-Newsweeklaunch-52"
              - superscript [ref=f6e578]:
                - link "[51]" [ref=f6e579] [cursor=pointer]:
                  - /url: "#cite_note-Redbull-51"
              - text: Initially, the game was played in
              - link "portrait mode" [ref=f6e580] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Portrait_mode
              - text: and the movement controls were controlled by tapping on the screen. Landscape mode and joystick-based input would later replace them.
              - superscript [ref=f6e581]:
                - link "[52]" [ref=f6e582] [cursor=pointer]:
                  - /url: "#cite_note-Newsweeklaunch-52"
              - superscript [ref=f6e583]:
                - link "[51]" [ref=f6e584] [cursor=pointer]:
                  - /url: "#cite_note-Redbull-51"
              - text: Other changes include changing the
              - link "UI" [ref=f6e585] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/User_interface
              - text: ", changing the"
              - link "metagame" [ref=f6e586] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Metagame
              - text: and transitioning the game from 2D to 3D.
              - superscript [ref=f6e587]:
                - link "[51]" [ref=f6e588] [cursor=pointer]:
                  - /url: "#cite_note-Redbull-51"
              - text: Frank Keienburg attributes the difficult beta period to the developers working in a new genre where they "weren't sure how to interpret its success".
              - superscript [ref=f6e589]:
                - link "[52]" [ref=f6e590] [cursor=pointer]:
                  - /url: "#cite_note-Newsweeklaunch-52"
              - text: The game soft-launched in Finland, Sweden, Denmark, Norway, Ireland, Singapore, Hong Kong, Macao and Malaysia for iOS on 19 January 2018.
              - superscript [ref=f6e591]:
                - text: "["
                - link "citation needed" [ref=f6e593] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Wikipedia:Citation_needed
                - text: "]"
              - text: ", with a later"
              - link "Android" [ref=f6e594] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Android_(operating_system)
              - text: soft-launch in June.
            - paragraph [ref=f6e595]:
              - text: Brawl Stars was made globally and officially available on 12 December 2018,
              - superscript [ref=f6e596]:
                - link "[1]" [ref=f6e597] [cursor=pointer]:
                  - /url: "#cite_note-vb1-1"
              - text: grossing US$10 million in its first week
              - superscript [ref=f6e598]:
                - link "[56]" [ref=f6e599] [cursor=pointer]:
                  - /url: "#cite_note-GB_20260131-56"
              - text: and US$63 million in its first month.
              - superscript [ref=f6e600]:
                - link "[57]" [ref=f6e601] [cursor=pointer]:
                  - /url: "#cite_note-57"
              - text: On 9 June 2020, Brawl Stars was released in
              - link "mainland China" [ref=f6e602] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Mainland_China
              - text: ", with the corresponding changes to accommodate to Chinese regulations by"
              - link "Tencent Games" [ref=f6e603] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Tencent_Games
              - text: .
              - superscript [ref=f6e604]:
                - link "[58]" [ref=f6e605] [cursor=pointer]:
                  - /url: "#cite_note-58"
          - region [ref=f6e606]:
            - heading "Brawl Stars Championship" [level=2] [ref=f6e608]
            - paragraph [ref=f6e609]:
              - text: The Brawl Stars Championship is an annual tournament, composed of a qualifying stage, available in-game, another Monthly Qualifier stage, a Regional Monthly Finals stage, and finally a World Finals stage, in which the best teams compete to win the Championship. The first in-game challenge is similar to other challenges, where players must win 15 matches in the in-game challenge without losing three times. After 15 wins, players win a spot in regional Monthly Qualifiers, which then give access to the regional Monthly Finals.
              - superscript [ref=f6e610]:
                - link "[59]" [ref=f6e611] [cursor=pointer]:
                  - /url: "#cite_note-21BSC-59"
              - text: First introduced in 2025, the Brawl Cup is an in-person event that features the top teams from six regions. The results from this event allows teams to secure a spot in the Last Chance Qualifiers (LCQs) or even the World Finals.
              - superscript [ref=f6e612]:
                - link "[60]" [ref=f6e613] [cursor=pointer]:
                  - /url: "#cite_note-60"
              - superscript [ref=f6e614]:
                - link "[61]" [ref=f6e615] [cursor=pointer]:
                  - /url: "#cite_note-:7-61"
              - text: At the end of the year, the World Finals take place, which is an event which has the largest prize pool and attracts the most viewers.
              - superscript [ref=f6e616]:
                - link "[62]" [ref=f6e617] [cursor=pointer]:
                  - /url: "#cite_note-:0-62"
              - superscript [ref=f6e618]:
                - text: "["
                - link "unreliable source?" [ref=f6e620] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Wikipedia:Reliable_sources
                - text: "]"
              - superscript [ref=f6e621]:
                - link "[63]" [ref=f6e622] [cursor=pointer]:
                  - /url: "#cite_note-BSC-63"
            - paragraph [ref=f6e623]:
              - text: The first edition, known as the Brawl Stars World Championship, was held on 15 and 16 November 2019, at the
              - link "Busan Exhibition and Convention Center" [ref=f6e624] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Busan_Exhibition_and_Convention_Center
              - text: in South Korea. The first-place winner was
              - link "Nova Esports" [ref=f6e625] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Nova_Esports
              - text: with a 3–0 victory. Other competing participants included Animal Chanpuru, Tribe Gaming, 3Bears,
              - link "Spacestation Gaming" [ref=f6e626] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Spacestation_Gaming
              - text: ", and"
              - link "PSG Esports" [ref=f6e627] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/PSG_Esports
              - text: . With a $250,000 prize pool, it was the first international event for the game and had teams from North America, Europe, Latin America, Southeast Asia, Japan, and South Korea.
              - superscript [ref=f6e628]:
                - link "[62]" [ref=f6e629] [cursor=pointer]:
                  - /url: "#cite_note-:0-62"
              - superscript [ref=f6e630]:
                - link "[64]" [ref=f6e631] [cursor=pointer]:
                  - /url: "#cite_note-64"
            - paragraph [ref=f6e632]:
              - text: In 2020, the World Finals were held between 21 and 22 November with a base $1,000,000 prize pool. Half of the amount was raised using the profits from an in-game championship package. Eight teams participated in the World Finals, which were originally to take place in
              - link "Katowice" [ref=f6e633] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Katowice
              - text: ", Poland, but were moved online due to the"
              - link "COVID-19 pandemic" [ref=f6e634] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/COVID-19_pandemic
              - text: . PSG Esports was the winner of that year's championship with a prize of $200,000. The other monetary prizes were split between the teams which won second to eighth place.
              - superscript [ref=f6e635]:
                - link "[65]" [ref=f6e636] [cursor=pointer]:
                  - /url: "#cite_note-2020Win-65"
            - paragraph [ref=f6e637]:
              - text: In 2021, the Brawl Stars Championship started on 20 February. There are eight seasons for the championship that occur once per month, from February to September. The Championship Challenges and Monthly Qualifiers are each live for two days per season. The top eight teams from the regional Monthly Qualifiers go to the regional Monthly Finals. Sixteen teams from the Monthly Finals from all seven regions come together to participate in the World Finals, which took place in that year's edition from 26 to 28 November in-person in
              - link "Bucharest" [ref=f6e638] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Bucharest
              - text: ", Romania. The prizes for 2021 were $600,000 in the Monthly Finals, and a minimum of $500,000 in the World Finals with opportunities to increase this amount through in-game offers."
              - superscript [ref=f6e639]:
                - link "[63]" [ref=f6e640] [cursor=pointer]:
                  - /url: "#cite_note-BSC-63"
            - paragraph [ref=f6e641]:
              - text: In 2024, the World Finals were held in conjunction with the
              - link "Clash Royale League World Finals" [ref=f6e642] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Clash_Royale#Clash_Royale_League
              - text: and the Clash of Clans World Championship in
              - link "Helsinki" [ref=f6e643] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Helsinki
              - text: ", Finland during Superfest, an event developed by Supercell encompassing the before mentioned tournaments."
              - superscript [ref=f6e644]:
                - link "[66]" [ref=f6e645] [cursor=pointer]:
                  - /url: "#cite_note-66"
              - superscript [ref=f6e646]:
                - link "[67]" [ref=f6e647] [cursor=pointer]:
                  - /url: "#cite_note-67"
              - text: The 2024 edition reached a peak viewership of over a million viewers with team HMBLE taking first place after defeating Crazy Raccoon.
              - superscript [ref=f6e648]:
                - link "[68]" [ref=f6e649] [cursor=pointer]:
                  - /url: "#cite_note-68"
            - paragraph [ref=f6e650]:
              - text: In 2025, the first edition of the Brawl Cup was held in
              - link "Dallas" [ref=f6e651] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Dallas
              - text: ", Texas, at"
              - link "DreamHack" [ref=f6e652] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/DreamHack
              - text: Dallas. With a prize pool of $50,000, six teams battled for places in the World Finals and Last Chance Qualifiers,
              - superscript [ref=f6e653]:
                - link "[61]" [ref=f6e654] [cursor=pointer]:
                  - /url: "#cite_note-:7-61"
              - text: with HMBLE taking the crown and advancing straight to the World Finals later that year, and the second and third place teams (
              - link "SK Gaming" [ref=f6e655] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/SK_Gaming
              - text: and Zeta Division) advancing to the LCQs.
              - superscript [ref=f6e656]:
                - text: "["
                - link "citation needed" [ref=f6e658] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Wikipedia:Citation_needed
                - text: "]"
              - text: The Last Chance Qualifiers were held in Brazil, in October. This event saw 16 teams from 7 regions battle for four spots in the World Finals.
              - superscript [ref=f6e659]:
                - link "[69]" [ref=f6e660] [cursor=pointer]:
                  - /url: "#cite_note-69"
              - text: Revenant XSpark, Totem Esports, Crazy Raccoon, and Papara Supermassive all came out victorious, securing their spots in the World Finals.
              - superscript [ref=f6e661]:
                - text: "["
                - link "citation needed" [ref=f6e663] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Wikipedia:Citation_needed
                - text: "]"
              - text: The World Finals were held in
              - link "Stockholm" [ref=f6e664] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Stockholm
              - text: ", Sweden, as part of DreamHack Stockholm. 16 teams fought for a share of the $1,000,000 prize pool. With a peak viewer count of just over 211,000, the final included reigning champions HMBLE facing Crazy Raccoon, a repeat of the finals that happened in 2024. Ultimately Crazy Raccoon came out victorious, defeating HMBLE 3–0."
              - superscript [ref=f6e665]:
                - link "[70]" [ref=f6e666] [cursor=pointer]:
                  - /url: "#cite_note-70"
          - region [ref=f6e667]:
            - heading "Reception" [level=2] [ref=f6e669]
