                      - /url: https://en.wikipedia.org/wiki/Wikipedia:Reliable_sources
                    - text: "]"
                  - superscript [ref=f6e370]:
                    - link "[17]" [ref=f6e371] [cursor=pointer]:
                      - /url: "#cite_note-17"
                  - superscript [ref=f6e372]:
                    - text: "["
                    - link "unreliable source?" [ref=f6e374] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/Wikipedia:Reliable_sources
                    - text: "]"
                  - superscript [ref=f6e375]:
                    - link "[18]" [ref=f6e376] [cursor=pointer]:
                      - /url: "#cite_note-:2-18"
                  - superscript [ref=f6e377]:
                    - link "[19]" [ref=f6e378] [cursor=pointer]:
                      - /url: "#cite_note-19"
                - listitem [ref=f6e379]:
                  - text: "Brawl Ball: A"
                  - link "soccer" [ref=f6e380] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Soccer
                  - text: game mode where two teams of three (or five for 5v5 Brawl Ball) players attempt to score points by shooting a ball into the opponents' goal. The game ends if one team scores two points, or if one team has a point advantage after two minutes, or overtime. Other variants of this game mode were later added, modelled after different sports such as
                  - link "basketball" [ref=f6e381] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Basketball
                  - text: ","
                  - link "volleyball" [ref=f6e382] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Volleyball
                  - text: ", and"
                  - link "ice hockey" [ref=f6e383] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Ice_hockey
                  - text: .
                  - superscript [ref=f6e384]:
                    - link "[20]" [ref=f6e385] [cursor=pointer]:
                      - /url: "#cite_note-20"
                  - superscript [ref=f6e386]:
                    - text: "["
                    - link "unreliable source?" [ref=f6e388] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/Wikipedia:Reliable_sources
                    - text: "]"
                  - superscript [ref=f6e389]:
                    - link "[18]" [ref=f6e390] [cursor=pointer]:
                      - /url: "#cite_note-:2-18"
                  - text: . These game modes are named Basket Brawl, Volley Brawl, and Brawl Hockey respectively.
                - listitem [ref=f6e391]:
                  - text: "Gem Grab: Gems spawn in the middle of the map, and two teams of either three or five Brawlers (or four teams in the case of Trio Gem Grab) must collect the highest number of Gems possible. A team wins if they collect and hold at least ten Gems for 15 seconds. If both teams have 10 or more Gems, the countdown is active, and the teams are tied in Gems collected, the timer pauses. It restarts once a team takes the lead again."
                  - superscript [ref=f6e392]:
                    - link "[21]" [ref=f6e393] [cursor=pointer]:
                      - /url: "#cite_note-21"
                  - superscript [ref=f6e394]:
