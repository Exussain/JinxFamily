            - region [ref=f6e702]:
              - heading "Awards" [level=3] [ref=f6e704]
              - paragraph [ref=f6e705]:
                - text: The game was nominated for "Mobile Game" and "EE Mobile Game of the Year" at the
                - link "15th British Academy Games Awards" [ref=f6e706] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/15th_British_Academy_Games_Awards
                - text: .
                - superscript [ref=f6e707]:
                  - link "[74]" [ref=f6e708] [cursor=pointer]:
                    - /url: "#cite_note-74"
            - region [ref=f6e709]:
              - heading "Critical reception" [level=3] [ref=f6e711]
              - paragraph [ref=f6e712]:
                - text: Brawl Stars received "mixed or average" reviews or 72 out of 100 on
                - link "review aggregator" [ref=f6e713] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Review_aggregator
                - text: website
                - link "Metacritic" [ref=f6e714] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Metacritic
                - text: .
                - superscript [ref=f6e715]:
                  - link "[71]" [ref=f6e716] [cursor=pointer]:
                    - /url: "#cite_note-MC-71"
              - paragraph [ref=f6e717]:
                - generic [ref=f6e718]:
                  - link "Pocket Gamer" [ref=f6e719] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Pocket_Gamer
                  - text: "'"
                - text: s Harry Slater scored the game 3 out of 5. Reviewing the game immediately after global release, he praised that game's progression. He criticized Showdown, the game's
                - link "battle royale" [ref=f6e720] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Battle_royale_game
                - text: mode, for being the weakest of all the game modes that were in the game. He said that Showdown "doesn't capture the real madness of the genre, and there's a distinct lack of tension since you can pretty much see everyone on the map and what they're up to". He mentioned that something felt "missing in Brawl Stars. You'll play, you'll get new characters, you'll unlock new modes, but you're never having quite as much fun as you feel you should be doing." He continued on to say that "the action is relatively flat - in the team matches you know within the first few seconds which way the game is going." He concluded in disappointment because the game did not seem like "the huge step forward for multiplayer mobile action that a lot of us were hoping for."
                - superscript [ref=f6e721]:
                  - link "[72]" [ref=f6e722] [cursor=pointer]:
                    - /url: "#cite_note-PG-72"
              - paragraph [ref=f6e723]:
                - text: 148 Apps' Campbell Bird scored the game 3.5 out of 5. She started with mentioning that the game felt "like a combination of
                - link "Arena of Valor" [ref=f6e725] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Arena_of_Valor
                - text: and
                - link "Overwatch" [ref=f6e727] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Overwatch_(2016_video_game)
                - text: ." She praised the game's graphics and the developer's implementation of the progression system to encourage players to play again, as well as the quick matchmaking. However, she criticized the game's controls for feeling "oddly loose and muddy". the characters falling "into pretty predictable hero shooter archetypes", as well as claiming that "every mode in the game is some variation on something you've seen before in other, better multiplayer shooters." She also highlighted that the frequent connection issues and unbalanced teams made the experience of playing the game less enjoyable.
                - superscript [ref=f6e728]:
                  - link "[73]" [ref=f6e729] [cursor=pointer]:
                    - /url: "#cite_note-SndRev-73"
              - paragraph [ref=f6e730]:
                - link "Eurogamer" [ref=f6e732] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Eurogamer
                - text: writer Christian Donlan wrote that the gameplay is easy to pick up (even for players of low skill). He also wrote that Battle Royales are all about preying on opponents and with
                - link "health bars" [ref=f6e733] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Health_(game_terminology)
                - text: always being visible to everyone, it becomes even more crucial.
                - superscript [ref=f6e734]:
                  - link "[75]" [ref=f6e735] [cursor=pointer]:
                    - /url: "#cite_note-75"
            - region [ref=f6e736]:
              - heading "Commercial reception" [level=3] [ref=f6e738]
              - paragraph [ref=f6e739]:
                - text: Brawl Stars has been downloaded over 400 million times. In 2020, Brawl Stars had the second highest gross of any mobile game in Europe.
                - superscript [ref=f6e740]:
                  - link "[76]" [ref=f6e741] [cursor=pointer]:
                    - /url: "#cite_note-76"
                - text: It grossed US$526 million in total in 2020, which accounted for more than half its life time revenue. It was also the fourth game by Supercell to surpass US$1 billion in lifetime revenue.
                - superscript [ref=f6e742]:
                  - link "[77]" [ref=f6e743] [cursor=pointer]:
                    - /url: "#cite_note-77"
