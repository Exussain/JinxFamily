                    - cell [ref=f4e578]:
                      - text: 5/5
                      - superscript [ref=f4e579]:
                        - link "[10]" [ref=f4e580] [cursor=pointer]:
                          - /url: "#cite_note-Stuff-11"
            - paragraph [ref=f4e581]:
              - text: Clash Royale received generally favorable reviews from critics according to
              - link "review aggregator" [ref=f4e582] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Review_aggregator
              - text: website
              - link "Metacritic" [ref=f4e583] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Metacritic
              - text: .
              - superscript [ref=f4e584]:
                - link "[51]" [ref=f4e585] [cursor=pointer]:
                  - /url: "#cite_note-MC-52"
              - text: Clash Royale was listed as one of the best mobile games of 2016 in multiple outlets, including Pocket Gamer,
              - superscript [ref=f4e586]:
                - link "[52]" [ref=f4e587] [cursor=pointer]:
                  - /url: "#cite_note-53"
              - link "TouchArcade" [ref=f4e589] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/TouchArcade
              - text: ","
              - superscript [ref=f4e590]:
                - link "[53]" [ref=f4e591] [cursor=pointer]:
                  - /url: "#cite_note-54"
              - link "Eurogamer" [ref=f4e593] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Eurogamer
              - text: ","
              - superscript [ref=f4e594]:
                - link "[54]" [ref=f4e595] [cursor=pointer]:
                  - /url: "#cite_note-55"
              - link "Game Informer" [ref=f4e597] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Game_Informer
              - text: ","
              - superscript [ref=f4e598]:
                - link "[55]" [ref=f4e599] [cursor=pointer]:
                  - /url: "#cite_note-56"
              - link "The Verge" [ref=f4e601] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/The_Verge
              - text: ","
              - superscript [ref=f4e602]:
                - link "[56]" [ref=f4e603] [cursor=pointer]:
                  - /url: "#cite_note-57"
              - link "GamesBeat" [ref=f4e605] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/GamesBeat
              - text: ","
              - superscript [ref=f4e606]:
                - link "[57]" [ref=f4e607] [cursor=pointer]:
                  - /url: "#cite_note-58"
              - link "Digital Spy" [ref=f4e609] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Digital_Spy
              - text: ","
              - superscript [ref=f4e610]:
                - link "[58]" [ref=f4e611] [cursor=pointer]:
                  - /url: "#cite_note-59"
              - link "Macworld" [ref=f4e613] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Macworld
              - superscript [ref=f4e614]:
                - link "[59]" [ref=f4e615] [cursor=pointer]:
                  - /url: "#cite_note-60"
              - text: and GamingBolt.
              - superscript [ref=f4e616]:
                - link "[60]" [ref=f4e617] [cursor=pointer]:
                  - /url: "#cite_note-61"
              - text: In 2018, PCMag included it on their list of the 50 best iPhone games of all time.
              - superscript [ref=f4e618]:
                - link "[61]" [ref=f4e619] [cursor=pointer]:
                  - /url: "#cite_note-62"
            - paragraph [ref=f4e620]:
              - text: Reviewers praised the game's blend of different genres and mechanics,
              - superscript [ref=f4e621]:
                - link "[2]" [ref=f4e622] [cursor=pointer]:
                  - /url: "#cite_note-:4-2"
              - superscript [ref=f4e623]:
                - link "[11]" [ref=f4e624] [cursor=pointer]:
                  - /url: "#cite_note-GI-12"
              - text: and the way Supercell simplified these disparate elements to create a game well-suited for mobile.
              - superscript [ref=f4e625]:
                - link "[1]" [ref=f4e626] [cursor=pointer]:
                  - /url: "#cite_note-toucharcade-1"
              - superscript [ref=f4e627]:
                - link "[18]" [ref=f4e628] [cursor=pointer]:
                  - /url: "#cite_note-:0-19"
              - superscript [ref=f4e629]:
                - link "[62]" [ref=f4e630] [cursor=pointer]:
                  - /url: "#cite_note-:3-63"
              - text: Battles were described as accessible and intuitive, but hiding a surprising depth of strategy and complex decision-making.
              - superscript [ref=f4e631]:
                - link "[b]" [ref=f4e632] [cursor=pointer]:
                  - /url: "#cite_note-64"
              - text: Their short length and fast pace were also praised.
              - superscript [ref=f4e633]:
                - link "[18]" [ref=f4e634] [cursor=pointer]:
                  - /url: "#cite_note-:0-19"
              - superscript [ref=f4e635]:
                - link "[62]" [ref=f4e636] [cursor=pointer]:
                  - /url: "#cite_note-:3-63"
              - superscript [ref=f4e637]:
                - link "[6]" [ref=f4e638] [cursor=pointer]:
                  - /url: "#cite_note-:2-6"
              - superscript [ref=f4e639]:
                - link "[11]" [ref=f4e640] [cursor=pointer]:
                  - /url: "#cite_note-GI-12"
              - text: Harry Slater of
              - link "Pocket Gamer" [ref=f4e642] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Pocket_Gamer
              - text: enjoyed the flow of battles, with the increasing elixir generation in the last minute leading to "a frantic final scramble".
              - superscript [ref=f4e643]:
                - link "[6]" [ref=f4e644] [cursor=pointer]:
                  - /url: "#cite_note-:2-6"
              - text: Game Informer
              - generic [ref=f4e645]: "'s"
              - text: Daniel Tack likewise enjoyed the "fun, fast" gameplay, finding it so addictive that "[a] quick five minute session can expand to eat an hour with terrifying ease".
              - superscript [ref=f4e646]:
                - link "[11]" [ref=f4e647] [cursor=pointer]:
                  - /url: "#cite_note-GI-12"
            - paragraph [ref=f4e648]:
              - text: Jordan Minor, writing for
              - link "PCMag UK" [ref=f4e650] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/PCMag_UK
              - text: ", praised the game's production values and the \"cartoony\" visuals that he felt were \"full of cheery personality\"."
              - superscript [ref=f4e651]:
                - link "[2]" [ref=f4e652] [cursor=pointer]:
                  - /url: "#cite_note-:4-2"
              - text: Tommaso Pugliese of Multiplayer.it also enjoyed the colorful art style and praised the variety of units available.
              - superscript [ref=f4e653]:
                - link "[63]" [ref=f4e654] [cursor=pointer]:
                  - /url: "#cite_note-65"
              - text: The game's
              - link "matchmaking" [ref=f4e655] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Matchmaking_(video_games)
              - text: system also garnered mixed reactions.
              - superscript [ref=f4e656]:
                - link "[11]" [ref=f4e657] [cursor=pointer]:
                  - /url: "#cite_note-GI-12"
              - superscript [ref=f4e658]:
                - link "[18]" [ref=f4e659] [cursor=pointer]:
                  - /url: "#cite_note-:0-19"
              - superscript [ref=f4e660]:
                - link "[64]" [ref=f4e661] [cursor=pointer]:
                  - /url: "#cite_note-66"
            - paragraph [ref=f4e662]:
              - text: The monetisation strategy, including the use of in-game currency to skip chest timers, was received more negatively. Thrower called it "greedy" and argued it put up a paywall for success, ultimately "[making] what could have been a truly great game into merely a very good one."
              - superscript [ref=f4e663]:
                - link "[18]" [ref=f4e664] [cursor=pointer]:
                  - /url: "#cite_note-:0-19"
              - text: A number of reviewers questioned whether the game is "
              - link "pay to win" [ref=f4e665] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Pay_to_win
              - text: "\", especially in high-level competitive play."
              - superscript [ref=f4e666]:
                - link "[65]" [ref=f4e667] [cursor=pointer]:
                  - /url: "#cite_note-67"
              - superscript [ref=f4e668]:
                - link "[66]" [ref=f4e669] [cursor=pointer]:
                  - /url: "#cite_note-68"
              - text: Nick Gillet, for
              - link "The Guardian" [ref=f4e671] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/The_Guardian
              - text: ", likened the game's free-to-play model to \"[shaking] you down for change\"."
              - superscript [ref=f4e672]:
                - link "[67]" [ref=f4e673] [cursor=pointer]:
                  - /url: "#cite_note-69"
              - text: Some reviewers were less negative, such as TouchArcade's Eli Hodapp, who argued that gaining trophies is free and more important than unlocking rewards from chests.
              - superscript [ref=f4e674]:
                - link "[1]" [ref=f4e675] [cursor=pointer]:
                  - /url: "#cite_note-toucharcade-1"
              - text: Craig Grannell, writing for
              - link "Stuff" [ref=f4e677] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Stuff_(magazine)
              - text: ", felt that although some would find chest timers restrictive, it helped him limit his playtime to a reasonable amount per day."
              - superscript [ref=f4e678]:
                - link "[10]" [ref=f4e679] [cursor=pointer]:
                  - /url: "#cite_note-Stuff-11"
            - paragraph [ref=f4e680]:
              - text: In 2019, Christian Donlan of Eurogamer described Clash Royale as a game of the decade. He said that the game was such an omnipresent aspect of his life that it felt like "the place where I live". He praised the small eight-card decks for making deck-building more focused, and the simple strategic gameplay that he could nonetheless refine with years of practice.
              - superscript [ref=f4e681]:
                - link "[68]" [ref=f4e682] [cursor=pointer]:
                  - /url: "#cite_note-70"
              - link "Dean Takahashi" [ref=f4e683] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Dean_Takahashi
              - text: likewise included Clash Royale on a list of the games that defined the 2010s for GamesBeat, describing it as engaging players that would not be traditional PC gamers and as providing new ways to socialize and play games.
              - superscript [ref=f4e684]:
                - link "[69]" [ref=f4e685] [cursor=pointer]:
                  - /url: "#cite_note-71"
            - paragraph [ref=f4e686]:
              - text: Andrew Reiner for Game Informer said that he light-heartedly calls Clash Royale his "forever game" because he plans to play it consistently into the future. He described it as "always fun to play" due to its tactical gameplay that puts a large focus on skill.
              - superscript [ref=f4e687]:
                - link "[70]" [ref=f4e688] [cursor=pointer]:
                  - /url: "#cite_note-72"
              - text: During the
              - link "COVID-19 pandemic" [ref=f4e689] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/COVID-19_pandemic
              - text: ", Stuart Dredge of The Guardian said that Clash Royale's mixture of genres \"remains magic\" and praised the social aspects of the game—like clans and friendly battles—for providing connection during"
              - link "social distancing" [ref=f4e690] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Social_distancing_measures_related_to_the_COVID-19_pandemic
              - text: .
              - superscript [ref=f4e691]:
                - link "[71]" [ref=f4e692] [cursor=pointer]:
                  - /url: "#cite_note-73"
              - link "Matt Bai" [ref=f4e693] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Matt_Bai
              - text: of
              - link "The Washington Post" [ref=f4e695] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/The_Washington_Post
              - text: said that the game eliminated boring or idle moments, but that this fed into a culture where people have "forgotten how to be with our thoughts". As a result, he said that he planned to quit the game.
              - superscript [ref=f4e696]:
                - link "[72]" [ref=f4e697] [cursor=pointer]:
                  - /url: "#cite_note-74"
            - region [ref=f4e698]:
              - heading "Sales" [level=3] [ref=f4e700]
              - paragraph [ref=f4e701]:
                - text: Within its first year, Clash Royale generated over
                - link "US$" [ref=f4e702] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/United_States_dollar
                - text: 1 billion in revenue.
                - superscript [ref=f4e703]:
                  - link "[73]" [ref=f4e704] [cursor=pointer]:
                    - /url: "#cite_note-75"
                - text: By its third anniversary, total revenue had reportedly reached approximately US$2.5 billion,
                - superscript [ref=f4e705]:
                  - link "[74]" [ref=f4e706] [cursor=pointer]:
                    - /url: "#cite_note-76"
                - text: and it had reached $4 billion by 2023, according to market intelligence firm Sensor Tower.
                - superscript [ref=f4e707]:
                  - link "[41]" [ref=f4e708] [cursor=pointer]:
                    - /url: "#cite_note-:6-42"
                - text: In October 2025, it had one of its best performing months since release with $78 million in revenue.
                - superscript [ref=f4e709]:
                  - link "[49]" [ref=f4e710] [cursor=pointer]:
                    - /url: "#cite_note-:14-50"
                - text: Increases in spending across 2025 made it the game's best performing year since 2017. By its tenth anniversary, the game had made $4.9 billion.
                - superscript [ref=f4e711]:
                  - link "[75]" [ref=f4e712] [cursor=pointer]:
                    - /url: "#cite_note-77"
