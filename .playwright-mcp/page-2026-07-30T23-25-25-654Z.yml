                      - /url: https://en.wikipedia.org/wiki/Multiplayer
            - paragraph [ref=f4e266]:
              - generic [ref=f4e267]: Clash Royale
              - text: is a 2016
              - link "real-time strategy" [ref=f4e268] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Real-time_strategy
              - text: mobile game developed and published by
              - link "Supercell" [ref=f4e269] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Supercell_(video_game_company)
              - text: . It combines elements of
              - link "collectible card games" [ref=f4e270] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Collectible_card_game
              - text: ","
              - link "tower defense" [ref=f4e271] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Tower_defense
              - text: ", and"
              - link "multiplayer online battle arena" [ref=f4e272] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Multiplayer_online_battle_arena
              - text: (MOBA). Players collect cards and create a deck to use in 3–5 minute battles, with the aim to destroy opposing towers whilst defending. Released worldwide on March 2, 2016, the game is the first spin-off of
              - link "Clash of Clans" [ref=f4e274] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Clash_of_Clans
              - text: ", another title developed by Supercell."
            - paragraph [ref=f4e275]:
              - text: With development beginning in 2014, Clash Royale shifted towards gaming on vertical phone screens (as opposed to
              - link "tablets" [ref=f4e276] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Tablet_computer
              - text: ) and
              - link "real-time gameplay" [ref=f4e277] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Real-time_game
              - text: compared to Clash of Clans. It uses a
              - link "free-to-play" [ref=f4e278] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Free-to-play
              - text: monetisation model, including
              - link "microtransactions" [ref=f4e279] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Microtransaction
              - text: and
              - link "artificial scarcity" [ref=f4e280] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Artificial_scarcity
              - text: of in-game resources. From July 2019, it features monthly seasons, which coincide with regular content updates and a monthly
              - link "battle pass" [ref=f4e281] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Battle_pass
              - text: called “Pass Royale”.
            - paragraph [ref=f4e282]:
              - text: Clash Royale received favorable reviews from critics when it was first released, with reviewers citing the game's quick, short matches and its depth of strategy.
              - link "Matchmaking" [ref=f4e283] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Matchmaking_(video_games)
              - text: received mixed reviews. It has also been referred to as a "
              - link "pay-to-win" [ref=f4e284] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Pay-to-win
              - text: "\" game and has drawn criticism for its monetization techniques."
          - region [ref=f4e285]:
            - heading "Gameplay" [level=2] [ref=f4e287]
            - generic [ref=f4e289]:
              - generic [ref=f4e290]: Clash Royale 1v1 and 2v2 gameplay
              - generic [ref=f4e292]:
                - generic [ref=f4e293]:
                  - link [ref=f4e296] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/File:Clash_Royale_screenshot_2018.jpg
                    - img "Screenshot of a 1v1 battle" [ref=f4e297]
                  - generic [ref=f4e298]: A screenshot of a 1v1 battle
                - generic [ref=f4e299]:
                  - link [ref=f4e302] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/File:Clash_Royale_2v2.jpg
                    - img "Screenshot of a 2v2 battle" [ref=f4e303]
                  - generic [ref=f4e304]: A screenshot of a 2v2 battle
            - paragraph [ref=f4e305]:
              - text: Clash Royale is a
              - link "real-time strategy" [ref=f4e306] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Real-time_strategy
              - text: mobile game incorporating elements from
              - link "collectible card games" [ref=f4e307] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Collectible_card_game
              - text: ","
              - link "multiplayer online battle arenas" [ref=f4e308] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Multiplayer_online_battle_arena
              - text: (MOBAs) and
              - link "tower defense" [ref=f4e309] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Tower_defense
              - text: .
              - superscript [ref=f4e310]:
                - link "[1]" [ref=f4e311] [cursor=pointer]:
                  - /url: "#cite_note-toucharcade-1"
              - text: Players compete in head-to-head battles to destroy opposing towers while defending their own.
              - superscript [ref=f4e312]:
                - link "[2]" [ref=f4e313] [cursor=pointer]:
                  - /url: "#cite_note-:4-2"
              - text: The primary game mode features
              - link "1v1" [ref=f4e314] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/1v1
              - text: matches in which players earn trophies and progress through a series of themed arenas, unlocking new cards and gameplay features as they advance.
              - superscript [ref=f4e315]:
                - link "[1]" [ref=f4e316] [cursor=pointer]:
                  - /url: "#cite_note-toucharcade-1"
              - superscript [ref=f4e317]:
                - link "[3]" [ref=f4e318] [cursor=pointer]:
                  - /url: "#cite_note-:15-3"
              - text: Upon reaching a sufficiently high trophy count, players gain access to ranked play, which is divided into seven leagues with the highest being Ultimate Champion.
              - superscript [ref=f4e319]:
                - link "[4]" [ref=f4e320] [cursor=pointer]:
                  - /url: "#cite_note-Pocket2-4"
              - superscript [ref=f4e321]:
                - link "[5]" [ref=f4e322] [cursor=pointer]:
                  - /url: "#cite_note-5"
            - paragraph [ref=f4e323]:
              - text: Battles take place in an arena where each player has three towers—one King Tower and two Princess Towers.
              - superscript [ref=f4e324]:
                - link "[6]" [ref=f4e325] [cursor=pointer]:
                  - /url: "#cite_note-:2-6"
              - superscript [ref=f4e326]:
                - link "[7]" [ref=f4e327] [cursor=pointer]:
                  - /url: "#cite_note-:7-7"
              - superscript [ref=f4e328]:
                - link "[a]" [ref=f4e329] [cursor=pointer]:
                  - /url: "#cite_note-9"
              - text: The arena is divided into two halves by a river, with bridges on the left and right forming two lanes where players can focus their attacks.
              - superscript [ref=f4e330]:
                - link "[2]" [ref=f4e331] [cursor=pointer]:
                  - /url: "#cite_note-:4-2"
              - superscript [ref=f4e332]:
                - link "[9]" [ref=f4e333] [cursor=pointer]:
                  - /url: "#cite_note-10"
              - text: Each player uses a deck of eight cards,
              - superscript [ref=f4e334]:
                - link "[1]" [ref=f4e335] [cursor=pointer]:
                  - /url: "#cite_note-toucharcade-1"
              - text: four of which are available in their hand at any given time.
              - superscript [ref=f4e336]:
                - link "[10]" [ref=f4e337] [cursor=pointer]:
                  - /url: "#cite_note-Stuff-11"
              - text: Cards are deployed onto the arena by spending elixir, a resource that generates passively over time, up to a maximum of 10.
              - superscript [ref=f4e338]:
                - link "[10]" [ref=f4e339] [cursor=pointer]:
                  - /url: "#cite_note-Stuff-11"
              - superscript [ref=f4e340]:
                - link "[11]" [ref=f4e341] [cursor=pointer]:
                  - /url: "#cite_note-GI-12"
            - paragraph [ref=f4e342]:
              - text: Cards may represent troops, buildings, or spells. When deployed, troops typically advance towards enemy towers; some target the opponent's troops on the way, while others charge directly towards the tower.
              - superscript [ref=f4e343]:
                - link "[1]" [ref=f4e344] [cursor=pointer]:
                  - /url: "#cite_note-toucharcade-1"
              - text: Princess Towers automatically attack enemy units that cross onto their side of the river.
              - superscript [ref=f4e345]:
                - link "[12]" [ref=f4e346] [cursor=pointer]:
                  - /url: "#cite_note-:12-13"
              - superscript [ref=f4e347]:
                - link "[13]" [ref=f4e348] [cursor=pointer]:
                  - /url: "#cite_note-:9-14"
              - text: The King Tower becomes active after a Princess Tower is destroyed or once the King Tower has taken damage, and will then assist in defending against enemy troops.
              - superscript [ref=f4e349]:
                - link "[14]" [ref=f4e350] [cursor=pointer]:
                  - /url: "#cite_note-15"
              - text: Buildings can be placed to defend territory, whilst spells cause effects like damaging enemy units and structures. Most troops and buildings can only be deployed by players onto their own side of the arena, corresponding to the lower half of the screen, but spells can be used anywhere. If a player destroys an opponent's tower, the area where they can place troops and buildings expands partially to the opponent’s side of the arena.
              - superscript [ref=f4e351]:
                - link "[7]" [ref=f4e352] [cursor=pointer]:
                  - /url: "#cite_note-:7-7"
            - paragraph [ref=f4e353]:
              - text: Battles last up to three minutes in normal time, with elixir generation doubling during the final minute. A player wins by destroying the opponent’s King Tower or by destroying more towers than their opponent by the end of normal time. If both players have destroyed the same number of towers, the match enters overtime, where the first player to destroy a tower wins.
              - superscript [ref=f4e354]:
                - link "[15]" [ref=f4e355] [cursor=pointer]:
                  - /url: "#cite_note-16"
              - text: If no tower is destroyed within two minutes of overtime, a tiebreaker is applied in which the player with the tower on the lowest remaining health loses.
              - superscript [ref=f4e356]:
                - link "[7]" [ref=f4e357] [cursor=pointer]:
                  - /url: "#cite_note-:7-7"
              - text: During the final minute of overtime, elixir generation is tripled.
              - superscript [ref=f4e358]:
                - link "[16]" [ref=f4e359] [cursor=pointer]:
                  - /url: "#cite_note-17"
            - paragraph [ref=f4e360]:
              - link "Deck-building" [ref=f4e361] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Deck-building
              - text: is another core gameplay element in Clash Royale.
              - superscript [ref=f4e362]:
                - link "[2]" [ref=f4e363] [cursor=pointer]:
                  - /url: "#cite_note-:4-2"
              - superscript [ref=f4e364]:
                - link "[17]" [ref=f4e365] [cursor=pointer]:
                  - /url: "#cite_note-:10-18"
              - text: Between battles, players can select any eight cards from their collection to form their deck.
              - superscript [ref=f4e366]:
                - link "[1]" [ref=f4e367] [cursor=pointer]:
                  - /url: "#cite_note-toucharcade-1"
              - superscript [ref=f4e368]:
                - link "[18]" [ref=f4e369] [cursor=pointer]:
                  - /url: "#cite_note-:0-19"
              - text: Players can collect cards from chests earned through gameplay, purchase them from the in-game shop, or join a clan and request them from clan members. Once they have collected enough copies of the same card, they can upgrade that card using in-game currency, which increases its effectiveness. Upgrading cards also contributes to the player's "King Level", the level of their account, which also affects their towers' strength.
              - superscript [ref=f4e370]:
                - link "[1]" [ref=f4e371] [cursor=pointer]:
                  - /url: "#cite_note-toucharcade-1"
              - superscript [ref=f4e372]:
                - link "[7]" [ref=f4e373] [cursor=pointer]:
                  - /url: "#cite_note-:7-7"
              - text: Card levels are an important consideration when building a deck, as higher-level cards are stronger. However, players must also account for the synergy between cards in their collection. In-battle strategy varies depending on the deck, but generally consists of efficient elixir management, precise card placements and timings, and tracking an opponent's elixir and cards.
              - superscript [ref=f4e374]:
                - link "[7]" [ref=f4e375] [cursor=pointer]:
                  - /url: "#cite_note-:7-7"
              - superscript [ref=f4e376]:
                - link "[12]" [ref=f4e377] [cursor=pointer]:
                  - /url: "#cite_note-:12-13"
            - region [ref=f4e378]:
              - heading "Other game modes" [level=3] [ref=f4e380]
              - paragraph [ref=f4e381]:
                - text: Throughout its development, Supercell has introduced numerous additional game modes. A cooperative 2v2 mode allows players to team up with friends or other online players.
                - superscript [ref=f4e382]:
                  - link "[7]" [ref=f4e383] [cursor=pointer]:
                    - /url: "#cite_note-:7-7"
                - superscript [ref=f4e384]:
                  - link "[19]" [ref=f4e385] [cursor=pointer]:
                    - /url: "#cite_note-20"
                - text: The game also features permanent and limited-time challenges and events, which require an entry fee at the in-game currency and reward players based on the number of wins achieved before three losses. Variants include the draft challenge, in which players select from a series of two-card choices to build their deck before each battle, and various events added to celebrate the introduction of new cards or features.
                - superscript [ref=f4e386]:
                  - link "[7]" [ref=f4e387] [cursor=pointer]:
                    - /url: "#cite_note-:7-7"
                - superscript [ref=f4e388]:
                  - link "[20]" [ref=f4e389] [cursor=pointer]:
                    - /url: "#cite_note-21"
              - paragraph [ref=f4e390]:
                - text: Clan Wars, introduced in April 2018, allowed players to work together. This mode was replaced by Clan Wars 2 in August 2020. In the updated format, players must construct four unique decks without overlapping cards,
                - superscript [ref=f4e391]:
                  - link "[7]" [ref=f4e392] [cursor=pointer]:
                    - /url: "#cite_note-:7-7"
                - text: which are used to attack opposing clans' defences.
                - superscript [ref=f4e393]:
                  - link "[21]" [ref=f4e394] [cursor=pointer]:
                    - /url: "#cite_note-22"
              - paragraph [ref=f4e395]:
                - text: In July 2025, Merge Tactics was added as a permanent game mode. The mode features a four-player, turn-based format in which players select units to deploy and merge in order to strengthen them before sending them into automated battles. Its gameplay is comparable to that of
                - link "Rush Royale" [ref=f4e397] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Rush_Royale
                - text: .
                - superscript [ref=f4e398]:
                  - link "[4]" [ref=f4e399] [cursor=pointer]:
                    - /url: "#cite_note-Pocket2-4"
                - superscript [ref=f4e400]:
                  - link "[22]" [ref=f4e401] [cursor=pointer]:
                    - /url: "#cite_note-23"
              - paragraph [ref=f4e402]:
                - text: Clash Royale regularly includes limited-time game modes. In March 2018, for the game's second anniversary, Supercell introduced Retro Royale, which restricted gameplay to cards available during the game's soft launch.
                - superscript [ref=f4e403]:
                  - link "[23]" [ref=f4e404] [cursor=pointer]:
                    - /url: "#cite_note-24"
                - text: The mode returned temporarily in March 2025, this time limiting card selection to those released as of 2017.
                - superscript [ref=f4e405]:
                  - link "[24]" [ref=f4e406] [cursor=pointer]:
                    - /url: "#cite_note-25"
                - text: In June 2024, a limited-time mode replaced the King Tower with a Goblin Queen. As goblin-themed cards are played, the Queen's ability charges up, culminating with the release of several Goblin Babies across the opponent's side of the arena. Progression in this game mode followed a similar trophy-based system as the primary game mode.
                - superscript [ref=f4e407]:
                  - link "[25]" [ref=f4e408] [cursor=pointer]:
                    - /url: "#cite_note-26"
                - superscript [ref=f4e409]:
                  - link "[26]" [ref=f4e410] [cursor=pointer]:
                    - /url: "#cite_note-27"
                - text: Ranked 2v2 play was introduced as a limited-time mode in November 2024,
                - superscript [ref=f4e411]:
                  - link "[27]" [ref=f4e412] [cursor=pointer]:
                    - /url: "#cite_note-28"
                - text: and reintroduced briefly in February 2025, allowing players to team up and play competitively against other teams.
                - superscript [ref=f4e413]:
                  - link "[28]" [ref=f4e414] [cursor=pointer]:
                    - /url: "#cite_note-29"
          - region [ref=f4e415]:
            - heading "Development history" [level=2] [ref=f4e417]
            - region [ref=f4e418]:
              - heading "Initial development and release" [level=3] [ref=f4e420]
              - paragraph [ref=f4e421]:
                - text: Clash Royale was developed by
                - link "Supercell" [ref=f4e422] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Supercell_(company)
                - text: ", a Finnish game company known for the mobile games"
                - link "Clash of Clans" [ref=f4e424] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Clash_of_Clans
                - text: (2012),
                - link "Hay Day" [ref=f4e426] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Hay_Day
                - text: (2012), and
                - link "Boom Beach" [ref=f4e428] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Boom_Beach
                - text: (2014).
                - superscript [ref=f4e429]:
                  - link "[29]" [ref=f4e430] [cursor=pointer]:
                    - /url: "#cite_note-30"
                - text: The concept for the game came from a prototype called The Summoners that had been abandoned prior to the release of Clash of Clans.
                - superscript [ref=f4e431]:
                  - link "[30]" [ref=f4e432] [cursor=pointer]:
                    - /url: "#cite_note-31"
                - text: Continued development of the concept began in 2014. It initially had an original fantasy setting and was developed under the name Wizard Arena, but Supercell later decided to set it in the world of Clash of Clans.
                - superscript [ref=f4e433]:
                  - link "[31]" [ref=f4e434] [cursor=pointer]:
                    - /url: "#cite_note-:5-32"
              - paragraph [ref=f4e435]:
                - text: While Clash of Clans had primarily been designed to be played on larger, horizontal
                - link "tablet" [ref=f4e436] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tablet_computer
                - text: screens, Clash Royale was made to be played on mobile phones.
                - superscript [ref=f4e437]:
                  - link "[31]" [ref=f4e438] [cursor=pointer]:
                    - /url: "#cite_note-:5-32"
                - superscript [ref=f4e439]:
                  - link "[32]" [ref=f4e440] [cursor=pointer]:
                    - /url: "#cite_note-33"
                - text: Many of the initial characters were taken directly from Clash of Clans, with designs adjusted for the new vertical format. New character designs were mostly themed around the idea of a refined group of "the Royals", including the Kings in the King Towers, the Knight, and the Musketeer.
                - superscript [ref=f4e441]:
                  - link "[31]" [ref=f4e442] [cursor=pointer]:
                    - /url: "#cite_note-:5-32"
                - text: Clash Royale was one of the first
                - link "player-versus-player" [ref=f4e443] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Player_versus_player
                - text: (PvP)
                - link "real-time" [ref=f4e444] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Real-time_game
                - text: games for mobile, which is difficult to implement because of the need for many players to be online simultaneously and the infrastructure to allow a quick connection between them.
                - superscript [ref=f4e445]:
                  - link "[33]" [ref=f4e446] [cursor=pointer]:
                    - /url: "#cite_note-:1-34"
                - superscript [ref=f4e447]:
                  - link "[34]" [ref=f4e448] [cursor=pointer]:
                    - /url: "#cite_note-:13-35"
              - paragraph [ref=f4e449]:
                - text: Clash Royale was
                - link "soft-launched" [ref=f4e450] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Soft_launch
                - text: in Canada, Hong Kong, Australia, Sweden, Norway, Denmark, Iceland, Finland, and New Zealand for
                - link "iOS" [ref=f4e451] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/IOS
                - text: on January 4, 2016.
                - superscript [ref=f4e452]:
                  - link "[35]" [ref=f4e453] [cursor=pointer]:
                    - /url: "#cite_note-36"
                - superscript [ref=f4e454]:
                  - link "[36]" [ref=f4e455] [cursor=pointer]:
                    - /url: "#cite_note-37"
                - text: It was soft-launched on
                - link "Android" [ref=f4e456] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Android_(operating_system)
                - text: for those same countries on February 16, 2016.
                - superscript [ref=f4e457]:
                  - link "[37]" [ref=f4e458] [cursor=pointer]:
                    - /url: "#cite_note-38"
                - text: Both platforms received a global release on March 2, 2016.
                - superscript [ref=f4e459]:
                  - link "[38]" [ref=f4e460] [cursor=pointer]:
                    - /url: "#cite_note-39"
                - text: Upon its release, Clash Royale became the most downloaded and top-grossing app on the U.S.
                - link "iOS App Store" [ref=f4e461] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/App_Store_(iOS)
                - text: .
                - superscript [ref=f4e462]:
                  - link "[39]" [ref=f4e463] [cursor=pointer]:
                    - /url: "#cite_note-40"
                - text: The game launched for
                - link "PC" [ref=f4e464] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/PC_game
                - text: globally on October 22, 2023, during the rollout of
                - link "Google Play Games" [ref=f4e465] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Google_Play_Games
                - text: "'s PC beta launch."
                - superscript [ref=f4e466]:
                  - link "[40]" [ref=f4e467] [cursor=pointer]:
                    - /url: "#cite_note-41"
                - superscript [ref=f4e468]:
                  - link "[41]" [ref=f4e469] [cursor=pointer]:
                    - /url: "#cite_note-:6-42"
            - region [ref=f4e470]:
              - heading "Post-release updates and monetisation strategy" [level=3] [ref=f4e472]
              - paragraph [ref=f4e473]:
                - text: Clash Royale is regularly updated by Supercell to
                - link "balance" [ref=f4e474] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Game_balance
                - text: the game and add new content.
                - superscript [ref=f4e475]:
                  - link "[7]" [ref=f4e476] [cursor=pointer]:
                    - /url: "#cite_note-:7-7"
                - text: In July 2019, Supercell introduced monthly themed seasons and a
                - link "battle pass" [ref=f4e477] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Battle_pass
                - text: called "Pass Royale" that refreshes each month.
                - superscript [ref=f4e478]:
                  - link "[42]" [ref=f4e479] [cursor=pointer]:
                    - /url: "#cite_note-43"
                - superscript [ref=f4e480]:
                  - link "[43]" [ref=f4e481] [cursor=pointer]:
                    - /url: "#cite_note-44"
                - text: Since then, updates usually coincide with the beginning of each season. Cards are buffed or nerfed based on player win and usage rates. Sometimes cards are reworked, fundamentally changing how they operate within the game, generally with the aim of improving cards with very low win rates.
                - superscript [ref=f4e482]:
                  - link "[7]" [ref=f4e483] [cursor=pointer]:
                    - /url: "#cite_note-:7-7"
              - paragraph [ref=f4e484]:
                - text: "The game initially soft-launched with 42 cards across three rarities: Common, Rare and Epic. The global launch added six new cards alongside a new rarity: Legendary. Since the global launch, numerous cards have been added to the game."
                - superscript [ref=f4e485]:
                  - link "[7]" [ref=f4e486] [cursor=pointer]:
                    - /url: "#cite_note-:7-7"
                - text: In October 2021, the Champion rarity was added; these troops have powerful special abilities that can be activated by the player during battles.
                - superscript [ref=f4e487]:
                  - link "[44]" [ref=f4e488] [cursor=pointer]:
                    - /url: "#cite_note-45"
                - text: In June 2023, Card Evolutions were introduced, giving existing cards a powerful new form when played enough times in a battle.
                - superscript [ref=f4e489]:
                  - link "[45]" [ref=f4e490] [cursor=pointer]:
                    - /url: "#cite_note-46"
                - superscript [ref=f4e491]:
                  - link "[46]" [ref=f4e492] [cursor=pointer]:
                    - /url: "#cite_note-47"
                - text: Heroes were added in December 2025; these are updated versions of old cards that have special abilities similar to Champions.
                - superscript [ref=f4e493]:
                  - link "[47]" [ref=f4e494] [cursor=pointer]:
                    - /url: "#cite_note-48"
              - paragraph [ref=f4e495]:
                - text: As a
                - link "free-to-play" [ref=f4e496] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Free-to-play
                - text: mobile game, Clash Royale's monetisation strategy relies on
                - link "in-game purchases" [ref=f4e497] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/In-game_purchases
                - text: . On release, the game placed rewards in chests that could only be opened once the chest timer finished, which lasted multiple hours. These chest timers could be skipped by spending real money on the game. This mechanic contributed to the game's monetisation strategy, but also provided natural limits on a player's session length and a reason for them to return to the game later.
                - superscript [ref=f4e498]:
                  - link "[33]" [ref=f4e499] [cursor=pointer]:
                    - /url: "#cite_note-:1-34"
                - superscript [ref=f4e500]:
                  - link "[48]" [ref=f4e501] [cursor=pointer]:
                    - /url: "#cite_note-49"
                - text: Chest timers were removed in April 2025 in favour of
                - link "gacha" [ref=f4e502] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Gacha_game
                - text: lucky drop style mechanics.
                - superscript [ref=f4e503]:
                  - link "[49]" [ref=f4e504] [cursor=pointer]:
                    - /url: "#cite_note-:14-50"
                - superscript [ref=f4e505]:
                  - link "[50]" [ref=f4e506] [cursor=pointer]:
                    - /url: "#cite_note-51"
              - paragraph [ref=f4e507]:
                - text: Another aspect of Clash Royale's monetisation strategy is scarcity of supplies. To remain competitive, players must level up their cards as much as possible. However, as they upgrade their cards, the amount of cards and gold required to level up increases. In general, a player will not have enough resources to upgrade all of their cards, so must decide how to allocate upgrades.
                - superscript [ref=f4e508]:
                  - link "[7]" [ref=f4e509] [cursor=pointer]:
                    - /url: "#cite_note-:7-7"
                - superscript [ref=f4e510]:
                  - link "[34]" [ref=f4e511] [cursor=pointer]:
                    - /url: "#cite_note-:13-35"
                - text: However, Clash Royale's monthly updates ensure that no single card or set of cards is consistently dominant, incentivising players to spend money to make sure all of their cards are upgraded.
                - superscript [ref=f4e512]:
                  - link "[7]" [ref=f4e513] [cursor=pointer]:
                    - /url: "#cite_note-:7-7"
                - superscript [ref=f4e514]:
                  - link "[3]" [ref=f4e515] [cursor=pointer]:
                    - /url: "#cite_note-:15-3"
          - region [ref=f4e516]:
            - heading "Reception" [level=2] [ref=f4e518]
            - complementary [ref=f4e519]:
