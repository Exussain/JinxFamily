            - paragraph [ref=f1e312]:
              - generic [ref=f1e313]: Fortnite
              - text: is a 2017
              - link "online video game" [ref=f1e314] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Online_game
              - text: and game platform developed and released by
              - link "Epic Games" [ref=f1e315] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Epic_Games
              - text: ". It is available in seven distinct game mode versions that otherwise share the same general gameplay and game engine:"
              - link "Fortnite Battle Royale" [ref=f1e317] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Fortnite_Battle_Royale
              - text: ", a"
              - link "battle royale game" [ref=f1e318] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Battle_royale_game
              - text: in which up to 100 players fight to be the last person standing;
              - link "Fortnite Save the World" [ref=f1e320] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Fortnite_Save_the_World
              - text: ", a cooperative hybrid"
              - link "tower defense" [ref=f1e321] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Tower_defense
              - text: "-"
              - link "shooter" [ref=f1e322] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Shooter_game
              - text: and
              - link "survival" [ref=f1e323] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Survival_game
              - text: game in which up to four players fight off
              - link "zombie" [ref=f1e324] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Zombie
              - text: "-like creatures and defend objects with traps and fortifications they can build;"
              - link "Fortnite Creative" [ref=f1e326] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Fortnite_Creative
              - text: ", in which players are given complete freedom to create worlds and battle arenas;"
              - link "Lego Fortnite" [ref=f1e328] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Lego_Fortnite
              - text: ", an"
              - link "open world" [ref=f1e329] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Open_world
              - text: game collection divided between
              - link "survival game" [ref=f1e330] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Survival_game
              - text: Lego Fortnite Odyssey and
              - link "social game" [ref=f1e331] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Social_game
              - text: Lego Fortnite Brick Life;
              - link "Rocket Racing" [ref=f1e333] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Rocket_Racing
              - text: ", a"
              - link "racing game" [ref=f1e334] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Racing_video_game
              - text: ;
              - link "Fortnite Festival" [ref=f1e336] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Fortnite_Festival
              - text: ", a"
              - link "rhythm" [ref=f1e337] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Rhythm_games
              - text: game; and
              - link "Fortnite Ballistic" [ref=f1e339] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Fortnite_Ballistic
              - text: ", a"
              - link "tactical first-person shooter" [ref=f1e340] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Tactical_first-person_shooter
              - text: currently in early access. All game modes are
              - link "free-to-play" [ref=f1e341] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Free-to-play
              - text: .
            - paragraph [ref=f1e342]:
              - text: Save the World and Battle Royale were released in 2017 as
              - link "early access" [ref=f1e343] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Early_access
              - text: titles, while Creative was released on December 6, 2018. While the Save the World and Creative versions have been successful for Epic Games, Fortnite Battle Royale in particular became an overwhelming success and a
              - link "cultural phenomenon" [ref=f1e344] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Cultural_phenomenon
              - text: ", drawing more than 125 million players in less than a year, earning hundreds of millions of dollars per month. Fortnite as a whole generated $9 billion in gross revenue up until December 2019, making it one of the"
              - link "highest-grossing media franchises" [ref=f1e345] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/List_of_highest-grossing_media_franchises
              - text: of all time. Since its release, Fortnite has been listed among the
              - link "greatest video games of all time" [ref=f1e346] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/List_of_video_games_considered_the_best
              - text: .
            - paragraph [ref=f1e347]:
              - text: Save the World is available for
              - link "macOS" [ref=f1e348] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/MacOS
              - text: ","
              - superscript [ref=f1e349]:
                - link "[c]" [ref=f1e350] [cursor=pointer]:
                  - /url: "#cite_note-apple_lawsuit-4"
              - link "PlayStation 4" [ref=f1e351] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/PlayStation_4
              - text: ","
              - link "Windows" [ref=f1e352] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Windows
              - text: ", and"
              - link "Xbox One" [ref=f1e353] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Xbox_One
              - text: ", while Battle Royale and Creative were released for all those platforms as well as"
              - link "Android" [ref=f1e354] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Android_(operating_system)
              - text: and
              - link "iOS" [ref=f1e355] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/IOS
              - text: devices
              - superscript [ref=f1e356]:
                - link "[c]" [ref=f1e357] [cursor=pointer]:
                  - /url: "#cite_note-apple_lawsuit-4"
              - text: and
              - link "Nintendo Switch" [ref=f1e358] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Nintendo_Switch
              - text: . The game also launched with the release of the ninth-generation
              - link "PlayStation 5" [ref=f1e359] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/PlayStation_5
              - text: ","
              - link "Xbox Series X/S" [ref=f1e360] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Xbox_Series_X/S
              - text: ", and"
              - link "Nintendo Switch 2" [ref=f1e361] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Nintendo_Switch_2
              - text: consoles. Furthermore, Lego Fortnite, Rocket Racing, Fortnite Festival, and Fortnite Ballistic are available on all platforms. Most game modes support
              - link "cross-platform play" [ref=f1e362] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Cross-platform_play
              - text: between the various supported devices.
          - region [ref=f1e363]:
            - heading "Game modes" [level=2] [ref=f1e365]
            - paragraph [ref=f1e366]: "Fortnite has multiple game modes, using the same engine; each has similar graphics and art assets. Five of these modes are directly created and managed by Epic Games and its subsidiaries:"
            - list [ref=f1e367]:
              - listitem [ref=f1e368]:
                - 'link "Fortnite: Save the World" [ref=f1e370] [cursor=pointer]':
                  - /url: https://en.wikipedia.org/wiki/Fortnite:_Save_the_World
                - text: is a player-versus-environment
                - link "cooperative game" [ref=f1e371] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cooperative_video_game
                - text: ", with four players collaborating towards a common objective on various missions while avoiding the effects of an encroaching cataclysmic storm. The players take the role of commanders of home base shelters, collecting resources, saving survivors, and defending equipment that helps to either collect data on the storm or to push back the storm. From missions, players are awarded several in-game items, which include hero characters, weapon and trap schematics, and survivors, all of which can be leveled up through gained experience to improve their attributes."
              - listitem [ref=f1e372]:
                - link "Fortnite Battle Royale" [ref=f1e374] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fortnite_Battle_Royale
                - text: is a player-versus-player game for up to 100 players, allowing one to play alone, in a duo, or in a squad (usually comprising three or four players). Weaponless players
                - link "airdrop" [ref=f1e375] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Skydive
                - text: from a "Battle Bus" that crosses the game's map, and then scavenge for weapons, items, and resources while trying to stay alive and to attack and eliminate other players. Over the course of a round, the safe area of the map shrinks in size due to an incoming toxic storm; players outside that threshold take damage and can be eliminated if they fail to quickly evacuate. This forces remaining players into tighter spaces and encourages player encounters until the last player or team is alive. Players can also select Zero Build, a mode that removes building elements. Alongside these are Ranked options and other modes such as Reload, a 40-player mode which allows players to respawn after dying for a set amount of time on a smaller map, OG, which re-introduces the classic Chapter 1 map and weapons, and Blitz Royale, a tightly paced, 32-player mode that usually lasts five minutes. Furthermore, "Party Royale" serves as a social space, which hosts various concert events.
              - listitem [ref=f1e376]:
                - link "Lego Fortnite" [ref=f1e380] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Lego_Fortnite
                - text: is a platform for Lego-based games. The platform includes Odyssey, a
                - link "survival" [ref=f1e381] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Survival_game
                - text: sandbox game, where players play as Lego
                - link "Minifig" [ref=f1e382] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Lego_minifigure
                - text: versions of characters, as they collect materials, build various buildings, craft various weapons and tools and fight against monsters; Brick Life, a social-based game designed as an age-appropriate
                - link "Grand Theft Auto" [ref=f1e384] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Grand_Theft_Auto
                - text: game;
                - superscript [ref=f1e385]:
                  - link "[9]" [ref=f1e386] [cursor=pointer]:
                    - /url: "#cite_note-12"
                - text: and Lego Expeditions, a co-operation action-adventure mode where up to four players can select characters from different hero classes and customize tools and weapons to defeat enemies or complete puzzles.
                - superscript [ref=f1e387]:
                  - link "[10]" [ref=f1e388] [cursor=pointer]:
                    - /url: "#cite_note-13"
              - listitem [ref=f1e389]:
                - link "Rocket Racing" [ref=f1e391] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Rocket_Racing
                - text: is a
                - link "racing" [ref=f1e392] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Racing_video_game
                - text: game developed by
                - link "Psyonix" [ref=f1e393] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Psyonix
                - text: and serving as a spin-off title to
                - link "Rocket League" [ref=f1e395] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Rocket_League
                - text: . Players race vehicles, gaining speed boosts from special lane sections or by
                - link "drifting" [ref=f1e396] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Drifting_(motorsport)
                - text: ", as well as the ability to jump and race on vertical and inverted surfaces, while avoiding obstacles on the course."
              - listitem [ref=f1e397]:
                - link "Fortnite Festival" [ref=f1e401] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fortnite_Festival
                - text: is a
                - link "rhythm game" [ref=f1e402] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Music_video_game
                - text: developed by
                - link "Harmonix" [ref=f1e403] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Harmonix
                - text: ", comprising three modes. In the \"Main Stage\", players play popular hit songs and original tracks created by Harmonix and the Epic Games Sound Team, hitting notes to the rhythm in the Main Stage on one of the four unique parts: Lead, Guitar/Bass, Drums and Vocals, in a manner similar to Harmonix's"
                - link "Rock Band" [ref=f1e405] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Rock_Band
                - text: games, while the "Battle Stage" pits sixteen players to get the highest score and survive each round until one player remains.
                - superscript [ref=f1e406]:
                  - link "[11]" [ref=f1e407] [cursor=pointer]:
                    - /url: "#cite_note-14"
                - text: In the "Jam Stage", players cooperate to make remixes, similar to Harmonix'
                - link "Dropmix" [ref=f1e409] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Dropmix
                - text: and
                - link "Fuser" [ref=f1e411] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fuser_(video_game)
                - text: ", using any part of any song within Festival mode, in which are also usable in Save the World, Battle Royale, Creative and Unreal Editor for Fortnite (UEFN). The \"Battle Stage\" mode was removed on April 16, 2026."
              - listitem [ref=f1e412]:
                - link "Fortnite Ballistic" [ref=f1e414] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fortnite_Ballistic
                - text: is a five-on-five, round-based tactical shooter, comparable to
                - link "Counter-Strike" [ref=f1e416] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Counter-Strike
                - text: and
                - link "Valorant" [ref=f1e418] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Valorant
                - text: ", to launch in"
                - link "early access" [ref=f1e419] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Early_access
                - text: on December 11, 2024. One team must plant and protect a rift device while it is charging from the opposing team that seeks to eliminate them and disarm the device. Between rounds, players can buy in-game weapons and gear with currency earned in previous rounds. Ballistic is the first Epic-developed game on the Fortnite platform to directly support a
                - link "first-person view" [ref=f1e420] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/First-person_(video_games)
                - text: .
                - superscript [ref=f1e421]:
                  - link "[12]" [ref=f1e422] [cursor=pointer]:
                    - /url: "#cite_note-15"
                - text: It was removed on April 16, 2026.
            - paragraph [ref=f1e423]:
              - text: Besides these modes, Fortnite offers the
              - link "sandbox" [ref=f1e424] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Sandbox_game
              - text: mode,
              - link "Fortnite Creative" [ref=f1e426] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Fortnite_Creative
              - text: . Within this mode, players are given complete freedom to spawn any item from the Battle Royale game mode on a personal island, and can create games such as battle arenas, race courses,
              - link "platforming" [ref=f1e427] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Platform_game
              - text: challenges, and more. Furthermore, it also supports
              - link "Unreal Editor for Fortnite" [ref=f1e428] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Unreal_Editor_for_Fortnite
              - text: (UEFN), which allows players to edit worlds using Fortnite assets. Creative and UEFN also allow players to create custom
              - link "Fall Guys" [ref=f1e430] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Fall_Guys
              - text: and
              - link "Teenage Mutant Ninja Turtles" [ref=f1e432] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Teenage_Mutant_Ninja_Turtles
              - text: games, which can be accessible within the Fortnite launcher.
            - paragraph [ref=f1e433]:
              - text: All modes of Fortnite are
              - link "cross-platform play" [ref=f1e434] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Cross-platform_play
              - text: compatible, requiring users to use an Epic Games account for cross-saving between platforms.
              - superscript [ref=f1e435]:
                - link "[13]" [ref=f1e436] [cursor=pointer]:
                  - /url: "#cite_note-16"
            - region [ref=f1e437]:
              - heading "V-Bucks" [level=3] [ref=f1e439]
              - paragraph [ref=f1e440]:
                - text: All modes are
                - link "free-to-play" [ref=f1e441] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Free-to-play
                - text: ; Save the World was
                - link "pay-to-play" [ref=f1e442] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Pay-to-play
                - text: until April 2026.
                - superscript [ref=f1e443]:
                  - link "[14]" [ref=f1e444] [cursor=pointer]:
                    - /url: "#cite_note-17"
                - text: The games are
                - link "monetized" [ref=f1e445] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Video_game_monetization
                - text: through the use of V-Bucks, in-game currency that can be purchased with real-world funds, but also earned through completing missions and other achievements in Save the World.
                - superscript [ref=f1e446]:
                  - link "[15]" [ref=f1e447] [cursor=pointer]:
                    - /url: "#cite_note-18"
                - text: In other modes, V-Bucks can be used to buy cosmetic items such as character models, emotes, or the game's
                - link "battle pass" [ref=f1e448] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Battle_pass
                - text: ", a tiered progression of customization rewards for gaining experience and completing certain objectives during a Battle Royale season."
                - superscript [ref=f1e449]:
                  - link "[16]" [ref=f1e450] [cursor=pointer]:
                    - /url: "#cite_note-19"
                - superscript [ref=f1e451]:
                  - link "[17]" [ref=f1e452] [cursor=pointer]:
                    - /url: "#cite_note-20"
                - text: The battle pass originally was aimed to support Fortnite Battle Royale, and with the expansion of game modes in 2023, two addition passes were added, the Festival Pass for Fortnite Festival and Lego Pass for Lego Fortnite, each which required progression in those modes to receive rewards. In November and December 2024, Epic changed these mechanics, allowing both passes to be progressed through experience points earned in any Fortnite game mode, as well as renaming the Festival Pass to Music Pass. Similarly, the Fortnite Crew, a monthly subscription that paid for the cost of the main battle pass and additional cosmetics, was expanded during the same time to encompass the Music and Lego passes.
              - paragraph [ref=f1e453]:
                - text: At launch, the cost for V-Bucks was about 1000 V-Bucks for US$10, though are discounted in larger V-Buck bundles. The battle pass, when first introduced, also cost 1000 V-Bucks, and included the ability to reclaim the V-Buck cost along with a smaller amount of V-Bucks.
                - superscript [ref=f1e454]:
                  - link "[18]" [ref=f1e455] [cursor=pointer]:
                    - /url: "#cite_note-21"
                - text: In 2020, Epic reduced the cost of V-Bucks purchases directly in game or via Epic's website by 20% ($7.99 for 1000 V-Bucks), while still charging $10 for 1000 V-Bucks to both the Google
                - link "Play Store" [ref=f1e456] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Play_Store
                - text: and Apple
                - link "App Store" [ref=f1e457] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/App_Store_(Apple)
                - text: ", as Epic argued the 30% revenue cut both Google and Apple took from such purchases was excessive. These changes led to two lawsuits,"
                - link "Epic Games v. Google" [ref=f1e459] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Epic_Games_v._Google
                - text: and
                - link "Epic Games v. Apple" [ref=f1e461] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Epic_Games_v._Apple
                - text: ", both challenging the respective app store policies and revenue cut."
                - superscript [ref=f1e462]:
                  - link "[19]" [ref=f1e463] [cursor=pointer]:
                    - /url: "#cite_note-22"
                - text: In the case of the Apple suit, Epic was able to secure a ruling requiring Apple to allow in-app steering of users to make purchases through third-party storefronts, like Epic's,
                - superscript [ref=f1e464]:
                  - link "[20]" [ref=f1e465] [cursor=pointer]:
                    - /url: "#cite_note-npr_decision-23"
                - text: while in the Google suit, Epic reached a settlement to reduce the 30% revenue cut on the Play Store.
                - superscript [ref=f1e466]:
                  - link "[21]" [ref=f1e467] [cursor=pointer]:
                    - /url: "#cite_note-24"
              - paragraph [ref=f1e468]:
                - text: Epic has since raised the price of V-Bucks twice. The price was increased by about 12.5% in 2023 to offset inflation, with 1000 V-Bucks now costing $8.99 when purchased through Epic's storefront.
                - superscript [ref=f1e469]:
                  - link "[22]" [ref=f1e470] [cursor=pointer]:
                    - /url: "#cite_note-25"
                - text: The second increase in March 2026 was about 20% increase in cost, with now 800 V-Bucks costing $10. Battle pass costs were changed to also remain at 800 V-Bucks, but contained only just enough V-Buck rewards to recover its cost. Epic claimed these increases were needed because operating prices for Fortnite had increased, and "frees up our teams to continue driving stories and building stuff you love".
                - superscript [ref=f1e471]:
                  - link "[23]" [ref=f1e472] [cursor=pointer]:
                    - /url: "#cite_note-26"
                - superscript [ref=f1e473]:
                  - link "[24]" [ref=f1e474] [cursor=pointer]:
                    - /url: "#cite_note-pcgamer_vbuck_increase-27"
                - text: A large number of players stated they would boycott Fortnite as a result of this increase.
                - superscript [ref=f1e475]:
                  - link "[24]" [ref=f1e476] [cursor=pointer]:
                    - /url: "#cite_note-pcgamer_vbuck_increase-27"
          - region [ref=f1e477]:
            - heading "Development history" [level=2] [ref=f1e479]
            - region [ref=f1e480]:
              - 'heading "Fortnite: Save the World (2011–2017)" [level=3] [ref=f1e482]'
              - note [ref=f1e483]:
                - text: "Main article:"
                - 'link "Fortnite: Save the World § Development" [ref=f1e484] [cursor=pointer]':
                  - /url: https://en.wikipedia.org/wiki/Fortnite:_Save_the_World#Development
                  - text: "Fortnite: Save the World§ Development"
              - paragraph [ref=f1e486]:
                - text: Fortnite began from an internal
                - link "game jam" [ref=f1e487] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Game_jam
                - text: at Epic Games following the publishing of
                - link "Gears of War 3" [ref=f1e489] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Gears_of_War_3
                - text: around 2011. Though it was not initially one of the developed titles during the jam, the concept of merging the construction game genre, representing games like
                - link "Minecraft" [ref=f1e491] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Minecraft
                - text: and
                - link "Terraria" [ref=f1e493] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Terraria
                - text: ", and shooter games arose, leading to the foundation of Fortnite."
                - superscript [ref=f1e494]:
                  - link "[25]" [ref=f1e495] [cursor=pointer]:
                    - /url: "#cite_note-polygon_march2014-28"
                - superscript [ref=f1e496]:
                  - link "[26]" [ref=f1e497] [cursor=pointer]:
                    - /url: "#cite_note-gi_2014_retrospective-29"
                - text: Development of Fortnite slowed due to several issues, including switching from
                - link "Unreal Engine" [ref=f1e498] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Unreal_Engine
                - text: 3 to Unreal Engine 4, a deeper
                - link "role-playing game" [ref=f1e499] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Computer_role-playing_game
                - text: approach to extend the life of the game, and a switch of art style from a dark theme to a more cartoonish style. Further, Epic was looking to get into the
                - link "games as a service" [ref=f1e500] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Games_as_a_service
                - text: model, and brought in Chinese publisher
                - link "Tencent" [ref=f1e501] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tencent
                - text: to help; Tencent took a large stake in Epic as part of this, leading to the departure of several executives, including
                - link "Cliff Bleszinski" [ref=f1e502] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cliff_Bleszinski
                - text: ", who had been a key part of Fortnite"
                - generic [ref=f1e503]: "'"
                - text: s development. Fortnite
                - generic [ref=f1e504]: "'"
                - text: s approach was changed to be Epic's testbed for games as a service, and further slowed the development.
                - superscript [ref=f1e505]:
                  - link "[27]" [ref=f1e506] [cursor=pointer]:
                    - /url: "#cite_note-pcgamesn_jun2017-30"
                - superscript [ref=f1e507]:
                  - link "[26]" [ref=f1e508] [cursor=pointer]:
                    - /url: "#cite_note-gi_2014_retrospective-29"
                - superscript [ref=f1e509]:
                  - link "[28]" [ref=f1e510] [cursor=pointer]:
                    - /url: "#cite_note-31"
              - paragraph [ref=f1e511]:
                - text: Epic prepared to release Fortnite as a paid early access title in July 2017, with plans to release it as free-to-play in 2019 while gaining feedback from players to improve the game.
                - superscript [ref=f1e512]:
                  - link "[29]" [ref=f1e513] [cursor=pointer]:
                    - /url: "#cite_note-glixed_gdc2018-32"
                - superscript [ref=f1e514]:
                  - link "[30]" [ref=f1e515] [cursor=pointer]:
                    - /url: "#cite_note-earlyaccess-33"
                - superscript [ref=f1e516]:
                  - link "[31]" [ref=f1e517] [cursor=pointer]:
                    - /url: "#cite_note-34"
                - superscript [ref=f1e518]:
                  - link "[32]" [ref=f1e519] [cursor=pointer]:
                    - /url: "#cite_note-35"
                - text: With the release of Fortnite Battle Royale, the player-versus-environment mode was distinguished as "Save the World". Ultimately, Epic opted to release Save the World as a premium title, bringing it out of early access on June 29, 2020.
                - superscript [ref=f1e520]:
                  - link "[33]" [ref=f1e521] [cursor=pointer]:
                    - /url: "#cite_note-36"
                - text: Later, Epic announced that Save the World will become free-to-play for most console and computer versions in April 2026.
                - superscript [ref=f1e522]:
                  - link "[34]" [ref=f1e523] [cursor=pointer]:
                    - /url: "#cite_note-37"
            - region [ref=f1e524]:
              - heading "Fortnite Battle Royale (2017–2018)" [level=3] [ref=f1e526]
              - note [ref=f1e527]:
                - text: "Main article:"
                - link "Fortnite Battle Royale § Development" [ref=f1e528] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fortnite_Battle_Royale#Development
                  - text: Fortnite Battle Royale§ Development
              - paragraph [ref=f1e530]:
                - text: Near the same time that Epic released Fortnite into early access,
                - link "PlayerUnknown's Battlegrounds" [ref=f1e532] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/PlayerUnknown's_Battlegrounds
                - text: had become a worldwide phenomenon, having sold over 5 million copies three months from its March 2017 release and drawing strong interest in the battle royale genre. Epic recognized that with the Fortnite base game, they could also do a battle royale mode, and rapidly developed their own version atop Fortnite in about two months.
                - superscript [ref=f1e533]:
                  - link "[35]" [ref=f1e534] [cursor=pointer]:
                    - /url: "#cite_note-38"
                - text: By September 2017, Epic was ready to release this as a second mode from "Save the World" in the paid-for earlier access but then later released it as a free game, Fortnite Battle Royale, supported with microtransactions. This version quickly gained players, with over 10 million players during its first two weeks of release, and leading Epic to create separate teams to continue the Fortnite Battle Royale development apart from the Save the World version, outside of common engine elements and art assets.
                - superscript [ref=f1e535]:
                  - link "[36]" [ref=f1e536] [cursor=pointer]:
                    - /url: "#cite_note-ign_devvideo-39"
                - superscript [ref=f1e537]:
                  - link "[37]" [ref=f1e538] [cursor=pointer]:
                    - /url: "#cite_note-pcgamer_gdc_2018-40"
                - text: This allowed Fortnite Battle Royale to expand to other platforms otherwise not supported by Save the World, including iOS, Android mobile devices, Nintendo Switch, and Nintendo Switch 2.
                - superscript [ref=f1e539]:
                  - link "[38]" [ref=f1e540] [cursor=pointer]:
                    - /url: "#cite_note-41"
                - superscript [ref=f1e541]:
                  - link "[39]" [ref=f1e542] [cursor=pointer]:
                    - /url: "#cite_note-42"
            - region [ref=f1e543]:
              - heading "Fortnite Creative (2018–2023)" [level=3] [ref=f1e545]
              - note [ref=f1e546]:
                - text: "Main article:"
                - link "Fortnite Creative § Development" [ref=f1e547] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fortnite_Creative#Development
                  - text: Fortnite Creative§ Development
              - paragraph [ref=f1e549]:
                - text: A creative
                - link "sandbox" [ref=f1e550] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Sandbox_game
                - text: mode launched on December 6, 2018, synchronized with the start of season 7 of Fortnite Battle Royale. Each player has access to a private, persistent island on which they construct buildings and add and manipulate objects as desired. Players can invite friends to this island and take part in unofficial games such as race tracks or jumping courses.
                - superscript [ref=f1e551]:
                  - link "[40]" [ref=f1e552] [cursor=pointer]:
                    - /url: "#cite_note-43"
                - text: Only players who purchased the battle pass initially received their own island, but a week later, on December 13, players who did not purchase it received access to the game mode for free.
                - superscript [ref=f1e553]:
                  - link "[41]" [ref=f1e554] [cursor=pointer]:
                    - /url: "#cite_note-44"
            - region [ref=f1e555]:
              - heading "Fortnite Experiences (2023–present)" [level=3] [ref=f1e557]
              - paragraph [ref=f1e558]:
                - text: In March 2023, Epic released the Unreal Editor for Fortnite (UEFN), a standalone editor for Windows. UEFN allows creators to use the Unreal Editor with features of Unreal Engine 5 and Fortnite assets in developing new modes within the Fortnite Creative mode; this mode was called "Creative 2.0".
                - superscript [ref=f1e559]:
                  - link "[42]" [ref=f1e560] [cursor=pointer]:
                    - /url: "#cite_note-45"
              - paragraph [ref=f1e561]:
                - text: In October 2023, Epic redesigned the main Fortnite client to present Epic's own various modes as well as the many creative modes as part of Fortnite Experiences, comparable to
                - link "Roblox" [ref=f1e563] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Roblox
                - text: in presentation.
                - superscript [ref=f1e564]:
                  - link "[43]" [ref=f1e565] [cursor=pointer]:
                    - /url: "#cite_note-46"
                - text: "This was followed by introducing three new Epic-developed modes for the game in December 2023:"
                - link "Lego Fortnite" [ref=f1e567] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Lego_Fortnite
                - text: ", a"
                - link "survival game" [ref=f1e568] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Survival_game
                - text: developed with
                - link "The Lego Group" [ref=f1e569] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/The_Lego_Group
                - text: ", Rocket Racing, an arcade-style driving game developed by"
                - link "Psyonix" [ref=f1e570] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Psyonix
                - text: ", and"
                - link "Fortnite Festival" [ref=f1e572] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fortnite_Festival
                - text: ", a"
                - link "rhythm game" [ref=f1e573] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Rhythm_game
                - text: developed by
                - link "Harmonix" [ref=f1e574] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Harmonix
                - text: . Each mode was introduced as free-to-play, interfacing with the game's battle pass system and offering new rewards associated with those modes.
                - superscript [ref=f1e575]:
                  - link "[44]" [ref=f1e576] [cursor=pointer]:
                    - /url: "#cite_note-47"
                - text: One recent Epic experience features music by
                - link "Daft Punk" [ref=f1e577] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Daft_Punk
                - text: .
                - superscript [ref=f1e578]:
                  - link "[45]" [ref=f1e579] [cursor=pointer]:
                    - /url: "#cite_note-48"
              - paragraph [ref=f1e580]:
                - text: Many improvements in UEFN were announced in March 2024, including the addition of Unreal Engine's MetaHuman character rendering technology, and more assets from Lego, Rocket Racing, and
                - link "Fall Guys" [ref=f1e582] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fall_Guys
                - text: . Epic also stated their intent to have future Fortnite Battle Royale seasons starting in late 2025 to be developed in UEFN.
                - superscript [ref=f1e583]:
                  - link "[46]" [ref=f1e584] [cursor=pointer]:
                    - /url: "#cite_note-49"
          - region [ref=f1e585]:
            - heading "Reception" [level=2] [ref=f1e587]
            - note [ref=f1e588]:
              - text: "See also:"
              - 'link "Fortnite: Save the World § Reception" [ref=f1e589] [cursor=pointer]':
                - /url: https://en.wikipedia.org/wiki/Fortnite:_Save_the_World#Reception
                - text: "Fortnite: Save the World§ Reception"
              - text: ","
              - link "Fortnite Battle Royale § Reception and legacy" [ref=f1e591] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Fortnite_Battle_Royale#Reception_and_legacy
                - text: Fortnite Battle Royale§ Reception and legacy
              - text: ", and"
              - link "Fortnite Creative § Reception" [ref=f1e593] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Fortnite_Creative#Reception
                - text: Fortnite Creative§ Reception
            - figure "The Fortnite Pro-Am event at E3 2018" [ref=f1e595]:
              - link [ref=f1e596] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/File:Fortnite_Pro-Am_stadium_at_E3_2018_3.jpg
            - paragraph [ref=f1e599]:
              - text: The Save the World mode achieved over one million players by August 2017, just before the release of Battle Royale.
              - superscript [ref=f1e600]:
                - link "[47]" [ref=f1e601] [cursor=pointer]:
                  - /url: "#cite_note-50"
            - paragraph [ref=f1e602]:
              - text: Fortnite Battle Royale became a significant financial success for Epic Games, leading them to separate the teams between Save the World and Battle Royale to provide better support for both modes. Within two weeks of release, over 10 million players had played the mode,
              - superscript [ref=f1e603]:
                - link "[48]" [ref=f1e604] [cursor=pointer]:
                  - /url: "#cite_note-51"
              - text: and by June 2018, just after the Nintendo Switch release, had reached 125 million players.
              - superscript [ref=f1e605]:
                - link "[49]" [ref=f1e606] [cursor=pointer]:
                  - /url: "#cite_note-52"
              - text: Revenue from Fortnite Battle Royale during the first half of 2018 had been estimated in the hundreds of millions of dollars per month,
              - superscript [ref=f1e607]:
                - link "[50]" [ref=f1e608] [cursor=pointer]:
                  - /url: "#cite_note-53"
              - superscript [ref=f1e609]:
                - link "[51]" [ref=f1e610] [cursor=pointer]:
                  - /url: "#cite_note-54"
              - text: with total 2018 revenue estimated at $2.4 billion by analysis firm SuperData Research.
              - superscript [ref=f1e611]:
                - link "[52]" [ref=f1e612] [cursor=pointer]:
                  - /url: "#cite_note-55"
              - text: Total revenue for Fortnite reached more than $9 billion by the end of 2019.
              - superscript [ref=f1e613]:
                - link "[53]" [ref=f1e614] [cursor=pointer]:
                  - /url: "#cite_note-56"
            - paragraph [ref=f1e615]:
              - text: Fortnite Battle Royale has also become a
              - link "cultural phenomenon" [ref=f1e616] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Cultural_phenomenon
              - text: ","
              - superscript [ref=f1e617]:
                - link "[54]" [ref=f1e618] [cursor=pointer]:
                  - /url: "#cite_note-57"
              - text: with several celebrities reporting they play the game, and athletes using Fortnite
              - link "emotes" [ref=f1e619] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Emote
              - text: as victory celebrations.
              - superscript [ref=f1e620]:
                - link "[55]" [ref=f1e621] [cursor=pointer]:
                  - /url: "#cite_note-58"
              - text: A notable
              - link "streaming" [ref=f1e622] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Video_game_live_streaming
              - text: event in March 2018, with streamer
              - link "Ninja" [ref=f1e623] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Ninja_(streamer)
              - text: playing Fortnite Battle Royale alongside
              - link "Drake" [ref=f1e624] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Drake_(musician)
              - text: ","
              - link "Travis Scott" [ref=f1e625] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Travis_Scott
              - text: ","
              - link "Kim DotCom" [ref=f1e626] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Kim_Dotcom
              - text: ", and"
              - link "Pittsburgh Steelers" [ref=f1e627] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Pittsburgh_Steelers
              - text: wide receiver
              - link "JuJu Smith-Schuster" [ref=f1e628] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/JuJu_Smith-Schuster
              - text: ", broke viewership records for"
              - link "Twitch" [ref=f1e629] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Twitch_(service)
              - text: to date, and led to Epic arranging a Fortnite Battle Royale
              - link "pro–am" [ref=f1e630] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Pro–am
              - text: with 50 pairs of streamers and professional players matched with celebrities at
              - link "E3 2018" [ref=f1e631] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/E3_2018
              - text: in June 2018.
              - superscript [ref=f1e632]:
                - link "[56]" [ref=f1e633] [cursor=pointer]:
                  - /url: "#cite_note-59"
              - superscript [ref=f1e634]:
                - link "[57]" [ref=f1e635] [cursor=pointer]:
                  - /url: "#cite_note-60"
              - superscript [ref=f1e636]:
                - link "[58]" [ref=f1e637] [cursor=pointer]:
                  - /url: "#cite_note-61"
              - text: Epic Games has developed organized
              - link "esports" [ref=f1e638] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Esports
              - text: competitions around Fortnite Battle Royale, such as the inaugural US$30 million
              - link "Fortnite World Cup" [ref=f1e639] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Fortnite_World_Cup
              - text: tournament that took place in July 2019
              - superscript [ref=f1e640]:
                - link "[59]" [ref=f1e641] [cursor=pointer]:
                  - /url: "#cite_note-62"
              - superscript [ref=f1e642]:
                - link "[60]" [ref=f1e643] [cursor=pointer]:
                  - /url: "#cite_note-63"
              - text: and the Fortnite Championship Series (FNCS), the latter of which would be organized by Epic Games in 2020 and 2021 before being organized by Blast ApS from 2022 onwards.
            - note [ref=f1e644]:
              - text: "See also:"
              - link "Fortnite Battle Royale § Parental concerns" [ref=f1e645] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Fortnite_Battle_Royale#Parental_concerns
                - text: Fortnite Battle Royale§ Parental concerns
            - paragraph [ref=f1e647]:
              - text: There has also been growing concern over Fortnite Battle Royale
              - generic [ref=f1e648]: "'s"
              - text: draw toward young children, emphasized with the release of the mobile client. Parents and teachers had expressed concern that students are being distracted and drawn away from school work due to playing Fortnite.
              - superscript [ref=f1e649]:
                - link "[61]" [ref=f1e650] [cursor=pointer]:
                  - /url: "#cite_note-64"
              - text: Concerns have also been raised about the impact that playing a game involving repeated depictions of gun violence may have on young children.
              - superscript [ref=f1e651]:
                - link "[62]" [ref=f1e652] [cursor=pointer]:
                  - /url: "#cite_note-65"
              - superscript [ref=f1e653]:
                - link "[63]" [ref=f1e654] [cursor=pointer]:
                  - /url: "#cite_note-66"
            - region [ref=f1e655]:
              - heading "Awards" [level=3] [ref=f1e657]
              - paragraph [ref=f1e658]:
                - text: In 2017, the game was nominated for "Best Co-op Game" by
                - link "PC Gamer" [ref=f1e660] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/PC_Gamer
                - text: ","
                - superscript [ref=f1e661]:
                  - link "[64]" [ref=f1e662] [cursor=pointer]:
                    - /url: "#cite_note-67"
                - text: and for "Best Spectator Game" by
                - link "IGN" [ref=f1e664] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/IGN
                - text: .
                - superscript [ref=f1e665]:
                  - link "[65]" [ref=f1e666] [cursor=pointer]:
                    - /url: "#cite_note-68"
                - text: In 2018, the game won the award for Best Ongoing Game by PC Gamer
                - superscript [ref=f1e667]:
                  - link "[66]" [ref=f1e668] [cursor=pointer]:
                    - /url: "#cite_note-69"
                - text: and IGN,
                - superscript [ref=f1e669]:
                  - link "[67]" [ref=f1e670] [cursor=pointer]:
                    - /url: "#cite_note-70"
                - text: the latter of which nominated it for "Best Nintendo Switch Game", "Best Mobile Game", and "Best Action Game".
                - superscript [ref=f1e671]:
