              - listitem [ref=f1e1085]:
                - link "Jump up" [ref=f1e1087] [cursor=pointer]:
                  - /url: "#cite_ref-3"
                  - text: ^
                - generic [ref=f1e1088]:
                  - link "Gearbox Software" [ref=f1e1089] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Gearbox_Software
                  - text: "published retail copies of Fortnite: Save the World for Xbox One and PlayStation 4 when the game was first released in July 2017. After the introduction of Battle Royale,"
                  - link "Warner Bros. Games" [ref=f1e1090] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Warner_Bros._Games
                  - text: published retail copies for PlayStation, Xbox and Nintendo Switch consoles.
                  - superscript [ref=f1e1091]:
                    - link "[1]" [ref=f1e1092] [cursor=pointer]:
                      - /url: "#cite_note-2"
              - listitem [ref=f1e1093]:
                - generic [ref=f1e1094]:
                  - text: ^
                  - link "Jump up to:" [ref=f1e1095] [cursor=pointer]:
                    - /url: "#cite_ref-apple_lawsuit_4-0"
                  - link [ref=f1e1097] [cursor=pointer]:
                    - /url: "#cite_ref-apple_lawsuit_4-1"
                  - link [ref=f1e1098] [cursor=pointer]:
                    - /url: "#cite_ref-apple_lawsuit_4-2"
                  - link [ref=f1e1099] [cursor=pointer]:
                    - /url: "#cite_ref-apple_lawsuit_4-3"
                  - link [ref=f1e1100] [cursor=pointer]:
                    - /url: "#cite_ref-apple_lawsuit_4-4"
                - generic [ref=f1e1101]:
                  - text: The iOS and Android clients of Fortnite Battle Royale were removed by Apple and Google respectively on August 13, 2020, as Epic had changed how one could buy V-bucks with the client, leading Epic to file a lawsuit against Apple. In subsequent actions, the courts ruled in April 2025 that Apple cannot block third-party storefronts or take fees from them, and Epic said that they plan to bring Fortnite back to iOS shortly after this ruling.
                  - superscript [ref=f1e1102]:
                    - link "[2]" [ref=f1e1103] [cursor=pointer]:
                      - /url: "#cite_note-5"
                  - superscript [ref=f1e1104]:
                    - link "[3]" [ref=f1e1105] [cursor=pointer]:
                      - /url: "#cite_note-6"
                  - text: It was returned to the US storefront on May 20, 2025.
                  - superscript [ref=f1e1106]:
                    - link "[4]" [ref=f1e1107] [cursor=pointer]:
                      - /url: "#cite_note-7"
                  - text: The iOS version returned for European users via the Epic Game Store following its launch in Europe on August 16, 2024, and it will be available in Brazil in July 2025 and in Japan and the United Kingdom, it is planned for launch in 2025 as well.
                  - superscript [ref=f1e1108]:
                    - link "[5]" [ref=f1e1109] [cursor=pointer]:
                      - /url: "#cite_note-8"
                  - superscript [ref=f1e1110]:
                    - link "[6]" [ref=f1e1111] [cursor=pointer]:
                      - /url: "#cite_note-9"
                  - text: The macOS client of both Battle Royale and Save the World, while downloadable, will not be able to be updated as well due to app signing restrictions. See
                  - link "Epic Games v. Apple" [ref=f1e1113] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Epic_Games_v._Apple
                  - text: . The game remained playable if one had already downloaded it. On Android, while it is no longer available on Google Play, it remains available via the
                  - link "Samsung Galaxy Store" [ref=f1e1114] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Samsung_Galaxy_Store
                  - text: on Samsung Galaxy devices as well as directly from the Epic Games App on all other Android devices. Since May 5, 2022, the game can also be played via
                  - link "Xbox Cloud Gaming" [ref=f1e1115] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Xbox_Cloud_Gaming
                  - text: and
                  - link "GeForce Now" [ref=f1e1116] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/GeForce_Now
                  - text: on Android, macOS, iOS and iPadOS devices.
                  - superscript [ref=f1e1117]:
                    - link "[7]" [ref=f1e1118] [cursor=pointer]:
                      - /url: "#cite_note-10"
                  - superscript [ref=f1e1119]:
                    - link "[8]" [ref=f1e1120] [cursor=pointer]:
                      - /url: "#cite_note-11"
