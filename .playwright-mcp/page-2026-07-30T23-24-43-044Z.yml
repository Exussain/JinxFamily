                - generic [ref=f1e1081]:
                  - link "Iron Galaxy" [ref=f1e1082] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Iron_Galaxy
                  - text: "co-developed the Xbox One and PlayStation 4 versions in Fortnite: Save the World."
                  - link "Psyonix" [ref=f1e1083] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Psyonix
                  - text: developed Rocket Racing.
                  - link "Harmonix" [ref=f1e1084] [cursor=pointer]:
