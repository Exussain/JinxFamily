                    - text: 8 December 2017
                    - superscript [ref=f7e280]:
                      - link "[1]" [ref=f7e281] [cursor=pointer]:
                        - /url: "#cite_note-1"
                - row [ref=f7e282]:
                  - rowheader [ref=f7e283]:
