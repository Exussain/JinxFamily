                      - /url: https://en.wikipedia.org/wiki/Battle_royale_game
                - row [ref=f7e287]:
                  - rowheader "Mode" [ref=f7e288]
                  - cell [ref=f7e289]:
                    - link "Multiplayer" [ref=f7e290] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/Multiplayer_video_game
            - paragraph [ref=f7e291]:
              - generic [ref=f7e292]: Free Fire
              - text: ", formerly known as"
              - generic [ref=f7e293]: Garena Free Fire
              - text: ", is a"
              - link "free-to-play" [ref=f7e294] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Free-to-play
              - link "battle royale game" [ref=f7e295] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Battle_royale_game
              - text: developed and published by
              - link "Garena" [ref=f7e296] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Garena
              - text: for Android and iOS.
              - superscript [ref=f7e297]:
                - link "[2]" [ref=f7e298] [cursor=pointer]:
                  - /url: "#cite_note-2"
              - text: Released on December 8, 2017, the game gained widespread popularity, becoming the most downloaded mobile game globally in 2019. By 2021, it had over 150 million daily active users and surpassed $1 billion in lifetime revenue.
              - superscript [ref=f7e299]:
                - link "[3]" [ref=f7e300] [cursor=pointer]:
                  - /url: "#cite_note-3"
              - superscript [ref=f7e301]:
                - link "[4]" [ref=f7e302] [cursor=pointer]:
                  - /url: "#cite_note-4"
              - text: As of February 2024, Free Fire had 100 million active users.
              - superscript [ref=f7e303]:
                - link "[5]" [ref=f7e304] [cursor=pointer]:
                  - /url: "#cite_note-5"
            - paragraph [ref=f7e305]:
              - text: In September 2021, Garena launched
              - generic [ref=f7e306]: Free Fire Max
              - text: ", an enhanced version featuring improved graphics, lighting, and sound effects."
              - superscript [ref=f7e307]:
                - link "[6]" [ref=f7e308] [cursor=pointer]:
                  - /url: "#cite_note-:02-6"
              - text: The game’s official annual esports competition, the
              - link "Free Fire World Series" [ref=f7e310] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Free_Fire_World_Series
              - text: ", set a record as the most-watched esports event at the time, reaching over 5.4 million peak live viewers."
              - superscript [ref=f7e311]:
                - link "[7]" [ref=f7e312] [cursor=pointer]:
                  - /url: "#cite_note-7"
              - superscript [ref=f7e313]:
                - link "[8]" [ref=f7e314] [cursor=pointer]:
                  - /url: "#cite_note-8"
          - region [ref=f7e315]:
            - heading "Gameplay" [level=2] [ref=f7e317]
            - paragraph [ref=f7e318]:
              - text: In Free Fire, players control a character in a
              - link "third-person" [ref=f7e319] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Third-person_shooter
              - text: perspective. The fire button allows them to shoot and throw items. The character can perform actions such as jumping, crawling, and lying down. During gameplay, players can utilize the "Gloo Wall" grenade as a form of cover to protect against damage.
              - superscript [ref=f7e320]:
                - link "[9]" [ref=f7e321] [cursor=pointer]:
                  - /url: "#cite_note-9"
            - region [ref=f7e322]:
              - heading "Game modes" [level=3] [ref=f7e324]
              - paragraph [ref=f7e325]:
                - text: Free Fire offers over 15 game modes, including Team Deathmatch, Clash Squad, Big Head, Explosive Jump, Cold Steel, Zombie Hunt, Rampage, and Pet Mania.
                - superscript [ref=f7e326]:
                  - link "[10]" [ref=f7e327] [cursor=pointer]:
                    - /url: "#cite_note-10"
                - text: However, modes other than Battle Royale, Clash Squad, and Lone Wolf are only available during special events.
                - superscript [ref=f7e328]:
                  - link "[11]" [ref=f7e329] [cursor=pointer]:
                    - /url: "#cite_note-11"
                - superscript [ref=f7e330]:
                  - link "[12]" [ref=f7e331] [cursor=pointer]:
                    - /url: "#cite_note-12"
              - paragraph [ref=f7e332]:
                - text: The
                - link "Battle Royale" [ref=f7e333] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Battle_royale_game
                - text: "mode in Free Fire accommodates up to 52 players landing on an island without weapons. They must fight to be the last one standing by scavenging weapons and equipment from buildings. Playing this mode in ranked mode will affect their ranking. There are 6 maps to choose from: Bermuda, Bermuda Remastered, Kalahari, Purgatory, Alpine, and NeXTerra. The mode allows for solo, duo, or squad play."
                - superscript [ref=f7e334]:
                  - link "[13]" [ref=f7e335] [cursor=pointer]:
                    - /url: "#cite_note-13"
                - superscript [ref=f7e336]:
                  - link "[14]" [ref=f7e337] [cursor=pointer]:
                    - /url: "#cite_note-14"
              - paragraph [ref=f7e338]:
                - text: Clash Squad is a 4-player versus 4-player mode where players purchase weapons and items from an in-game shop during preparation time, then engage in combat against the opposing team. The mode is played in a
                - link "best-of-7" [ref=f7e339] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Playoff_format#Best-of-seven_playoff
                - text: format, lasting anywhere from 4 to 7 rounds. Each round is won when all players from one team are killed, either by their opponents or through environmental factors. As of 2022, the maps used in Clash Squad are the same as those in Battle Royale mode. The mode can be played as either Ranked or Casual.
                - superscript [ref=f7e340]:
                  - link "[15]" [ref=f7e341] [cursor=pointer]:
                    - /url: "#cite_note-15"
                - superscript [ref=f7e342]:
                  - link "[16]" [ref=f7e343] [cursor=pointer]:
                    - /url: "#cite_note-16"
              - paragraph [ref=f7e344]:
                - text: Lone Wolf is a variation of the Clash Squad mode that can be played as either a 1-player versus 1-player or 2-player versus 2-player "duo" format with more intricate rules. In each round, both sides have the opportunity to select their equipment for the next 2 rounds. The game is played in a best-of-5 format. If both teams have won 4 rounds each, a final round begins with both sides able to choose any weapon they prefer. All players are automatically equipped with basic items such as a vest and helmet from the start of the round. This mode takes place on its own map known as Iron Dome.
                - superscript [ref=f7e345]:
                  - link "[17]" [ref=f7e346] [cursor=pointer]:
                    - /url: "#cite_note-17"
                - superscript [ref=f7e347]:
                  - link "[18]" [ref=f7e348] [cursor=pointer]:
                    - /url: "#cite_note-18"
              - figure "Free Fire Craftland editor" [ref=f7e349]:
                - link [ref=f7e350] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:FreeFireCraftlandEditor.png
                  - img "Free Fire Craftland editor" [ref=f7e351]
              - paragraph [ref=f7e353]:
                - text: Craftland allows players to design their own maps in Free Fire using an in-game builder tool. The maps created can be shared and played with others. Craftland also supports script editing for advanced customization, giving creators greater freedom to bring their ideas to life. Players can add buildings, gameplay elements, and decorations to the map until they reach the maximum space limit. There are two maps available for players to use as the base for their designs.
                - superscript [ref=f7e354]:
                  - link "[19]" [ref=f7e355] [cursor=pointer]:
                    - /url: "#cite_note-19"
                - superscript [ref=f7e356]:
                  - link "[20]" [ref=f7e357] [cursor=pointer]:
                    - /url: "#cite_note-20"
            - region [ref=f7e358]:
              - heading "Character system" [level=3] [ref=f7e360]
              - figure "Free Fire character system" [ref=f7e361]:
                - link [ref=f7e362] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Free_Fire_Chrono.png
                  - img "Free Fire Character System" [ref=f7e363]
              - paragraph [ref=f7e365]:
                - text: Free Fire features a character system of 50+ characters. Each character has a unique skill which can be active or passive. Active skills can be triggered manually by an in-game button and passive skills are triggered automatically. Each character can equip 4 skills including the character's skill and 3 skills from other characters (one active skill and three passive skills can be equipped by a single character).
                - superscript [ref=f7e366]:
                  - link "[21]" [ref=f7e367] [cursor=pointer]:
                    - /url: "#cite_note-21"
                - text: Free Fire characters have unique backstories. A few of these characters were inspired by real-life celebrities whom Free Fire had collaborations with, such as Chrono from the collaboration with
                - link "Cristiano Ronaldo" [ref=f7e368] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cristiano_Ronaldo
                - text: ","
                - superscript [ref=f7e369]:
                  - link "[22]" [ref=f7e370] [cursor=pointer]:
                    - /url: "#cite_note-22"
                - text: Dimitri & Thiva from the collaboration with
                - link "Dimitri Vegas & Like Mike" [ref=f7e371] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Dimitri_Vegas_&_Like_Mike
                - text: ","
                - superscript [ref=f7e372]:
                  - link "[23]" [ref=f7e373] [cursor=pointer]:
                    - /url: "#cite_note-23"
                - text: A-Patroa from the collaboration with
                - link "Anitta" [ref=f7e374] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Anitta_(singer)
                - text: ","
                - superscript [ref=f7e375]:
                  - link "[24]" [ref=f7e376] [cursor=pointer]:
                    - /url: "#cite_note-24"
                - text: Alok from the collaboration with
                - link "DJ Alok" [ref=f7e377] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Alok_(DJ)
                - superscript [ref=f7e378]:
                  - link "[25]" [ref=f7e379] [cursor=pointer]:
                    - /url: "#cite_note-25"
                - text: and JBeibs from the collaboration with
                - link "Justin Bieber" [ref=f7e380] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Justin_Bieber
                - text: .
                - superscript [ref=f7e381]:
                  - link "[26]" [ref=f7e382] [cursor=pointer]:
                    - /url: "#cite_note-26"
                - text: In the game, it is possible to acquire all characters by using gold, an in-game currency that can be earned through gameplay and event participation, or with Diamonds which can be bought with real-world currency.
                - superscript [ref=f7e383]:
                  - link "[27]" [ref=f7e384] [cursor=pointer]:
                    - /url: "#cite_note-27"
            - region [ref=f7e385]:
              - heading "Pet System" [level=3] [ref=f7e387]
              - paragraph [ref=f7e388]:
                - text: In Free Fire, pets can provide support to players during fights. As of 2023, the game features 21 different pets that players can choose to bring into battle. Each pet has a special ability that sets it apart from the others. Some of these abilities are passive and trigger automatically, while others are active and require manual activation. One of the pets in the game, Poring, was added as part of a collaboration with
                - link "Ragnarok Online" [ref=f7e390] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ragnarok_Online
                - text: . Players can also customize their pets with skins and emotes.
                - superscript [ref=f7e391]:
                  - link "[28]" [ref=f7e392] [cursor=pointer]:
                    - /url: "#cite_note-28"
            - region [ref=f7e393]:
              - heading "Ranking System" [level=3] [ref=f7e395]
              - paragraph [ref=f7e396]:
                - text: "In Free Fire, a seven-tier ranking system, including sub-tiers like Bronze I, II, III, categorizes players by skill and performance. Players earn ranking points based on kills, damage, survival time and standing position, progressing from Bronze to Grandmaster. Seasons reset ranks (e.g., from Silver III to Bronze I or II). There are two ranked modes: Battle Royale rank mode and Clash Squad rank mode."
                - superscript [ref=f7e397]:
                  - link "[29]" [ref=f7e398] [cursor=pointer]:
                    - /url: "#cite_note-29"
                - superscript [ref=f7e399]:
                  - link "[30]" [ref=f7e400] [cursor=pointer]:
                    - /url: "#cite_note-30"
          - region [ref=f7e401]:
            - heading "Premise" [level=2] [ref=f7e403]
            - paragraph [ref=f7e404]:
              - text: Free Fire
              - generic [ref=f7e405]: "'"
              - text: s premise is detailed in animated shorts and other materials published by Garena to promote the game. Free Fire Universe is the universe where the game,
              - link "comics" [ref=f7e406] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Comics
              - text: "and stories take place. Each character has a different story and a family background and characters are connected to each other. There are three cities in the universe, called La Luna, Griza, and New Dawn where the characters live. Characters are divided into two factions: the Horizon and the Mambas. The Horizon is the ruling faction of the city where the rich and powerful people are while the Mambas are a liberation group against the Horizon."
              - superscript [ref=f7e407]:
                - link "[31]" [ref=f7e408] [cursor=pointer]:
                  - /url: "#cite_note-31"
              - text: In 2022 Free Fire released the first short film, "How to Start a Fire", which featured the character Hayato Yagami.
              - superscript [ref=f7e409]:
                - link "[32]" [ref=f7e410] [cursor=pointer]:
                  - /url: "#cite_note-32"
              - superscript [ref=f7e411]:
                - link "[33]" [ref=f7e412] [cursor=pointer]:
                  - /url: "#cite_note-33"
          - region [ref=f7e413]:
            - heading "Reception" [level=2] [ref=f7e415]
            - figure "Logo (2017-2022)" [ref=f7e416]:
              - link [ref=f7e417] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/File:Free_Fire.svg
            - paragraph [ref=f7e420]:
              - text: The graphics were described as having "a benefit for mid- and low-specification phones", but a reviewer stated that "if games with good graphics are your thing then we don't recommend that you play Free Fire Battlegrounds. But if you like battle royale games and want to have fun with your friends, you should definitely play."
              - superscript [ref=f7e421]:
                - link "[34]" [ref=f7e422] [cursor=pointer]:
                  - /url: "#cite_note-game_prime-34"
            - paragraph [ref=f7e423]:
              - text: Tais Carvalho of
              - link "Techtudo" [ref=f7e425] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Techtudo
              - text: commented that Free Fire "prioritizes performance, making it a great choice for any type of device. The gameplay stands out and has enough content to entertain and offer rewarding combat." Regarding the progression of characters and skills, she said it is "a flashy add-on".
              - superscript [ref=f7e426]:
                - link "[35]" [ref=f7e427] [cursor=pointer]:
                  - /url: "#cite_note-35"
            - paragraph [ref=f7e428]:
              - text: In the
              - link "Google Play" [ref=f7e429] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Google_Play
              - text: annual list of "Best Apps of the Year", Free Fire won in the "Best Popular Vote Game" category of 2019, being the most publicly voted in
              - link "Brazil" [ref=f7e430] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Brazil
              - text: and in
              - link "Thailand" [ref=f7e431] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Thailand
              - text: .
              - superscript [ref=f7e432]:
                - link "[36]" [ref=f7e433] [cursor=pointer]:
                  - /url: "#cite_note-IGN1-36"
              - superscript [ref=f7e434]:
                - link "[37]" [ref=f7e435] [cursor=pointer]:
                  - /url: "#cite_note-37"
            - paragraph [ref=f7e436]:
              - text: Garena Free Fire is one of the most popular battle royale mobile games, behind
              - link "PUBG Mobile" [ref=f7e438] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/PUBG_Mobile
              - text: ","
              - link "Fortnite Battle Royale" [ref=f7e440] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Fortnite_Battle_Royale
              - text: and
              - 'link "Call of Duty: Mobile" [ref=f7e442] [cursor=pointer]':
                - /url: https://en.wikipedia.org/wiki/Call_of_Duty:_Mobile
              - text: . It is particularly popular in
              - link "Latin America" [ref=f7e443] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Latin_America
              - text: ","
              - link "India" [ref=f7e444] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/India
              - text: and
              - link "Southeast Asia" [ref=f7e445] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Southeast_Asia
              - text: .
              - superscript [ref=f7e446]:
                - link "[38]" [ref=f7e447] [cursor=pointer]:
                  - /url: "#cite_note-38"
              - text: Free Fire was the fourth most downloaded game on the
              - link "Google Play Store" [ref=f7e448] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Google_Play_Store
              - text: in the fourth quarter of 2018,
              - superscript [ref=f7e449]:
                - link "[39]" [ref=f7e450] [cursor=pointer]:
                  - /url: "#cite_note-39"
              - text: and was the fourth most downloaded game worldwide in 2018 on
              - link "iOS" [ref=f7e451] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/IOS
              - text: and the Google Play Store together.
              - superscript [ref=f7e452]:
                - link "[40]" [ref=f7e453] [cursor=pointer]:
                  - /url: "#cite_note-40"
              - text: The title earned approximately 182 million downloads in 2018, making it the second most downloaded battle royale mobile game (above
              - link "Fortnite Battle Royale" [ref=f7e455] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Fortnite_Battle_Royale
              - text: and behind only PUBG Mobile),
              - superscript [ref=f7e456]:
                - link "[41]" [ref=f7e457] [cursor=pointer]:
                  - /url: "#cite_note-sensortower-41"
              - text: and grossed approximately $19.3 million in monthly revenues through December 2018, becoming a significant financial success for
              - link "Garena" [ref=f7e458] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Garena
              - text: .
              - superscript [ref=f7e459]:
                - link "[42]" [ref=f7e460] [cursor=pointer]:
                  - /url: "#cite_note-42"
              - superscript [ref=f7e461]:
                - link "[43]" [ref=f7e462] [cursor=pointer]:
                  - /url: "#cite_note-43"
              - text: As of August 2021, Garena Free Fire has more than one billion downloads on the Google Play Store.
              - superscript [ref=f7e463]:
                - link "[44]" [ref=f7e464] [cursor=pointer]:
                  - /url: "#cite_note-44"
              - superscript [ref=f7e465]:
                - link "[45]" [ref=f7e466] [cursor=pointer]:
                  - /url: "#cite_note-45"
            - paragraph [ref=f7e467]:
              - text: At the end of Q1 2021, Free Fire surpassed PUBG Mobile in revenues in the
              - link "United States" [ref=f7e468] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/United_States
              - text: ", generating $100 million in turnover as compared to PUBG Mobile's $68 million."
              - superscript [ref=f7e469]:
                - link "[46]" [ref=f7e470] [cursor=pointer]:
                  - /url: "#cite_note-46"
              - text: Free Fire's revenues jumped by 4.5 times as compared to the same period in the previous year.
              - superscript [ref=f7e471]:
                - link "[47]" [ref=f7e472] [cursor=pointer]:
                  - /url: "#cite_note-47"
            - paragraph [ref=f7e473]:
              - text: By November 2019, Free Fire had grossed over $1 billion worldwide.
              - superscript [ref=f7e474]:
                - link "[48]" [ref=f7e475] [cursor=pointer]:
                  - /url: "#cite_note-48"
              - superscript [ref=f7e476]:
                - link "[49]" [ref=f7e477] [cursor=pointer]:
                  - /url: "#cite_note-49"
              - text: It went on to become the fourth highest-grossing
              - link "video game of 2020" [ref=f7e478] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/2020_in_video_games
              - text: with $2.13 billion,
              - superscript [ref=f7e479]:
                - link "[50]" [ref=f7e480] [cursor=pointer]:
                  - /url: "#cite_note-SuperData2020-50"
              - text: and then the eighth highest-grossing
              - link "mobile game of 2021" [ref=f7e481] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/2021_in_video_games
              - text: with $1.2 billion,
              - superscript [ref=f7e482]:
                - link "[51]" [ref=f7e483] [cursor=pointer]:
                  - /url: "#cite_note-Sensor2021-51"
              - text: for a total of at least $4.33 billion grossed as of 2021 .
            - paragraph [ref=f7e484]:
              - text: In 2020 and 2021, Free Fire won the Esports Mobile Game of the Year award at the Esports Awards.
              - superscript [ref=f7e485]:
                - link "[52]" [ref=f7e486] [cursor=pointer]:
                  - /url: "#cite_note-52"
            - paragraph [ref=f7e487]:
              - link "Free Fire World Series 2021" [ref=f7e488] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Free_Fire_World_Series
              - text: became the most viewed
              - link "E-sport" [ref=f7e489] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/E-sport
              - text: tournament of all time with a peak concurrent online viewership of more than 5.4 million, until it was surpassed by the
              - link "League of Legends event" [ref=f7e490] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/2024_League_of_Legends_World_Championship
              - text: in 2024.
              - superscript [ref=f7e491]:
                - link "[53]" [ref=f7e492] [cursor=pointer]:
                  - /url: "#cite_note-53"
              - superscript [ref=f7e493]:
                - link "[54]" [ref=f7e494] [cursor=pointer]:
                  - /url: "#cite_note-54"
              - superscript [ref=f7e495]:
                - link "[55]" [ref=f7e496] [cursor=pointer]:
                  - /url: "#cite_note-55"
          - region [ref=f7e497]:
            - heading "Esports" [level=2] [ref=f7e499]
            - note [ref=f7e500]:
              - text: "Main article:"
              - link "Free Fire World Series" [ref=f7e501] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Free_Fire_World_Series
            - region [ref=f7e502]:
              - heading "Free Fire World Series" [level=3] [ref=f7e504]
              - paragraph [ref=f7e505]:
                - text: Free Fire began the Free Fire World Series (FFWS)
                - link "esports" [ref=f7e506] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Esports
                - text: competition in 2019. In 2020, FFWS was replaced by a series of regional events, the "Free Fire Continental Series" (FFCS), due to the
                - link "COVID-19 pandemic" [ref=f7e507] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/COVID-19_pandemic
                - text: .
                - superscript [ref=f7e508]:
                  - link "[56]" [ref=f7e509] [cursor=pointer]:
                    - /url: "#cite_note-56"
                - superscript [ref=f7e510]:
                  - link "[57]" [ref=f7e511] [cursor=pointer]:
                    - /url: "#cite_note-57"
                - text: In February 2021, Garena announced the Free Fire World Series (FFWS) with a $2 million prize pool.
                - superscript [ref=f7e512]:
                  - link "[58]" [ref=f7e513] [cursor=pointer]:
                    - /url: "#cite_note-58"
              - paragraph [ref=f7e514]:
                - text: In 2021, the Free Fire World Series became the most-watched esports event in history with over 5.4 million peak live viewers, surpassing the
                - link "2022 League of Legends World Championship" [ref=f7e515] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/2022_League_of_Legends_World_Championship
                - text: which had 5.1 million peak viewers.
                - superscript [ref=f7e516]:
                  - link "[59]" [ref=f7e517] [cursor=pointer]:
                    - /url: "#cite_note-59"
                - superscript [ref=f7e518]:
                  - link "[60]" [ref=f7e519] [cursor=pointer]:
                    - /url: "#cite_note-60"
                - superscript [ref=f7e520]:
                  - link "[61]" [ref=f7e521] [cursor=pointer]:
                    - /url: "#cite_note-61"
            - region [ref=f7e522]:
              - heading "Regional events" [level=3] [ref=f7e524]
              - paragraph [ref=f7e525]:
                - text: The "EMEA Invitational" was a replacement for the Free Fire World Series in 2021 for
                - link "Europe, the Middle East and Africa" [ref=f7e526] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Europe,_the_Middle_East_and_Africa
                - text: . This championship featured a total of 12 teams. With a prize pool of USD 200,000.
                - superscript [ref=f7e527]:
                  - link "[62]" [ref=f7e528] [cursor=pointer]:
                    - /url: "#cite_note-62"
              - paragraph [ref=f7e529]:
                - text: The Free Fire Asia Championship was a replacement for the Free Fire World Series in 2021 for Asia. This championship featured a total of 31 teams from Vietnam, Indonesia, Thailand, India, Taiwan, and MCP (Malaysia, Cambodia, and Pakistan). The teams compete for a prize pool of USD 400,000.
                - superscript [ref=f7e530]:
                  - link "[63]" [ref=f7e531] [cursor=pointer]:
                    - /url: "#cite_note-63"
              - paragraph [ref=f7e532]:
                - text: The Liga Brasileira de Free Fire (LBFF) is the main Free Fire esports event in Brazil. Comprising 3 divisions, Series A, B, and C, it is played in two stages a year, with the elite qualifying for the Free Fire World Series.
                - superscript [ref=f7e533]:
                  - link "[64]" [ref=f7e534] [cursor=pointer]:
                    - /url: "#cite_note-64"
          - region [ref=f7e535]:
            - heading "Free Fire Max" [level=2] [ref=f7e537]
            - paragraph [ref=f7e538]:
              - text: Free Fire Max is an enhanced version of Free Fire that was released in 2021.
              - superscript [ref=f7e539]:
                - link "[65]" [ref=f7e540] [cursor=pointer]:
                  - /url: "#cite_note-65"
              - superscript [ref=f7e541]:
                - link "[66]" [ref=f7e542] [cursor=pointer]:
                  - /url: "#cite_note-66"
              - text: It features improved
              - link "High-Definition" [ref=f7e543] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/High-definition_video
              - link "graphics" [ref=f7e544] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Video_game_graphics
              - text: ","
              - link "sound effects" [ref=f7e545] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Video_game_sound_effect
              - text: ", and a 360-degree rotatable lobby. Players can use the same account to play both Free Fire Max and Free Fire, and in-game purchases, costumes, and items are synced between the two games."
              - superscript [ref=f7e546]:
                - link "[67]" [ref=f7e547] [cursor=pointer]:
                  - /url: "#cite_note-67"
              - text: Both games are connected with FireLink technology,
              - superscript [ref=f7e548]:
                - link "[68]" [ref=f7e549] [cursor=pointer]:
                  - /url: "#cite_note-68"
              - superscript [ref=f7e550]:
                - link "[69]" [ref=f7e551] [cursor=pointer]:
                  - /url: "#cite_note-69"
              - text: which allows players from both games to play together simultaneously. In February 2022, the
              - link "Government of India" [ref=f7e552] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Government_of_India
              - text: banned Free Fire for security reasons, alleging a connection to China, but Free Fire Max remained available in the country.
              - superscript [ref=f7e553]:
                - link "[70]" [ref=f7e554] [cursor=pointer]:
                  - /url: "#cite_note-70"
          - region [ref=f7e555]:
            - heading "Collaborations" [level=2] [ref=f7e557]
            - paragraph [ref=f7e558]:
              - text: Collaboration with other popular franchises is a major marketing strategy used to promote the game. Since its launch, Free Fire collaborated with popular video games, celebrities, TV shows and films.
              - superscript [ref=f7e559]:
                - link "[71]" [ref=f7e560] [cursor=pointer]:
                  - /url: "#cite_note-71"
              - text: Free Fire has two types of collaborations which are global and regional. Unlike global collaborations, regional collaborations are only available to players from specific regions. In 2022, Free Fire collaborated with singer
              - link "Justin Bieber" [ref=f7e561] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Justin_Bieber
              - text: and debuted his song "Beautiful Love" in Free Fire.
              - superscript [ref=f7e562]:
                - link "[72]" [ref=f7e563] [cursor=pointer]:
                  - /url: "#cite_note-72"
              - superscript [ref=f7e564]:
