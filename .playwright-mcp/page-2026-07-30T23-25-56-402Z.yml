                  - cell "Q2 2027 – scheduled" [ref=f7e806]
            - paragraph [ref=f7e807]:
              - text: An
              - link "anime" [ref=f7e808] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Anime
              - text: adaptation co-produced by Garena and
              - link "Kadokawa" [ref=f7e809] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Kadokawa_Corporation
              - text: was announced on 13 May 2024. The project was launched through a joint investment, with Kadokawa Qingyu — Kadokawa’s overseas branch, as its production manager.
              - superscript [ref=f7e810]:
                - link "[100]" [ref=f7e811] [cursor=pointer]:
                  - /url: "#cite_note-100"
              - superscript [ref=f7e812]:
                - link "[101]" [ref=f7e813] [cursor=pointer]:
                  - /url: "#cite_note-101"
              - text: It will be animated by Candy Box and directed by Ken Takahashi, with Sus4 Inc. producing the music.
              - superscript [ref=f7e814]:
                - link "[102]" [ref=f7e815] [cursor=pointer]:
                  - /url: "#cite_note-102"
              - text: Titled Free Fire Daybreak, the series is set to premiere in Q2 2027.
              - superscript [ref=f7e816]:
                - link "[103]" [ref=f7e817] [cursor=pointer]:
                  - /url: "#cite_note-103"
          - region [ref=f7e818]:
            - heading "Controversies" [level=2] [ref=f7e820]
            - paragraph [ref=f7e821]:
              - text: In January 2022,
              - link "PUBG" [ref=f7e822] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/PUBG:_Battlegrounds
              - text: developer
              - link "Krafton" [ref=f7e823] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Krafton
              - text: filed a lawsuit against
              - link "Garena" [ref=f7e824] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Garena
              - text: and its parent company
              - link "Sea" [ref=f7e825] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Sea_Ltd
              - text: for copyright infringement. The lawsuit accused Garena of copying in-game items, game mechanics and overall look and feel of
              - 'link "PUBG: Battlegrounds" [ref=f7e827] [cursor=pointer]':
                - /url: https://en.wikipedia.org/wiki/PUBG:_Battlegrounds
              - text: and
              - link "PUBG Mobile" [ref=f7e829] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/PUBG_Mobile
              - text: in their games Free Fire and Free Fire Max. According to Krafton, "Free Fire and Free Fire Max extensively copy numerous aspects of Battlegrounds, both individually and in combination, including Battlegrounds' copyrighted unique game opening 'air drop' feature, the game structure and play, the combination and selection of weapons, armor, and unique objects, locations, and the overall choice of color schemes, materials, and textures."
              - superscript [ref=f7e830]:
                - link "[104]" [ref=f7e831] [cursor=pointer]:
                  - /url: "#cite_note-104"
              - text: Krafton also sued Apple and Google for hosting the game as well as Youtube for hosting Free Fire gameplay videos. The lawsuit was later dropped through mutual agreement between Sea Ltd, Krafton, Apple and Google.
            - paragraph [ref=f7e832]:
              - text: On 14 February 2022, the India's
              - link "Ministry of Electronics and Information Technology" [ref=f7e833] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Ministry_of_Electronics_and_Information_Technology
              - text: banned Free Fire along with 53 other apps which posed a threat to India's privacy and security
              - superscript [ref=f7e834]:
                - link "[105]" [ref=f7e835] [cursor=pointer]:
                  - /url: "#cite_note-105"
              - superscript [ref=f7e836]:
                - link "[106]" [ref=f7e837] [cursor=pointer]:
                  - /url: "#cite_note-106"
              - text: under Section 69A of the
              - link "Information Technology Act" [ref=f7e838] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Information_Technology_Act,_2000
              - text: ","
              - link "Constitution of India" [ref=f7e839] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Constitution_of_India
              - text: .
            - paragraph [ref=f7e840]:
              - text: In October 2024, the
              - link "FFWS 2024" [ref=f7e841] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Free_Fire_World_Series_–_Global_Finals_2024
              - text: trailer sparked controversy for depicting a character running up stairs with a "Ram Darbar" emblem printed on the stairs alongside various cultural elements from other countries. The placement of the emblem on the stairs was perceived as disrespectful to Hindu deity
              - link "Rama" [ref=f7e842] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Rama
              - text: . This led to backlash in India and Indonesia, with demands for an apology from
              - link "Garena" [ref=f7e843] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Garena
              - text: . The original trailer was removed, and an edited version was uploaded to Free Fire's Malaysian YouTube channel.
              - superscript [ref=f7e844]:
                - link "[107]" [ref=f7e845] [cursor=pointer]:
                  - /url: "#cite_note-107"
              - superscript [ref=f7e846]:
                - link "[108]" [ref=f7e847] [cursor=pointer]:
                  - /url: "#cite_note-108"
